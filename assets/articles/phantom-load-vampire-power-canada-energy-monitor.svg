<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian phantom-load hunt versus heating energy</title>
  <desc id="desc">NRCan: standby power is at least 5 percent, typically 5 to 10 percent, of household electricity. Heating and hot water still dwarf that slice. Hunt vampires after the envelope. 20 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Phantom loads are real. They are not your January bill.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">NRCan: standby is at least 5%, often 5-10%, of household electricity. 20 Sep 2026.</text>
  <rect x="60" y="100" width="400" height="44" fill="#0F7A4B"/>
  <text x="76" y="128" font-size="14" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Heating / envelope  (the winter story)</text>
  <rect x="60" y="152" width="120" height="44" fill="#34A06C"/>
  <text x="76" y="180" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Hot water</text>
  <rect x="60" y="204" width="70" height="44" fill="#9CA3AF"/>
  <text x="70" y="232" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Standby</text>
  <text x="140" y="232" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">~5-10% of electricity, not of the whole energy bill</text>
  <rect x="500" y="88" width="196" height="200" rx="12" fill="#E7F4EE"/>
  <text x="516" y="116" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Worth killing</text>
  <text x="516" y="144" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Second TV / game pile</text>
  <text x="516" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Old cable / DVR boxes</text>
  <text x="516" y="184" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Idle desktop PC</text>
  <text x="516" y="204" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Spare fridge / freezer</text>
  <text x="516" y="232" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Leave the modem and</text>
  <text x="516" y="250" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">the furnace board on.</text>
  <text x="516" y="272" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Viral $400 claims: skip.</text>
  <text x="24" y="292" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Plug-in monitor: room by room, 24 hours, write watts. Kill the 10 W+ always-ons you do not need. Ignore the 0.5 W toothbrush.</text>
  <text x="24" y="328" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A smart power bar you actually switch beats an unplugging ritual you abandon in week two.</text>
  <text x="24" y="364" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">If the house still leaks at the hatch, fix that first. Phantom hunting is a spring project, not a polar-vortex plan.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: NRCan standby power / smart-device pages; OEB electricity rates for the dollar sketch. Education only.</text>
</svg>
