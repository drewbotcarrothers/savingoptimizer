<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Flow from a listed impairment to a service-animal medical expense claim</title>
  <desc>Four steps from Guide RC4065: a listed impairment, a specially trained animal from an organization that trains such animals, eligible expenses, then the claim. Emotional support alone does not continue. As of 27 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Impairment, training, expenses, claim</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Emotional support alone stops before the second box. Not tax advice.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">
    <rect x="28" y="100" width="150" height="84" rx="8" fill="#0F7A4B"/>
    <text x="103" y="136" text-anchor="middle" fill="#FFFFFF" font-weight="700">Listed</text>
    <text x="103" y="156" text-anchor="middle" fill="#FFFFFF" font-weight="700">impairment</text>
    <polygon points="186,142 210,142 210,134 226,142 210,150 210,142" fill="#6B7280"/>
    <rect x="234" y="100" width="180" height="84" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="324" y="132" text-anchor="middle" font-weight="700">Specially trained</text>
    <text x="324" y="152" text-anchor="middle" font-size="11" fill="#6B7280">Qualifying organization</text>
    <polygon points="422,142 446,142 446,134 462,142 446,150 446,142" fill="#6B7280"/>
    <rect x="470" y="100" width="180" height="84" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="560" y="132" text-anchor="middle" font-weight="700">Eligible expenses</text>
    <text x="560" y="152" text-anchor="middle" font-size="11" fill="#6B7280">Animal, care, travel</text>
    <polygon points="560,192 560,220 552,220 560,236 568,220 560,220" fill="#6B7280"/>
    <rect x="450" y="244" width="220" height="72" rx="8" fill="#0F7A4B"/>
    <text x="560" y="274" text-anchor="middle" fill="#FFFFFF" font-weight="700">Claim</text>
    <text x="560" y="294" text-anchor="middle" fill="#FFFFFF" font-size="11">Lines 33099 or 33199</text>
  </g>
  <text x="24" y="360" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Support only, with no task training, does not move past the first box.</text>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Guide RC4065, Medical Expenses 2025, opened 27 Sep 2026. Confirm the year you file.</text>
</svg>
