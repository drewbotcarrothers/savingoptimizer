<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Find smart thermostat rebates before you buy in Canada</title>
  <desc id="desc">Buy-order: eligibility, model list, instant code or 60-day receipt, then install. Ontario Home Renovation Savings $100 used 20 Sep 2026. Peak Perks is a different pot of money.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Confirm the list. Then spend.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Ontario HRSP $100 (terms used 20 Sep 2026). Not a US $850 brochure.</text>
  <rect x="24" y="78" width="160" height="210" rx="12" fill="#E7F4EE"/>
  <text x="104" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Qualify</text>
  <text x="104" y="150" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fuel + dwelling</text>
  <text x="104" y="172" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">One per household</text>
  <text x="104" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cornwall excluded</text>
  <text x="104" y="230" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Enbridge or IESO</text>
  <text x="104" y="252" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">grid paths.</text>
  <rect x="196" y="78" width="160" height="210" rx="12" fill="#E7F4EE"/>
  <text x="276" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">2. SKU list</text>
  <text x="276" y="150" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Live portal models</text>
  <text x="276" y="172" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Voltage must match</text>
  <text x="276" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">24 V vs line-voltage</text>
  <text x="276" y="230" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Wrong colourway</text>
  <text x="276" y="252" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">can still fail.</text>
  <rect x="368" y="78" width="160" height="210" rx="12" fill="#E7F4EE"/>
  <text x="448" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Code</text>
  <text x="448" y="150" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Instant code or</text>
  <text x="448" y="172" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">60-day receipt</text>
  <text x="448" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Named retailers</text>
  <text x="448" y="230" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Do not stack instant</text>
  <text x="448" y="252" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">plus post-purchase.</text>
  <rect x="540" y="78" width="156" height="210" rx="12" fill="#F3F4F6"/>
  <text x="618" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Then DR</text>
  <text x="618" y="150" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Install + Wi-Fi</text>
  <text x="618" y="172" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Peak Perks $75</text>
  <text x="618" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">is not a till coupon</text>
  <text x="618" y="230" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Pick one overlapping</text>
  <text x="618" y="252" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Ontario DR program.</text>
  <text x="24" y="324" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">HRSP terms we read: purchase and activate by 31 Dec 2026. Keep serial, invoice, and account number.</text>
  <text x="24" y="348" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No rebate? Still run last year heat dollars x 5-10% only if you gain a real schedule.</text>
  <text x="24" y="380" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Phishing exists. Start from homerenovationsavings.ca or saveonenergy.ca - not a surprise email.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Amounts move. Greener Homes is closed to new applicants.</text>
</svg>
