<title id="t">RA Centre pickleball: cost per session</title>
<desc id="d">Bars: All Level Play drop-in $15.28; court rental split four ways $9.17; Saturday membership about $7.88 per session if attending all season; paddle and ball rental $5.48 plus tax.</desc>
