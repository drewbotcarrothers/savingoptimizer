<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: recreational and competitive hockey seasons</title>
  <desc>Example with made-up inputs. Stacked bars for one child. Recreational season $800, split into registration $450, equipment $200, travel $80, and extras $70. Competitive season $2,900, split into registration $1,200, equipment $450, travel $900, and extras $350.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: two seasons</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">One child. Not association fees. Recreational $800. Competitive $2,900.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">
    <text x="24" y="100">Recreational</text>
    <rect x="140" y="80" width="65" height="28" fill="#0F7A4B"/>
    <rect x="205" y="80" width="29" height="28" fill="#1A1A1A"/>
    <rect x="234" y="80" width="12" height="28" fill="#F59E0B"/>
    <rect x="246" y="80" width="10" height="28" fill="#6B7280"/>
    <text x="266" y="99">$800</text>
    <text x="24" y="160">Competitive</text>
    <rect x="140" y="140" width="174" height="28" fill="#0F7A4B"/>
    <rect x="314" y="140" width="65" height="28" fill="#1A1A1A"/>
    <rect x="379" y="140" width="130" height="28" fill="#F59E0B"/>
    <rect x="509" y="140" width="51" height="28" fill="#6B7280"/>
    <text x="568" y="159">$2,900</text>
    <rect x="24" y="210" width="16" height="16" fill="#0F7A4B"/>
    <text x="46" y="223">Registration</text>
    <rect x="170" y="210" width="16" height="16" fill="#1A1A1A"/>
    <text x="192" y="223">Equipment</text>
    <rect x="300" y="210" width="16" height="16" fill="#F59E0B"/>
    <text x="322" y="223">Travel</text>
    <rect x="400" y="210" width="16" height="16" fill="#6B7280"/>
    <text x="422" y="223">Extras</text>
    <text x="24" y="270" font-size="12" fill="#6B7280">Recreational: registration $450, equipment $200, travel $80, extras $70.</text>
    <text x="24" y="290" font-size="12" fill="#6B7280">Competitive: registration $1,200, equipment $450, travel $900, extras $350.</text>
    <text x="24" y="320" font-size="12" fill="#6B7280">The longer bar is the competitive season. Travel is the segment that grows the most.</text>
    <text x="24" y="396" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 29 Sep 2026.</text>
  </g>

</svg>
