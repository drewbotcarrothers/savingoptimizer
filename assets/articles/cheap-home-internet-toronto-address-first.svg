<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Toronto address-first internet worksheet</title>
  <desc id="desc">Four steps: qualify the unit, record upload and both prices, add equipment and any building fee, then choose the lowest 24-month total that meets the household worksheet.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Toronto: the unit, then the total</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">City ads are not a checkout. Drafted 22 Sep 2026.</text>
  <rect x="24" y="80" width="155" height="150" rx="12" fill="#F3F4F6"/>
  <text x="101" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1. Qualify</text>
  <text x="101" y="142" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Civic address</text>
  <text x="101" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">and unit.</text>
  <text x="101" y="188" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Not a postal code.</text>
  <rect x="195" y="80" width="155" height="150" rx="12" fill="#E7F4EE"/>
  <text x="272" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">2. Both prices</text>
  <text x="272" y="142" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Promo and after.</text>
  <text x="272" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Write the upload.</text>
  <text x="272" y="188" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">500 is not 500/500.</text>
  <rect x="366" y="80" width="155" height="150" rx="12" fill="#F3F4F6"/>
  <text x="443" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3. Add-ons</text>
  <text x="443" y="142" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Modem, pods,</text>
  <text x="443" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">building fee.</text>
  <text x="443" y="188" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Decline TV by default.</text>
  <rect x="537" y="80" width="159" height="150" rx="12" fill="#0F7A4B"/>
  <text x="616" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">4. 24 months</text>
  <text x="616" y="142" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Lowest total that</text>
  <text x="616" y="160" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">clears the upload.</text>
  <text x="616" y="188" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Then calendar it.</text>
  <text x="24" y="262" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Oxio's Ontario pattern is Cogeco plant. Much of the city is Rogers. Run the checker.</text>
  <text x="24" y="290" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Dated anchors only: Bell and Rogers cards 21 Sep 2026. TekSavvy and Oxio rows 11 Sep 2026.</text>
  <text x="24" y="322" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Bell 150/500/1.5 Gbps cards that day included a $10 mobility credit. Internet-only is a different price.</text>
  <text x="24" y="350" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Rogers Popular 500 was $90 versus $130 on the plans page. The second number is the coasting cost.</text>
  <text x="24" y="378" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Wholesale Bell fibre access in Ontario was $68.26 up to 1500 Mbps in Order 2026-77. That is not your bill.</text>
  <text x="24" y="404" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Education only. ISP plans are an offer type. No live partnership.</text>
</svg>
