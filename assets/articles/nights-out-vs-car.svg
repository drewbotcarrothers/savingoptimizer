<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
 <title id="title">Eight nights out versus Ratehub car ownership</title>
 <desc id="desc">Bars comparing late-night transit, mixed rideshare, eight two-way rideshares, and Ratehub 1373 dollar average ownership for a labelled eight-night month.</desc>
 <rect width="720" height="420" fill="#FFFFFF"/>
 <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Last call does not amortize a car payment</text>
 <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Eight nights. TTC $3.30. Rideshare pairs are labelled sketches. Ratehub $1,373 (29 Apr 2026).</text>
 <line x1="70" y1="78" x2="70" y2="300" stroke="#E5E7EB"/>
 <line x1="70" y1="300" x2="680" y2="300" stroke="#E5E7EB"/>
 <text x="62" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
 <text x="62" y="249" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$350</text>
 <text x="62" y="194" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$700</text>
 <text x="62" y="139" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1,050</text>
 <text x="62" y="90" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1,400</text>
 <!-- scale $1400 = 222px from 300: $1 = 0.1586 -->
 <rect x="110" y="296" width="80" height="4" rx="4" fill="#0F7A4B"/>
 <text x="150" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$26</text>
 <text x="150" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Night bus</text>
 <text x="150" y="338" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">if it exists</text>
 <rect x="250" y="282" width="80" height="18" rx="4" fill="#4B9B74"/>
 <text x="290" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$112</text>
 <text x="290" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ride home</text>
 <text x="290" y="338" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">4 nights</text>
 <rect x="390" y="254" width="80" height="46" rx="4" fill="#4B9B74"/>
 <text x="430" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$288</text>
 <text x="430" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2 rides x 8</text>
 <text x="430" y="338" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">labelled surge</text>
 <rect x="530" y="82" width="80" height="218" rx="4" fill="#9CA3AF"/>
 <text x="570" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1,373</text>
 <text x="570" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Own a car</text>
 <text x="570" y="338" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Ratehub avg</text>
 <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Impaired driving is not a savings line. Parking tickets are. Confirm TTC overnight buses, TransLink NightBus, or STM night réseau.</text>
 <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Keep the car if weekdays need it. Do not keep it as a Saturday 1 a.m. locker. 20 Sep 2026.</text>
</svg>
