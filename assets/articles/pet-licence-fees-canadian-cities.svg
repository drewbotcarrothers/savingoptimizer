<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Bars comparing altered and unaltered dog licence fees</title>
  <desc>Paired bars for Toronto, Calgary, Edmonton, and Winnipeg. Altered dogs are 25, 45, 38, and 41.50 dollars. Unaltered dogs are 60, 71, 78, and 138 dollars. Calgary uses the 2026 column. Winnipeg's page is effective 1 January 2026. Senior discounts are not drawn.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="start">Altered and unaltered dog licence, four cities</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">2026 Calgary column. Winnipeg effective 1 Jan 2026. Toronto and Edmonton pages opened 27 Sep 2026.</text>
<line x1="70" y1="300" x2="690" y2="300" stroke="#E5E7EB"/>
<line x1="70" y1="300.0" x2="690" y2="300.0" stroke="#E5E7EB"/>
  <text x="28" y="304.0" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start">$0</text>
<line x1="70" y1="195.0" x2="690" y2="195.0" stroke="#E5E7EB"/>
  <text x="28" y="199.0" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start">$69</text>
<line x1="70" y1="90.0" x2="690" y2="90.0" stroke="#E5E7EB"/>
  <text x="28" y="94.0" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start">$138</text>
<rect x="110" y="262.0" width="40" height="38.0" fill="#0F7A4B"/>
  <text x="130" y="255.95652173913044" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F7A4B" text-anchor="middle">$25</text>
<rect x="158" y="208.7" width="40" height="91.3" fill="#6B7280"/>
  <text x="178" y="202.69565217391306" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">$60</text>
  <text x="154" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">Toronto</text>
<rect x="255" y="231.5" width="40" height="68.5" fill="#0F7A4B"/>
  <text x="275" y="225.52173913043478" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F7A4B" text-anchor="middle">$45</text>
<rect x="303" y="192.0" width="40" height="108.0" fill="#6B7280"/>
  <text x="323" y="185.95652173913044" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">$71</text>
  <text x="299" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">Calgary</text>
<rect x="400" y="242.2" width="40" height="57.8" fill="#0F7A4B"/>
  <text x="420" y="236.17391304347825" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F7A4B" text-anchor="middle">$38</text>
<rect x="448" y="181.3" width="40" height="118.7" fill="#6B7280"/>
  <text x="468" y="175.30434782608697" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">$78</text>
  <text x="444" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">Edmonton</text>
<rect x="545" y="236.8" width="40" height="63.2" fill="#0F7A4B"/>
  <text x="565" y="230.84782608695653" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F7A4B" text-anchor="middle">$41.50</text>
<rect x="593" y="90.0" width="40" height="210.0" fill="#6B7280"/>
  <text x="613" y="84.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">$138</text>
  <text x="589" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">Winnipeg</text>
