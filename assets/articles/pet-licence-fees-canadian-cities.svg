  <text x="24" y="388" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">Cat fees, senior discounts, and fines are in the table. Ottawa did not return a fee page.</text>
  <text x="24" y="408" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start">Saving Optimizer. City pages checked 27 Sep 2026.</text></svg>
