<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Cost per day</title>
  <desc>Example with made-up inputs. Not a shelf price.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Cost per day</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Example with made-up inputs. Not a shelf price.</text>
  <text x="24" y="86" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Dollars per day</text>
  <line x1="70" y1="292.0" x2="696" y2="292.0" stroke="#E5E7EB"/>
  <line x1="70" y1="200.0" x2="696" y2="200.0" stroke="#E5E7EB"/>
  <line x1="70" y1="108.0" x2="696" y2="108.0" stroke="#E5E7EB"/>
  <line x1="70" y1="108" x2="70" y2="292" stroke="#E5E7EB"/>
  <text x="64" y="296.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">0</text>
  <text x="64" y="204.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">3</text>
  <text x="64" y="112.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">6</text>
  <rect x="121.7" y="144.8" width="110.0" height="147.2" rx="6" fill="#6B7280"/>
  <text x="176.7" y="134.8" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$4.80</text>
  <text x="176.7" y="314.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Name brand</text>
  <text x="176.7" y="330.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">4 a day</text>
  <rect x="335.0" y="193.9" width="110.0" height="98.1" rx="6" fill="#F59E0B"/>
  <text x="390.0" y="183.9" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$3.20</text>
  <text x="390.0" y="314.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Store brand</text>
  <text x="390.0" y="330.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">4 a day</text>
  <rect x="548.3" y="209.2" width="110.0" height="82.8" rx="6" fill="#0F7A4B"/>
  <text x="603.3" y="199.2" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$2.70</text>
  <text x="603.3" y="314.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Bulk case</text>
  <text x="603.3" y="330.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">4 a day</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Made-up prices: $24 for 20, $16 for 20, and $54 for 80. Use is 4 a day.</text>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">$24÷20×4 = $4.80. $16÷20×4 = $3.20. $54÷80×4 = $2.70.</text>
</svg>
