<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Québec renters: most security deposits are illegal</title>
  <desc id="desc">Civil Code article 1904 and TAL: a lessor may not exact a damage or last-month deposit. Same $2,200 rent: Québec typical move-in $2,200 versus Ontario $4,400 and B.C. $3,300.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Québec: first month is the usual cheque  not a damage jar</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">C.c.Q. art. 1904 / TAL. Same $2,200 rent. 20 Sep 2026. Not legal advice.</text>
  <rect x="36" y="88" width="208" height="200" rx="12" fill="#0F7A4B"/>
  <text x="140" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Québec typical</text>
  <text x="140" y="168" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$2,200</text>
  <text x="140" y="198" text-anchor="middle" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">First periods rent</text>
  <text x="52" y="232" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">No exacted deposit</text>
  <text x="52" y="254" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">No postdated cheques</text>
  <rect x="256" y="88" width="208" height="200" rx="12" fill="#E7F4EE"/>
  <text x="360" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Ontario import</text>
  <text x="360" y="168" text-anchor="middle" font-size="26" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$4,400</text>
  <text x="360" y="198" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">First + last-month habit</text>
  <text x="272" y="232" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Wrong statute here</text>
  <text x="272" y="254" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Ask for $2,200 back</text>
  <rect x="476" y="88" width="208" height="200" rx="12" fill="#F3F4F6"/>
  <text x="580" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">If you already paid</text>
  <text x="492" y="168" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Write once, cite 1904</text>
  <text x="492" y="192" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Keep the e-transfer</text>
  <text x="492" y="216" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TAL is the usual path</text>
  <text x="492" y="240" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Clinic if forms stall</text>
  <text x="492" y="264" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Mandatory lease form</text>
  <text x="24" y="328" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A $2,200 damage deposit in Montréal is typically $2,200 you should not have parked. July 1 culture is not article 1904.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Confirm on tal.gouv.qc.ca and the Civil Code. Éducaloi (8 May 2026) is public-language backup. Not a filing kit.</text>
</svg>
