<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Ignite TV vs streaming stack</title>
  <desc id="desc">Compare Ignite TV plus internet with internet-only plus a streaming ceiling for sports and news. Drafted 22 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Ignite TV line, or a capped stack?</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Split the quote first. Illustrative. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="320" height="230" rx="12" fill="#F3F4F6"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Keep Ignite TV when</text>
  <text x="40" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Concurrent live channels</text>
  <text x="40" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Weak antenna / local news gap</text>
  <text x="40" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Apps would never get cancelled</text>
  <text x="40" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Internet discount is real for 24 months</text>
  <text x="40" y="248" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Read the tier card at your address.</text>
  <rect x="364" y="78" width="332" height="230" rx="12" fill="#E7F4EE"/>
  <text x="380" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Stream when</text>
  <text x="380" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Internet-only quote holds</text>
  <text x="380" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">One or two apps inside a ceiling</text>
  <text x="380" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Sports paused in the off-season</text>
  <text x="380" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">January audit on the calendar</text>
  <text x="380" y="248" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Illustrative ceiling $50–$70</text>
  <text x="380" y="272" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A household rule, not an average.</text>
  <rect x="24" y="324" width="672" height="48" rx="12" fill="#0F7A4B"/>
  <text x="40" y="354" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">If internet-only jumps more than the TV line, negotiate before you cancel.</text>
  <text x="24" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Confirm live Rogers and streaming prices in Canada.</text>
</svg>
