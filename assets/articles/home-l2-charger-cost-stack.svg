<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Level 2 home charger cost stack in Canada</title>
  <desc id="desc">Horizontal bars showing typical 2026 Canadian cost ranges for charger hardware, electrician labour, permits, and a panel upgrade.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Level 2 install: hardware is rarely the expensive line</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Public 2026 installer ranges. Rebates (BC Hydro up to $350; Québec $600) come off the total, not the sticker on Amazon.</text>
  <line x1="220" y1="88" x2="220" y2="300" stroke="#E5E7EB"/>
  <text x="210" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <!-- scale $4000 = 430px from x=220 -->
  <text x="220" y="88" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Typical range (midpoint shown)</text>
  <text x="24" y="128" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Hardware</text>
  <rect x="220" y="110" width="108" height="28" rx="6" fill="#4B9B74"/>
  <text x="338" y="130" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$500$1,500</text>
  <text x="24" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Labour + permit</text>
  <rect x="220" y="158" width="108" height="28" rx="6" fill="#0F7A4B"/>
  <text x="338" y="178" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$500$1,500</text>
  <text x="24" y="224" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Simple all-in</text>
  <rect x="220" y="206" width="215" height="28" rx="6" fill="#0F7A4B"/>
  <text x="445" y="226" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$1,000$3,000</text>
  <text x="24" y="272" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+ Panel upgrade</text>
  <rect x="220" y="254" width="323" height="28" rx="6" fill="#9CA3AF"/>
  <text x="553" y="274" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+$2,000$4,000</text>
  <text x="24" y="340" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Net after rebate examples: Québec $600 off · BC Hydro $350 (+$200 load device)</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Condo and rental installs can be $0 (not allowed) or a five-figure shared-riser project. Get a licensed quote before you order the EV.</text>
</svg>
