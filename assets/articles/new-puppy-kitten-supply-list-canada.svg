<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
<title id="t">New puppy or kitten: buy now, buy later, or skip</title>
<desc id="d">A three-column checklist from the article table, with no prices. Buy now: food the animal is eating, bowls, collar and leash, crate for puppies, carrier, bed or washable pad, a few toys, litter and a box for kittens, scratching post for kittens. Later: nail clipper, brush or comb, fountain or automatic feeder. Skip: clothing, a second crate or a bed in every room, opened food from a stranger, a worn harness or chewed toy.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Day one, later, or skip</text>
<text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">From the checklist table. No prices. Used items only after the safety check in the article.</text>
<rect x="24" y="72" width="216" height="296" rx="10" fill="#ECF6F1" stroke="#0F7A4B" stroke-width="1.5"/>
<text x="38" y="98" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F7A4B">Buy now</text>
<text x="38" y="124" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Food it eats now</text>
<text x="38" y="150" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Bowls</text>
<text x="38" y="176" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Collar + leash that fit</text>
<text x="38" y="202" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Crate (puppy)</text>
<text x="38" y="228" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Carrier</text>
<text x="38" y="254" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Bed or washable pad</text>
<text x="38" y="280" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• A few toys</text>
<text x="38" y="306" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Litter + box (kitten)</text>
<text x="38" y="332" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Scratching post (kitten)</text>
<rect x="252" y="72" width="216" height="296" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="266" y="98" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F7A4B">Later</text>
<text x="266" y="124" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Nail clipper</text>
<text x="266" y="150" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Brush or comb</text>
<text x="266" y="176" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Fountain or auto feeder</text>
<rect x="480" y="72" width="216" height="296" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="494" y="98" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F7A4B">Skip</text>
<text x="494" y="124" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Clothing</text>
<text x="494" y="150" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Extra crate, bed per room</text>
<text x="494" y="176" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Opened food from strangers</text>
<text x="494" y="202" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">• Worn harness, chewed toy</text>
<text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer, 27 Sep 2026. OVMA cost figures are in the article, not on this chart.</text>
</svg>
