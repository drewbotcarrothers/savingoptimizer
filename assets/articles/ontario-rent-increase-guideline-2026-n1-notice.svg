<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" role="img" aria-labelledby="title desc">
  <title id="title">Ontario 2026 rent increase guideline 2.1 percent on example rents and N1 checks</title>
  <desc id="desc">Ontario 2026 guideline is 2.1 percent. On $2,200 rent the maximum guideline increase is $46.20. Form N1 needs 90 days written notice. Increases generally once every 12 months. Exempt units use N2 and have no guideline cap.</desc>
  <rect width="720" height="472" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Ontario 2026 guideline: 2.1%  —  and the form has to be N1</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">ontario.ca residential rent increases (as of 20 Sep 2026). 90 days in writing. Once every 12 months. Do not </tspan><tspan x="24" dy="17.6">treat a text as N1.</tspan></text>
  <rect x="48" y="180" width="70" height="100" fill="#4B9B74" transform="translate(0,17.6)"/>
  <text x="83" y="168" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">+$37.80</text>
  <text x="83" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$1,800</text>
  <rect x="138" y="168" width="70" height="112" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="173" y="156" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">+$46.20</text>
  <text x="173" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$2,200</text>
  <rect x="228" y="156" width="70" height="124" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="263" y="144" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">+$54.60</text>
  <text x="263" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$2,600</text>
  <rect x="318" y="140" width="70" height="140" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="353" y="128" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">+$67.20</text>
  <text x="353" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$3,200</text>
  <text x="420" y="120" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">N1 validity checks</text>
  <text x="420" y="148" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Proper LTB form (N1 vs N2)</text>
  <text x="420" y="172" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">90 days before the effective date</text>
  <text x="420" y="196" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">12 months since last increase</text>
  <text x="420" y="220" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">or since rent was first set</text>
  <text x="420" y="252" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Dollar math = 2.1% if guideline</text>
  <text x="420" y="276" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$2,200 x 2.1% = $46.20</text>
  <text x="24" y="354" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">A $50 "rounding" on $2,200 is over. An AGI needs LTB approval — it is not a bigger N1. Exempt buildings still </tspan><tspan x="24" dy="17.6">need 90 days on N2.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Educational only. Dispute timing is generally 12 months after the amount was first charged — confirm current LTB </tspan><tspan x="24" dy="16.2">instructions. Not legal advice.</tspan></text>
</svg>
