<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Flight versus train versus drive for a short Canadian trip</title>
  <desc id="desc">Door-to-door one-way cost sketch for TorontoMontréal comparing airfare plus airport access, Via Economy, and a car with one or three passengers.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Door-to-door, not ticket vs gas  TorontoMontréal</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled one-way. Air and Via are 2026 fare bands. Confirm live. Reviewed 20 Sep 2026.</text>
  <line x1="56" y1="80" x2="56" y2="290" stroke="#E5E7EB"/>
  <line x1="56" y1="290" x2="680" y2="290" stroke="#E5E7EB"/>
  <text x="48" y="294" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="48" y="224" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$80</text>
  <text x="48" y="154" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$160</text>
  <text x="48" y="94" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$240</text>
  <rect x="86" y="118" width="88" height="172" fill="#9CA3AF"/>
  <rect x="216" y="188" width="88" height="102" fill="#0F7A4B"/>
  <rect x="346" y="176" width="88" height="114" fill="#6B7280"/>
  <rect x="476" y="218" width="88" height="72" fill="#4B9B74"/>
  <rect x="606" y="248" width="70" height="42" fill="#4B9B74"/>
  <text x="130" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Flight + access</text>
  <text x="130" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$160$280</text>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Via Economy</text>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$50$180</text>
  <text x="390" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Drive solo</text>
  <text x="390" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">~$110$170</text>
  <text x="520" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Drive / 3</text>
  <text x="520" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">~$40$60 ea</text>
  <text x="641" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Via / 3</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Flight bar includes a cheap-ish fare plus UP/rideshare or airport parking and a bag. 70 minutes in the air is not door-to-door. Union and Central Station skip that.</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Three adults in one car crush per-person cost. Three advance Economy seats can still win if downtown-to-downtown and nobody wants the 401. Carbon is secondary here.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Keep vacation itineraries in Travel. This page is mode-cost math for errands, meetings, and visiting family under ~800 km.</text>
</svg>
