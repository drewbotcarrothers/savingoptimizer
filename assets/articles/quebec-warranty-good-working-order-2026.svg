<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Years of Quebec good-working-order coverage by product group</title>
  <desc id="desc">OPC durations checked 26 September 2026: six years for ranges, refrigerators, freezers, air conditioners and heat pumps; five years for washers, dryers and dishwashers; four years for televisions; three years for computers, tablets, phones and consoles. The warranty takes effect 5 October 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Years of coverage, from delivery</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">OPC pages checked 26 Sep 2026. Takes effect 5 Oct 2026.</text>
  <line x1="250" y1="80" x2="250" y2="340" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="340" y1="80" x2="340" y2="340" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="430" y1="80" x2="430" y2="340" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="520" y1="80" x2="520" y2="340" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="610" y1="80" x2="610" y2="340" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="700" y1="80" x2="700" y2="340" stroke="#E5E7EB" stroke-width="1"/>
  <text x="328" y="360" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">3 yr</text>
  <text x="418" y="360" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">4</text>
  <text x="508" y="360" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">5</text>
  <text x="598" y="360" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">6</text>
  <text x="24" y="112" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Ranges, fridges,</text>
  <text x="24" y="128" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">freezers, ACs, heat pumps</text>
  <rect x="250" y="96" width="450" height="28" fill="#0F7A4B"/>
  <text x="610" y="115" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">6 years</text>
  <text x="24" y="184" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Washers, dryers,</text>
  <text x="24" y="200" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">dishwashers</text>
  <rect x="250" y="168" width="375" height="28" fill="#0F7A4B"/>
  <text x="545" y="187" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">5 years</text>
  <text x="24" y="256" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Televisions</text>
  <rect x="250" y="236" width="300" height="28" fill="#0F7A4B"/>
  <text x="478" y="255" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4 years</text>
  <text x="24" y="312" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Computers, tablets,</text>
  <text x="24" y="328" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">phones, consoles</text>
  <rect x="250" y="300" width="225" height="28" fill="#0F7A4B"/>
  <text x="400" y="319" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3 years</text>
  <text x="24" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Each bar is 75 pixels per year. Goods bought before 5 Oct 2026 are outside this warranty.</text>
</svg>
