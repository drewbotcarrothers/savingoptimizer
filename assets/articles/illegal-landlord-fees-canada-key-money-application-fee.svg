<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Key money and application fees in Canada  refuse the rebrands</title>
  <desc id="desc">Common illegal or red-flag landlord fees across Ontario, B.C., and Québec: application fees, holding e-transfers, key money, and extra damage deposits. Walking away can be cheaper than paying to win the unit.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Everyone pays this is not a statute</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Ontario LTB · B.C. RTB · Québec TAL. 20 Sep 2026. Cash saved, not litigation theatre.</text>
  <rect x="24" y="80" width="220" height="214" rx="12" fill="#E7F4EE"/>
  <text x="134" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Rebranded fees</text>
  <text x="40" y="148" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Application / credit check</text>
  <text x="40" y="172" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Holding / off Kijiji</text>
  <text x="40" y="196" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Key money / furniture buy-in</text>
  <text x="40" y="220" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Damage hold (ON/QC)</text>
  <text x="40" y="244" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Monthly pet fee (BC)</text>
  <text x="40" y="268" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Admin / lease-prep charge</text>
  <rect x="256" y="80" width="220" height="214" rx="12" fill="#0F7A4B"/>
  <text x="366" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Lawful cash instead</text>
  <text x="272" y="148" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">ON: last-month rent</text>
  <text x="272" y="172" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">BC: d half-month security</text>
  <text x="272" y="196" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">QC: first month typical</text>
  <text x="272" y="220" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Key: replacement cost only</text>
  <text x="272" y="244" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Compete with a PDF pack</text>
  <text x="272" y="268" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Write, then the board</text>
  <rect x="488" y="80" width="208" height="214" rx="12" fill="#1A1A1A"/>
  <text x="592" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Walk-away math</text>
  <text x="504" y="152" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$800 fee to win</text>
  <text x="504" y="176" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">+ new deposit elsewhere</text>
  <text x="504" y="200" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">= often worse than</text>
  <text x="504" y="224" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">one more viewing day</text>
  <text x="504" y="248" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Recover if already paid</text>
  <text x="504" y="272" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">T1 / RTB / TAL path</text>
  <text x="24" y="328" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">B.C. cannot charge to process an application (RTB). Ontario rental-offences material flags extra fees. Québec bars extra amounts besides rent.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Educational map. Atlantic and Prairie rules differ  find that provinces tenancy office before you import these three. Not legal advice.</text>
</svg>
