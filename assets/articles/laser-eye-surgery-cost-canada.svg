<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Illustrative cumulative cost of glasses and contacts versus one surgery</title>
  <desc>A worked example, not a clinic price. Glasses and contacts cost $450 a year. Surgery is $4,500 in year 0. The lines meet in year 10.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Illustrative break-even</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">$450 a year of glasses and contacts, and $4,500 of surgery in year 0. Not a quote.</text>
  <line x1="80" y1="80" x2="80" y2="330" stroke="#E5E7EB"/>
  <line x1="80" y1="330" x2="660" y2="330" stroke="#E5E7EB"/>
  <line x1="80" y1="80" x2="660" y2="80" stroke="#E5E7EB"/>
  <line x1="80" y1="163" x2="660" y2="163" stroke="#E5E7EB"/>
  <line x1="80" y1="247" x2="660" y2="247" stroke="#E5E7EB"/>
  <text x="28" y="84" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$4,500</text>
  <text x="28" y="167" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$3,000</text>
  <text x="28" y="251" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$1,500</text>
  <text x="36" y="348" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$0</text>
  <polyline fill="none" stroke="#6B7280" stroke-width="3" points="80,330 136,305 192,280 248,255 304,230 360,205 416,180 472,155 528,130 584,105 640,80"/>
  <polyline fill="none" stroke="#0F7A4B" stroke-width="3" points="80,80 640,80"/>
  <circle cx="640" cy="80" r="5" fill="#0F7A4B"/>
  <text x="100" y="74" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0F7A4B">Surgery, flat at $4,500</text>
  <text x="300" y="300" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Glasses and contacts, $450 x years</text>
  <text x="80" y="368" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Year 0</text>
  <text x="580" y="368" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Year 10, lines meet</text>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer, 27 Sep 2026. 10 x $450 = $4,500. No clinic price and no interest rate were opened.</text>

</svg>
