<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: a couple&#x27;s receipts</title>
<desc id="d">Horizontal bars for a made-up couple: Partner A earlier gifts $400, GivingTuesday $250, Partner B earlier gifts $300, December gift $200, total $1,150.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: a couple&#x27;s receipts</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Donation receipts for 2026, pooled on one return</text>
<text x="240" y="110.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">A, earlier in year</text>
<rect x="250" y="88.6" width="121.7" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="379.7" y="110.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$400</text>
<text x="240" y="166.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">A, GivingTuesday</text>
<rect x="250" y="144.6" width="76.1" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="334.1" y="166.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$250</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">B, earlier in year</text>
<rect x="250" y="200.6" width="91.3" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="349.3" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$300</text>
<text x="240" y="278.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">B, December</text>
<rect x="250" y="256.6" width="60.9" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="318.9" y="278.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$200</text>
<text x="240" y="334.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Total pooled</text>
<rect x="250" y="312.6" width="350.0" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="334.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$1,150</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
