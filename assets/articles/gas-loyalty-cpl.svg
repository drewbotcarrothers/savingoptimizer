<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canada gas loyalty base cents per litre 2026</title>
  <desc id="desc">Approximate base-earn value at Esso PC Optimum, Petro-Canada Petro-Points, and Shell Scene+ before credit-card stacks.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Base pump earn (before cards and loaded offers)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative cents per litre at published 2026 base rates. Stacks change the winner.</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <text x="24" y="108" font-weight="600" fill="#1A1A1A">Esso/Mobil PC Optimum (10 pts/L)</text>
    <rect x="340" y="90" width="80" height="24" rx="4" fill="#9CA3AF"/>
    <text x="430" y="108" fill="#6B7280">~1.0¢/L</text>
    <text x="24" y="152" font-weight="600" fill="#1A1A1A">PC Mastercard at Esso (30+ pts/L)</text>
    <rect x="340" y="134" width="240" height="24" rx="4" fill="#0F7A4B"/>
    <text x="590" y="152" fill="#FFFFFF">~3.0¢+/L</text>
    <text x="24" y="196" font-weight="600" fill="#1A1A1A">Petro-Points base (10 pts/L)</text>
    <rect x="340" y="178" width="80" height="24" rx="4" fill="#9CA3AF"/>
    <text x="430" y="196" fill="#6B7280">~1.0¢/L</text>
    <text x="24" y="240" font-weight="600" fill="#1A1A1A">Petro-Points Platinum (15 pts/L)</text>
    <rect x="340" y="222" width="120" height="24" rx="4" fill="#0F7A4B"/>
    <text x="470" y="240" fill="#FFFFFF">~1.5¢/L</text>
    <text x="24" y="284" font-weight="600" fill="#1A1A1A">Shell Scene+ (1 pt/L = 1¢)</text>
    <rect x="340" y="266" width="80" height="24" rx="4" fill="#0F7A4B"/>
    <text x="430" y="284" fill="#FFFFFF">~1.0¢/L</text>
    <text x="24" y="328" font-weight="600" fill="#1A1A1A">Shell + Go+ + Scotia card stack</text>
    <rect x="340" y="310" width="300" height="24" rx="4" fill="#0F7A4B"/>
    <text x="650" y="328" fill="#FFFFFF">often 4-7¢/L</text>
  </g>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">PC 10,000 pts = $10; Petro-Points 1,000 = $1; Scene+ 1,000 = $10. Confirm live apps  offers move weekly.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer - Canada - 16 Sep 2026</text>
</svg>
