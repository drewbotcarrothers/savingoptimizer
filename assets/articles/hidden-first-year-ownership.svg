  <text x="24" y="360" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Worked stay test: $18,000 extra year-one cash / $400 "cheaper than rent" = 45 months before you have only earned back the cash  -  before sell costs.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Home-insurance comparison and furniture-outlet deals are offer types only. Not mortgage, tax, or brokerage advice. Tie back to the rent-vs-buy stacks.</text>
