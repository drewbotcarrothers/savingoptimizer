<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Hidden first-year Canadian homeownership cash beyond the down payment</title>
  <desc id="desc">Labelled first-year stack: closing costs, immediate repairs, property-tax instalments, utility deposits, insurance, moving overlap, and a maintenance reserve. Ontario first-time land-transfer refund is up to $4,000. These lines often move a rent-versus-buy break-even by years.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Year one is not "down payment + mortgage"</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled cash-to-survive sketch, 20 Sep 2026. Ontario first-time LTT refund max $4,000 (ontario.ca, updated 10 Feb 2026). Not a quote.</text>
