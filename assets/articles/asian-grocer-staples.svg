<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Asian grocer staple pack versus banner prices</title>
  <desc id="desc">Illustrative urban Canada comparison of a rice, oil, sauce, and produce staple run at an Asian grocer versus the same items at a national banner.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Build the pantry once, then ride discounter meat sales</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled urban sketch, Sep 2026. Unit prices move. Weigh the 8 kg rice bag before you cheer.</text>
  <rect x="40" y="88" width="300" height="188" rx="12" fill="#F3F4F6"/>
  <text x="190" y="124" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6B7280">Same staples at a banner</text>
  <text x="190" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A">~$42</text>
  <text x="190" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">2 kg rice, 1 L oil, soy,</text>
  <text x="190" y="228" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">chillies, tofu, greens</text>
  <rect x="380" y="88" width="300" height="188" rx="12" fill="#E7F4EE" stroke="#0F7A4B"/>
  <text x="530" y="124" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F7A4B">Asian grocer staple run</text>
  <text x="530" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0F7A4B">~$28</text>
  <text x="530" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Larger rice + oil, house soy,</text>
  <text x="530" y="228" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">bulk chillies, two tofu blocks</text>
  <text x="24" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Gap is a teaching range, not a promise. If you cannot store 8 kg of rice, buy the 4 kg and still compare $/kg.</text>
  <text x="24" y="338" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Meat still comes from Thursday Flipp at No Frills, FreshCo, or Food Basics unless the market's poultry is genuinely cheaper.</text>
  <text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer - Canada - 20 Sep 2026</text>
</svg>
