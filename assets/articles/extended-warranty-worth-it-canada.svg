<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Skip a protection plan when you are already covered</title>
  <desc id="desc">If the manufacturer warranty, the card certificate, or provincial law already covers the failure, skip the store plan. If not, consider a plan only when you cannot self-insure and the plan price is lower than a written repair quote. Otherwise skip.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Already covered? Skip the plan.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Education only. No card names and no invented repair prices.</text>
  <rect x="145" y="74" width="430" height="52" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Manufacturer + card certificate + provincial law:</text>
  <text x="360" y="114" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">does one of them cover this failure?</text>
  <line x1="250" y1="126" x2="140" y2="168" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="470" y1="126" x2="580" y2="168" stroke="#E5E7EB" stroke-width="2"/>
  <text x="160" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Yes</text>
  <text x="530" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">No</text>
  <rect x="40" y="168" width="200" height="48" rx="8" fill="#0F7A4B"/>
  <text x="140" y="197" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Skip the plan</text>
  <rect x="470" y="168" width="210" height="64" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="575" y="192" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Can you self-insure</text>
  <text x="575" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">the replacement?</text>
  <line x1="520" y1="232" x2="430" y2="280" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="640" y1="232" x2="640" y2="280" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="300" y="280" width="180" height="48" rx="8" fill="#0F7A4B"/>
  <text x="390" y="309" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Yes: skip the plan</text>
  <rect x="520" y="280" width="180" height="72" rx="8" fill="#0F7A4B"/>
  <text x="610" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">No: compare the plan</text>
  <text x="610" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">to a written quote.</text>
  <text x="610" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF">Consider only if cheaper.</text>
  <text x="24" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Quebec legal years take effect 5 Oct 2026 for listed goods. Ontario page updated 25 Sep 2024. Read your own certificate.</text>
</svg>
