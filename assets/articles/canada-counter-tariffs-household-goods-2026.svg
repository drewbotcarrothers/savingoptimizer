<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Check origin, then the 8 September 2026 list, before you buy</title>
  <desc id="desc">Decision flow for household goods. If the good is not U.S. origin, the September 2026 counter-tariff is not the issue. If it is U.S. origin, confirm the tariff item on Finance Canada's list. If the item is listed, compare a non-U.S. alternative. Do not panic-buy. Goods in transit on 8 September 2026 are excluded by the Finance Canada backgrounder.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Origin first. Then the tariff item. Then stop.</text>
  <text x="24" y="50" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Finance Canada backgrounder and list, read 26 Sep 2026.</text>
  <rect x="230" y="68" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="95" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">U.S. origin on the mark?</text>
  <line x1="360" y1="112" x2="360" y2="132" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="40" y="132" width="200" height="48" rx="8" fill="#0F7A4B"/>
  <text x="140" y="152" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">No: this tariff</text>
  <text x="140" y="168" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">is not the issue</text>
  <rect x="470" y="132" width="210" height="48" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="575" y="152" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Yes: is that tariff item</text>
  <text x="575" y="168" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">on the 8 Sep 2026 list?</text>
  <line x1="575" y1="180" x2="575" y2="206" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="470" y="206" width="210" height="48" rx="8" fill="#0F7A4B"/>
  <text x="575" y="226" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Not listed: do not</text>
  <text x="575" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">invent a category rate</text>
  <rect x="230" y="270" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="292" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Listed: already in a Canadian</text>
  <text x="360" y="308" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">store, or still to be imported?</text>
  <line x1="360" y1="322" x2="360" y2="344" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="145" y="344" width="430" height="48" rx="8" fill="#0F7A4B"/>
  <text x="360" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Compare a non-U.S. alternative. Do not panic-buy.</text>
  <text x="360" y="382" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">In-transit goods on 8 Sep 2026 are excluded.</text>
</svg>
