<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Ontario and Toronto first-time land transfer tax refund stack</title>
  <desc id="desc">Ontario first-time refund maximum $4,000 covering provincial LTT on the first $368,000. Toronto municipal first-time rebate up to $4,475. Combined labelled maximum $8,475. Worked $650,000 Toronto condo: $18,950 combined tax before refunds, about $10,475 after.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Ontario + Toronto LTT: stack the refunds, then still write a cheque</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">ontario.ca first-time refund max $4,000 (updated 10 Feb 2026). Toronto MLTT rebate up to $4,475 (toronto.ca).</text>
  <rect x="48" y="168" width="80" height="112" fill="#4B9B74"/>
  <text x="88" y="156" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$4,000</text>
  <text x="88" y="300" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ON refund</text>
  <rect x="148" y="156" width="80" height="124" fill="#0F7A4B"/>
  <text x="188" y="144" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$4,475</text>
  <text x="188" y="300" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TO rebate</text>
  <rect x="248" y="88" width="80" height="192" fill="#0F7A4B"/>
  <text x="288" y="76" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$18,950</text>
  <text x="288" y="300" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$650k both</text>
  <rect x="348" y="168" width="80" height="112" fill="#4B9B74"/>
  <text x="388" y="156" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$10,475</text>
  <text x="388" y="300" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Net if both</text>
  <text x="460" y="120" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Eligibility (confirm live pages)</text>
  <text x="460" y="148" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">18+; never owned anywhere</text>
  <text x="460" y="172" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Spouse history can block you</text>
  <text x="460" y="196" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Occupy within 9 months</text>
  <text x="460" y="220" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Citizen or PR (or within 18 mo.)</text>
  <text x="460" y="252" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Claim at registration or</text>
  <text x="460" y="276" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">apply within 18 months</text>
  <text x="24" y="354" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Labelled $650,000 Toronto condo: one-side LTT $9,475 × 2 = $18,950. Minus $8,475 stack = $10,475 plus MLTT admin fee.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Not a lawyer’s estimate. Verify ontario.ca and toronto.ca before you spend the refund in your head.</text>
</svg>
