<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">PPI cost versus skipped rust-belt repairs</title>
  <desc id="desc">Horizontal bars comparing a typical independent PPI to example brake-line, subframe, timing, and used-EV battery repair bands.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Skip the PPI, buy the repair.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled 2026 Canadian shop bands — not bids. Salt provinces fail cars that still “drive fine.”</text>
  <line x1="230" y1="80" x2="230" y2="330" stroke="#E5E7EB"/>
  <text x="24" y="112" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Independent PPI</text>
  <rect x="230" y="92" width="52" height="26" rx="6" fill="#0F7A4B"/>
  <text x="292" y="111" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$150–$300</text>
  <text x="24" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Brake lines / rust</text>
  <rect x="230" y="142" width="160" height="26" rx="6" fill="#4B9B74"/>
  <text x="400" y="161" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1,500–$5,000+</text>
  <text x="24" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Timing / engine</text>
  <rect x="230" y="192" width="220" height="26" rx="6" fill="#4B9B74"/>
  <text x="460" y="211" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$2,000–$8,000+</text>
  <text x="24" y="262" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Used EV battery</text>
  <rect x="230" y="242" width="360" height="26" rx="6" fill="#9CA3AF"/>
  <text x="600" y="261" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Four–five figures</text>
  <text x="24" y="312" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Dealer “inspection”</text>
  <rect x="230" y="292" width="8" height="26" rx="4" fill="#9CA3AF"/>
  <text x="248" y="311" font-size="13" font-weight="700" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0 independence</text>
  <text x="24" y="368" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Pay a shop you chose. Walk if the seller blocks the hoist.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">CAA-Québec rust education is prevention on a car you own — on a car you might buy, prevention is the lift.</text>
</svg>
