<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Prairie hybrid weeks: pass vs tickets / Arc cap</title>
  <desc id="desc">Calgary hybrid 26 × $4.00 = $104 beats the $126 pass. Edmonton’s $102 cap is automatic on one payment method — do not also buy a paper monthly.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Prairie hybrid weeks: pass vs tickets / Arc cap</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Calgary 2026 adult $4.00 / monthly $126. Edmonton Arc PAYG $3.00, monthly cap $102 (reviewed Sep 2026).</text>
  <line x1="64" y1="88" x2="64" y2="300" stroke="#E5E7EB"/>
  <line x1="64" y1="300" x2="696" y2="300" stroke="#E5E7EB"/>
