  <text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Calgary hybrid 26 × $4.00 = $104 beats the $126 pass. Edmonton’s $102 cap is automatic on one payment method — do not also buy a paper monthly.</text>
