  <text x="128" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">YYC 26 tix</text>
  <text x="128" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">hybrid</text>
  <rect x="199" y="174" width="95" height="126" rx="6" fill="#0F7A4B"/>
