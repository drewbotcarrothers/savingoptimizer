  <text x="246" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">YYC pass</text>
  <text x="246" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">monthly</text>
  <rect x="318" y="128" width="95" height="172" rx="6" fill="#9CA3AF"/>
  <text x="366" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$172</text>
  <text x="366" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">YYC 43 tix</text>
  <text x="366" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">5-day</text>
  <rect x="437" y="222" width="95" height="78" rx="6" fill="#9CA3AF"/>
  <text x="484" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$78</text>
  <text x="484" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">YEG 26</text>
  <text x="484" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Arc $3</text>
  <rect x="556" y="198" width="95" height="102" rx="6" fill="#0F7A4B"/>
  <text x="604" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$102</text>
