<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Toronto water bills: consumption and sewer explained</title>
  <desc id="desc">Block 1 is combined water plus wastewater at $4.8629 per cubic metre on time from 1 Jan 2026. Block 2 is industrial. Leak adjustments need about 3 times historical daily average. Condos often never see the bill.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Block 1 is water plus wastewater</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">$4.8629/m3 on time, $5.1188 after due date. 1 Jan 2026 interim. Used 20 Sep 2026.</text>
  <rect x="24" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">The rate</text>
  <text x="40" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Block 1: households</text>
  <text x="40" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Up to 5,000 m3/year</text>
  <text x="40" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3.75% interim increase</text>
  <text x="40" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Block 2 is industrial</text>
  <text x="40" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">process use - not yours.</text>
  <text x="40" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Pay on time.</text>
  <rect x="252" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Leaks</text>
  <text x="268" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">20 m3/day ~ $97/day</text>
  <text x="268" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Dye-test every toilet</text>
  <text x="268" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Adjustment ~3x history</text>
  <text x="268" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">A repaired toilet is not</text>
  <text x="268" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">an automatic credit.</text>
  <text x="268" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Photo the meter first.</text>
  <rect x="480" y="78" width="216" height="230" rx="12" fill="#F3F4F6"/>
  <text x="496" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Who sees it</text>
  <text x="496" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">House: you see Block 1</text>
  <text x="496" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Condo: often the corp</text>
  <text x="496" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rental: lease language</text>
  <text x="496" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Low-income rebate</text>
  <text x="496" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1.4589/m3 if eligible.</text>
  <text x="496" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Apply; not automatic.</text>
  <text x="24" y="344" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">20 m3 in a month is about $97 on time - or just over $100 if you miss the due date.</text>
  <text x="24" y="368" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Search toronto.ca the week you shop toilets. 2018 news clippings are not forms.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Confirm live rates if Council amends the 2026 budget.</text>
</svg>
