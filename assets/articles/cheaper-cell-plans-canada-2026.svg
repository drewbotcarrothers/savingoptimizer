<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: annual cost of four two-line plan structures</title>
  <desc>Example with made-up inputs. A two-line household pays 1,920 dollars a year on a main-brand postpaid structure at 80 dollars a line, 1,080 dollars on a flanker postpaid structure at 45 dollars a line, 840 dollars bringing their own phones at 35 dollars a line, and 720 dollars on prepaid at 30 dollars a line.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs</text>
  <text x="24" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Annual phone-plan cost for two lines. Not a quoted plan and not a ranking.</text>
  <text x="24" y="86" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Main-brand postpaid, two lines</text><rect x="250" y="70" width="400.0" height="26" rx="3" fill="#0F7A4B"/><text x="658.0" y="88" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">$1,920</text><text x="24" y="146" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Flanker postpaid, two lines</text><rect x="250" y="130" width="225.0" height="26" rx="3" fill="#0F7A4B"/><text x="483.0" y="148" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">$1,080</text><text x="24" y="206" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">BYOD on the lower plan, two lines</text><rect x="250" y="190" width="175.0" height="26" rx="3" fill="#F59E0B"/><text x="433.0" y="208" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">$840</text><text x="24" y="266" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Prepaid, two lines</text><rect x="250" y="250" width="150.0" height="26" rx="3" fill="#F59E0B"/><text x="408.0" y="268" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">$720</text>
  <text x="24" y="320" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Main brand: 2 x $80 x 12. Flanker: 2 x $45 x 12. BYOD: 2 x $35 x 12. Prepaid: 2 x $30 x 12.</text>
  <text x="24" y="342" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Device financing is left out. A financed phone can erase the gap. See the financing guide.</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Coverage, a trial period, and an early cancellation fee still apply when you switch.</text>
  <text x="24" y="394" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Wireless Code, simplified, checked 30 Sep 2026. These dollars were not on that page.</text>
</svg>
