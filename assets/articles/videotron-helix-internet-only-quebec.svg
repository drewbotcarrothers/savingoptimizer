<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Helix internet-only versus TV bundle sketch</title>
  <desc id="desc">Illustrative Quebec Helix math: internet-only plus a streaming ceiling versus a TV bundle that still keeps streaming. Verify live. Drafted 23 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Refuse the TV upsell. Price both paths.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Quebec Helix worksheet sketch, taxes extra. 23 Sep 2026.</text>
  <rect x="48" y="88" width="300" height="236" rx="12" fill="#E7F4EE"/>
  <text x="198" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Internet-only Helix</text>
  <text x="198" y="156" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Written internet rate x 24</text>
  <text x="198" y="186" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+ streaming ceiling you set</text>
  <text x="198" y="216" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">One promo clock to watch</text>
  <text x="198" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Ask for email confirmation</text>
  <rect x="372" y="88" width="300" height="236" rx="12" fill="#F3F4F6"/>
  <text x="522" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Helix + entry TV</text>
  <text x="522" y="156" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Bundle internet + TV lines</text>
  <text x="522" y="186" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+ streaming you still keep</text>
  <text x="522" y="216" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Two clocks can cliff apart</text>
  <text x="522" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Only if you watch Helix TV</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Quote Fizz on the same plant and Bell Fibe where glass exists before you accept a temporary TV credit.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">French and English PDFs can label credits differently — keep the language you negotiated.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Live Videotron address tools override this sketch.</text>
</svg>
