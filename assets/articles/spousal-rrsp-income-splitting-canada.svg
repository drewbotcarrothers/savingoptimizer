<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Spousal RRSP roles</title>
  <desc id="desc">Contributor uses RRSP room; annuitant owns the plan; attribution can apply after recent contributions.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Spousal RRSP: who does what</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Education sketch. Confirm with CRA. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="320" height="200" rx="12" fill="#E7F4EE"/>
  <text x="40" y="110" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Contributor</text>
  <text x="40" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Uses their RRSP deduction room</text>
  <text x="40" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">May claim the deduction</text>
  <text x="40" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Does not own the spousal plan</text>
  <text x="40" y="214" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">2026 dollar limit $33,810 (verify personal)</text>
  <rect x="376" y="78" width="320" height="200" rx="12" fill="#F3F4F6"/>
  <text x="392" y="110" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Annuitant</text>
  <text x="392" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Owns the plan</text>
  <text x="392" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Later withdrawals usually their income</text>
  <text x="392" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">After attribution rules allow</text>
  <text x="392" y="214" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Not a same-year vacation loophole</text>
  <text x="24" y="320" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Fund match, buffer, high-interest debt, and fitting TFSA/FHSA goals first.</text>
  <text x="24" y="342" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Attribution look-back is multi-year — read CRA, do not DIY.</text>
  <text x="24" y="364" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Not tax advice.</text>
</svg>
