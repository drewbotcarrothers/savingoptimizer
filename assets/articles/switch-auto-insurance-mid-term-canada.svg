<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Labelled mid-term auto switch math</title>
  <desc id="desc">On a prepaid 2400 dollar annual premium with 180 days used, a day-count refund would be about 1216 dollars. An illustrated short-rate refund of 1040 dollars is what you compare with the new premium for the remaining days.</desc>
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Compare the refund you will actually get</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled illustration. Not an OAP 1 table. $2,400 annual, 180 days used.</text>
  <text x="120" y="96" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Dollars returned or charged for the rest of the term</text>
  <rect x="80" y="150" width="90" height="170" rx="6" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="92" y="142" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F7A4B">$1,216</text>
  <text x="86" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Day-count</text>
  <text x="90" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">refund</text>
  <rect x="250" y="174" width="90" height="146" rx="6" fill="#0F7A4B"/>
  <text x="262" y="166" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">$1,040</text>
  <text x="248" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Illustrated</text>
  <text x="252" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">short-rate</text>
  <rect x="420" y="188" width="90" height="132" rx="6" fill="#1A1A1A"/>
  <text x="436" y="180" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">$980</text>
  <text x="426" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">New policy</text>
  <text x="418" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">same limits</text>
  <rect x="560" y="250" width="90" height="70" rx="6" fill="#0F7A4B"/>
  <text x="578" y="242" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F7A4B">$60</text>
  <text x="568" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Ahead if</text>
  <text x="562" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">you switch</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">If the annual premium was prepaid, switching wins here only because $980 is under the $1,040 refund.</text>
  <text x="24" y="418" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Ontario OAP 1 uses short rate when you cancel. Ask for your dollar figure. Public provinces differ.</text>
</svg>
