<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">How to shop auto insurance channels in Canada</title>
  <desc id="desc">Flow of brokers, direct insurers, and aggregators for apples-to-apples auto insurance quotes.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Shop the channel, then match the coverage</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">FSRA (Ontario): get at least three quotes. Headline premium is not a coverage match.</text>
  <rect x="24" y="80" width="210" height="120" rx="8" fill="#0F7A4B"/>
  <text x="40" y="108" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Broker</text>
  <text x="40" y="132" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Many insurers, one</text>
  <text x="40" y="150" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">conversation. Ask which</text>
  <text x="40" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">companies they represent.</text>
  <rect x="255" y="80" width="210" height="120" rx="8" fill="#0F7A4B"/>
  <text x="271" y="108" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Direct writer</text>
  <text x="271" y="132" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">One company, often</text>
  <text x="271" y="150" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">online. Still compare</text>
  <text x="271" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">against a broker quote.</text>
  <rect x="486" y="80" width="210" height="120" rx="8" fill="#4B5563"/>
  <text x="502" y="108" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Aggregator</text>
  <text x="502" y="132" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Lead form, not a policy.</text>
  <text x="502" y="150" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Use as a scan, then</text>
  <text x="502" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">verify identical cover.</text>
  <rect x="24" y="220" width="672" height="88" rx="8" fill="#F3F4F6"/>
  <text x="40" y="248" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Same worksheet every quote</text>
  <text x="40" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Liability limit · collision/comprehensive deductibles · accident benefits options · listed drivers · km and use</text>
  <text x="40" y="290" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Winter tires · multi-policy · telematics · pleasure vs commute. Re-shop at renewal, not mid-term (FSRA).</text>
  <text x="24" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Public auto (ICBC, MPI, SGI) and Quebec SAAQ + private damage change the shopping map. Education only  not a broker.</text>
  <text x="24" y="362" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Quote tools are an offer type. Confirm licence of any seller on FSRA / RIBO / provincial regulator sites.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer - Canada - 16 Sep 2026</text>
</svg>
