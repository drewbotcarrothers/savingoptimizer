<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Same mortgage, different monthly shelter (worksheet)</title>
  <desc id="desc">Labelled example: $2,100 principal and interest held constant. Not a city average.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Same mortgage, different monthly shelter (worksheet)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled example: $2,100 principal and interest held constant. Not a city average.</text>
  <line x1="80" y1="310.0" x2="680" y2="310.0" stroke="#E5E7EB"/><text x="72" y="314.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text><line x1="80" y1="255.0" x2="680" y2="255.0" stroke="#E5E7EB"/><text x="72" y="259.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$850</text><line x1="80" y1="200.0" x2="680" y2="200.0" stroke="#E5E7EB"/><text x="72" y="204.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1.7k</text><line x1="80" y1="145.0" x2="680" y2="145.0" stroke="#E5E7EB"/><text x="72" y="149.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$2.5k</text><line x1="80" y1="90.0" x2="680" y2="90.0" stroke="#E5E7EB"/><text x="72" y="94.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$3.4k</text>
  <rect x="108.0" y="112.6" width="162.7" height="197.4" rx="8" fill="#9CA3AF"/><text x="189.3" y="102.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$3,050</text><text x="189.3" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Condo</text><text x="189.3" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">fee + tax + ins.</text><rect x="298.7" y="130.1" width="162.7" height="179.9" rx="8" fill="#4B9B74"/><text x="380.0" y="120.1" text-anchor="middle" font-size="13" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">$2,780</text><text x="380.0" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Townhouse</text><text x="380.0" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">partial fee</text><rect x="489.3" y="136.6" width="162.7" height="173.4" rx="8" fill="#0F7A4B"/><text x="570.7" y="126.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$2,680</text><text x="570.7" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Freehold</text><text x="570.7" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">tax + sinking fund</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">The mortgage line is the same in this teaching chart. Condo fees and an honest freehold maintenance fund are what actually rank affordability.</text>
</svg>
