<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">40 L/week: pump gap vs detour and queue</title>
  <desc id="desc">Teaching km cost ~$0.70/km: a 10 km extra round trip weekly is ~$364/year of driving to save $166 — the membership-for-gas story dies. Combine with the warehouse shop.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">40 L/week: pump gap vs detour and queue</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative 8¢/L gap on 2,080 L/year = $166 before extra kilometres and time. Gold Star $65 + tax (Costco.ca, Sep 2026).</text>
  <line x1="64" y1="88" x2="64" y2="300" stroke="#E5E7EB"/>
  <line x1="64" y1="300" x2="696" y2="300" stroke="#E5E7EB"/>
  <rect x="80" y="134" width="100" height="166" rx="6" fill="#0F7A4B"/>
  <text x="130" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$166</text>
  <text x="130" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">8¢ gap</text>
  <text x="130" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">2,080 L</text>
  <rect x="204" y="234" width="100" height="66" rx="6" fill="#9CA3AF"/>
  <text x="254" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$65</text>
  <text x="254" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Gold Star</text>
  <text x="254" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">fee</text>
  <rect x="328" y="190" width="100" height="110" rx="6" fill="#4B9B74"/>
  <text x="378" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">~$110</text>
  <text x="378" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">10 km detour</text>
  <text x="378" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">52 wks</text>
  <rect x="452" y="244" width="100" height="56" rx="6" fill="#9CA3AF"/>
  <text x="502" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$56</text>
  <text x="502" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Net if detour</text>
  <text x="502" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">after km</text>
  <text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Teaching km cost ~$0.70/km: a 10 km extra round trip weekly is ~$364/year of driving to save $166 — the membership-for-gas story dies. Combine with the warehouse shop.</text>
</svg>
