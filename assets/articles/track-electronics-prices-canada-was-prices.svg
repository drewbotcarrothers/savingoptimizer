<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: how often each price appeared</title>
<desc id="d">Horizontal bars for a made-up price log: $899 seen 2 times, $849 seen 3 times, $799 seen 2 times, $699 seen 1 time.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: how often each price appeared</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Eight log entries for one TV model over 16 weeks</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$899 (tag was-price)</text>
<rect x="250" y="93.0" width="233.3" height="40.0" rx="3" fill="#6B7280"/>
<text x="491.3" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">2 times</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$849</text>
<rect x="250" y="163.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">3 times</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$799</text>
<rect x="250" y="233.0" width="233.3" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="491.3" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">2 times</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$699 (sale)</text>
<rect x="250" y="303.0" width="116.7" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="374.7" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">1 time</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
