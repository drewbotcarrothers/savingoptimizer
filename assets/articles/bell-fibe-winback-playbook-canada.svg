<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Bell Fibe fibre versus legacy copper uploads</title>
  <desc id="desc">Illustrative upload comparison: symmetrical Pure Fibre tiers versus a legacy copper-finish Fibe plan near 10 Mbps up, plus a short checklist before the tech visit.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Which Fibe are you negotiating?</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Upload is the tell. Ontario public cards, not a winback. Drafted 21 Sep 2026.</text>
  <text x="160" y="92" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Legacy copper finish</text>
  <rect x="40" y="108" width="240" height="22" rx="6" fill="#F3F4F6"/>
  <rect x="40" y="108" width="16" height="22" rx="6" fill="#0F7A4B"/>
  <text x="290" y="124" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">about 10 Mbps up</text>
  <text x="160" y="160" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Pure Fibre 150 and 500</text>
  <rect x="40" y="176" width="240" height="22" rx="6" fill="#E7F4EE"/>
  <rect x="40" y="176" width="240" height="22" rx="6" fill="#0F7A4B"/>
  <text x="290" y="192" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">150 or 500 Mbps up</text>
  <text x="160" y="228" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Pure Fibre 1.5 (upload cap)</text>
  <rect x="40" y="244" width="240" height="22" rx="6" fill="#E7F4EE"/>
  <rect x="40" y="244" width="200" height="22" rx="6" fill="#0F7A4B"/>
  <text x="290" y="260" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">940 Mbps up</text>
  <text x="24" y="310" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Before the tech visit, the email names:</text>
  <text x="24" y="334" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Monthly rate, each credit, term, ETF, upload, and whether a $150 install applies.</text>
  <text x="24" y="358" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Ontario Internet and Mobility page, 21 Sep 2026: self-install $0; $150 if you decline self-install when it is offered.</text>
  <text x="24" y="380" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Unreturned Giga Hub 2.0: third-party reading of Bell's outside-Quebec fee page cited $249 (26 Aug 2026). Confirm.</text>
  <text x="24" y="402" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Winback sketches from forums are not Bell offers. Education only.</text>
</svg>
