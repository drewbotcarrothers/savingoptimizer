<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">What independent ethnic grocers often price better in Canada</title>
  <desc id="desc">Split of staple categories that independent markets often beat national banners on versus categories that still belong at a discounter.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Shop the market for staples, the discounter for flyer meat</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Urban Canada pattern, not a stereotype and not a city index. Verify unit price on the day.</text>
  <rect x="40" y="86" width="300" height="210" rx="12" fill="#E7F4EE"/>
  <text x="56" y="118" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">Often cheaper here</text>
  <text x="56" y="150" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Rice, pulses, and cooking oil</text>
  <text x="56" y="176" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Herbs, spices, and sauces</text>
  <text x="56" y="202" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">In-season produce with high turnover</text>
  <text x="56" y="228" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Tofu, yogurt tubs, flatbreads</text>
  <text x="56" y="254" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Frozen dumplings and veg mixes</text>
  <rect x="380" y="86" width="300" height="210" rx="12" fill="#F3F4F6"/>
  <text x="396" y="118" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Still check the discounter</text>
  <text x="396" y="150" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Flyer chicken, pork, and eggs</text>
  <text x="396" y="176" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Milk, butter, national brands</text>
  <text x="396" y="202" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Price-matchable pantry SKUs</text>
  <text x="396" y="228" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Flashfood meat on your route</text>
  <text x="396" y="254" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Loyalty offers you already loaded</text>
  <text x="24" y="330" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">PFC threads repeatedly note cheaper produce and staples at independent markets. Treat that as a shopping tactic, not a search-volume claim.</text>
  <text x="24" y="354" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">One extra stop only if the gap beats time, transit, or 73 cents/km CRA 2026 provincial allowance math.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer - Canada - 20 Sep 2026</text>
</svg>
