<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 473" role="img" aria-labelledby="title desc">
  <title id="title">Contract-rate payment vs mortgage stress-test qualifying payment</title>
  <desc id="desc">Labelled sketch: a $450,000 25-year Canadian mortgage at 4.50% is about $2,491 a month. OSFI MQR of the greater of contract plus 2% or 5.25% qualifies the same loan at 6.50%, about $3,014 a month. Lenders underwrite the higher payment.</desc>
  <rect width="720" height="473" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Stress test: the payment you shop vs the payment you qualify at</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">OSFI MQR for uninsured originations: greater of contract + 2% or 5.25% (as of 20 Sep 2026). Labelled $450k </tspan><tspan x="24" dy="17.6">/ 25-year sketch - not a quote.</tspan></text>
  <rect x="80" y="168" width="200" height="132" fill="#4B9B74" transform="translate(0,17.6)"/>
  <text x="180" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$2,491</text>
  <text x="180" y="322" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Contract 4.50%</text>
  <text x="180" y="342" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Listing payment</text>
  <rect x="340" y="110" width="200" height="190" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="440" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$3,014</text>
  <text x="440" y="322" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Qualify at 6.50%</text>
  <text x="440" y="342" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">4.50% + 2% buffer</text>
  <text x="560" y="140" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Gap: ~$523 / mo</text>
  <text x="560" y="164" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Same loan. Different</text>
  <text x="560" y="184" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">underwriting payment.</text>
  <text x="560" y="216" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Floor still 5.25%</text>
  <text x="560" y="236" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="560">if contract is under </tspan><tspan x="560" dy="17.6">3.25%.</tspan></text>
  <text x="24" y="378" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Canadian semi-annual compounding, 25-year amort, $450,000 principal. Replace every number with a </tspan><tspan x="24" dy="17.6">licensed mortgage professional's worksheet.</tspan></text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)">Educational only  -  not brokerage advice. Straight-switch MQR relief (21 Nov 2024) is a renewal rule, not a purchase rule.</text>
</svg>
