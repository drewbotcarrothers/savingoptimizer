<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Five individual 200 GB iCloud plans versus one shared 2 TB plan</title>
  <desc id="desc">Five iCloud Plus 200 GB plans at 3.99 dollars are 19.95 dollars a month. One shared 2 TB plan is 12.99 dollars a month on Apple Canada prices published 16 September 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Five separate 200 GB plans versus one shared 2 TB</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Apple Canada iCloud+ prices, published 16 Sep 2026. Monthly.</text>
  <rect x="130" y="108" width="160" height="172" rx="6" fill="#1A1A1A"/>
  <text x="166" y="98" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$19.95</text>
  <text x="148" y="304" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">5 x 200 GB</text>
  <text x="162" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">5 x $3.99</text>
  <rect x="430" y="168" width="160" height="112" rx="6" fill="#0F7A4B"/>
  <text x="470" y="158" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$12.99</text>
  <text x="452" y="304" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">1 x 2 TB shared</text>
  <text x="468" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">up to 6 people</text>
  <text x="24" y="370" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Share only if the pool is big enough for the people who will use it.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">One person who only needs 200 GB should not buy 2 TB to feel safe.</text>
</svg>
