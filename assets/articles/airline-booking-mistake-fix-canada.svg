<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">24-hour window versus a basic fare you cannot change</title>
  <desc id="desc">Inside 24 hours, cancel for a refund to the original payment. After 24 hours, a basic fare often means buying a new ticket and eating the first one.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The typo is cheap only inside 24 hours</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled $240 wrong ticket and a $310 replacement. WestJet same-day departures differ.</text>
  <rect x="48" y="88" width="300" height="168" rx="8" fill="#E8F6EF" stroke="#0F7A4B"/>
  <text x="68" y="118" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">Inside 24 hours</text>
  <text x="68" y="148" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Refund $240 to the card.</text>
  <text x="68" y="172" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Pay $310 for the right ticket.</text>
  <text x="68" y="208" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">You spent $310.</text>
  <rect x="372" y="88" width="300" height="168" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="392" y="118" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">After 24 hours, basic fare</text>
  <text x="392" y="148" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">The $240 ticket stays spent.</text>
  <text x="392" y="172" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Pay $310 again.</text>
  <text x="392" y="208" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">You spent $550.</text>
  <text x="24" y="300" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Buy the correct ticket first if you must, then cancel the wrong one inside the window.</text>
  <text x="24" y="328" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">WestJet: a flight that leaves within 24 hours of booking is not this cash refund.</text>
  <text x="24" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Air Canada refund page and WestJet flight terms, read 24 Sep 2026. Agency tickets follow the seller.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. The fare rules on your receipt override the sketch.</text>
</svg>
