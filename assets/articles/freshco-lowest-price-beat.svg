<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">FreshCo Lowest Price Guarantee vs No Frills Won't Be Beat</title>
  <desc id="desc">Side-by-side comparison: FreshCo sells a qualifying flyer item for 1 cent less; No Frills matches the advertised price. Both typically cap at four units and use a local competitor board.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Match vs beat: same flyer, different till math</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative $6.49 shelf item vs a $4.99 local flyer. Policies reviewed 16 Sep 2026. Confirm the board at your store.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="24" y="80" width="328" height="230" rx="12" fill="#E7F4EE" stroke="#0F7A4B"/>
    <text x="44" y="112" font-size="12" font-weight="700" fill="#0F7A4B">FRESHCO</text>
    <text x="44" y="140" font-size="16" font-weight="700" fill="#1A1A1A">Lowest Price Guarantee</text>
    <text x="44" y="168" font-size="13" fill="#1A1A1A">You pay $4.98</text>
    <text x="44" y="190" font-size="13" fill="#1A1A1A">1 cent less than the flyer</text>
    <text x="44" y="220" font-size="12" fill="#6B7280">Ontario board typically: No Frills,</text>
    <text x="44" y="238" font-size="12" fill="#6B7280">Food Basics, Superstore, Walmart</text>
    <text x="44" y="264" font-size="12" fill="#6B7280">West typically swaps Food Basics</text>
    <text x="44" y="282" font-size="12" fill="#6B7280">for Save-On-Foods. Cap: 4 units.</text>
    <rect x="368" y="80" width="328" height="230" rx="12" fill="#F3F4F6"/>
    <text x="388" y="112" font-size="12" font-weight="700" fill="#6B7280">NO FRILLS</text>
    <text x="388" y="140" font-size="16" font-weight="700" fill="#1A1A1A">Won't Be Beat</text>
    <text x="388" y="168" font-size="13" fill="#1A1A1A">You pay $4.99</text>
    <text x="388" y="190" font-size="13" fill="#1A1A1A">Match, not a promised extra cent</text>
    <text x="388" y="220" font-size="12" fill="#6B7280">Trade-area list is store-specific.</text>
    <text x="388" y="238" font-size="12" fill="#6B7280">Loyalty / spend-X ads excluded.</text>
    <text x="388" y="264" font-size="12" fill="#6B7280">Use FreshCo when Empire is home</text>
    <text x="388" y="282" font-size="12" fill="#6B7280">and Scene+ offers are loaded.</text>
  </g>
  <text x="24" y="340" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">The 1 cent is a slogan. The real win is stealing a listed competitor's loss leader without a second parking lot.</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: FreshCo legal disclaimer; No Frills Won't Be Beat public copy (reviewed 16 Sep 2026). Teaching example, not a receipt.</text>
</svg>
