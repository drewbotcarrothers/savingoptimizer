<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian bank switching bonus timeline</title>
  <desc id="desc">Open, fund, meet criteria, receive bonus, hold period, then keep no-fee or close. Fee-drag check included. Drafted about 22 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Switching bonus without fee drag</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Confirm live offers. Education only. Drafted ~22 Sep 2026.</text>
  <rect x="24" y="88" width="120" height="88" rx="12" fill="#E7F4EE"/>
  <text x="36" y="122" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Open</text>
  <text x="36" y="144" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Save offer PDF</text>
  <rect x="160" y="88" width="120" height="88" rx="12" fill="#E7F4EE"/>
  <text x="172" y="122" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">2. Fund</text>
  <text x="172" y="144" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Min deposit in</text>
  <rect x="296" y="88" width="120" height="88" rx="12" fill="#E7F4EE"/>
  <text x="308" y="122" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Qualify</text>
  <text x="308" y="144" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Payroll + activity</text>
  <rect x="432" y="88" width="120" height="88" rx="12" fill="#E7F4EE"/>
  <text x="444" y="122" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">4. Credit</text>
  <text x="444" y="144" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Bonus posts</text>
  <rect x="568" y="88" width="128" height="88" rx="12" fill="#E7F4EE"/>
  <text x="580" y="122" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">5. Hold</text>
  <text x="580" y="144" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Then keep/close</text>
  <rect x="24" y="210" width="672" height="110" rx="12" fill="#F3F4F6"/>
  <text x="40" y="248" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fee-drag check before you celebrate</text>
  <text x="40" y="274" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Bonus − (monthly package × 12) must stay positive even if you remain a client.</text>
  <text x="40" y="298" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Example sketch: $350 − ($16.95 × 12) ≈ −$53. Prefer a $0 ongoing package.</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">FCAC switching sequence still applies: open first, overlap payroll and PADs, then close.</text>
  <text x="24" y="382" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Cash bonuses / promotional interest may be taxable — watch for a T5. Not tax advice.</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: FCAC switching guidance; CRA interest reporting pointers (~22 Sep 2026).</text>
</svg>
