<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Cost per year, cleaning between teeth</title>
  <desc>Example with made-up inputs. Not shelf prices.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Cost per year, cleaning between teeth</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs. Not shelf prices.</text>
  <text x="24" y="86" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Dollars</text>
  <line x1="70" y1="292.0" x2="690" y2="292.0" stroke="#E5E7EB"/>
  <text x="64" y="296.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">0</text>
  <line x1="70" y1="200.0" x2="690" y2="200.0" stroke="#E5E7EB"/>
  <text x="64" y="204.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">70</text>
  <line x1="70" y1="108.0" x2="690" y2="108.0" stroke="#E5E7EB"/>
  <text x="64" y="112.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">140</text>
  <rect x="120.0" y="272.3" width="100.0" height="19.7" rx="6" fill="#0F7A4B"/>
  <text x="170.0" y="264.3" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$15</text>
  <text x="170.0" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Floss</text>
  <rect x="260.0" y="260.5" width="100.0" height="31.5" rx="6" fill="#6B7280"/>
  <text x="310.0" y="252.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$24</text>
  <text x="310.0" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Brushes</text>
  <rect x="400.0" y="239.4" width="100.0" height="52.6" rx="6" fill="#1A1A1A"/>
  <text x="450.0" y="231.4" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$40</text>
  <text x="450.0" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Picks</text>
  <rect x="540.0" y="147.4" width="100.0" height="144.6" rx="6" fill="#F59E0B"/>
