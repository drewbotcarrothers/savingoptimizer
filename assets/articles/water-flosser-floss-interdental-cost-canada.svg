  <text x="590.0" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Water flosser</text>
  <text x="24" y="352" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Floss $15. Brushes 3 x $8. Picks $40. Water flosser $80 plus $30 of tips.</text>
  <text x="24" y="370" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Year 1 only. Saving Optimizer, 29 Sep 2026.</text>
