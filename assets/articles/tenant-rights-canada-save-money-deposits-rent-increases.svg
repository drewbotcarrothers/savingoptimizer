<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" role="img" aria-labelledby="title desc">
  <title id="title">Canadian tenant money rights across Ontario B.C. and Quebec boards</title>
  <desc id="desc">Money-first snapshot. Ontario last-month rent deposit and 2.1 percent 2026 guideline and LMR interest. B.C. half-month security deposit and 2.3 percent 2026 limit. Quebec Civil Code 1904 no exacted deposit and TAL process. LTB, RTB, TAL.</desc>
  <rect width="720" height="472" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Three boards. Three deposit rules. Real dollars.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">As of 20 Sep 2026 from ontario.ca, gov.bc.ca, TAL / C.c.Q. 1904. Same $2,200 rent. Not a national "first and </tspan><tspan x="24" dy="17.6">last."</tspan></text>
  <rect x="36" y="80" width="210" height="220" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="141" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Ontario - LTB</text>
  <text x="141" y="138" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Last-month deposit</text>
  <text x="141" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Move-in ~$4,400</text>
  <text x="141" y="190" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">2026 guideline 2.1%</text>
  <text x="141" y="212" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">LMR interest 2.1%</text>
  <text x="141" y="242" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">N1 - 90 days</text>
  <text x="141" y="272" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">T1 path for illegal fees</text>
  <rect x="255" y="80" width="210" height="220" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="360" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">B.C. - RTB</text>
  <text x="360" y="138" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Security d half month</text>
  <text x="360" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Move-in ~$3,300</text>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">2026 limit 2.3%</text>
  <text x="360" y="212" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">2027 posted 2.2%</text>
  <text x="360" y="242" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">RTB-7 - 3 full months</text>
  <text x="360" y="272" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">15-day deposit return</text>
  <rect x="474" y="80" width="210" height="220" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="579" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Québec - TAL</text>
  <text x="579" y="138" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">No exacted deposit</text>
  <text x="579" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Move-in ~$2,200</text>
  <text x="579" y="190" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Lease-renewal process</text>
  <text x="579" y="212" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Refuse ' TAL path</text>
  <text x="579" y="242" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">C.c.Q. art. 1904</text>
  <text x="579" y="272" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">No postdated cheques</text>
  <text x="24" y="334" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">A 30-minute audit: listing + lease + last notice + deposit math + interest. Recovering a junk $1,500 fee can </tspan><tspan x="24" dy="17.6">beat a move.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Educational money map. Not legal advice. Bookmark LTB, RTB, and TAL pages — not a Facebook group's "first and </tspan><tspan x="24" dy="16.2">last" slogan.</tspan></text>
</svg>
