<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: cumulative two-year shaving cost by system</title>
  <desc>Example with made-up inputs. Over 24 months, disposables rise from 0 to 50 to 100 dollars, cartridges from 20 to 120 to 220, a safety razor from 40 to 45 to 50, and an electric shaver from 90 to 130 and stays at 130. Two hundred shaves. Not shelf prices.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example cumulative cost over 24 months</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs. Not a shelf price.</text>
  <line x1="120" y1="90" x2="600" y2="90" stroke="#E5E7EB"/>
  <line x1="120" y1="215" x2="600" y2="215" stroke="#E5E7EB"/>
  <line x1="120" y1="340" x2="600" y2="340" stroke="#E5E7EB"/>
  <text x="40" y="94" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$220</text>
  <text x="40" y="219" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$110</text>
  <text x="48" y="344" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$0</text>
  <polyline points="120,340 360,283 600,226" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <polyline points="120,317 360,204 600,90" fill="none" stroke="#6B7280" stroke-width="3"/>
  <polyline points="120,295 360,289 600,283" fill="none" stroke="#0F7A4B" stroke-width="3"/>
  <polyline points="120,238 360,192 600,192" fill="none" stroke="#0F7A4B" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="120" y="368" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Month 0</text>
  <text x="340" y="368" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Month 12</text>
  <text x="560" y="368" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Month 24</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Black disposable. Grey cartridge. Solid green safety razor. Dashed green electric. Saving Optimizer, 29 Sep 2026.</text>
</svg>
