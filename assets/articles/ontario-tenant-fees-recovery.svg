<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Illegal-fee recovery vs a move, labelled GTA example</title>
  <desc id="desc">Teaching worksheet, 16 Sep 2026. Not a survey and not an LTB award.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Illegal-fee recovery vs a move, labelled GTA example</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Teaching worksheet, 16 Sep 2026. Not a survey and not an LTB award.</text>
  <line x1="80" y1="310.0" x2="680" y2="310.0" stroke="#E5E7EB"/><text x="72" y="314.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text><line x1="80" y1="255.0" x2="680" y2="255.0" stroke="#E5E7EB"/><text x="72" y="259.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1.1k</text><line x1="80" y1="200.0" x2="680" y2="200.0" stroke="#E5E7EB"/><text x="72" y="204.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$2.2k</text><line x1="80" y1="145.0" x2="680" y2="145.0" stroke="#E5E7EB"/><text x="72" y="149.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$3.4k</text><line x1="80" y1="90.0" x2="680" y2="90.0" stroke="#E5E7EB"/><text x="72" y="94.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$4.5k</text>
  <rect x="108.0" y="268.4" width="162.7" height="41.6" rx="8" fill="#9CA3AF"/><text x="189.3" y="258.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$850</text><text x="189.3" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Illegal fees</text><text x="189.3" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">app + keys + ‘holding’</text><rect x="298.7" y="304.1" width="162.7" height="5.9" rx="8" fill="#4B9B74"/><text x="380.0" y="294.1" text-anchor="middle" font-size="13" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">$120</text><text x="380.0" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">LTB T1 path</text><text x="380.0" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">time, copies, no lawyer</text><rect x="489.3" y="104.7" width="162.7" height="205.3" rx="8" fill="#0F7A4B"/><text x="570.7" y="94.7" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$4,200</text><text x="570.7" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Move instead</text><text x="570.7" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">first+last + truck</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Moving is the expensive ‘reset.’ Recovering an illegal fee is usually cheaper than a new last-month deposit — if the unit is otherwise livable.</text>
</svg>
