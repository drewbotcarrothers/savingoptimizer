<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Bundle vs unbundle auto and tenant or home insurance in Canada</title>
  <desc id="desc">A multi-policy discount only wins if the same liability, contents or rebuild, deductibles, and water endorsements are compared. A cheaper bundle that dropped cover is not cheaper.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Bundle vs unbundle: same cover, two invoices</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Multi-policy discounts of 515% are common. They are not a reason to stop shopping.</text>
  <rect x="40" y="88" width="300" height="150" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">One-company bundle</text>
  <text x="190" y="146" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Auto $1,640 + tenant $240</text>
  <text x="190" y="170" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">12% multi-policy = $1,654</text>
  <text x="190" y="198" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">One renewal date, one claims file</text>
  <rect x="380" y="88" width="300" height="150" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="2"/>
  <text x="530" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Shopped separately</text>
  <text x="530" y="146" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Auto $1,480 + tenant $220</text>
  <text x="530" y="170" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No bundle = $1,700</text>
  <text x="530" y="198" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Wins only if cover matches</text>
  <text x="24" y="276" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fair comparison checklist</text>
  <text x="24" y="304" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Same $1M/$2M liability · same contents or rebuild · same deductibles · same sewer / overland limits · telematics on or off both sides</text>
  <text x="24" y="334" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">If the bundle wins because a water endorsement vanished, it did not win. Re-run the worksheet at renewal.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Labelled sketch, not a quote. Consumer multi-policy ranges used 20 Sep 2026. Education only.</text>
</svg>
