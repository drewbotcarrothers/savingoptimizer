<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Ontario LEAP emergency assistance path</title>
  <desc id="desc">OEB LEAP: up to $650 electricity, $780 if electrically heated, $650 natural gas. Paid to the utility through an intake agency. Not a monthly grant. 20 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">LEAP is an emergency grant to the utility, not a cheque</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">OEB: up to $650 electricity ($780 if electrically heated) and $650 gas. Used 20 Sep 2026.</text>
  <rect x="40" y="88" width="150" height="170" rx="10" fill="#E7F4EE"/>
  <text x="56" y="116" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Utility page</text>
  <text x="56" y="144" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Call the number</text>
  <text x="56" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">on the bill first.</text>
  <text x="56" y="184" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ask for LEAP and</text>
  <text x="56" y="204" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">a payment plan.</text>
  <rect x="206" y="88" width="150" height="170" rx="10" fill="#E7F4EE"/>
  <text x="222" y="116" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">2. Intake agency</text>
  <text x="222" y="144" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">OEB agency list</text>
  <text x="222" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">for your LDC or</text>
  <text x="222" y="184" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">gas utility. Not a</text>
  <text x="222" y="204" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Facebook "grant".</text>
  <rect x="372" y="88" width="150" height="170" rx="10" fill="#E7F4EE"/>
  <text x="388" y="116" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Documents</text>
  <text x="388" y="144" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ID, bills, income,</text>
  <text x="388" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">lease or mortgage,</text>
  <text x="388" y="184" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">bank statement,</text>
  <text x="388" y="204" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">disconnection notice.</text>
  <rect x="538" y="88" width="150" height="170" rx="10" fill="#F3F4F6"/>
  <text x="554" y="116" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Not LEAP</text>
  <text x="554" y="144" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Monthly support</text>
  <text x="554" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A cheque to you</text>
  <text x="554" y="184" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">More than you owe</text>
  <text x="554" y="204" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A paid "apply" fee</text>
  <text x="24" y="292" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A LEAP assessment can pause disconnection for up to 21 days. Funds are limited. Apply when you are behind, not the morning after the 48-hour call.</text>
  <text x="24" y="328" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Stack: utility arrangement + LEAP + OESP (hydro credit) + municipal / OW / ODSP pointers. Winter ban is a pause, not forgiveness.</text>
  <text x="24" y="364" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Nobody legitimate charges a fee to apply for you. The utility will not ask for a gift card.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: OEB LEAP page and agency list; OESP and LEAP Manual (1 Jul 2025). Education only, not an approval.</text>
</svg>
