<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Why CRA TFSA room lags your ledger</title>
  <desc id="desc">January adds the 7,000 dollar limit. Issuers file by the end of February. CRA's useful prior-year view is around April. Your own ledger overrides a higher portal number.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The portal is late on purpose</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">2026 dollar limit $7,000. Drafted 22 Sep 2026. Not tax advice.</text>
  <rect x="24" y="78" width="160" height="200" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1 January</text>
  <text x="40" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">New $7,000</text>
  <text x="40" y="158" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+ unused room</text>
  <text x="40" y="178" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+ last year's</text>
  <text x="40" y="198" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">withdrawals.</text>
  <text x="40" y="230" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Write opening room.</text>
  <rect x="196" y="78" width="160" height="200" rx="12" fill="#F3F4F6"/>
  <text x="212" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">End of February</text>
  <text x="212" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Issuers file</text>
  <text x="212" y="158" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">last year's</text>
  <text x="212" y="178" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">contributions and</text>
  <text x="212" y="198" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">withdrawals.</text>
  <text x="212" y="230" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">This year is still missing.</text>
  <rect x="368" y="78" width="160" height="200" rx="12" fill="#F3F4F6"/>
  <text x="384" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Around April</text>
  <text x="384" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CRA processes</text>
  <text x="384" y="158" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">prior-year slips.</text>
  <text x="384" y="178" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Reconcile My Account</text>
  <text x="384" y="198" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">to the ledger.</text>
  <text x="384" y="230" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Then fix any excess.</text>
  <rect x="540" y="78" width="156" height="200" rx="12" fill="#E7F4EE"/>
  <text x="554" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Your ledger</text>
  <text x="554" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Every issuer.</text>
  <text x="554" y="158" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">If the portal is</text>
  <text x="554" y="178" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">higher, do not</text>
  <text x="554" y="198" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">contribute the gap.</text>
  <text x="554" y="230" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1% per month if excess.</text>
  <text x="24" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Path: Individual, Savings and pension plans, View TFSA details, Contribution room.</text>
  <text x="24" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">A withdrawal this year does not raise this year's room. It returns on 1 January next year.</text>
  <text x="24" y="358" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Two TFSA issuers share one room. A qualifying transfer is not a new contribution.</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Form RC243 if you are in excess. Education only. Not tax advice.</text>
</svg>
