<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Check the label, then the unit price</title>
  <desc>Decision flow: drug or natural health number, cosmetic label, unit price, then buy or skip. As of 29 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Check the label, then the unit price</text>
  <text x="24" y="50" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Dollar-store toiletries. Not a product ranking.</text>
<line x1="360" y1="116" x2="360" y2="140" stroke="#6B7280" stroke-width="2"/>
<line x1="360" y1="188" x2="360" y2="204" stroke="#6B7280" stroke-width="2"/>
<line x1="184" y1="204" x2="536" y2="204" stroke="#6B7280" stroke-width="2"/>
<line x1="184" y1="204" x2="184" y2="214" stroke="#6B7280" stroke-width="2"/>
<line x1="536" y1="204" x2="536" y2="214" stroke="#6B7280" stroke-width="2"/>
<line x1="184" y1="278" x2="184" y2="292" stroke="#6B7280" stroke-width="2"/>
<line x1="536" y1="278" x2="536" y2="292" stroke="#6B7280" stroke-width="2"/>
<line x1="184" y1="292" x2="536" y2="292" stroke="#6B7280" stroke-width="2"/>
<line x1="360" y1="292" x2="360" y2="304" stroke="#6B7280" stroke-width="2"/>
  <rect x="190" y="68" width="340" height="48" rx="8" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="360" y="97" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">1. Product in your hand</text>
  <rect x="190" y="140" width="340" height="48" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="169" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">2. Is a DIN or an NPN printed?</text>
  <rect x="24" y="214" width="320" height="64" rx="8" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="184" y="238" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Yes: search the database</text>
  <rect x="376" y="214" width="320" height="64" rx="8" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="536" y="238" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">No: read the cosmetic label</text>
  <rect x="190" y="304" width="340" height="48" rx="8" fill="#0F7A4B" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="360" y="333" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">3. Compare unit price, then buy or skip</text>
  <text x="184" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">Read the status before you pay</text>
  <text x="536" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">English, French, metric size, ingredients</text>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Health Canada labelling pages and the two product databases, as of 29 Sep 2026.</text>
  <text x="24" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Skip a sunscreen with no DIN or NPN, and search recalls-rappels.canada.ca.</text>
</svg>
