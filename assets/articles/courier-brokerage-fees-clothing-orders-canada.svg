<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Flow from checkout to a casual refund request</title>
  <desc>Order placed. If duties were prepaid, check the invoice. If not, the carrier or Canada Post collects at delivery. If the charge looks wrong, refuse and ask for a reassessment, or pay and send Form B2G, then a casual refund request. No fee amount is drawn.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">A clothing order and a charge at the door</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Government duty and tax are not the carrier's fee. No fee amount is drawn.</text>
  <rect x="230" y="64" width="260" height="40" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="360" y="89" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">Order placed</text>
  <line x1="360" y1="104" x2="360" y2="118" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="40" y="122" width="300" height="64" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="52" y="146" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Duties prepaid at checkout</text>
  <text x="52" y="168" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Check the invoice against the checkout.</text>
  <rect x="380" y="122" width="300" height="64" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="392" y="146" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Duties not prepaid</text>
  <text x="392" y="168" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Carrier or Canada Post collects.</text>
  <line x1="190" y1="186" x2="190" y2="206" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="530" y1="186" x2="530" y2="206" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="190" y1="206" x2="530" y2="206" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="360" y1="206" x2="360" y2="220" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="150" y="220" width="420" height="36" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="360" y="243" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Charge looks wrong</text>
  <line x1="250" y1="256" x2="250" y2="272" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="490" y1="256" x2="490" y2="272" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="40" y="272" width="300" height="64" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="52" y="296" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Refuse, ask for a reassessment</text>
  <text x="52" y="318" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Mail with Form E14 can take this path.</text>
  <rect x="380" y="272" width="300" height="64" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="392" y="296" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Pay, then send Form B2G</text>
  <text x="392" y="318" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Casual refund request after that.</text>
  <text x="24" y="368" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">How a carrier bills the surtax is a question for CBSA or that carrier.</text>
  <text x="24" y="390" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Checked 29 Sep 2026. No brokerage dollar amount.</text>
</svg>
