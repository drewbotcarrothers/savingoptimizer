<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Bind home insurance before cancelling so there is no bare day</title>
  <desc id="desc">A labelled timeline shows the new policy starting before the old policy ends, including water endorsements and the mortgagee, versus a gap if the old policy is cancelled first.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Overlap the minute. Do not leave a bare day.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustration. Ask for the refund basis before you cancel. 24 Sep 2026.</text>
  <text x="24" y="96" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Safe switch</text>
  <rect x="24" y="108" width="520" height="28" rx="4" fill="#0F7A4B"/>
  <text x="32" y="127" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Old policy in force</text>
  <rect x="480" y="108" width="216" height="28" rx="4" fill="#1A1A1A"/>
  <text x="492" y="127" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">New policy bound</text>
  <text x="24" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">The dark bar starts at or before the minute the green bar ends.</text>
  <text x="24" y="200" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Gap to reject</text>
  <rect x="24" y="212" width="360" height="28" rx="4" fill="#0F7A4B"/>
  <text x="32" y="231" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Old policy cancelled early</text>
  <rect x="400" y="212" width="80" height="28" rx="4" fill="#F4F7F5" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="418" y="231" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Bare</text>
  <rect x="496" y="212" width="200" height="28" rx="4" fill="#0F7A4B"/>
  <text x="508" y="231" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">New policy</text>
  <text x="24" y="280" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Must be on the new declarations, not assumed</text>
  <rect x="24" y="296" width="160" height="52" rx="6" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="36" y="326" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F7A4B">Mortgagee named</text>
  <rect x="200" y="296" width="160" height="52" rx="6" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="212" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F7A4B">Sewer and</text>
  <text x="212" y="336" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F7A4B">overland limits</text>
  <rect x="376" y="296" width="160" height="52" rx="6" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="388" y="326" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F7A4B">Settlement basis</text>
  <rect x="552" y="296" width="144" height="52" rx="6" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="564" y="326" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F7A4B">Landlord proof</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Water endorsements do not move themselves. Re-buy them on the new form.</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">A one-day overlap premium is cheaper than an uninsured loss.</text>
</svg>
