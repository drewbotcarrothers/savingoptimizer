<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Equal billing versus actual Canadian utility usage</title>
  <desc id="desc">Equal or budget billing sets monthly installments from estimated annual use. Actual winter usage still spikes. A year-end true-up is a credit or a balance owing. Enbridge EMPP, FortisBC EPP, and hydro equalized plans are cashflow tools, not conservation.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Equal billing: cashflow, not a discount</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Installments follow estimated annual use. True-up is the bill arriving later. Verified 20 Sep 2026.</text>
  <rect x="80" y="200" width="36" height="80" fill="#E5E7EB"/>
  <rect x="128" y="160" width="36" height="120" fill="#E5E7EB"/>
  <rect x="176" y="100" width="36" height="180" fill="#0F7A4B"/>
  <rect x="224" y="88" width="36" height="192" fill="#0F7A4B"/>
  <rect x="272" y="130" width="36" height="150" fill="#E5E7EB"/>
  <rect x="320" y="190" width="36" height="90" fill="#E5E7EB"/>
  <rect x="368" y="210" width="36" height="70" fill="#E5E7EB"/>
  <rect x="416" y="200" width="36" height="80" fill="#E5E7EB"/>
  <line x1="70" y1="168" x2="470" y2="168" stroke="#0F7A4B" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="80" y="310" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Jul</text>
  <text x="176" y="310" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Nov</text>
  <text x="224" y="310" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Jan</text>
  <text x="368" y="310" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">May</text>
  <rect x="500" y="88" width="196" height="200" rx="12" fill="#E7F4EE"/>
  <text x="516" y="116" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Read both numbers</text>
  <text x="516" y="144" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Dashed = installment</text>
  <text x="516" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Bars = actual use</text>
  <text x="516" y="192" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Enbridge EMPP</text>
  <text x="516" y="210" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">FortisBC EPP</text>
  <text x="516" y="228" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Hydro equalized / budget</text>
  <text x="516" y="256" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Cancel = true-up now.</text>
  <text x="24" y="356" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Enrol if winter spikes wreck a fixed income. Skip if you just moved, just added a heat pump, or you will not open the usage graph.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: Enbridge EMPP, FortisBC Equal Payment Plan, Hydro-Quebec equalized payments. Education only.</text>
</svg>
