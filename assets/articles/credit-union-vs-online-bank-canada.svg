<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Credit unions versus online banks in Canada</title>
  <desc id="desc">Credit unions often use provincial deposit insurance and local branches. Online banks often use CDIC and app-first access. Compare fees, insurance, and cash needs.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Credit union vs online bank</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Insurance and access differ more than the debit card. 22 Sep 2026.</text>
  <rect x="24" y="78" width="330" height="200" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Credit union</text>
  <text x="40" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Member-owned, local service</text>
  <text x="40" y="160" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Provincial deposit insurance</text>
  <text x="40" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ON example: up to $250k non-reg</text>
  <text x="40" y="208" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Unlimited eligible registered*</text>
  <text x="40" y="236" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">*FSRA DIRF framing — verify live</text>
  <text x="40" y="258" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Membership geography matters</text>
  <rect x="370" y="78" width="326" height="200" rx="12" fill="#F3F4F6"/>
  <text x="386" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Online bank</text>
  <text x="386" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">App-first, often $0 fees</text>
  <text x="386" y="160" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Often CDIC member</text>
  <text x="386" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$100k per CDIC category</text>
  <text x="386" y="208" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ATM partners or rebates</text>
  <text x="386" y="236" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Cash deposits can be weak</text>
  <text x="386" y="258" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Verify the legal entity name</text>
  <rect x="24" y="298" width="672" height="78" rx="12" fill="#E7F4EE"/>
  <text x="40" y="328" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Decision lens: fees · insurer · cash/ATM · advice depth · moving provinces.</text>
  <text x="40" y="352" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">A combo stack is allowed. Do not pay a Big-5 package out of habit.</text>
  <text x="24" y="406" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">FCAC deposit-insurance overview. Education only. Not a product pick.</text>
</svg>
