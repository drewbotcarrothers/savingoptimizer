<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Ebox versus Bell retail checklist</title>
  <desc id="desc">Seven-step Quebec flanker checklist from address check through written offer. Drafted 26 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Ebox shopping is a checklist.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Quebec flanker path. Confirm live. 26 Sep 2026.</text>
  <rect x="48" y="80" width="624" height="280" rx="12" fill="#E7F4EE"/>
  <text x="72" y="118" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">1. Address-check Ebox — save upload and tech path</text>
  <text x="72" y="148" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">2. Address-check Bell retail the same day</text>
  <text x="72" y="178" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">3. Add Fizz or Videotron if coax exists</text>
  <text x="72" y="208" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">4. Write modem / ONT rules before you buy gear</text>
  <text x="72" y="238" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">5. Confirm support hours the household can live with</text>
  <text x="72" y="268" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">6. Price ETF and equipment return on the old ISP</text>
  <text x="72" y="298" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">7. Get the offer in email before you cancel</text>
  <text x="24" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">A Bell winback in writing can still beat Ebox. Education only — live carts override blogs.</text>
  <text x="24" y="410" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Accent #0F7A4B. No affiliate partnerships claimed.</text>
</svg>
