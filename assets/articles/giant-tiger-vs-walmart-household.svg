<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>How to plot a household unit-price check across three stores</title>
  <desc>An illustrative dot chart, not a store reading. Three items are plotted for Giant Tiger, Walmart, and Dollarama. The cheapest dot on each item is green. No real shelf prices were verified on 26 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Illustrative dots, not a shelf reading</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Fill the template with your store, town, and date. These cents are invented for the drawing.</text>
  <line x1="90" y1="300" x2="680" y2="300" stroke="#E5E7EB" stroke-width="1"/>
  <text x="160" y="328" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Cleaner</text>
  <text x="360" y="328" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Paper</text>
  <text x="560" y="328" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Home basic</text>
  <circle cx="130" cy="180" r="8" fill="#6B7280"/>
  <circle cx="160" cy="220" r="8" fill="#0F7A4B"/>
  <circle cx="190" cy="150" r="8" fill="#6B7280"/>
  <circle cx="330" cy="200" r="8" fill="#6B7280"/>
  <circle cx="360" cy="140" r="8" fill="#0F7A4B"/>
  <circle cx="390" cy="240" r="8" fill="#6B7280"/>
  <circle cx="530" cy="160" r="8" fill="#0F7A4B"/>
  <circle cx="560" cy="210" r="8" fill="#6B7280"/>
  <circle cx="590" cy="190" r="8" fill="#6B7280"/>
  <circle cx="24" cy="370" r="6" fill="#0F7A4B"/>
  <text x="38" y="374" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Cheapest dot on that item (illustrative)</text>
  <circle cx="280" cy="370" r="6" fill="#6B7280"/>
  <text x="294" y="374" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">The other two stores</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">No Giant Tiger, Walmart, or Dollarama unit price was verified on 26 Sep 2026.</text>
</svg>
