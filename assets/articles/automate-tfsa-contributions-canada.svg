<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">TFSA automation without same-year recontribution</title>
  <desc id="desc">2026 TFSA dollar limit 7,000 dollars. Withdrawals return 1 January next year. Pause payday PAD after an emergency withdrawal.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">TFSA room is a calendar, not a balance</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">CRA 2026 dollar limit $7,000. Drafted 21 Sep 2026.</text>
  <rect x="24" y="78" width="160" height="200" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1 Jan</text>
  <text x="40" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">New $7,000</text>
  <text x="40" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+ unused room</text>
  <text x="40" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+ last year</text>
  <text x="40" y="196" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">withdrawals.</text>
  <text x="40" y="228" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Set or resize PAD.</text>
  <rect x="196" y="78" width="160" height="200" rx="12" fill="#E7F4EE"/>
  <text x="212" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Payday</text>
  <text x="212" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">PAD day after</text>
  <text x="212" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">payroll. Size =</text>
  <text x="212" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">room / pays left.</text>
  <text x="212" y="228" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Ledger every transfer.</text>
  <rect x="368" y="78" width="160" height="200" rx="12" fill="#F3F4F6"/>
  <text x="384" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">If you withdraw</text>
  <text x="384" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Pause the PAD</text>
  <text x="384" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">the same day.</text>
  <text x="384" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No new room until</text>
  <text x="384" y="196" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1 Jan next year.</text>
  <text x="384" y="228" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">1% / month on excess.</text>
  <rect x="540" y="78" width="156" height="200" rx="12" fill="#F3F4F6"/>
  <text x="556" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">April</text>
  <text x="556" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CRA processes</text>
  <text x="556" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">prior-year slips.</text>
  <text x="556" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Reconcile My Account</text>
  <text x="556" y="196" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">to your ledger.</text>
  <text x="556" y="228" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">File TFSA Return if excess.</text>
  <text x="24" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Spouses: individual room, separate PADs. Multiple TFSAs share one room number.</text>
  <text x="24" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Last in-year PAD must settle before 31 Dec. EFTs can take 2-3 business days.</text>
  <text x="24" y="358" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: CRA TFSA contributing / withdrawing / over-contribute pages used 21 Sep 2026.</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not tax advice. Growth inside a TFSA does not use room.</text>
</svg>
