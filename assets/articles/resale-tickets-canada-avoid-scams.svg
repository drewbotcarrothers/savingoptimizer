<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: one ticket, two ways</title>
<desc id="d">Horizontal bars for a made-up purchase. Platform ticket by credit card $180. Stranger&#x27;s PDF by e-transfer $150 if valid, or $330 if fake and the fan buys again.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: one ticket, two ways</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Worst-case cost if a stranger&#x27;s PDF ticket is fake</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Stranger, if valid</text>
<rect x="250" y="104.7" width="159.1" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="417.1" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$150</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Platform, card</text>
<rect x="250" y="198.0" width="190.9" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="448.9" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$180</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Stranger, if fake, buy again</text>
<rect x="250" y="291.3" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$330</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
