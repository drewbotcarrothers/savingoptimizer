<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: Tide Pods 31 count after points</title>
<desc id="d">Bars compare $12.97 at Walmart, about $15.75 at Shoppers on a normal day and about $11.19 at Shoppers on a 20x day.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: Tide Pods 31 count after points</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Dollars</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Walmart</text>
<rect x="250" y="104.7" width="288.2" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="546.2" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$12.97</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Shoppers, normal day</text>
<rect x="250" y="198.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$15.75</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Shoppers, 20x day</text>
<rect x="250" y="291.3" width="248.7" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="506.7" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$11.19</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
</svg>
