<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">ISP to CCTS complaint path</title>
  <desc id="desc">Three steps: exhaust the ISP process, build an evidence pack, then file with CCTS. Drafted 27 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">CCTS after the ISP — not instead of it.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Canadian household path. Not legal advice. 27 Sep 2026.</text>
  <rect x="40" y="100" width="200" height="180" rx="12" fill="#E7F4EE"/>
  <text x="140" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. ISP first</text>
  <text x="140" y="175" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Clear ask</text>
  <text x="140" y="198" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Dates and agents</text>
  <text x="140" y="221" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Reasonable window</text>
  <rect x="260" y="100" width="200" height="180" rx="12" fill="#F3F4F6"/>
  <text x="360" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Evidence</text>
  <text x="360" y="175" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Bills and contract</text>
  <text x="360" y="198" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Chats and call notes</text>
  <text x="360" y="221" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">One-page timeline</text>
  <rect x="480" y="100" width="200" height="180" rx="12" fill="#E7F4EE"/>
  <text x="580" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. File CCTS</text>
  <text x="580" y="175" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Online process</text>
  <text x="580" y="198" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1-888-221-1687</text>
  <text x="580" y="221" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Pay undisputed</text>
  <text x="24" y="330" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">CCTS will not rewrite a lawful disclosed internet ETF just because the amount stings.</text>
  <text x="24" y="354" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Check provider membership on ccts-cprst.ca before you invest a weekend of paperwork.</text>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">You do not start at the CRTC for an individual bill fight.</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Confirm live filing steps on the official site.</text>
</svg>
