<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with illustrative inputs: what a bag returns</title>
  <desc>An example split, an example cash offer, and a swap. Example with illustrative inputs. 50% of $80 = $40. Cash offer = $25. Swap = $0.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with illustrative inputs: what a bag returns</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">An example split, an example cash offer, and a swap.</text>
  <text x="24" y="114" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">50% split on $80</text>
  <rect x="250" y="96" width="400" height="28" fill="#0F7A4B"/>
  <text x="262" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$40</text>
  <text x="24" y="176" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Buy-outright offer</text>
  <rect x="250" y="158" width="250" height="28" fill="#F59E0B"/>
  <text x="262" y="177" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$25</text>
  <text x="24" y="238" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Swap, cash</text>
  <text x="250" y="239" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$0 cash</text>
  <text x="24" y="318" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with illustrative inputs. 50% of $80 = $40. Cash offer = $25. Swap = $0.</text>
  <text x="24" y="338" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Not Once Upon a Child's offer and not a consignment contract.</text>
  <text x="24" y="404" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 29 Sep 2026.</text>
</svg>
