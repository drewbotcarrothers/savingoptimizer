<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Which province's children's activity credit to open</title>
  <desc>Decision flow. Start with the province or territory of residence on 31 December. Quebec, Manitoba, and Nova Scotia have credits on official pages for the 2025 tax year. Yukon and every other province: check that jurisdiction's return before claiming. Then test the program and keep a receipt with the provider's details.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Where were you resident on 31 December?</text>
  <rect x="40" y="48" width="200" height="88" rx="8" fill="#0F7A4B"/>
  <text x="140" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Quebec</text>
  <text x="140" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">Refundable credit</text>
  <text x="140" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">Line 462, point 25</text>
  <rect x="260" y="48" width="200" height="88" rx="8" fill="#0F7A4B"/>
  <text x="360" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Manitoba</text>
  <text x="360" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">Fitness and arts</text>
  <text x="360" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">Non-refundable</text>
  <rect x="480" y="48" width="200" height="88" rx="8" fill="#0F7A4B"/>
  <text x="580" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Nova Scotia</text>
  <text x="580" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">Sports and arts</text>
  <text x="580" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">$500 per child, 2025</text>
  <rect x="150" y="164" width="420" height="56" rx="8" fill="#1A1A1A"/>
  <text x="360" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Yukon and every other province or territory</text>
  <text x="360" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">Check that year's provincial package before you claim.</text>
  <text x="24" y="252" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Then, for a credit that exists:</text>
  <rect x="24" y="268" width="210" height="64" rx="8" fill="#E5E7EB"/>
  <text x="129" y="294" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">1. Program fits</text>
  <text x="129" y="314" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Age, weeks, and type</text>
  <rect x="254" y="268" width="210" height="64" rx="8" fill="#E5E7EB"/>
  <text x="359" y="294" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">2. Receipt</text>
  <text x="359" y="314" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Provider and amount paid</text>
  <rect x="484" y="268" width="212" height="64" rx="8" fill="#0F7A4B"/>
  <text x="590" y="294" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3. Provincial form</text>
  <text x="590" y="314" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">One claim per dollar</text>
  <text x="24" y="364" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">There is no federal children's fitness or arts line to assume. Check the current federal return.</text>
  <text x="24" y="384" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Quebec's dollar maximum is in the line 462 instructions, not restated here.</text>
  <text x="24" y="408" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. As of 29 Sep 2026. Education only.</text>
</svg>
