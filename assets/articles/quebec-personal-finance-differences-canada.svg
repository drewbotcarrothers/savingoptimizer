<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Québec personal finance differences versus rest of Canada</title>
  <desc id="desc">Two tax returns, QPP instead of CPP for Québec-covered work, RQAP parental insurance, and dual refund timing that changes savings automation.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Québec vs rest of Canada</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Same savings goals; different plumbing. 22 Sep 2026.</text>
  <rect x="24" y="78" width="160" height="100" rx="12" fill="#E7F4EE"/>
  <text x="40" y="110" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Two returns</text>
  <text x="40" y="134" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CRA T1</text>
  <text x="40" y="154" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Revenu Québec TP-1</text>
  <rect x="200" y="78" width="160" height="100" rx="12" fill="#F3F4F6"/>
  <text x="216" y="110" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">QPP</text>
  <text x="216" y="134" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Not a CPP rename</text>
  <text x="216" y="154" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">RL slips + T slips</text>
  <rect x="376" y="78" width="160" height="100" rx="12" fill="#E7F4EE"/>
  <text x="392" y="110" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">RQAP</text>
  <text x="392" y="134" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Parental benefits</text>
  <text x="392" y="154" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Not EI parental</text>
  <rect x="552" y="78" width="144" height="100" rx="12" fill="#F3F4F6"/>
  <text x="568" y="110" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cards</text>
  <text x="568" y="134" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">5% minimum</text>
  <text x="568" y="154" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">from 1 Aug 2025</text>
  <rect x="24" y="200" width="672" height="150" rx="12" fill="#E7F4EE"/>
  <text x="40" y="232" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Savings-plan checklist</text>
  <text x="40" y="260" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1. Budget dual-file software or a preparer who files both</text>
  <text x="40" y="284" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Calendar two refunds before you pre-commit an RRSP loop</text>
  <text x="40" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3. Read Québec consumer rules before national cancel scripts</text>
  <text x="40" y="332" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Match deposit insurance to AMF caisses vs CDIC banks</text>
  <text x="24" y="388" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not tax or benefits advice. Accent #0F7A4B.</text>
</svg>
