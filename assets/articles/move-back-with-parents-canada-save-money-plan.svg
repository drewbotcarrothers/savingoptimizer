<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 489" role="img" aria-labelledby="title desc">
  <title id="title">Twelve and twenty-four month move-home savings versus solo rent</title>
  <desc id="desc">Labelled adult-child plan. Paying $800 toward household costs instead of a $2,273 Toronto one-bedroom frees about $1,473 a month. Twelve months is about $17,676. Twenty-four months is about $35,352 before CRA FHSA room of $8,000 a year.</desc>
  <rect width="720" height="489" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Move home with a runway, not an open tab</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">TRREB Q2 2026 1-bed $2,273 vs labelled $800 contribution. CRA FHSA $8,000 / $40,000 (as of 16 Sep 2026 </tspan><tspan x="24" dy="17.6">on the FHSA page).</tspan></text>
  <rect x="70" y="168" width="130" height="112" fill="#6B7280" transform="translate(0,17.6)"/>
  <text x="135" y="156" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$800</text>
  <text x="135" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Contribution</text>
  <rect x="230" y="88" width="130" height="192" fill="#1A1A1A" transform="translate(0,17.6)"/>
  <text x="295" y="76" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$2,273</text>
  <text x="295" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Solo 1-bed</text>
  <rect x="390" y="120" width="130" height="160" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="455" y="108" text-anchor="middle" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$17,676</text>
  <text x="455" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">12-mo gap</text>
  <rect x="550" y="72" width="130" height="208" fill="#4B9B74" transform="translate(0,17.6)"/>
  <text x="615" y="60" text-anchor="middle" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$35,352</text>
  <text x="615" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">24-mo gap</text>
  <text x="24" y="348" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">Gap = $2,273 - $800. Park the difference in an FHSA (first-year room $8,000) or a debt avalanche - write the </tspan><tspan x="24" dy="17.6">destination before month two.</tspan></text>
  <text x="24" y="372" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">HBP still allows up to $60,000 RRSP if you independently qualify. FTHBI new applications closed 21 Mar 2024 </tspan><tspan x="24" dy="17.6">(CMHC).</tspan></text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)"><tspan x="24">Contribution is a labelled household share, not a market rent. Tax notes are high-level. Not tax, legal, or relationship </tspan><tspan x="24" dy="16.2">advice.</tspan></text>
</svg>
