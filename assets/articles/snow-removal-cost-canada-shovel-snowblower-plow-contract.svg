<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: five-winter cost of snow removal</title>
<desc id="d">Bars: seasonal plow contract $2,750; gas snowblower $1,600; shovels and ice melt $260.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: five-winter cost of snow removal</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs. Double driveway</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Seasonal plow contract</text>
<rect x="250" y="104.7" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$2,750</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Gas snowblower</text>
<rect x="250" y="198.0" width="203.6" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="461.6" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$1,600</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Shovels and ice melt</text>
<rect x="250" y="291.3" width="33.1" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="291.1" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$260</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 7 Oct 2026.</text>
</svg>
