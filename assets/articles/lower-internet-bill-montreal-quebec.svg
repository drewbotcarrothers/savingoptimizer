<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Montréal address quote columns</title>
  <desc id="desc">Four columns for one Montréal, Laval, or South Shore address: Videotron, Fizz, Bell, and a reseller. Capture monthly now, monthly later, upload, and support. Drafted 22 Sep 2026. Not a quote.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">One address. Four columns. No Ontario prices.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Montréal, Laval, South Shore. Drafted 22 Sep 2026. Taxes extra.</text>
  <rect x="24" y="76" width="160" height="250" rx="12" fill="#F3F4F6"/>
  <text x="104" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Videotron</text>
  <text x="40" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Monthly now</text>
  <text x="40" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Monthly later</text>
  <text x="40" y="188" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Upload</text>
  <text x="40" y="212" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Phone support</text>
  <text x="40" y="248" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Credits end</text>
  <text x="40" y="268" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">on their clock</text>
  <rect x="196" y="76" width="160" height="250" rx="12" fill="#0F7A4B"/>
  <text x="276" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Fizz</text>
  <text x="212" y="140" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Same plant</text>
  <text x="212" y="164" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Flat-ish rate</text>
  <text x="212" y="188" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Upload on card</text>
  <text x="212" y="212" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">App and chat</text>
  <text x="212" y="248" font-size="12" fill="#C5E3D4" font-family="Inter, system-ui, sans-serif">100 Mbps sketch</text>
  <text x="212" y="268" font-size="12" fill="#C5E3D4" font-family="Inter, system-ui, sans-serif">often near $45</text>
  <rect x="368" y="76" width="160" height="250" rx="12" fill="#E7F4EE"/>
  <text x="448" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Bell</text>
  <text x="384" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fibre or not</text>
  <text x="384" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Read upload</text>
  <text x="384" y="188" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Québec card</text>
  <text x="384" y="212" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Not Ontario $</text>
  <text x="384" y="248" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Method travels.</text>
  <text x="384" y="268" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Dollars do not.</text>
  <rect x="540" y="76" width="156" height="250" rx="12" fill="#F3F4F6"/>
  <text x="618" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Reseller</text>
  <text x="556" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Oxio, TekSavvy,</text>
  <text x="556" y="160" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">or a flanker</text>
  <text x="556" y="188" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">24-month total</text>
  <text x="556" y="212" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Support channel</text>
  <text x="556" y="248" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Two quotes,</text>
  <text x="556" y="268" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">not ten tabs</text>
  <text x="24" y="356" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Fizz 100 near $45 vs Videotron 100 near $68 is a 21 Sep 2026 comparison sketch, not a live tariff.</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">If you need TVA or Radio-Canada live, price that before you drop television.</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Confirm each checkout at the unit.</text>
</svg>
