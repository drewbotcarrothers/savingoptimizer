<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">

  <title>Example with made-up inputs: price per millilitre by fragrance format</title>
  <desc>Example with made-up inputs. A made-up full size is 1.50 dollars per millilitre, a made-up mini is 3.20, and a made-up decant is 4.40. Not shelf prices.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Example with made-up inputs: price per mL</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Not a shelf price. Divide your own price by the millilitres.</text>
  <text x="24" y="110" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Full size</text>
  <rect x="160" y="92" width="136" height="26" fill="#0F7A4B"/>
  <text x="306" y="110" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">$1.50</text>
  <text x="24" y="160" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Mini</text>
  <rect x="160" y="142" width="291" height="26" fill="#F59E0B"/>
  <text x="460" y="160" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">$3.20</text>
  <text x="24" y="210" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Decant</text>
  <rect x="160" y="192" width="400" height="26" fill="#6B7280"/>
  <text x="570" y="210" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">$4.40</text>
  <text x="24" y="270" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Full size: 100 mL at $150. Mini: 10 mL at $32. Decant: 5 mL at $22.</text>
  <text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">A higher rate can still be fewer dollars if you will not finish the bottle.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. Checked 29 Sep 2026.</text>

</svg>
