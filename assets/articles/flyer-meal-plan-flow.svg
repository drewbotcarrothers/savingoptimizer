<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="title desc">
  <title id="title">Plan meals from Canadian grocery flyers</title>
  <desc id="desc">Four-step loop: clip Thursday and Friday flyers, pick protein loss leaders, sketch five dinners, then write the list.</desc>
  <rect width="720" height="456" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Sales first. Meals second. List last.</text>
  <text x="24" y="58" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">Canadian flyer cadence: most banners drop Thursday; some Friday. Clip proteins, then cook what you already </tspan><tspan x="24" dy="17.6">like.</tspan></text>
  <g font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">
    <rect x="24" y="88" width="155" height="118" rx="12" fill="#E7F4EE" stroke="#0F7A4B"/>
    <text x="40" y="118" font-size="12" font-weight="700" fill="#0F7A4B">1. Cadence</text>
    <text x="40" y="144" font-size="14" font-weight="600" fill="#1A1A1A">Thu / Fri drop</text>
    <text x="40" y="166" font-size="12" fill="#6B7280">Pin two banners</text>
    <text x="40" y="184" font-size="12" fill="#6B7280">in Flipp or Reebee</text>
    <rect x="196" y="88" width="155" height="118" rx="12" fill="#F3F4F6"/>
    <text x="212" y="118" font-size="12" font-weight="700" fill="#0F7A4B">2. Proteins</text>
    <text x="212" y="144" font-size="14" font-weight="600" fill="#1A1A1A">Loss leaders</text>
    <text x="212" y="166" font-size="12" fill="#6B7280">Thighs, pork, eggs</text>
    <text x="212" y="184" font-size="12" fill="#6B7280">not out-of-season fish</text>
    <rect x="368" y="88" width="155" height="118" rx="12" fill="#F3F4F6"/>
    <text x="384" y="118" font-size="12" font-weight="700" fill="#0F7A4B">3. Meals</text>
    <text x="384" y="144" font-size="14" font-weight="600" fill="#1A1A1A">5 dinners</text>
    <text x="384" y="166" font-size="12" fill="#6B7280">+ leftover night</text>
    <text x="384" y="184" font-size="12" fill="#6B7280">+ one flex night</text>
    <rect x="540" y="88" width="156" height="118" rx="12" fill="#0F7A4B"/>
    <text x="556" y="118" font-size="12" font-weight="700" fill="#FFFFFF">4. List</text>
    <text x="556" y="144" font-size="14" font-weight="600" fill="#FFFFFF">Pantry bridges</text>
    <text x="556" y="166" font-size="12" fill="#E7F4EE">Buy what is missing</text>
    <text x="556" y="184" font-size="12" fill="#E7F4EE">not a new spice rack</text>
  </g>
  <path d="M179 147h17" stroke="#0F7A4B" stroke-width="2" transform="translate(0,17.6)"/>
  <path d="M351 147h17" stroke="#0F7A4B" stroke-width="2" transform="translate(0,17.6)"/>
  <path d="M523 147h17" stroke="#0F7A4B" stroke-width="2" transform="translate(0,17.6)"/>
  <rect x="24" y="230" width="672" height="135.6" rx="12" fill="#F3F4F6" transform="translate(0,17.6)"/>
  <text x="40" y="262" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B" transform="translate(0,17.6)">Illustrative Ontario two-store week (labelled estimate)</text>
  <text x="40" y="286" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" transform="translate(0,17.6)"><tspan x="40">No Frills: chicken thighs $3.99/lb + eggs + frozen veg. FreshCo: yogurt + bananas if the flyer wins after </tspan><tspan x="40" dy="17.6">the extra stop.</tspan></text>
  <text x="40" y="308" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" transform="translate(0,17.6) translate(0,17.6)">Five dinners from two proteins. Freeze half the thighs the same night. Skip salmon at $16/lb.</text>
  <text x="40" y="330" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)">Prices are examples of flyer-style loss leaders, not a Statistics Canada series. Check this week's Flipp clips.</text>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)">Grocery CPI context: food from stores +2.8% year over year in August 2026 (Statistics Canada Daily, 14 Sep 2026).</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)">Saving Optimizer - Canada - 16 Sep 2026</text>
</svg>
