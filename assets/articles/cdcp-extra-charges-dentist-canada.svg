<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Illustrative CDCP payment split by co-pay tier</title>
  <desc>Stacked bars for one illustrative procedure with a CDCP established fee of 100 dollars and a provider fee of 130 dollars. At a zero co-pay the plan pays 100 and you pay the 30 dollars above the grid. At 40 percent you pay 40 plus 30. At 60 percent you pay 60 plus 30. Not a real procedure code.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">One illustrative procedure, three co-pay tiers</text>
  <text x="24" y="52" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">CDCP fee $100. Provider fee $130. Arithmetic only. Not a fee-grid line.</text>
  <line x1="70" y1="80" x2="70" y2="320" stroke="#E5E7EB"/>
  <line x1="70" y1="320" x2="680" y2="320" stroke="#E5E7EB"/>
  <text x="60" y="324" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="60" y="168" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$100</text>
  <text x="60" y="84" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$130</text>
  <line x1="70" y1="166" x2="680" y2="166" stroke="#E5E7EB"/>
  <!-- scale: $130 = 240px, so $1 = 1.846px. Base y=320 -->
  <!-- 0% tier x=140: CDCP 100 = 185px, extra 30 = 55px -->
  <rect x="140" y="135" width="110" height="185" fill="#0F7A4B"/>
  <rect x="140" y="80" width="110" height="55" fill="#6B7280"/>
  <text x="195" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$100</text>
  <text x="195" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$30</text>
  <text x="195" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">0% co-pay</text>
  <text x="195" y="362" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">You pay $30</text>
  <!-- 40% x=310: CDCP 60 = 111px, copay 40 = 74px, extra 30 = 55px -->
  <rect x="310" y="209" width="110" height="111" fill="#0F7A4B"/>
  <rect x="310" y="135" width="110" height="74" fill="#0F7A4B" fill-opacity="0.45"/>
  <rect x="310" y="80" width="110" height="55" fill="#6B7280"/>
  <text x="365" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$60</text>
  <text x="365" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$40</text>
  <text x="365" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$30</text>
  <text x="365" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">40% co-pay</text>
  <text x="365" y="362" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">You pay $70</text>
  <!-- 60% x=480: CDCP 40 = 74px, copay 60 = 111px, extra 30 = 55px -->
  <rect x="480" y="246" width="110" height="74" fill="#0F7A4B"/>
  <rect x="480" y="135" width="110" height="111" fill="#0F7A4B" fill-opacity="0.45"/>
  <rect x="480" y="80" width="110" height="55" fill="#6B7280"/>
  <text x="535" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$40</text>
  <text x="535" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$60</text>
  <text x="535" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$30</text>
  <text x="535" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">60% co-pay</text>
  <text x="535" y="362" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">You pay $90</text>
  <rect x="24" y="386" width="14" height="14" fill="#0F7A4B"/>
  <text x="44" y="398" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CDCP pays</text>
  <rect x="140" y="386" width="14" height="14" fill="#0F7A4B" fill-opacity="0.45"/>
  <text x="160" y="398" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Your co-pay</text>
  <rect x="270" y="386" width="14" height="14" fill="#6B7280"/>
  <text x="290" y="398" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Above the CDCP fee</text>
</svg>
