<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: a year of cleaning</title>
  <desc>Twelve cleaner visits versus a home-care year. Example with made-up inputs. 12 x $18 = $216. Home year = $36.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: a year of cleaning</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Twelve cleaner visits versus a home-care year.</text>
  <text x="24" y="114" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">12 cleaner visits</text>
  <rect x="250" y="96" width="400" height="28" fill="#6B7280"/>
  <text x="262" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$216</text>
  <text x="24" y="176" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Home-care year</text>
  <rect x="250" y="158" width="67" height="28" fill="#0F7A4B"/>
  <text x="325" y="177" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$36</text>
  <text x="24" y="318" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs. 12 x $18 = $216. Home year = $36.</text>
  <text x="24" y="338" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Not a cleaner's rate card. Labels that say do not wash stay at the cleaner.</text>
  <text x="24" y="404" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 29 Sep 2026.</text>
</svg>
