<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Auto and home premiums with a multi-policy credit, and life kept beside the stack</title>
  <desc id="desc">A labelled stack. The multi-policy credit is a dollar amount on auto and home. Life insurance often does not change that credit and should be scored on its own contract.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Score the total only if the cover survived</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Placeholders, not a quote. 29 Nov 2026.</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">
    <text x="24" y="100">Auto, same limits</text>
    <rect x="230" y="82" width="280" height="26" rx="4" fill="#0F7A4B"/>
    <text x="240" y="100" fill="#FFFFFF">Written quote</text>
    <text x="24" y="150">Home, same endorsements</text>
    <rect x="230" y="132" width="320" height="26" rx="4" fill="#0F7A4B"/>
    <text x="240" y="150" fill="#FFFFFF">Sewer and flood still on</text>
    <text x="24" y="200">Multi-policy credit</text>
    <rect x="230" y="182" width="120" height="26" rx="4" fill="#0F7A4B"/>
    <text x="240" y="200" fill="#FFFFFF">In dollars</text>
    <text x="24" y="260">Life, same face and term</text>
    <rect x="230" y="242" width="240" height="26" rx="4" fill="#6B7280"/>
    <text x="240" y="260" fill="#FFFFFF">Beside the stack</text>
  </g>
  <text x="24" y="320" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Ask what the auto and home premiums become if the life policy is removed.</text>
  <text x="24" y="352" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">If nothing changes, life is not buying the discount.</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">A coverage cut is not a discount. Re-quote the expensive line alone once a year.</text>
</svg>
