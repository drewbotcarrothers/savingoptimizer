<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian sinking fund monthly skims</title>
  <desc id="desc">Four pots for property tax, home insurance, auto insurance, and holidays filling with monthly transfers.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Sinking funds: monthly skims for lumps</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled examples only. Drafted ~22 Sep 2026.</text>
  <rect x="24" y="84" width="150" height="180" rx="12" fill="#F3F4F6"/>
  <rect x="24" y="184" width="150" height="80" rx="12" fill="#0F7A4B"/>
  <text x="40" y="112" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Property tax</text>
  <text x="40" y="136" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$400 / mo</text>
  <text x="40" y="230" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Toward Mar bill</text>
  <rect x="198" y="84" width="150" height="180" rx="12" fill="#F3F4F6"/>
  <rect x="198" y="204" width="150" height="60" rx="12" fill="#0F7A4B"/>
  <text x="214" y="112" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Home ins.</text>
  <text x="214" y="136" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$100 / mo</text>
  <text x="214" y="240" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Annual draft</text>
  <rect x="372" y="84" width="150" height="180" rx="12" fill="#F3F4F6"/>
  <rect x="372" y="194" width="150" height="70" rx="12" fill="#0F7A4B"/>
  <text x="388" y="112" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Auto ins.</text>
  <text x="388" y="136" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$150 / mo</text>
  <text x="388" y="234" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Semi-annual</text>
  <rect x="546" y="84" width="150" height="180" rx="12" fill="#F3F4F6"/>
  <rect x="546" y="214" width="150" height="50" rx="12" fill="#0F7A4B"/>
  <text x="562" y="112" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Holidays</text>
  <text x="562" y="136" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$100 / mo</text>
  <text x="562" y="244" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Dec travel</text>
  <text x="24" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Park multi-month pots in a labelled HISA. Keep emergency cash visually separate.</text>
  <text x="24" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">If the mortgage PAD already remits property tax, do not double-count a second tax pot.</text>
  <text x="24" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Automate on payday + one business day beside the emergency skim.</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: FCAC budgeting guidance (~22 Sep 2026). Amounts are sketches — replace with your bills.</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not insurance or tax advice.</text>
</svg>
