<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Coverage decision before you buy a phone or laptop plan</title>
  <desc>A four-step process: check a card certificate or home policy first, then whether the household is accident-prone, then the deductible against a written repair quote, then consider a plan or self-insure.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Before you buy another device plan</text>
  <text x="24" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Read the certificate you already hold. Education only.</text>
  <rect x="150" y="62" width="420" height="46" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360.0" y="81.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">1. Card certificate or home policy</text>
  <text x="360.0" y="97.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">already covers this loss?</text>
  <line x1="250" y1="108" x2="130" y2="140" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="470" y1="108" x2="560" y2="140" stroke="#E5E7EB" stroke-width="2"/>
  <text x="175" y="132" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Yes</text>
  <text x="500" y="132" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">No</text>
  <rect x="24" y="142" width="210" height="44" rx="8" fill="#0F7A4B" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="129.0" y="168.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Use that coverage</text>
  <rect x="430" y="142" width="266" height="50" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="563.0" y="163.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">2. Accident-prone household?</text>
  <text x="563.0" y="179.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Drops, kids, travel, commute</text>
  <line x1="500" y1="192" x2="360" y2="228" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="620" y1="192" x2="620" y2="228" stroke="#E5E7EB" stroke-width="2"/>
  <text x="400" y="220" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">No</text>
  <text x="632" y="216" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Yes</text>
  <rect x="250" y="230" width="200" height="44" rx="8" fill="#0F7A4B" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="350.0" y="256.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Self-insure</text>
  <rect x="490" y="228" width="206" height="56" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="593.0" y="252.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">3. Deductible plus premium</text>
  <text x="593.0" y="268.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">vs a written repair quote</text>
  <line x1="540" y1="284" x2="430" y2="324" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="640" y1="284" x2="640" y2="324" stroke="#E5E7EB" stroke-width="2"/>
  <text x="460" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Quote is lower</text>
  <text x="640" y="310" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Plan is lower</text>
  <rect x="300" y="326" width="180" height="40" rx="8" fill="#0F7A4B" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="390.0" y="350.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Self-insure</text>
  <rect x="530" y="326" width="174" height="40" rx="8" fill="#0F7A4B" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="617.0" y="350.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Consider the plan</text>
  <text x="24" y="388" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Quebec legal warranties and card certificates sit in step 1.</text>
  <text x="24" y="406" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Wireless Code, simplified, checked 29 Sep 2026. No product is named.</text>
</svg>
