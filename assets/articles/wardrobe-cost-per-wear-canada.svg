<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: cost per wear, 10 wears versus 100</title>
  <desc>Example with made-up inputs. A $40 item worn 10 times costs $4.00 a wear. A $120 item worn 100 times costs $1.20 a wear. Not store prices.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: cost per wear</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Price divided by wears. Not a shelf price or a survey.</text>
  <text x="24" y="120" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">$40 worn 10 times</text>
  <rect x="220" y="98" width="400" height="28" fill="#6B7280"/>
  <text x="232" y="117" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$4.00 a wear</text>
  <text x="24" y="190" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">$120 worn 100 times</text>
  <rect x="220" y="168" width="120" height="28" fill="#0F7A4B"/>
  <text x="232" y="187" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$1.20</text>
  <text x="24" y="250" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">$40 / 10 = $4.00. $120 / 100 = $1.20. Bar length: $4.00 = 400 px.</text>
  <text x="24" y="278" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">The pricier item costs less per wear only because it is worn more often in this example.</text>
  <text x="24" y="306" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">If you will not wear it 100 times, do not use the $1.20.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. Checked 29 Sep 2026.</text>

</svg>
