<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">ETF versus stay worksheet</title>
  <desc id="desc">Compare paying an early cancellation fee to switch now versus staying until the fee hits zero or a winback lands. Drafted 29 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">ETF math before you give notice.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Home internet fixed-term sketch after CRTC 2026-43. 29 Sep 2026.</text>
  <rect x="48" y="88" width="200" height="220" rx="12" fill="#E7F4EE"/>
  <text x="148" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Pay ETF</text>
  <text x="148" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fee + overlap</text>
  <text x="148" y="185" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+ return shipping</text>
  <text x="148" y="220" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Wins if save is large</text>
  <rect x="260" y="88" width="200" height="220" rx="12" fill="#F3F4F6"/>
  <text x="360" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Stay</text>
  <text x="360" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Higher months</text>
  <text x="360" y="185" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">until ETF hits $0</text>
  <text x="360" y="220" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Wins if cliff is soon</text>
  <rect x="472" y="88" width="200" height="220" rx="12" fill="#E7F4EE"/>
  <text x="572" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Winback</text>
  <text x="572" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Written retain offer</text>
  <text x="572" y="185" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Future-dated cancel</text>
  <text x="572" y="220" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Often the real BATNA</text>
  <text x="24" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Wireless no-ETF-without-subsidy is not a home-internet rule. Read your schedule.</text>
  <text x="24" y="374" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Return the gateway on time — non-return fees are a second bill.</text>
  <text x="24" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not legal advice.</text>
</svg>
