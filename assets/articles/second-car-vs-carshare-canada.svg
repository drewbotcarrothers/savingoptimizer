<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" role="img" aria-labelledby="title desc">
  <title id="title">Paid-off second car versus car-share plus transit</title>
  <desc id="desc">Bar comparison of Ratehub running costs on a paid-off second car, four Communauto days plus a Compass pass, and a financed second car stack.</desc>
  <rect width="720" height="454" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The quiet hatchback is not free.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">Ratehub 29 Apr 2026 placeholders. Communauto Value Extra Toronto 15 Jun 2026. Compass 2-zone $156.70 </tspan><tspan x="24" dy="17.6">from 1 Jul 2026.</tspan></text>
  <line x1="70" y1="340" x2="680" y2="340" stroke="#E5E7EB" transform="translate(0,17.6)"/>
  <text x="160" y="368" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Paid-off 2nd car</text>
  <rect x="120" y="198" width="80" height="142" rx="8" fill="#9CA3AF" transform="translate(0,17.6)"/>
  <text x="160" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$659</text>
  <text x="360" y="368" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">4 share days + pass</text>
  <rect x="320" y="276" width="80" height="64" rx="8" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="360" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">~$293</text>
  <text x="560" y="368" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Financed 2nd car</text>
  <rect x="520" y="88" width="80" height="252" rx="8" fill="#6B7280" transform="translate(0,17.6)"/>
  <text x="560" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$1,373</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6)"><tspan x="24">$659 = insurance $164 + parking $200 + gas $165 + maintenance $120 + admin $10. $136 + $156.70 ≈ $293. Replace </tspan><tspan x="24" dy="16.2">every line.</tspan></text>
</svg>
