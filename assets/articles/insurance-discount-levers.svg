<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Ontario FSRA-style auto insurance discount ranges</title>
  <desc id="desc">Horizontal bars showing typical published discount ranges: winter tires, multi-policy, multi-vehicle, and renewal loyalty. Educational ranges, not a quote.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Ask for the discount  FSRA lists the names, insurers set the %</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">FSRA How to save on auto insurance (reviewed 16 Sep 2026). Ontario winter-tire discount is mandatory to offer; the rate is not. Not a quote.</text>
  <line x1="220" y1="90" x2="220" y2="310" stroke="#E5E7EB"/>
  <line x1="220" y1="310" x2="660" y2="310" stroke="#E5E7EB"/>
  <text x="220" y="328" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0%</text>
  <text x="367" y="328" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">5%</text>
  <text x="514" y="328" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">10%</text>
  <text x="660" y="328" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">15%+</text>
  <!-- winter tires ~4% of 15% scale = 117px -->
  <text x="208" y="128" text-anchor="end" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Winter tires (ON)</text>
  <rect x="220" y="110" width="118" height="28" rx="6" fill="#4B9B74"/>
  <text x="348" y="130" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">often 35%</text>
  <text x="208" y="178" text-anchor="end" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Multi-policy</text>
  <rect x="220" y="160" width="294" height="28" rx="6" fill="#0F7A4B"/>
  <text x="524" y="180" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">515%</text>
  <text x="208" y="228" text-anchor="end" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Multi-vehicle</text>
  <rect x="220" y="210" width="294" height="28" rx="6" fill="#0F7A4B"/>
  <text x="524" y="230" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">515%</text>
  <text x="208" y="278" text-anchor="end" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Renewal / loyalty</text>
  <rect x="220" y="260" width="440" height="28" rx="6" fill="#9CA3AF"/>
  <text x="670" y="280" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">520%</text>
  <text x="24" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">FSRA: shop around; do not assume identical coverage costs the same; wait until renewal to switch so you avoid mid-term cancellation penalties.</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">This is comparison education, not brokerage advice. Compare identical deductibles and accident benefits before you chase a headline premium.</text>
</svg>
