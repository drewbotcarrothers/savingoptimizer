<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Same shelf price, smaller pack: Canadian unit-price defence</title>
  <desc id="desc">Worked example of a cereal box that shrank from 725 g to 580 g at the same $5.99 shelf price, and how $/100 g exposes the increase.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The box looks familiar. The grams changed.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled example, not a specific brand claim. StatsCan quantity-adjusts shrinkflation into CPI.</text>
  <rect x="40" y="88" width="300" height="170" rx="12" fill="#F3F4F6"/>
  <text x="56" y="120" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Old pack</text>
  <text x="56" y="154" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">725 g at $5.99</text>
  <text x="56" y="184" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A">$0.83</text>
  <text x="56" y="214" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">per 100 g</text>
  <rect x="380" y="88" width="300" height="170" rx="12" fill="#E7F4EE" stroke="#0F7A4B"/>
  <text x="396" y="120" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">New pack, same sticker</text>
  <text x="396" y="154" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">580 g at $5.99</text>
  <text x="396" y="184" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0F7A4B">$1.03</text>
  <text x="396" y="214" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">per 100 g - about 25% more</text>
  <text x="24" y="294" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">StatsCan: from 2021-2023, 29.6% of eligible grocery items tracked in CPI saw shrinkflation, mostly name brands (77.6%).</text>
  <text x="24" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Food from stores was still +2.8% YoY in August 2026 (Daily, 14 Sep 2026) and 29.0% above August 2021. Unit price is the defence.</text>
  <text x="24" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Private-label bags and bulk bins often move slower. Compare $/100 g, not the front of the box.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer - Canada - 20 Sep 2026</text>
</svg>
