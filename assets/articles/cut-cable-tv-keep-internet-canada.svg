<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Cord-cutting cost stack</title>
  <desc id="desc">Compare the old bundle with internet-only plus a streaming ceiling. Antenna and the library sit at zero. The fifty-dollar cap is an illustrative household rule, not a market average. Drafted 22 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Internet, then a ceiling. Not every app.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative stack. Write your own Canadian prices. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="320" height="230" rx="12" fill="#F3F4F6"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Old bundle</text>
  <text x="40" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Internet line</text>
  <text x="40" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TV package</text>
  <text x="40" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Home phone you may not use</text>
  <text x="40" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Credits that end on different months</text>
  <text x="40" y="248" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Ask them to split the lines.</text>
  <text x="40" y="272" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">If they will not, you have no number.</text>
  <rect x="364" y="78" width="332" height="230" rx="12" fill="#E7F4EE"/>
  <text x="380" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">After you cut TV</text>
  <text x="380" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Internet-only quote (shop it)</text>
  <text x="380" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Streaming ceiling, illustrative $50</text>
  <text x="380" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Antenna and library at $0</text>
  <text x="380" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Sports app only in season</text>
  <text x="380" y="248" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">January audit</text>
  <text x="380" y="272" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cancel what nobody opened.</text>
  <rect x="24" y="324" width="672" height="48" rx="12" fill="#0F7A4B"/>
  <text x="40" y="354" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">If internet-only jumps by more than TV cost, you have not saved yet. Negotiate.</text>
  <text x="24" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">$50 is a household rule for this guide, not a Canadian average. Education only.</text>
</svg>
