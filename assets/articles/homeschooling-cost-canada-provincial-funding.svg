<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example homeschool year: frugal vs bought-in</title>
<desc id="d">Bars compare an example frugal homeschool year at $640 with a bought-in year at $2,610.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example homeschool year: frugal vs bought-in</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">One Grade 5 child, example costs</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Frugal plan</text>
<rect x="250" y="104.7" width="85.8" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="343.8" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$640</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Bought-in plan</text>
<rect x="250" y="198.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$2,610</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Alberta parent portion</text>
<rect x="250" y="291.3" width="124.4" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="382.4" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$928.03 max back</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
</svg>
