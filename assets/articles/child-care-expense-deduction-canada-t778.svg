<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Who claims the child care expense deduction</title>
  <desc>Flow from the Income Tax Act and Form T778. The lower-income spouse claims by default. Equal incomes need a joint election or neither person claims. Part C exceptions are a student, a person confined or with a long infirmity, a person in prison, or spouses living separate and apart. In those cases the higher-income person may claim, limited to the weekly amount times the weeks.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="26" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Who claims? The path on Form T778</text>
  <rect x="150" y="42" width="420" height="40" rx="8" fill="#0F7A4B"/>
  <text x="360" y="67" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Start with the lower-income spouse</text>
  <text x="360" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Section 63 and folio S1-F3-C1. Compare income without the child care deduction.</text>
  <rect x="70" y="124" width="270" height="72" rx="8" fill="#E5E7EB"/>
  <text x="205" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Incomes are equal</text>
  <text x="205" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Joint election, or neither</text>
  <text x="205" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">person may claim. s.63(2.1)</text>
  <rect x="380" y="124" width="270" height="72" rx="8" fill="#E5E7EB"/>
  <text x="515" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">One income is lower</text>
  <text x="515" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">That person claims, unless</text>
  <text x="515" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">a Part C exception applies.</text>
  <rect x="80" y="220" width="560" height="78" rx="8" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">T778 Part C: higher-income claim, listed situations only</text>
  <text x="360" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Student in a qualifying program. Confined, or a long infirmity, certified in writing.</text>
  <text x="360" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">In prison at least two weeks. Living separate and apart at year-end for 90 days.</text>
  <rect x="80" y="318" width="560" height="52" rx="8" fill="#0F7A4B"/>
  <text x="360" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Higher-income claim is capped at the weekly amount times the weeks</text>
  <text x="360" y="358" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">Weekly amount is 1/40 of the annual limit: $275, $200, or $125.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Real process from the Act and T778. Not tax advice. Checked 29 Sep 2026.</text>
</svg>
