<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Apartment Wi-Fi fix before speed upgrade</title>
  <desc id="desc">Flow from wired test to placement to mesh before considering a higher internet tier. Drafted 30 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Fix Wi-Fi before you buy megabits.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Canadian apartment path. 30 Sep 2026.</text>
  <rect x="40" y="90" width="150" height="100" rx="12" fill="#E7F4EE"/>
  <text x="115" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Wired test</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Peak + noon</text>
  <text x="200" y="140" font-size="20" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">→</text>
  <rect x="230" y="90" width="150" height="100" rx="12" fill="#E7F4EE"/>
  <text x="305" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Placement</text>
  <text x="305" y="160" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Channels / bands</text>
  <text x="390" y="140" font-size="20" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">→</text>
  <rect x="420" y="90" width="150" height="100" rx="12" fill="#E7F4EE"/>
  <text x="495" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Mesh math</text>
  <text x="495" y="160" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Vs $10–$15 pods</text>
  <text x="580" y="140" font-size="20" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">→</text>
  <rect x="610" y="90" width="70" height="100" rx="12" fill="#F3F4F6"/>
  <text x="645" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Tier?</text>
  <rect x="48" y="220" width="624" height="120" rx="12" fill="#F3F4F6"/>
  <text x="72" y="255" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">If wired is fine and Wi-Fi is not — stop shopping speed tiers.</text>
  <text x="72" y="280" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">If wired is weak — call repair or change technology, not only radios.</text>
  <text x="72" y="305" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Ask the landlord before you touch bulk gateways or drill for ethernet.</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Mesh and routers are offer types — verify building rules.</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Accent #0F7A4B.</text>
</svg>
