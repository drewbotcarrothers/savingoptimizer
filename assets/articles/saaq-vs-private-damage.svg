<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 453" role="img" aria-labelledby="title desc">
  <title id="title">Québec: public injury vs private vehicle damage</title>
  <desc id="desc">Do not compare a Québec damage quote to an Ontario all-in premium. Shop collision/comprehensive and deductibles; verify rules at saaq.gouv.qc.ca and lautorite.qc.ca.</desc>
  <rect width="720" height="453" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Québec: public injury vs private vehicle damage</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">SAAQ pays bodily injury on a no-fault plan. Private Q.P.F. 1 Section A (liability, min $50,000) is mandatory; </tspan><tspan x="24" dy="17.6">Section B (collision/comprehensive) is the shop.</tspan></text>
  <line x1="64" y1="88" x2="64" y2="300" stroke="#E5E7EB" transform="translate(0,17.6)"/>
  <line x1="64" y1="300" x2="696" y2="300" stroke="#E5E7EB" transform="translate(0,17.6)"/>
  <rect x="80" y="230" width="100" height="70" rx="6" fill="#9CA3AF" transform="translate(0,17.6)"/>
  <text x="130" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">public</text>
  <text x="130" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">SAAQ</text>
  <text x="130" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">injury</text>
  <rect x="204" y="190" width="100" height="110" rx="6" fill="#4B9B74" transform="translate(0,17.6)"/>
  <text x="254" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">mandatory</text>
  <text x="254" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Section A</text>
  <text x="254" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">liability</text>
  <rect x="328" y="140" width="100" height="160" rx="6" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="378" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">shop this</text>
  <text x="378" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Section B</text>
  <text x="378" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">your car</text>
  <rect x="452" y="210" width="100" height="90" rx="6" fill="#9CA3AF" transform="translate(0,17.6)"/>
  <text x="502" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">trim</text>
  <text x="502" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Add-ons</text>
  <text x="502" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Q.E.F.</text>
  <text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6)"><tspan x="24">Do not compare a Québec damage quote to an Ontario all-in premium. Shop collision/comprehensive and deductibles; </tspan><tspan x="24" dy="16.2">verify rules at saaq.gouv.qc.ca and lautorite.qc.ca.</tspan></text>
</svg>
