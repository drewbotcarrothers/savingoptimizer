<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Québec: public injury vs private vehicle damage</title>
  <desc id="desc">Do not compare a Québec damage quote to an Ontario all-in premium. Shop collision/comprehensive and deductibles; verify rules at saaq.gouv.qc.ca and lautorite.qc.ca.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Québec: public injury vs private vehicle damage</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">SAAQ pays bodily injury on a no-fault plan. Private Q.P.F. 1 Section A (liability, min $50,000) is mandatory; Section B (collision/comprehensive) is the shop.</text>
  <line x1="64" y1="88" x2="64" y2="300" stroke="#E5E7EB"/>
  <line x1="64" y1="300" x2="696" y2="300" stroke="#E5E7EB"/>
  <rect x="80" y="230" width="100" height="70" rx="6" fill="#9CA3AF"/>
  <text x="130" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">public</text>
  <text x="130" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">SAAQ</text>
  <text x="130" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">injury</text>
  <rect x="204" y="190" width="100" height="110" rx="6" fill="#4B9B74"/>
  <text x="254" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">mandatory</text>
  <text x="254" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Section A</text>
  <text x="254" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">liability</text>
  <rect x="328" y="140" width="100" height="160" rx="6" fill="#0F7A4B"/>
  <text x="378" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">shop this</text>
  <text x="378" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Section B</text>
  <text x="378" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">your car</text>
  <rect x="452" y="210" width="100" height="90" rx="6" fill="#9CA3AF"/>
  <text x="502" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">trim</text>
  <text x="502" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Add-ons</text>
  <text x="502" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Q.E.F.</text>
  <text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Do not compare a Québec damage quote to an Ontario all-in premium. Shop collision/comprehensive and deductibles; verify rules at saaq.gouv.qc.ca and lautorite.qc.ca.</text>
</svg>
