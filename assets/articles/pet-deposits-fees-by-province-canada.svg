<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Grid of pet-deposit rules for five provinces</title>
  <desc>Five boxes. Ontario: no pet deposit, and a no-pet clause in a covered tenancy agreement is void, as the Ontario renting guide quotes the statute. British Columbia: pet damage deposit no more than half a month's rent. Alberta: no separate pet-deposit cap on the pages opened; refundable fees sit inside the one-month security deposit. Manitoba: pet damage deposit up to one month's rent if collected on or after 1 August 2014. Saskatchewan: a separate pet deposit is not stated; the security deposit cap is one calendar month.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="start">Pet deposit, only where a page said so</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">Québec, Atlantic provinces, and the territories are omitted. Their pages did not load or were not opened.</text>
  <rect x="24" y="88" width="210" height="130" rx="6" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
  <text x="40" y="116" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">Ontario</text>
  <text x="40" y="144" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B" text-anchor="start">No pet deposit</text>
  <text x="40" y="168" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">Clause void in a</text>
  <text x="40" y="188" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">covered tenancy</text>
  <rect x="250" y="88" width="210" height="130" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="266" y="116" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">British Columbia</text>
  <text x="266" y="144" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start">Pet deposit allowed</text>
  <text x="266" y="168" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">No more than half</text>
  <text x="266" y="188" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">a month's rent</text>
  <rect x="476" y="88" width="210" height="130" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="492" y="116" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">Alberta</text>
  <text x="492" y="144" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start">No separate cap</text>
  <text x="492" y="168" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">Refundable sums sit</text>
  <text x="492" y="188" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">in the one-month cap</text>
  <rect x="24" y="250" width="210" height="130" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="40" y="278" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">Manitoba</text>
  <text x="40" y="306" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start">Pet deposit allowed</text>
  <text x="40" y="330" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">Up to one month if</text>
  <text x="40" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">collected from Aug 2014</text>
  <rect x="250" y="250" width="210" height="130" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="266" y="278" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">Saskatchewan</text>
  <text x="266" y="306" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">Not stated</text>
  <text x="266" y="330" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">Security deposit is</text>
  <text x="266" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">one month, pets unnamed</text>
  <text x="24" y="404" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start">Saving Optimizer. Provincial pages checked 27 Sep 2026. Not legal advice. Ontario text did not render on e-Laws.</text></svg>
