<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Is the reduced child care fee likely to apply?</title>
  <desc>Decision flow: is the centre licensed, is it enrolled in the Canada-wide system, and is the child under 6 or inside the provincial age rule. Outcomes are a reduced fee, a full fee with a subsidy check, or the child care expense deduction.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Will the reduced fee apply to this space?</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">One centre, one child. Provincial age rules can extend past age 6. Checked 29 Sep 2026.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">
    <rect x="24" y="68" width="300" height="52" rx="6" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
    <text x="36" y="90" font-weight="700">1. Is the centre licensed?</text>
    <text x="36" y="108" fill="#6B7280">If no, follow the arrow.</text>
    <line x1="324" y1="94" x2="390" y2="94" stroke="#6B7280" stroke-width="1.5"/>
    <rect x="390" y="68" width="306" height="52" rx="6" fill="#F59E0B"/>
    <text x="402" y="90" font-weight="700" fill="#1A1A1A">Full fee</text>
    <text x="402" y="108" fill="#1A1A1A">Check a subsidy. Deduction may apply.</text>
    <line x1="174" y1="120" x2="174" y2="142" stroke="#0F7A4B" stroke-width="1.5"/>
    <text x="182" y="136" fill="#0F7A4B">Yes</text>
    <rect x="24" y="142" width="300" height="52" rx="6" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
    <text x="36" y="164" font-weight="700">2. Enrolled in the Canada-wide system?</text>
    <text x="36" y="182" fill="#6B7280">Or funded, in your province's words.</text>
    <line x1="324" y1="168" x2="390" y2="168" stroke="#6B7280" stroke-width="1.5"/>
    <rect x="390" y="142" width="306" height="52" rx="6" fill="#F59E0B"/>
    <text x="402" y="164" font-weight="700" fill="#1A1A1A">Full fee</text>
    <text x="402" y="182" fill="#1A1A1A">Ask about a provincial subsidy.</text>
    <line x1="174" y1="194" x2="174" y2="216" stroke="#0F7A4B" stroke-width="1.5"/>
    <text x="182" y="210" fill="#0F7A4B">Yes</text>
    <rect x="24" y="216" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
    <text x="36" y="238" font-weight="700">3. Child under 6, or inside</text>
    <text x="36" y="256" font-weight="700">the province's age rule?</text>
    <line x1="324" y1="248" x2="390" y2="248" stroke="#6B7280" stroke-width="1.5"/>
    <rect x="390" y="222" width="306" height="64" rx="6" fill="#F59E0B"/>
    <text x="402" y="246" font-weight="700" fill="#1A1A1A">Check the age rule</text>
    <text x="402" y="266" fill="#1A1A1A">A full fee may apply after it.</text>
    <line x1="174" y1="280" x2="174" y2="308" stroke="#0F7A4B" stroke-width="1.5"/>
    <text x="182" y="300" fill="#0F7A4B">Yes</text>
    <rect x="24" y="308" width="672" height="52" rx="6" fill="#0F7A4B"/>
    <text x="36" y="330" font-weight="700" fill="#FFFFFF">Reduced fee can apply. Read the invoice and the parent handbook.</text>
    <text x="36" y="348" fill="#FFFFFF">A reduced fee can still be claimed as a child care expense if it qualifies.</text>
    <text x="24" y="392" fill="#6B7280">Saving Optimizer. Education only. Confirm the deduction with the CRA.</text>
  </g>

</svg>
