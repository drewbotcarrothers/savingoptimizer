<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">CARFAX Canada history vs lien vs UVIP vs PPI</title>
  <desc id="desc">Horizontal bars comparing typical 2026 costs and roles for a history-only CARFAX Canada report, a history plus lien report, an Ontario UVIP, and an independent PPI.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">A clean stamp is not a lien search — or a hoist.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">carfax.ca/order public prices reviewed 20 Sep 2026. UVIP $20 (O. Reg. 601/93). PPI shop quotes vary.</text>
  <line x1="250" y1="84" x2="250" y2="318" stroke="#E5E7EB"/>
  <text x="24" y="118" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">History only</text>
  <rect x="250" y="98" width="118" height="26" rx="6" fill="#4B9B74"/>
  <text x="378" y="117" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$58.95 · no lien</text>
  <text x="24" y="168" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">History + lien</text>
  <rect x="250" y="148" width="156" height="26" rx="6" fill="#0F7A4B"/>
  <text x="416" y="167" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$77.95</text>
  <text x="24" y="218" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ontario UVIP</text>
  <rect x="250" y="198" width="16" height="26" rx="4" fill="#4B9B74"/>
  <text x="276" y="217" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$20 · registry + liens</text>
  <text x="24" y="268" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Independent PPI</text>
  <rect x="250" y="248" width="200" height="26" rx="6" fill="#0F7A4B"/>
  <text x="460" y="267" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$150–$300</text>
  <text x="24" y="318" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">One missed repair</text>
  <rect x="250" y="298" width="320" height="26" rx="6" fill="#9CA3AF"/>
  <text x="580" y="317" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1,500+</text>
  <text x="24" y="368" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Stack paper, then the hoist. Walk if the seller blocks any layer.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">CARFAX Canada lien search copy excludes NWT. Prices move — confirm checkout.</text>
</svg>
