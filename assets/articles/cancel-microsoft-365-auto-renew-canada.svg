<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Two Personal plans versus one Family plan</title>
  <desc id="desc">Two Microsoft 365 Personal plans at 115 dollars each are 230 dollars a year. One Family plan is 145 dollars a year.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Two Personal plans cost more than one Family</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Microsoft Store Canada prices used 25 Sep 2026. Before tax.</text>
  <rect x="120" y="100" width="150" height="200" rx="6" fill="#1A1A1A"/>
  <text x="195.0" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$230</text>
  <text x="195.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Two Personal</text>
  <text x="195.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">2 x $115</text>
  <rect x="420" y="174" width="150" height="126" rx="6" fill="#0F7A4B"/>
  <text x="495.0" y="162" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$145</text>
  <text x="495.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">One Family</text>
  <text x="495.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">up to 6 people</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Empty Family seats replace a second Personal checkout.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Storage after the paid plan ends is 5 GB. 25 Sep 2026.</text>
</svg>
