<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Decision flow for an outlet tag</title>
  <desc>Start with the outlet tag. If the style matches the full-price store, compare the real price history. If it does not, judge fabric and seams on their own. Buy only if it beats a comparable item elsewhere.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Outlet tag: compare, or judge the garment alone</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">No prices. A compare-at figure is not a saving by itself.</text>
  <rect x="190" y="68" width="340" height="44" rx="4" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="360" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Read the outlet tag</text>
  <line x1="360" y1="112" x2="360" y2="132" stroke="#0F7A4B" stroke-width="2"/>
  <rect x="150" y="132" width="420" height="44" rx="4" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="360" y="159" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Same style as the full-price store?</text>
  <line x1="250" y1="176" x2="170" y2="210" stroke="#0F7A4B" stroke-width="2"/>
  <line x1="470" y1="176" x2="550" y2="210" stroke="#0F7A4B" stroke-width="2"/>
  <rect x="24" y="210" width="300" height="78" rx="4" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="36" y="234" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Yes</text>
  <text x="36" y="254" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Compare the real price history.</text>
  <text x="36" y="272" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Volume test or time test.</text>
  <rect x="396" y="210" width="300" height="78" rx="4" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="408" y="234" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">No</text>
  <text x="408" y="254" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Judge fabric and seams alone.</text>
  <text x="408" y="272" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Ignore the compare-at number.</text>
  <rect x="24" y="312" width="672" height="64" rx="4" fill="#F8FAF9" stroke="#0F7A4B"/>
  <text x="36" y="338" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Buy only if it beats a comparable item elsewhere</text>
  <text x="36" y="358" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Include the drive. Final-sale means the return desk will not rescue the fit.</text>
  <text x="24" y="402" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. As of 29 Sep 2026. Not a mall ranking.</text>
</svg>
