<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Catch up unused TFSA room</title>
  <desc id="desc">Confirm CRA room, pace monthly catch-up after buffer and high-interest debt, avoid over-contribution.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">TFSA catch-up without a cash crunch</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">2026 dollar limit $7,000. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="210" height="180" rx="12" fill="#E7F4EE"/>
  <text x="36" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Confirm</text>
  <text x="36" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">My Account figure</text>
  <text x="36" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">plus your ledger.</text>
  <text x="36" y="184" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Screen may lag into April.</text>
  <rect x="250" y="78" width="210" height="180" rx="12" fill="#E7F4EE"/>
  <text x="262" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Prioritize</text>
  <text x="262" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Match, HISA buffer,</text>
  <text x="262" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">then 19%+ debt.</text>
  <text x="262" y="184" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Then pace catch-up.</text>
  <rect x="476" y="78" width="220" height="180" rx="12" fill="#F3F4F6"/>
  <text x="488" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Pace</text>
  <text x="488" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Target divided by</text>
  <text x="488" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">months = PAD.</text>
  <text x="488" y="184" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Watch the 1% excess tax.</text>
  <text x="24" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Withdrawals return 1 January next year — do not replace them in the same calendar year.</text>
  <text x="24" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Write separate lines for catch-up room and the new annual limit.</text>
  <text x="24" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not tax or investment advice.</text>
</svg>
