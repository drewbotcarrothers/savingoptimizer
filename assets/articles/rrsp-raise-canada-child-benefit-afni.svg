<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: CCB before and after an RRSP deduction</title>
  <desc>Example with made-up inputs. Grouped bars of annual Canada Child Benefit for families with one, two, and three children under 6. Before uses a made-up AFNI of $90,000. After uses AFNI of $75,000 following a made-up $15,000 RRSP deduction. Amounts use the CRA reduction rates for July 2026 to June 2027. The bars are different lengths because the rates differ by number of children.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: annual CCB</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Children under 6. AFNI $90,000 before a made-up $15,000 RRSP deduction, and $75,000 after.</text>
  <text x="24" y="88" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">1 child, before</text>
  <rect x="168" y="72" width="110" height="22" fill="#6B7280"/>
  <text x="174" y="88" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">$4,805.11</text>
  <text x="24" y="122" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">1 child, after</text>
  <rect x="168" y="106" width="128" height="22" fill="#0F7A4B"/>
  <text x="174" y="122" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">$5,583.59</text>
  <text x="24" y="168" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">2 children, before</text>
  <rect x="168" y="152" width="226" height="22" fill="#6B7280"/>
  <text x="174" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">$9,884.28</text>
  <text x="24" y="202" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">2 children, after</text>
  <rect x="168" y="186" width="260" height="22" fill="#0F7A4B"/>
  <text x="174" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">$11,351.00</text>
  <text x="24" y="248" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">3 children, before</text>
  <rect x="168" y="232" width="353" height="22" fill="#6B7280"/>
  <text x="174" y="248" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">$15,422.76</text>
  <text x="24" y="282" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">3 children, after</text>
  <rect x="168" y="266" width="400" height="22" fill="#0F7A4B"/>
  <text x="174" y="282" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">$17,486.03</text>
  <text x="24" y="328" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Grey is before the deduction. Green is after. Increases: $778.48, $1,466.72, and $2,063.27.</text>
  <text x="24" y="348" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">CRA rates for July 2026 to June 2027. The CRA examples drop fractions of a cent.</text>
  <text x="24" y="368" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">The bars use that method. Not a tax refund. Confirm with the CRA calculator.</text>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 29 Sep 2026.</text>
</svg>
