<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Which return path applies: defect, change of mind, or an online order</title>
  <desc>A decision flow. If the item is defective, look at the warranty and the legal remedy. If you changed your mind, only the retailer policy applies. If you bought online, also read the distance-contract rules for your province.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Three questions before you drive back</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Information, not legal advice. Ontario.ca updated 25 Sep 2024.</text>
  <rect x="250" y="74" width="220" height="40" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="99" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Why are you returning it?</text>
  <line x1="300" y1="114" x2="130" y2="150" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="360" y1="114" x2="360" y2="150" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="420" y1="114" x2="590" y2="150" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="36" y="156" width="190" height="78" rx="8" fill="#0F7A4B"/>
  <text x="131" y="186" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Defective</text>
  <text x="131" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Warranty and legal remedy</text>
  <rect x="265" y="156" width="190" height="78" rx="8" fill="#0F7A4B"/>
  <text x="360" y="186" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Change of mind</text>
  <text x="360" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Retailer policy only</text>
  <rect x="494" y="156" width="190" height="78" rx="8" fill="#0F7A4B"/>
  <text x="589" y="186" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Bought online</text>
  <text x="589" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Also read distance rules</text>
  <text x="36" y="280" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Ontario.ca says the law does not require a general refund or exchange.</text>
  <text x="36" y="306" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">A posted policy can be stricter than you hoped, including all sales final.</text>
  <text x="36" y="332" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">An online order can add a cancellation right when disclosure or delivery fails.</text>
  <text x="36" y="370" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Provincial day counts in the article are from MyConsumerRights.ca, last verified 2 Sep 2026, and from ontario.ca.</text>
</svg>
