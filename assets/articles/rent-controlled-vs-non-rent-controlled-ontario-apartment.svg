<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Ontario guideline vs post November 15 2018 exempt rental cost paths</title>
  <desc id="desc">Two $2,200 Ontario rents. Guideline path uses 2.1 percent in 2026. Exempt path can reset toward market each year after proper N2 notice. Three renewals can diverge by thousands. First occupied for residential purposes after November 15 2018 is the usual exemption test.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Same sticker rent. Different 3-year path.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Ontario 2026 guideline 2.1% (ontario.ca). Exemption: first occupied for residential purposes after 15 Nov 2018 (RTA s.6.1). Sketch, 20 Sep 2026.</text>
  <rect x="48" y="88" width="300" height="200" fill="#E7F4EE"/>
  <text x="198" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Guideline unit</text>
  <text x="198" y="146" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year 0 rent $2,200</text>
  <text x="198" y="172" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+2.1% ' $2,246.20</text>
  <text x="198" y="198" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year 3 sketch ~$2,341</text>
  <text x="198" y="230" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">N1 - 90 days - once / 12 months</text>
  <text x="198" y="256" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">AGI is a separate LTB file</text>
  <rect x="372" y="88" width="300" height="200" fill="#F3F4F6"/>
  <text x="522" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Exempt unit</text>
  <text x="522" y="146" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year 0 rent $2,200</text>
  <text x="522" y="172" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">8% ask ' $2,376</text>
  <text x="522" y="198" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year 3 if 8% sticks ~$2,772</text>
  <text x="522" y="230" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">N2 - still 90 days - 12 months</text>
  <text x="522" y="256" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">No guideline cap on amount</text>
  <text x="24" y="322" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year-3 monthly gap in this labelled 8% path: about $430. Over 12 months that is ~$5,160  before you count the next move.</text>
  <text x="24" y="350" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A 2021 glass tower is not automatically exempt. A 2017 brick walk-up is not automatically protected. Occupancy history is the test.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Educational only. Landlord must prove the exemption in a dispute. Confirm on ontario.ca and Tribunals Ontario. Not legal advice.</text>
</svg>
