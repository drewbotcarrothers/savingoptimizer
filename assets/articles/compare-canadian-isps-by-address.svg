<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Three-quote ISP comparison method</title>
  <desc id="desc">Five-step Canadian address-based internet shopping: technology, three quotes, normalize terms, upload and fair-use, then BATNA and retention. Verified 21 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Shop by address, not by brand slogan</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Normalize 24-month CAD. Promos, credits, gear, and ETFs belong in the same row. Verified 21 Sep 2026.</text>
  <rect x="24" y="78" width="128" height="148" rx="12" fill="#E7F4EE"/>
  <text x="36" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Tech</text>
  <text x="36" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fibre / cable /</text>
  <text x="36" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">DSL / 5G / sat.</text>
  <text x="36" y="176" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Uploads matter.</text>
  <rect x="164" y="78" width="128" height="148" rx="12" fill="#F3F4F6"/>
  <text x="176" y="106" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Quotes</text>
  <text x="176" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Incumbent +</text>
  <text x="176" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">independent +</text>
  <text x="176" y="168" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">flanker.</text>
  <rect x="304" y="78" width="128" height="148" rx="12" fill="#E7F4EE"/>
  <text x="316" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Normalize</text>
  <text x="316" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Promo months,</text>
  <text x="316" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">credits, modem,</text>
  <text x="316" y="168" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ETF if any.</text>
  <rect x="444" y="78" width="128" height="148" rx="12" fill="#F3F4F6"/>
  <text x="456" y="106" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Fit</text>
  <text x="456" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Upload, WFH,</text>
  <text x="456" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">fair-use, data</text>
  <text x="456" y="168" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">caps vs unlimited.</text>
  <rect x="584" y="78" width="112" height="148" rx="12" fill="#E7F4EE"/>
  <text x="596" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">5. BATNA</text>
  <text x="596" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Walk or stay.</text>
  <text x="596" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Then retention.</text>
  <rect x="24" y="246" width="672" height="108" rx="12" fill="#F3F4F6"/>
  <text x="40" y="276" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Re-shop every 12 months, before the promo cliff</text>
  <text x="40" y="302" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A $55/mo independent for 24 months often beats $45 promo then $89 list. Calendar the end date.</text>
  <text x="40" y="326" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">After 12 Jun 2026, activation fees are generally banned; internet ETFs on a term can still apply.</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Confirm live quotes at your civic address. CRTC Internet Code and 2026-43. Saving Optimizer.</text>
</svg>
