<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: monthly OC Transpo cost</title>
<desc id="d">Bars compare $73.80 for two office days a week, $138.50 for four days and $116.50 for an STO monthly.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: monthly OC Transpo cost</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Adult, by office days</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Two days a week</text>
<rect x="250" y="104.7" width="186.5" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="444.5" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$73.80</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Four days (capped)</text>
<rect x="250" y="198.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$138.50</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">STO monthly</text>
<rect x="250" y="291.3" width="294.4" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="552.4" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$116.50</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
</svg>
