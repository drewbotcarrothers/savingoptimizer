<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Labelled life insurance needs stack</title>
  <desc id="desc">A labelled earner needs 864000 dollars of income replacement plus debts and goals, then subtracts group life, existing term, and spendable assets, leaving a gap near 952000 dollars.</desc>
  <rect width="720" height="460" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Needs stack, labelled Earner A</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Undiscounted. Not a quote. Replace with your shortfall. 23 Sep 2026.</text>
  <rect x="180" y="78" width="420" height="36" rx="6" fill="#0F7A4B"/>
  <text x="192" y="101" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Income shortfall 18 years x $48,000 = $864,000</text>
  <rect x="180" y="122" width="210" height="32" rx="6" fill="#128A56"/>
  <text x="192" y="143" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Mortgage $420,000</text>
  <rect x="180" y="162" width="150" height="32" rx="6" fill="#E7F4EE"/>
  <text x="192" y="183" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F7A4B">Debts, final, school $48,000</text>
  <text x="180" y="222" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Gross need $1,332,000</text>
  <rect x="180" y="240" width="300" height="32" rx="6" fill="#F3F4F6"/>
  <text x="192" y="261" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Minus group, existing term, cash $380,000</text>
  <rect x="180" y="288" width="360" height="40" rx="6" fill="#1A1A1A"/>
  <text x="192" y="313" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Gap to shop: about $952,000 of term</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">10 x $95,000 salary = $950,000. Close here only by accident.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Same rule on Earner B ($70,000) suggests $700,000 against an 8-year shortfall of $176,000.</text>
  <text x="24" y="420" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">FCAC: personal term lets you name the beneficiary. Creditor mortgage life pays the lender.</text>
  <text x="24" y="444" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. No investment return is assumed.</text>
</svg>
