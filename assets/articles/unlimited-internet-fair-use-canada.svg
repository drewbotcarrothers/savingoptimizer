<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Unlimited internet fine-print decoder</title>
  <desc id="desc">Soft caps, throttles, overage traps, and checklist questions for Canadian unlimited claims.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">“Unlimited” in Canada: decode the footnote</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Soft caps and old overage plans still exist. Facts stamped 22 Sep 2026.</text>
  <rect x="24" y="78" width="328" height="140" rx="12" fill="#E7F4EE"/>
  <text x="40" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">What to hunt</text>
  <text x="40" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fair use / AUP language</text>
  <text x="40" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Soft cap GB thresholds</text>
  <text x="40" y="168" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Throttle speeds after X</text>
  <text x="40" y="194" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Overage $ / GB on legacy</text>
  <rect x="368" y="78" width="328" height="140" rx="12" fill="#F3F4F6"/>
  <text x="384" y="106" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Heavy-use flags</text>
  <text x="384" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4K × many TVs</text>
  <text x="384" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cloud backup all day</text>
  <text x="384" y="168" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Security cameras upload</text>
  <text x="384" y="194" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Always-on game downloads</text>
  <rect x="24" y="240" width="672" height="110" rx="12" fill="#E7F4EE"/>
  <text x="40" y="268" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Before you switch</text>
  <text x="40" y="294" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ask: after what GB am I slowed? Is overage possible? Is this wireless home fair use?</text>
  <text x="40" y="318" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Internet Code usage alerts help — they do not rewrite a soft cap. Education only.</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">CRTC / CCTS consumer paths · plan PDFs · Saving Optimizer.</text>
</svg>
