<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Verified kitchen prices, not a 12-item basket</title>
  <desc>Two bars only. Dollarama's Canadian price-point ceiling is $5.00 from the fiscal 2026 annual information form. The IKEA VARDAGEN 28 cm cast-iron frying pan was $39.99 on the product page. Set totals and an all-dollar-store basket were not computed.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Prices this page could actually divide</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Scale is $0 to $50. Strategy totals are omitted because the other shelf tags were not opened. 26 Sep 2026.</text>
  <line x1="200" y1="80" x2="200" y2="300" stroke="#E5E7EB"/>
  <line x1="200" y1="300" x2="680" y2="300" stroke="#E5E7EB"/>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">
    <text x="192" y="304" text-anchor="end">$0</text>
    <text x="440" y="324" text-anchor="middle">$25</text>
    <text x="680" y="304" text-anchor="end">$50</text>
  </g>
  <text x="24" y="140" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Dollarama ceiling</text>
  <text x="24" y="158" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Not one SKU</text>
  <rect x="200" y="124" width="48" height="36" fill="#0F7A4B"/>
  <text x="256" y="147" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$5.00</text>
  <text x="24" y="230" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">IKEA VARDAGEN</text>
  <text x="24" y="248" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">28 cm pan</text>
  <rect x="200" y="214" width="384" height="36" fill="#0F7A4B"/>
  <text x="592" y="237" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$39.99</text>
  <text x="24" y="348" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">12-item basket, mixed strategy, and set-versus-pieces totals: not computed.</text>
  <text x="24" y="372" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">No HomeSense, Costco, or Canadian Tire cookware price was opened.</text>
</svg>
