<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Ten-year cumulative cost</title>
  <desc>Example with made-up inputs. At year 10, shaving is $1,500, laser is $2,000, and waxing is $4,800. Not clinic fees.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="30" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Ten-year cumulative cost</text>
  <text x="24" y="50" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs. Not a clinic quote.</text>
  <text x="18" y="190" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" transform="rotate(-90 18 190)">Dollars</text>
  <line x1="100" y1="280.0" x2="660" y2="280.0" stroke="#E5E7EB"/>
  <text x="94" y="284.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">0</text>
  <line x1="100" y1="179.0" x2="660" y2="179.0" stroke="#E5E7EB"/>
  <text x="94" y="183.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">2,500</text>
  <line x1="100" y1="78.0" x2="660" y2="78.0" stroke="#E5E7EB"/>
  <text x="94" y="82.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">5,000</text>
  <polyline points="130,280.0 370,183.0 610,86.1" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <polyline points="130,280.0 370,207.3 610,199.2" fill="none" stroke="#0F7A4B" stroke-width="3"/>
  <polyline points="130,280.0 370,249.7 610,219.4" fill="none" stroke="#6B7280" stroke-width="3"/>
  <text x="130" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Year 0</text>
  <text x="370" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Year 5</text>
  <text x="610" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Year 10</text>
  <text x="370" y="326" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Years</text>
  <line x1="70" y1="352" x2="100" y2="352" stroke="#6B7280" stroke-width="3"/>
  <text x="108" y="356" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Shaving $1,500</text>
  <line x1="250" y1="352" x2="280" y2="352" stroke="#0F7A4B" stroke-width="3"/>
  <text x="288" y="356" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Laser $2,000</text>
  <line x1="430" y1="352" x2="460" y2="352" stroke="#1A1A1A" stroke-width="3"/>
  <text x="468" y="356" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Waxing $4,800</text>
  <text x="24" y="384" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Shaving $150 a year. Waxing $480 a year. Laser $1,600, then $200 in year 4 and year 8.</text>
  <text x="24" y="404" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer, 29 Sep 2026. Arithmetic on made-up inputs only.</text>
</svg>
