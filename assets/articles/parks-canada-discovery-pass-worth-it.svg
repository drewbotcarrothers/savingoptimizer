<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Discovery Pass break-even versus Banff daily admission</title>
  <desc id="desc">At Banff regular daily rates from 8 September 2026, six adult entries cost 73.50 dollars, under the 83.50 adult Discovery Pass. Seven adult entries cost 85.75 dollars. A family or group vehicle is 24.50 a day versus a 167.50 annual pass, also crossing on the seventh entry day. Camping is not included.</desc>
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The pass pays on the seventh gate day</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Banff-style daily rates, regular fees from 8 Sep 2026. Count entries you pay, not nights you camp.</text>
  <line x1="80" y1="300" x2="500" y2="300" stroke="#E5E7EB"/>
  <line x1="80" y1="133" x2="500" y2="133" stroke="#0F7A4B" stroke-dasharray="5 4"/>
  <text x="88" y="125" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F7A4B">Adult pass $83.50</text>
  <rect x="100" y="275.5" width="32" height="24.5" fill="#9CA3AF"/>
  <rect x="150" y="251" width="32" height="49" fill="#9CA3AF"/>
  <rect x="200" y="226.5" width="32" height="73.5" fill="#9CA3AF"/>
  <rect x="250" y="202" width="32" height="98" fill="#9CA3AF"/>
  <rect x="300" y="177.5" width="32" height="122.5" fill="#9CA3AF"/>
  <rect x="350" y="153" width="32" height="147" fill="#9CA3AF"/>
  <rect x="400" y="128.5" width="32" height="171.5" fill="#0F7A4B"/>
  <text x="110" y="318" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">1</text>
  <text x="160" y="318" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">2</text>
  <text x="210" y="318" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">3</text>
  <text x="260" y="318" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">4</text>
  <text x="310" y="318" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">5</text>
  <text x="360" y="318" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">6</text>
  <text x="410" y="318" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F7A4B">7</text>
  <text x="510" y="168" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">6 x $12.25</text>
  <text x="510" y="188" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">= $73.50</text>
  <text x="510" y="216" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">7 x $12.25</text>
  <text x="510" y="236" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">= $85.75</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Family/group: $24.50 a day versus $167.50. Same seventh-day crossing ($171.50).</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">One Banff day does not pay for the pass. Camping, hot springs, and Lake Louise parking are extra.</text>
  <text x="24" y="420" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Parks Canada Banff fees, regular rates from 8 Sep 2026. Canada Strong Pass ended 7 Sep 2026.</text>
</svg>
