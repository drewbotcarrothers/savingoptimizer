<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Coverage overlap for accident, illness, and routine care</title>
  <desc>Conceptual diagram of three overlapping areas: accident, illness, and routine care. Accident-only sits in the accident area. Accident-and-illness adds illness. Embedded wellness may add routine care. No premiums and no policy wording. As of 27 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">What each plan type can reach</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Conceptual overlap only. Not a policy. No premiums drawn.</text>
  <circle cx="210" cy="188" r="92" fill="#0F7A4B" fill-opacity="0.18" stroke="#0F7A4B" stroke-width="2"/>
  <circle cx="330" cy="188" r="92" fill="#0F7A4B" fill-opacity="0.08" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="270" cy="268" r="92" fill="#6B7280" fill-opacity="0.12" stroke="#6B7280" stroke-width="2"/>
  <text x="168" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Accident</text>
  <text x="372" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Illness</text>
  <text x="270" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Routine care</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">
    <rect x="470" y="110" width="18" height="18" rx="3" fill="#0F7A4B" fill-opacity="0.35" stroke="#0F7A4B"/>
    <text x="498" y="124">Accident-only</text>
    <text x="498" y="142" font-size="11" fill="#6B7280">Accident area only</text>
    <rect x="470" y="168" width="18" height="18" rx="3" fill="#0F7A4B" fill-opacity="0.18" stroke="#1A1A1A"/>
    <text x="498" y="182">Accident and illness</text>
    <text x="498" y="200" font-size="11" fill="#6B7280">Both upper areas</text>
    <rect x="470" y="226" width="18" height="18" rx="3" fill="#6B7280" fill-opacity="0.25" stroke="#6B7280"/>
    <text x="498" y="240">Embedded wellness</text>
    <text x="498" y="258" font-size="11" fill="#6B7280">May add routine care</text>
  </g>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">NAPHIA labels the products. The wording you were offered decides the claim. As of 27 Sep 2026.</text>
</svg>
