<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Eight-year rustproofing cost in Canadian salt provinces</title>
  <desc id="desc">Cumulative cost of annual oil spray versus a one-time dealer undercoat versus a structural rust repair later.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Salt-province rust math over 8 years</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">CAA-Québec cost bands (updated 31 Jul 2026). Repair bar is a labelled late-stage sketch, not a body-shop quote.</text>
  <line x1="56" y1="80" x2="56" y2="290" stroke="#E5E7EB"/>
  <line x1="56" y1="290" x2="680" y2="290" stroke="#E5E7EB"/>
  <text x="48" y="294" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="48" y="224" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1.5k</text>
  <text x="48" y="154" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$3k</text>
  <text x="48" y="94" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$4.5k</text>
  <polyline fill="none" stroke="#0F7A4B" stroke-width="3" points="70,272 160,254 250,236 340,218 430,200 520,182 610,164 660,154"/>
  <polyline fill="none" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 4" points="70,248 660,248"/>
  <polyline fill="none" stroke="#9CA3AF" stroke-width="3" points="70,290 430,290 520,140 660,100"/>
  <rect x="80" y="348" width="12" height="12" fill="#0F7A4B"/>
  <text x="96" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Oil spray $140/yr</text>
  <rect x="250" y="348" width="12" height="12" fill="#6B7280"/>
  <text x="266" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Permanent coat $550</text>
  <rect x="460" y="348" width="12" height="12" fill="#9CA3AF"/>
  <text x="476" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Late structural repair</text>
  <text x="70" y="310" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Yr 0</text>
  <text x="250" y="310" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Yr 3</text>
  <text x="430" y="310" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Yr 5</text>
  <text x="610" y="310" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Yr 8</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">CAA-Québec: liquid oil $100$175/year; permanent $400$700. Eight oil years H $800$1,400. A rocker or frame repair later is the expensive bar.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Washes after brine and a dry garage habit still beat a $1,200 dealer package on a dirty underbody. Education, not a shop endorsement.</text>
</svg>
