<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">Eight-year rustproofing cost in Canadian salt provinces</title>
  <desc id="desc">Cumulative cost of annual oil spray versus a one-time dealer undercoat versus a structural rust repair later.</desc>
  <rect width="720" height="470" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Salt-province rust math over 8 years</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">CAA-Quebec cost bands (updated 31 Jul 2026). Repair bar is a labelled late-stage sketch, not a body-shop </tspan><tspan x="24" dy="17.6">quote.</tspan></text>
  <line x1="56" y1="80" x2="56" y2="290" stroke="#E5E7EB" transform="translate(0,17.6)"/>
  <line x1="56" y1="290" x2="680" y2="290" stroke="#E5E7EB" transform="translate(0,17.6)"/>
  <text x="48" y="294" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$0</text>
  <text x="48" y="224" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$1.5k</text>
  <text x="48" y="154" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$3k</text>
  <text x="48" y="94" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$4.5k</text>
  <polyline fill="none" stroke="#0F7A4B" stroke-width="3" points="70,272 160,254 250,236 340,218 430,200 520,182 610,164 660,154" transform="translate(0,17.6)"/>
  <polyline fill="none" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 4" points="70,248 660,248" transform="translate(0,17.6)"/>
  <polyline fill="none" stroke="#9CA3AF" stroke-width="3" points="70,290 430,290 520,140 660,100" transform="translate(0,17.6)"/>
  <rect x="80" y="348" width="12" height="12" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="96" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Oil spray $140/yr</text>
  <rect x="250" y="348" width="12" height="12" fill="#6B7280" transform="translate(0,17.6)"/>
  <text x="266" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Permanent coat $550</text>
  <rect x="460" y="348" width="12" height="12" fill="#9CA3AF" transform="translate(0,17.6)"/>
  <text x="476" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Late structural repair</text>
  <text x="70" y="310" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Yr 0</text>
  <text x="250" y="310" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Yr 3</text>
  <text x="430" y="310" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Yr 5</text>
  <text x="610" y="310" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Yr 8</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6)"><tspan x="24">CAA-Quebec: liquid oil $100-$175/year; permanent $400-$700. Eight oil years about $800-$1,400. A rocker or frame </tspan><tspan x="24" dy="16.2">repair later is the expensive bar.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,16.2) translate(0,17.6)"><tspan x="24">Washes after brine and a dry garage habit still beat a $1,200 dealer package on a dirty underbody. Education, not a </tspan><tspan x="24" dy="16.2">shop endorsement.</tspan></text>
</svg>
