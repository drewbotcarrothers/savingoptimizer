<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">One month of Crave Premium versus a year</title>
  <desc id="desc">One month at 22 dollars versus 264 dollars for twelve months at that rate.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">One HBO month is not a $264 year</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Premium rate on crave.ca, 25 Sep 2026. Before tax.</text>
  <rect x="140" y="262" width="150" height="38" rx="6" fill="#0F7A4B"/>
  <text x="215.0" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$22</text>
  <text x="215.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">One month</text>
  <text x="215.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">then cancel</text>
  <rect x="420" y="80" width="150" height="220" rx="6" fill="#1A1A1A"/>
  <text x="495.0" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$264</text>
  <text x="495.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Twelve months</text>
  <text x="495.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">$22 x 12</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Crave says you cannot pause. Cancel before the renewal.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Standard With Ads was $11.99 on Bell's page. 25 Sep 2026.</text>
</svg>
