<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">A year of list-price music plans</title>
  <desc id="desc">Spotify Individual is 167.88 dollars a year. Apple Music Individual is 143.88. Spotify Family is 287.88. Apple Music Family is 239.88. Monthly list price times 12, read 25 September 2026.</desc>
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">A year at the list price, before tax</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Monthly price times 12. Public pages read 25 Sep 2026.</text>
  <rect x="48" y="186" width="120" height="134" rx="6" fill="#1A1A1A"/>
  <text x="74" y="176" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$167.88</text>
  <text x="78" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Spotify</text>
  <text x="70" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Individual</text>
  <rect x="210" y="206" width="120" height="114" rx="6" fill="#0F7A4B"/>
  <text x="236" y="196" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$143.88</text>
  <text x="246" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Apple</text>
  <text x="232" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Individual</text>
  <rect x="372" y="90" width="120" height="230" rx="6" fill="#1A1A1A"/>
  <text x="398" y="80" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$287.88</text>
  <text x="402" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Spotify</text>
  <text x="410" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Family</text>
  <rect x="534" y="128" width="120" height="192" rx="6" fill="#0F7A4B"/>
  <text x="560" y="118" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$239.88</text>
  <text x="570" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Apple</text>
  <text x="570" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Family</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Duo, the two-person Spotify plan, is $19.99 a month, $239.88 a year. It is not a bar here.</text>
  <text x="24" y="422" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Family is one bill for up to six listeners, not six times the individual price.</text>
</svg>
