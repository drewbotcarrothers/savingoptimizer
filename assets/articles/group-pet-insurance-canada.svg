<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Flow from a group offer to naming the underwriter and deciding</title>
  <desc>Four steps: read the offer, name the insurer or underwriter, compare policy terms, then decide. No discount percentage is drawn. Checked 27 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Offer, underwriter, wording, decision</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">A logo is not the contract. No plan is ranked.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">
    <rect x="36" y="150" width="140" height="88" rx="8" fill="#0F7A4B"/>
    <text x="106" y="188" text-anchor="middle" fill="#FFFFFF" font-weight="700">Offer</text>
    <text x="106" y="208" text-anchor="middle" fill="#FFFFFF" font-size="11">Employer or membership</text>
    <polygon points="184,194 208,194 208,186 224,194 208,202 208,194" fill="#6B7280"/>
    <rect x="232" y="150" width="150" height="88" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="307" y="182" text-anchor="middle" font-weight="700">Name the</text>
    <text x="307" y="202" text-anchor="middle" font-weight="700">underwriter</text>
    <polygon points="390,194 414,194 414,186 430,194 414,202 414,194" fill="#6B7280"/>
    <rect x="438" y="150" width="140" height="88" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="508" y="182" text-anchor="middle" font-weight="700">Compare</text>
    <text x="508" y="202" text-anchor="middle" font-weight="700">the wording</text>
    <polygon points="586,194 610,194 610,186 626,194 610,202 610,194" fill="#6B7280"/>
    <rect x="250" y="280" width="220" height="72" rx="8" fill="#0F7A4B"/>
    <text x="360" y="310" text-anchor="middle" fill="#FFFFFF" font-weight="700">Decide</text>
    <text x="360" y="330" text-anchor="middle" fill="#FFFFFF" font-size="11">Limits, deductible, exclusions</text>
  </g>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Costco's opened page names Northbridge. An employer booklet was not opened. Checked 27 Sep 2026.</text>
</svg>
