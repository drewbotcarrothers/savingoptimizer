<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian grocery savings levers 2026</title>
  <desc id="desc">Ranked bars of highest-ROI grocery saving levers versus waiting for prices to go back, with Statistics Canada August 2026 CPI context.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Habits beat waiting for prices to 'go back'</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Food from stores +2.8% YoY in August 2026, still well above 2021. Rank the lever, not the headline.</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <text x="24" y="96" font-weight="600" fill="#1A1A1A">1. Discount banner vs full-service</text>
    <rect x="300" y="80" width="360" height="22" rx="4" fill="#0F7A4B"/>
    <text x="670" y="96" text-anchor="end" fill="#FFFFFF">often 10-20%</text>
    <text x="24" y="132" font-weight="600" fill="#1A1A1A">2. Flyer proteins + freeze</text>
    <rect x="300" y="116" width="280" height="22" rx="4" fill="#0F7A4B"/>
    <text x="590" y="132" fill="#FFFFFF">high on meat weeks</text>
    <text x="24" y="168" font-weight="600" fill="#1A1A1A">3. Waste / leftovers system</text>
    <rect x="300" y="152" width="220" height="22" rx="4" fill="#0F7A4B"/>
    <text x="530" y="168" fill="#FFFFFF">quiet 5-10%</text>
    <text x="24" y="204" font-weight="600" fill="#1A1A1A">4. Loaded loyalty offers</text>
    <rect x="300" y="188" width="90" height="22" rx="4" fill="#9CA3AF"/>
    <text x="400" y="204" fill="#6B7280">~0.5-1.5%</text>
    <text x="24" y="240" font-weight="600" fill="#1A1A1A">5. Card accelerator (paid in full)</text>
    <rect x="300" y="224" width="160" height="22" rx="4" fill="#0F7A4B"/>
    <text x="470" y="240" fill="#FFFFFF">~1-6% at till</text>
    <text x="24" y="276" font-weight="600" fill="#1A1A1A">6. Surplus app on the route</text>
    <rect x="300" y="260" width="130" height="22" rx="4" fill="#9CA3AF"/>
    <text x="440" y="276" fill="#6B7280">if no extra drive</text>
    <text x="24" y="312" font-weight="600" fill="#1A1A1A">7. Gift-card portal stack</text>
    <rect x="300" y="296" width="80" height="22" rx="4" fill="#9CA3AF"/>
    <text x="390" y="312" fill="#6B7280">~1-2% if clean</text>
  </g>
  <text x="24" y="356" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Source for the ceiling, not the lever: Statistics Canada Daily, 14 Sep 2026 - grocery CPI slower than all-items (3.0%) for the first time since July 2024.</text>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Wave 1 already used +29.0% since August 2021 for food from stores. Percent ranges above are household estimates, not official volumes.</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer - Canada - 16 Sep 2026</text>
</svg>
