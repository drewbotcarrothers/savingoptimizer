<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: monthly movie cost</title>
<desc id="d">Horizontal bars. Occasional without $8.75, with $10.99. Monthly without $32.50, with $22.99. Frequent without $97.50, with $68.97.</desc>
