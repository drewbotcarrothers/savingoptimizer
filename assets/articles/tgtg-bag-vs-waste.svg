<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Too Good To Go bag math after uneaten pastry</title>
  <desc id="desc">Bar chart showing a $6.99 bakery bag that looks like $18 of value, then collapses after $8 of food is not eaten.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Surprise-bag value vs food you eat</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative Canadian bakery bag, $6.99 plus tax. Stated retail is marketing.</text>
  <text x="86" y="92" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Dollars</text>
  <line x1="86" y1="110" x2="86" y2="310" stroke="#E5E7EB"/>
  <line x1="86" y1="310" x2="680" y2="310" stroke="#E5E7EB"/>
  <line x1="86" y1="260" x2="680" y2="260" stroke="#F3F4F6"/>
  <line x1="86" y1="210" x2="680" y2="210" stroke="#F3F4F6"/>
  <line x1="86" y1="160" x2="680" y2="160" stroke="#F3F4F6"/>
  <line x1="86" y1="110" x2="680" y2="110" stroke="#F3F4F6"/>
  <text x="78" y="314" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0</text>
  <text x="78" y="264" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">5</text>
  <text x="78" y="214" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">10</text>
  <text x="78" y="164" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">15</text>
  <text x="78" y="114" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">20</text>
  <rect x="140" y="130" width="110" height="180" rx="8" fill="#6B7280"/>
  <text x="195" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$18</text>
  <text x="195" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Stated retail</text>
  <text x="195" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">app crossed-out</text>
  <rect x="310" y="231" width="110" height="79" rx="8" fill="#0F7A4B"/>
  <text x="365" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$7.90</text>
  <text x="365" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">You paid</text>
  <text x="365" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$6.99 + tax</text>
  <rect x="480" y="210" width="110" height="100" rx="8" fill="#6B7280"/>
  <text x="535" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$10</text>
  <text x="535" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Food you eat</text>
  <text x="535" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$8 composted</text>
  <text x="24" y="382" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">If half the bag is pastry you will not freeze, you paid $7.90 for $10 of breakfast. Freeze, share, or skip.</text>
</svg>
