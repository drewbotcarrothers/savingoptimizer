<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian home insurance shopping: rebuild cost and water endorsements</title>
  <desc id="desc">Shop rebuild cost, not market value. Standard policies typically exclude sewer backup and overland flood unless you buy those endorsements. Condo unit owners need coverage the corporation policy does not buy.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Do not gut water cover to win a $180 premium</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">IBC: sewer backup and overland flood are typically optional. Standard water-escape is not the same thing.</text>
  <rect x="40" y="100" width="200" height="88" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="140" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Rebuild / replacement</text>
  <text x="140" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Not MLS market value</text>
  <rect x="260" y="100" width="200" height="88" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Sewer backup</text>
  <text x="360" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Drains / sump / septic</text>
  <rect x="480" y="100" width="200" height="88" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="580" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Overland flood</text>
  <text x="580" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rain, melt, freshwater</text>
  <text x="24" y="232" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Quote worksheet (same address, same rebuild number)</text>
  <text x="24" y="260" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1. Rebuild $   2. Deductible $   3. Sewer limit $   4. Overland limit $   5. Bundle / claims-free %</text>
  <text x="24" y="288" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Condo: corp policy is the building. You still need unit improvements, contents, liability, loss assessment.</text>
  <text x="24" y="330" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Loyalty inertia is a premium. Re-shop annually with identical limits. A cheaper quote that dropped flood is not cheaper.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Educational comparison only. IBC consumer pages used 20 Sep 2026. Not a policy recommendation.</text>
</svg>
