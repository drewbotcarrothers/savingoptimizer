<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Typical grocery loyalty returns in Canada</title>
  <desc id="desc">Horizontal bars comparing typical effective returns for PC Optimum, Scene+, and Moi with and without co-branded cards.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Effective grocery return  typical vs accelerated</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative ranges as of Sep 2026. Offers vary weekly; confirm in each app.</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <text x="24" y="100" font-weight="600" fill="#1A1A1A">PC Optimum (offers only)</text>
    <rect x="250" y="84" width="90" height="22" rx="4" fill="#9CA3AF"/>
    <text x="348" y="100" fill="#6B7280">~0.51.5%</text>
    <text x="24" y="142" font-weight="600" fill="#1A1A1A">Scene+ (offers only)</text>
    <rect x="250" y="126" width="90" height="22" rx="4" fill="#9CA3AF"/>
    <text x="348" y="142" fill="#6B7280">~0.51.5%</text>
    <text x="24" y="184" font-weight="600" fill="#1A1A1A">Moi base (QC/NB, 1 pt / $1)</text>
    <rect x="250" y="168" width="64" height="22" rx="4" fill="#0F7A4B"/>
    <text x="322" y="184" fill="#6B7280">~0.8%</text>
    <text x="24" y="226" font-weight="600" fill="#1A1A1A">Moi base (ON, 1 pt / $3)</text>
    <rect x="250" y="210" width="22" height="22" rx="4" fill="#6B7280"/>
    <text x="280" y="226" fill="#6B7280">~0.27%</text>
    <text x="24" y="268" font-weight="600" fill="#1A1A1A">PC World Elite at Loblaw</text>
    <rect x="250" y="252" width="240" height="22" rx="4" fill="#0F7A4B"/>
    <text x="500" y="268" fill="#6B7280">~3% (30 pts / $1)</text>
    <text x="24" y="310" font-weight="600" fill="#1A1A1A">Scotia Gold Amex at Empire</text>
    <rect x="250" y="294" width="360" height="22" rx="4" fill="#0F7A4B"/>
    <text x="620" y="310" fill="#6B7280">~6%</text>
  </g>
  <text x="24" y="352" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Point values: PC 10,000 = $10 (0.1¢); Scene+ 1,000 = $10 (1¢); Moi 500 = $4 (~0.8¢). Card rates change  check the issuer.</text>
  <text x="24" y="374" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">A richer points rate does not beat a 1015% higher shelf price at a full-service banner.</text>
</svg>
