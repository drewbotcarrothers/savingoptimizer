<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 491" role="img" aria-labelledby="title desc">
  <title id="title">Legal-frame Canadian rent increase pushback for Ontario B.C. and Quebec</title>
  <desc id="desc">Separate illegal notices from painful but legal increases. Ontario 2.1 percent guideline and N1. B.C. 2.3 percent limit and RTB-7. Quebec TAL renewal process. Ask for a smaller increase, delayed start, or included utilities. Comps and a move quote are the walk-away.</desc>
  <rect width="720" height="491" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Push back inside the statute — not a late-night speech</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">ON 2.1% / N1 - BC 2.3% / RTB-7 - QC TAL. 20 Sep 2026. Illegal notice first. Then comps. Then a smaller </tspan><tspan x="24" dy="17.6">number, a later date, or hydro included.</tspan></text>
  <rect x="40" y="84" width="200" height="150" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="140" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">1. Is it lawful?</text>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Right form</text>
  <text x="140" y="168" text-anchor="middle" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Right days</text>
  <text x="140" y="190" text-anchor="middle" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Right percentage</text>
  <text x="140" y="212" text-anchor="middle" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">12-month clock</text>
  <rect x="260" y="84" width="200" height="150" fill="#4B9B74" transform="translate(0,17.6)"/>
  <text x="360" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">2. Evidence pack</text>
  <text x="360" y="146" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">3 live comps</text>
  <text x="360" y="168" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">On-time ledger</text>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Repairs still open</text>
  <text x="360" y="212" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Move quote</text>
  <rect x="480" y="84" width="200" height="150" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="580" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">3. Ask for</text>
  <text x="580" y="146" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Smaller $</text>
  <text x="580" y="168" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Later start</text>
  <text x="580" y="190" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Hydro / parking in</text>
  <text x="580" y="212" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Written only</text>
  <text x="24" y="268" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">Do not threaten a fake LTB/RTB/TAL filing, a social-media pile-on, or a rent strike. Those are how good files </tspan><tspan x="24" dy="17.6">get messy.</tspan></text>
  <text x="24" y="300" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">If the lawful number still breaks the budget, price a move before you bluff. $175/month extra x 12 = $2,100 — </tspan><tspan x="24" dy="17.6">compare to a local van.</tspan></text>
  <text x="24" y="338" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)"><tspan x="24">Ontario exempt units have no 2.1% cap. B.C. still has a published limit. Québec is a notice-and-TAL sport, not </tspan><tspan x="24" dy="17.6">an N1 analogy.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6) translate(0,17.6)">Educational scripts only. Confirm forms on Tribunals Ontario, gov.bc.ca, and tal.gouv.qc.ca. Not legal advice.</text>
</svg>
