<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Used-goods inspection steps</title>
  <desc>Four steps before you pay: search a recall, inspect for bed bugs, check for water damage, and power the appliance on. A fail on any step ends the visit.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Inspect before you pay</text>
  <text x="24" y="58" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">A fail on any step ends the visit. Do them in this order.</text>
  <line x1="48" y1="320" x2="648" y2="320" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="48" y="250" width="140" height="70" rx="8" fill="#0F7A4B"/>
  <text x="108" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
  <text x="118" y="304" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Recall</text>
  <rect x="188" y="200" width="140" height="120" rx="8" fill="#0F7A4B"/>
  <text x="258" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
  <text x="258" y="274" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Bed bugs</text>
  <rect x="328" y="150" width="140" height="170" rx="8" fill="#0F7A4B"/>
  <text x="398" y="220" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
  <text x="398" y="244" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Water</text>
  <rect x="468" y="100" width="180" height="220" rx="8" fill="#0B5C38"/>
  <text x="558" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
  <text x="558" y="214" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Power on</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Search recalls-rappels.canada.ca. Then seams and frames. Then swollen board. Then a live outlet.</text>
  <text x="24" y="388" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Health Canada second-hand guidance and the recall database. No step has a dollar value.</text>
</svg>
