<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Same-week checklist when a HISA promo drops</title>
  <desc id="desc">Confirm the new rate, compare a twelve-month yield, leave one month of bills liquid, then stay or transfer. A labelled ten thousand dollars at a teaser then a cliff earns less than a steady everyday rate.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The week the promo ends, decide</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled $10,000. Simple interest. Drafted 22 Sep 2026. Not a ranking.</text>
  <rect x="24" y="78" width="160" height="188" rx="12" fill="#E7F4EE"/>
  <text x="38" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Confirm</text>
  <text x="38" y="134" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Posted rate today.</text>
  <text x="38" y="154" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">End date. Holds.</text>
  <text x="38" y="174" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Available balance,</text>
  <text x="38" y="194" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">not pending.</text>
  <rect x="196" y="78" width="160" height="188" rx="12" fill="#E7F4EE"/>
  <text x="210" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">2. Compare</text>
  <text x="210" y="134" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4.50% for 5 mo</text>
  <text x="210" y="154" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">then 0.30%: ~$205.</text>
  <text x="210" y="182" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2.75% all year:</text>
  <text x="210" y="202" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">about $275.</text>
  <rect x="368" y="78" width="160" height="188" rx="12" fill="#F3F4F6"/>
  <text x="382" y="106" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3. Buffer</text>
  <text x="382" y="134" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Leave one month</text>
  <text x="382" y="154" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">of must-pay PADs</text>
  <text x="382" y="174" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">until the new cash</text>
  <text x="382" y="194" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">is available.</text>
  <rect x="540" y="78" width="156" height="188" rx="12" fill="#E7F4EE"/>
  <text x="554" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">4. Act</text>
  <text x="554" y="134" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Stay, or ask</text>
  <text x="554" y="154" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">in writing, or</text>
  <text x="554" y="174" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">transfer after a</text>
  <text x="554" y="194" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$50 test.</text>
  <text x="24" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">CDIC: $100,000 per category, per member. EQ Bank and Equitable Bank share one member.</text>
  <text x="24" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Interest outside a TFSA, RRSP, or FHSA is taxable. T5 at $50 or more. Still report less.</text>
  <text x="24" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Calendar: promo end date minus 7 days. Bank of Canada overnight target 2.25% on 2 Sep 2026.</text>
  <text x="24" y="366" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Rates: EQ 2.75% with qualifying direct deposit effective 16 Sep 2026. Re-check before you move.</text>
  <text x="24" y="388" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not a deposit offer.</text>
</svg>
