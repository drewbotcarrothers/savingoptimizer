<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Rural Canada internet decision tree</title>
  <desc id="desc">Check the National Broadband Map and UBF builds first. If fibre or a decent WISP is near, wait or join the waitlist. If not, compare Xplore-class fixed wireless versus Starlink latency, hardware, and monthly CAD at your postal code.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Rural order of operations: map, then wait, then satellite</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">UBF / National Broadband Map first. Starlink.com/ca for live CAD. Drafted 21 Sep 2026.</text>
  <rect x="24" y="78" width="216" height="132" rx="12" fill="#E7F4EE"/>
  <text x="40" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Check the map</text>
  <text x="40" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ISED National Broadband</text>
  <text x="40" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Map + UBF layers.</text>
  <text x="40" y="176" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Ask the township too.</text>
  <rect x="252" y="78" width="216" height="132" rx="12" fill="#F3F4F6"/>
  <text x="268" y="106" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Fibre or WISP?</text>
  <text x="268" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Xplore fibre up to 1 Gbps</text>
  <text x="268" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">symmetrical in some towns.</text>
  <text x="268" y="176" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Fixed wireless to 500 Mbps.</text>
  <rect x="480" y="78" width="216" height="132" rx="12" fill="#E7F4EE"/>
  <text x="496" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Starlink CAD</text>
  <text x="496" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Often ~$75 / $115 / $150</text>
  <text x="496" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Residential 100 / 200 / Max.</text>
  <text x="496" y="176" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Hardware offer is address-tied.</text>
  <rect x="24" y="228" width="328" height="120" rx="12" fill="#F3F4F6"/>
  <text x="40" y="256" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Latency that matters</text>
  <text x="40" y="282" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fibre: usually under ~20 ms.</text>
  <text x="40" y="300" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Starlink LEO: often ~20-60 ms.</text>
  <text x="40" y="318" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Old GEO sat: hundreds of ms.</text>
  <rect x="368" y="228" width="328" height="120" rx="12" fill="#E7F4EE"/>
  <text x="384" y="256" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">When to wait</text>
  <text x="384" y="282" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Build is funded and dated.</text>
  <text x="384" y="300" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Trees / snow kill the dish view.</text>
  <text x="384" y="318" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A WISP already hits 50/10+.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Starlink prices and free-hardware offers change by postal code (Help Center: enter address, Order Now). Xplore.ca fibre lookup. Education only.</text>
  <text x="24" y="406" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Do not buy a dish on day one if a UBF fibre drop is already in the ditch. Saving Optimizer.</text>
</svg>
