<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">iPhone subscription cancel order</title>
  <desc id="desc">Five steps: open Settings, tap your name, tap Subscriptions, screenshot the list, cancel and confirm the end date.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Where the cancel actually happens</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Apple Support (CA), published 14 Sep 2026. Deleting the app leaves the charge.</text>
  <rect x="36" y="88" width="120" height="64" rx="8" fill="#0F7A4B"/>
  <text x="68" y="126" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Settings</text>
  <rect x="176" y="88" width="120" height="64" rx="8" fill="#0F7A4B"/>
  <text x="196" y="126" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Your name</text>
  <rect x="316" y="88" width="140" height="64" rx="8" fill="#0F7A4B"/>
  <text x="336" y="126" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Subscriptions</text>
  <rect x="476" y="88" width="210" height="64" rx="8" fill="#1A1A1A"/>
  <text x="500" y="118" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Screenshot, then</text>
  <text x="500" y="138" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">confirm the end date</text>
  <text x="24" y="196" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">1. One Apple Account at a time. You cannot cancel a family member's plan from yours.</text>
  <text x="24" y="224" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">2. A trial must be cancelled at least 24 hours before it ends.</text>
  <text x="24" y="252" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">3. If there is no receipt from Apple, the biller is the company on the bank line.</text>
  <text x="24" y="280" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">4. Red expiration text means it is already cancelled. Save that screen anyway.</text>
  <text x="24" y="328" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Put the next quarterly open-Subscriptions reminder on a calendar both adults can see.</text>
  <text x="24" y="364" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">25 Sep 2026. Carrier-billed Apple plans are cancelled with the carrier, then relinked only if you still want them.</text>
</svg>
