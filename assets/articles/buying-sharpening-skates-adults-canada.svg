<text x="437.9" y="166.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$185</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Sharpening</text>
<rect x="250" y="200.6" width="87.5" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="345.5" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$90</text>
<text x="240" y="278.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Used skates</text>
<rect x="250" y="256.6" width="77.8" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="335.8" y="278.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$80</text>
<text x="240" y="334.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Guards and covers</text>
<rect x="250" y="312.6" width="14.6" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="272.6" y="334.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$15</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
