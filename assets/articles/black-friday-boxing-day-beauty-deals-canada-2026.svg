<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">

  <title>Calendar from October 2026 to January 2027 for beauty sale dates</title>
  <desc>Black Friday is 27 November 2026, Cyber Monday is 30 November 2026, and Boxing Day is 26 December 2026. No discount level and no holiday return-by date is shown.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Beauty calendar, October 2026 to January 2027</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Dates only. No discount level. No holiday return-by date.</text>
  <line x1="70" y1="200" x2="660" y2="200" stroke="#E5E7EB" stroke-width="4"/>
  <circle cx="70" cy="200" r="8" fill="#6B7280"/>
  <circle cx="250" cy="200" r="9" fill="#0F7A4B"/>
  <circle cx="340" cy="200" r="9" fill="#F59E0B"/>
  <circle cx="490" cy="200" r="9" fill="#0F7A4B"/>
  <circle cx="660" cy="200" r="8" fill="#6B7280"/>
  <text x="70" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Oct 2026</text>
  <text x="250" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">Black Friday</text>
  <text x="250" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">27 Nov 2026</text>
  <text x="340" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Cyber Monday</text>
  <text x="340" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">30 Nov 2026</text>
  <text x="490" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">Boxing Day</text>
  <text x="490" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">26 Dec 2026</text>
  <text x="660" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Jan 2027</text>
  <text x="24" y="330" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Read the retailer's returns page for any window on your receipt.</text>
  <text x="24" y="352" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">A later sale does not automatically adjust a November price.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. As of 29 Sep 2026.</text>

</svg>
