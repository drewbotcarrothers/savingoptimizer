<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Scene+ grocery earn paths in Canada</title>
  <desc id="desc">Comparison of Scene+ offers-only grocery earn versus Scotiabank Scene+ Visa 2x and Gold American Express 6x at Empire banners.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Scene+ is grocery currency, not only movies</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">1,000 points = $10 at participating Sobeys-family tills. FreshCo: no base points - offers only.</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <text x="24" y="100" font-weight="600" fill="#1A1A1A">Free member offers (typical week)</text>
    <rect x="320" y="84" width="80" height="22" rx="4" fill="#9CA3AF"/>
    <text x="410" y="100" fill="#6B7280">~0.5-1.5%</text>
    <text x="24" y="146" font-weight="600" fill="#1A1A1A">Scene+ Visa at Empire (2 pts / $1)</text>
    <rect x="320" y="130" width="160" height="22" rx="4" fill="#0F7A4B"/>
    <text x="490" y="146" fill="#6B7280">~2%</text>
    <text x="24" y="192" font-weight="600" fill="#1A1A1A">Gold Amex at Empire (6 pts / $1)</text>
    <rect x="320" y="176" width="360" height="22" rx="4" fill="#0F7A4B"/>
    <text x="690" y="192" text-anchor="end" fill="#FFFFFF">~6% before fee</text>
    <text x="24" y="238" font-weight="600" fill="#1A1A1A">Redeem groceries vs travel</text>
    <rect x="320" y="222" width="200" height="22" rx="4" fill="#E7F4EE" stroke="#0F7A4B"/>
    <text x="340" y="238" fill="#0F7A4B">$10 per 1,000 is simple</text>
  </g>
  <rect x="24" y="270" width="672" height="76" rx="12" fill="#F3F4F6"/>
  <text x="40" y="296" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Load weekly and personalized offers in the banner app or MyGroceryOffers.ca. Scan Scene+ every trip.</text>
  <text x="40" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Voila online: earn and redeem Scene+ on eligible orders. Gift cards, dairy in Atlantic, and several services are often excluded.</text>
  <text x="40" y="338" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Gold Amex ~$120 annual fee (public 2026 roundups). Break-even is extra earn versus a no-fee Scene+ Visa, paid in full.</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: Sobeys/FreshCo Scene+ pages and Scotiabank card earn tables, reviewed 16 Sep 2026. Caps and lists change.</text>
</svg>
