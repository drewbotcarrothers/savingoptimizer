<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Labelled kids app budget cap</title>
  <desc id="desc">Labelled household cap of 20 dollars. One literacy app at 8 dollars and one math app at 7 dollars total 15 dollars. Four entertainment renewals at 8 dollars each total 32 dollars, which is 12 dollars over the cap.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Two apps fit. Four renewals do not.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled cap the household writes down. Not a store price. 25 Sep 2026.</text>
  <rect x="80" y="146" width="150" height="150" rx="6" fill="#0F7A4B"/>
  <text x="122" y="136" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$15</text>
  <text x="100" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Literacy + math</text>
  <text x="118" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">$8 + $7</text>
  <rect x="300" y="196" width="120" height="100" rx="6" fill="#1A1A1A"/>
  <text x="332" y="186" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$20</text>
  <text x="330" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Agreed cap</text>
  <rect x="490" y="46" width="150" height="250" rx="6" fill="#1A1A1A"/>
  <text x="532" y="36" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$32</text>
  <text x="500" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Four renewals</text>
  <text x="520" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">4 x $8</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">The cap is the rule. A third app waits until one of the two is cancelled and the card is quiet.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Read each price on the Apple or Google receipt. School and library apps come first, at $0.</text>
</svg>
