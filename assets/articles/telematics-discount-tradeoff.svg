<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Telematics is a score, not a coupon</title>
  <desc id="desc">Ask whether a poor score can raise renewal, what data is kept, and whether you can buy the same insurer without the app. FSRA-aligned education, not brokerage.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Telematics is a score, not a coupon</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Educational ranges only — not a quote. A 5–15% usage discount can lose to an honest km rewrite plus a re-shop.</text>
  <line x1="64" y1="88" x2="64" y2="300" stroke="#E5E7EB"/>
  <line x1="64" y1="300" x2="696" y2="300" stroke="#E5E7EB"/>
  <rect x="80" y="250" width="100" height="50" rx="6" fill="#9CA3AF"/>
  <text x="130" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">5%</text>
  <text x="130" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">5% off</text>
  <text x="130" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">small UBI</text>
  <rect x="204" y="200" width="100" height="100" rx="6" fill="#0F7A4B"/>
  <text x="254" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">10%</text>
  <text x="254" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">10% off</text>
  <text x="254" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">calm/low-km</text>
  <rect x="328" y="150" width="100" height="150" rx="6" fill="#4B9B74"/>
  <text x="378" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">15%</text>
  <text x="378" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">15% off</text>
  <text x="378" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">best case</text>
  <rect x="452" y="120" width="100" height="180" rx="6" fill="#0F7A4B"/>
  <text x="502" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">often more</text>
  <text x="502" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Re-shop gap</text>
  <text x="502" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">same cover</text>
  <text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Ask whether a poor score can raise renewal, what data is kept, and whether you can buy the same insurer without the app. FSRA-aligned education, not brokerage.</text>
</svg>
