<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Labelled annual interest on eight thousand dollars</title>
  <desc id="desc">Bar comparison of about 1679 dollars of interest at 20.99 percent versus about 676 dollars at a labelled 8.45 percent line of credit, with a note that interest-only payments never retire principal.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">$8,000 for one year, if the rate holds and you do not re-spend</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Interest only. Principal is a separate decision. Drafted 21 Sep 2026.</text>
  <text x="160" y="100" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Card purchases 20.99%</text>
  <rect x="160" y="112" width="420" height="36" rx="6" fill="#0F7A4B"/>
  <text x="172" y="136" font-size="14" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">about $1,679</text>
  <text x="160" y="180" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Labelled unsecured LOC 8.45%</text>
  <rect x="160" y="192" width="169" height="36" rx="6" fill="#0F7A4B" opacity="0.55"/>
  <text x="172" y="216" font-size="14" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">about $676</text>
  <rect x="24" y="260" width="672" height="110" rx="12" fill="#E7F4EE"/>
  <text x="40" y="290" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">FCAC warning</text>
  <text x="40" y="314" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">If the LOC minimum is the monthly interest, the $8,000 never falls.</text>
  <text x="40" y="336" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">The rate gap only saves money when a written principal payment is larger than interest.</text>
  <text x="40" y="354" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">8.45% = RBC Prime 4.45% (21 Sep 2026) plus a hypothetical 4 point spread. Not an offer.</text>
</svg>
