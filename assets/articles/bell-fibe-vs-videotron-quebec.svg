<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Bell Fibe uploads versus Videotron cable value</title>
  <desc id="desc">Quebec decision sketch: choose Fibe when upload and glass matter; choose Videotron or Fizz when cable price and timing win. Drafted 24 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Upload versus price — not logo versus logo.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Quebec FTTH vs HFC sketch. Verify at the unit. 24 Sep 2026.</text>
  <rect x="48" y="88" width="300" height="236" rx="12" fill="#E7F4EE"/>
  <text x="198" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Lean Bell Fibe</text>
  <text x="198" y="160" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Heavy WFH uploads</text>
  <text x="198" y="190" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Glass confirmed at suite</text>
  <text x="198" y="220" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Can wait for install</text>
  <text x="198" y="260" text-anchor="middle" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Ebox row still required</text>
  <rect x="372" y="88" width="300" height="236" rx="12" fill="#F3F4F6"/>
  <text x="522" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Lean Videotron / Fizz</text>
  <text x="522" y="160" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Light upload, streaming home</text>
  <text x="522" y="190" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Need service this week</text>
  <text x="522" y="220" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">24-month cable total wins</text>
  <text x="522" y="260" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Refuse TV you will not watch</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Address-check both networks the same day. Promo cliffs and equipment lines belong on the sheet.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Marketing fibre on a truck is not FTTH at your suite — ask for the upload number.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Live Bell and Videotron checkers override this diagram.</text>
</svg>
