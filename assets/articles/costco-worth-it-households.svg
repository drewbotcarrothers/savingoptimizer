<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Costco Canada Gold Star worth-it by household type</title>
  <desc id="desc">Estimated annual unit-price savings versus the $65 Gold Star fee for a single, a couple, and a family of four using a split-shop with a discounter.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Gold Star fee vs realistic unit-price wins (illustrative)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Gold Star $65 + tax (Costco.ca, reviewed 16 Sep 2026). Bars assume a split shop with No Frills / FreshCo  not a 100% Costco cart.</text>
  <line x1="90" y1="80" x2="90" y2="310" stroke="#E5E7EB"/>
  <line x1="90" y1="310" x2="680" y2="310" stroke="#E5E7EB"/>
  <text x="82" y="314" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="82" y="254" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$150</text>
  <text x="82" y="194" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$300</text>
  <text x="82" y="134" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$450</text>
  <!-- fee line: 65/450*230 H 33; y = 310-33 = 277 -->
  <line x1="90" y1="277" x2="680" y2="277" stroke="#9CA3AF" stroke-dasharray="5 5"/>
  <text x="686" y="281" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$65 fee</text>
  <!-- single $80: 80/450*230=41; y=269 -->
  <rect x="140" y="269" width="110" height="41" rx="8" fill="#9CA3AF"/>
  <text x="195" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$80</text>
  <text x="195" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Single</text>
  <text x="195" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">if bulk is finished</text>
  <!-- couple $220: 220/450*230=112; y=198 -->
  <rect x="320" y="198" width="110" height="112" rx="8" fill="#4B9B74"/>
  <text x="375" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$220</text>
  <text x="375" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Couple</text>
  <text x="375" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">pantry + dairy</text>
  <!-- family $420: 420/450*230=215; y=95 -->
  <rect x="500" y="95" width="110" height="215" rx="8" fill="#0F7A4B"/>
  <text x="555" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$420</text>
  <text x="555" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Family of four</text>
  <text x="555" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">meat, paper, snacks</text>
  <text x="24" y="388" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Teaching estimates, not a promise. Waste, travel time, and Executive 2% are separate questions  see the Executive vs Gold Star guide for the $3,250 eligible-spend math.</text>
</svg>
