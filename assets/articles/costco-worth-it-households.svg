<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" role="img" aria-labelledby="title desc">
  <title id="title">Example: a 90-day Costco Gold Star audit</title>
  <desc id="desc">Example with made-up inputs. $60 of unit-price wins, minus $12 of waste, minus $10 of extra driving, minus $16.25 of pro-rated Gold Star fee, leaves a net of $21.75 after 90 days.</desc>
  <rect width="720" height="454" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Example: a 90-day Gold Star audit</text>
  <text x="24" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Example with made-up inputs. Gold Star $65 a year plus tax (Costco.ca, checked 20 Oct 2026).</text>
  <line x1="70" y1="360" x2="690" y2="360" stroke="#9CA3AF"/>
  <!-- scale: $60 = 240 px (4 px per $); baseline y=360 -->
  <rect x="90" y="120" width="96" height="240" rx="6" fill="#0F7A4B"/>
  <text x="138" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F7A4B">+$60.00</text>
  <rect x="210" y="120" width="96" height="48" rx="6" fill="#1A1A1A"/>
  <text x="258" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">−$12.00</text>
  <rect x="330" y="168" width="96" height="40" rx="6" fill="#1A1A1A"/>
  <text x="378" y="230" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">−$10.00</text>
  <rect x="450" y="208" width="96" height="65" rx="6" fill="#6B7280"/>
  <text x="498" y="295" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">−$16.25</text>
  <rect x="570" y="273" width="96" height="87" rx="6" fill="#0F7A4B"/>
  <text x="618" y="263" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F7A4B">+$21.75</text>
  <text x="138" y="384" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Unit-price wins</text>
  <text x="258" y="384" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Food thrown out</text>
  <text x="378" y="384" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Extra driving</text>
  <text x="498" y="384" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">90 days of fee</text>
  <text x="618" y="384" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F7A4B">Net</text>
  <text x="24" y="424" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Count only items you would have bought anyway. Your receipts, waste log and kilometres decide.</text>
</svg>
