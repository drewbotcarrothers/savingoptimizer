<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: keep on a $300 sale</title>
  <desc>Three made-up rates. Not a published fee schedule. Example with made-up inputs. $300 minus 15% = $255. 60% of $300 = $180. 40% = $120.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: keep on a $300 sale</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Three made-up rates. Not a published fee schedule.</text>
  <text x="24" y="114" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">15% online fee</text>
  <rect x="250" y="96" width="400" height="28" fill="#0F7A4B"/>
  <text x="262" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$255 kept</text>
  <text x="24" y="176" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">60% seller split</text>
  <rect x="250" y="158" width="282" height="28" fill="#F59E0B"/>
  <text x="262" y="177" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$180 kept</text>
  <text x="24" y="238" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">40% seller split</text>
  <rect x="250" y="220" width="188" height="28" fill="#6B7280"/>
  <text x="262" y="239" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$120 kept</text>
  <text x="24" y="318" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs. $300 minus 15% = $255. 60% of $300 = $180. 40% = $120.</text>
  <text x="24" y="338" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Not Reluxify's tiers and not Poshmark's 20% fee.</text>
  <text x="24" y="404" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. Checked 29 Sep 2026.</text>
</svg>
