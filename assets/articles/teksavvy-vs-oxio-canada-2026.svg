<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">TekSavvy vs Oxio 24-month Ontario 100 Mbps sketch</title>
  <desc id="desc">Illustrative 24-month cost for an Ontario 100 Mbps-class independent plan: TekSavvy promo then regular versus Oxio flat rate. Public comparison figures dated 11 Sep 2026. Verify live at your address.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Month-one sticker vs 24-month CAD</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Ontario 100 Mbps-class sketch. Taxes extra. Confirm live. Drafted 21 Sep 2026.</text>
  <rect x="80" y="100" width="240" height="220" rx="12" fill="#F3F4F6"/>
  <text x="200" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TekSavvy Cable 100</text>
  <text x="200" y="152" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">ON example, no contract</text>
  <text x="200" y="188" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year 1: $38.95 x 12</text>
  <text x="200" y="210" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year 2: $74.95 x 12</text>
  <text x="200" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$1,366.80</text>
  <text x="200" y="274" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">24-month total before tax</text>
  <text x="200" y="298" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Re-shop before month 13.</text>
  <rect x="400" y="100" width="240" height="220" rx="12" fill="#E7F4EE"/>
  <text x="520" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Oxio 100/100</text>
  <text x="520" y="152" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">ON example, no contract</text>
  <text x="520" y="188" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year 1: $52 x 12</text>
  <text x="520" y="210" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year 2: $52 x 12</text>
  <text x="520" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$1,248.00</text>
  <text x="520" y="274" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">24-month total before tax</text>
  <text x="520" y="298" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Flat rate if you stay put.</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Source pattern: Topicks.ca comparison updated 11 Sep 2026 (TekSavvy $38.95 then $74.95; Oxio $52). Address decides the last mile.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Oxio: included gear and 60-day guarantee (oxio.ca, used 21 Sep 2026). TekSavvy: 24/7 phone. Education only.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">A Big-3 winback can still undercut both. Run the three-quote sheet before you hop.</text>
