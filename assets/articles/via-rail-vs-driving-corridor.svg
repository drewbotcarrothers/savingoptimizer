<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 487" role="img" aria-labelledby="title desc">
  <title id="title">Via Rail versus driving Toronto to Ottawa</title>
  <desc id="desc">All-in one-way cost for a solo traveller and a family of four on the Quebec-Windsor corridor, train versus car.</desc>
  <rect width="720" height="487" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Toronto-Ottawa: train vs car, solo and family</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">Labelled one-way. Via fares are demand bands - confirm viarail.ca. Driving uses fuel + parking + a wear line. </tspan><tspan x="24" dy="17.6">20 Sep 2026.</tspan></text>
  <line x1="56" y1="80" x2="56" y2="290" stroke="#E5E7EB" transform="translate(0,17.6)"/>
  <line x1="56" y1="290" x2="680" y2="290" stroke="#E5E7EB" transform="translate(0,17.6)"/>
  <text x="48" y="294" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$0</text>
  <text x="48" y="224" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$80</text>
  <text x="48" y="154" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$160</text>
  <text x="48" y="94" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$240</text>
  <rect x="100" y="206" width="80" height="84" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <rect x="210" y="176" width="80" height="114" fill="#6B7280" transform="translate(0,17.6)"/>
  <rect x="400" y="88" width="80" height="202" fill="#4B9B74" transform="translate(0,17.6)"/>
  <rect x="510" y="200" width="80" height="90" fill="#9CA3AF" transform="translate(0,17.6)"/>
  <text x="140" y="310" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Via solo</text>
  <text x="140" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$45-$150</text>
  <text x="250" y="310" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Drive solo</text>
  <text x="250" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">~$90-$140</text>
  <text x="440" y="310" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Via x 4</text>
  <text x="440" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$180-$600</text>
  <text x="550" y="310" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Drive x 4</text>
  <text x="550" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">~$100-$160</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6)"><tspan x="24">~450 km. Fuel at 8 L/100 km and $1.60/L is about $58; add downtown parking and 10-15 cents/km wear. </tspan><tspan x="24" dy="16.2">Escape/Economy advance fares often beat that for one adult.</tspan></text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,16.2) translate(0,17.6)"><tspan x="24">Four Economy seats usually lose to one car. Flexible same-week Business is a meeting product, not a grocery-run </tspan><tspan x="24" dy="16.2">product. Last-mile: OC Transpo / TTC, not a second rental.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,16.2) translate(0,16.2) translate(0,17.6)"><tspan x="24">Via fare bands are 2026 corridor ranges from public booking write-ups - not a ticket. Driving uses Ratehub-style wear, </tspan><tspan x="24" dy="16.2">not CRA allowance as "cost."</tspan></text>
</svg>
