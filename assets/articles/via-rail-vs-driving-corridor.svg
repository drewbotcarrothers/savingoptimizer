<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Via Rail versus driving Toronto to Ottawa</title>
  <desc id="desc">All-in one-way cost for a solo traveller and a family of four on the Quebec-Windsor corridor, train versus car.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Toronto-Ottawa: train vs car, solo and family</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled one-way. Via fares are demand bands - confirm viarail.ca. Driving uses fuel + parking + a wear line. 20 Sep 2026.</text>
  <line x1="56" y1="80" x2="56" y2="290" stroke="#E5E7EB"/>
  <line x1="56" y1="290" x2="680" y2="290" stroke="#E5E7EB"/>
  <text x="48" y="294" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="48" y="224" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$80</text>
  <text x="48" y="154" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$160</text>
  <text x="48" y="94" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$240</text>
  <rect x="100" y="206" width="80" height="84" fill="#0F7A4B"/>
  <rect x="210" y="176" width="80" height="114" fill="#6B7280"/>
  <rect x="400" y="88" width="80" height="202" fill="#4B9B74"/>
  <rect x="510" y="200" width="80" height="90" fill="#9CA3AF"/>
  <text x="140" y="310" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Via solo</text>
  <text x="140" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$45-$150</text>
  <text x="250" y="310" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Drive solo</text>
  <text x="250" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">~$90-$140</text>
  <text x="440" y="310" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Via x 4</text>
  <text x="440" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$180-$600</text>
  <text x="550" y="310" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Drive x 4</text>
  <text x="550" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">~$100-$160</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">~450 km. Fuel at 8 L/100 km and $1.60/L is about $58; add downtown parking and 10-15 cents/km wear. Escape/Economy advance fares often beat that for one adult.</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Four Economy seats usually lose to one car. Flexible same-week Business is a meeting product, not a grocery-run product. Last-mile: OC Transpo / TTC, not a second rental.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Via fare bands are 2026 corridor ranges from public booking write-ups - not a ticket. Driving uses Ratehub-style wear, not CRA allowance as "cost."</text>
</svg>
