<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">FHSA automation and one-year carry-forward</title>
  <desc id="desc">Open the FHSA to start 8,000 dollars of room. Unused room carries forward one year, maximum 8,000 dollars. Lifetime 40,000 dollars. Fifteen-year participation period. RC721 transfer to RRSP if plans change.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">FHSA: open first, then automate - unlike a TFSA</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">CRA figures used 21 Sep 2026. Not tax advice.</text>
  <rect x="24" y="78" width="216" height="150" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Year you open</text>
  <text x="40" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$8,000 room.</text>
  <text x="40" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Carry-forward = $0.</text>
  <text x="40" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No retroactive years.</text>
  <text x="40" y="204" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">PAD ~$308 / bi-weekly pay.</text>
  <rect x="252" y="78" width="216" height="150" rx="12" fill="#F3F4F6"/>
  <text x="268" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Next year if unused</text>
  <text x="268" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Up to $16,000</text>
  <text x="268" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">($8k + $8k carry).</text>
  <text x="268" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Skip two years and</text>
  <text x="268" y="196" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">it does not become $24k.</text>
  <rect x="480" y="78" width="216" height="150" rx="12" fill="#F3F4F6"/>
  <text x="496" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Lifetime / clock</text>
  <text x="496" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$40,000 lifetime in.</text>
  <text x="496" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">15-year participation</text>
  <text x="496" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">(or 71 / after qualifying</text>
  <text x="496" y="196" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">withdrawal).</text>
  <rect x="24" y="246" width="672" height="88" rx="12" fill="#E7F4EE"/>
  <text x="40" y="276" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">If you do not buy: direct transfer to RRSP/RRIF with Form RC721</text>
  <text x="40" y="300" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No immediate tax if no excess FHSA amount. Does not use RRSP room. Do not withdraw cash and recontribute.</text>
  <text x="40" y="320" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Qualifying withdrawals and HBP stacking: Housing FHSA and HBP guides - not this page.</text>
  <text x="24" y="362" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: CRA FHSA participating, definitions, deductions, transfers-out pages. Used 21 Sep 2026.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">1% per month on excess FHSA amounts. Education only. Not tax or mortgage advice.</text>
  <text x="24" y="406" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">EQ FHSA cash 1.50% on 16 Sep 2026 is a parking rate inside the wrapper, not a reason to delay opening.</text>
</svg>
