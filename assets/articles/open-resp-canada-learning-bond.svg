<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Open an RESP and request the Canada Learning Bond</title>
  <desc id="desc">Canada Learning Bond up to 2,000 dollars. 500 dollars in the first eligible year plus 100 dollars a year through age 15. No personal contribution required. Child born 2004 or later. Request before age 21. Confirm the deposit. Then add CESG only if you can contribute later.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">CLB: open the RESP, skip the sales pitch</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">ESDC and Canada.ca figures used 22 Sep 2026. Not a product ranking.</text>
  <rect x="24" y="74" width="160" height="150" rx="12" fill="#E7F4EE"/>
  <text x="40" y="104" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. SIN</text>
  <text x="40" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Child SIN</text>
  <text x="40" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Subscriber SIN</text>
  <text x="40" y="172" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Caregiver SIN</text>
  <text x="40" y="198" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Taxes filed for CCB</text>
  <rect x="196" y="74" width="160" height="150" rx="12" fill="#F3F4F6"/>
  <text x="212" y="104" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Open</text>
  <text x="212" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ask: do you pay</text>
  <text x="212" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CLB and CESG?</text>
  <text x="212" y="180" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No enrolment fee</text>
  <text x="212" y="200" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">required for the bond</text>
  <rect x="368" y="74" width="160" height="150" rx="12" fill="#F3F4F6"/>
  <text x="384" y="104" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3. Request</text>
  <text x="384" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$500 first year</text>
  <text x="384" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+$100 / year</text>
  <text x="384" y="172" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Max $2,000</text>
  <text x="384" y="198" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0 of your own money</text>
  <rect x="540" y="74" width="156" height="150" rx="12" fill="#E7F4EE"/>
  <text x="556" y="104" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">4. Confirm</text>
  <text x="556" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Read the</text>
  <text x="556" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">statement</text>
  <text x="556" y="180" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Retroactive</text>
  <text x="556" y="200" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">if income qualified</text>
  <rect x="24" y="240" width="672" height="124" rx="12" fill="#E7F4EE"/>
  <text x="40" y="268" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1 Jul 2026 to 30 Jun 2027 income test (Canada.ca)</text>
  <text x="40" y="296" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1 to 3 children: adjusted income at or under $58,523. 4 children: under $66,036. 5 children: under $73,577.</text>
  <text x="40" y="316" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">More than 5: call 1-800-O-Canada. Born 2004 or later. Claim before the beneficiary turns 21.</text>
  <text x="40" y="344" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A branch insurance RESP is optional. The bond does not require a contribution or a scholarship trust.</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: CRA Canada Learning Bond page (modified 2026-02-27) and Canada.ca estimating-amounts table. Education only.</text>
</svg>
