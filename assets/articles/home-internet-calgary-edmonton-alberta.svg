  <text x="40" y="176" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Upload tells glass vs coax.</text>
  <rect x="368" y="78" width="328" height="130" rx="12" fill="#F3F4F6"/>
  <text x="384" y="106" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Second quotes</text>
