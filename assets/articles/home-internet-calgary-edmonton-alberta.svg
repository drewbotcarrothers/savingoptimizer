  <text x="384" y="176" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">the suite wiring.</text>
  <rect x="24" y="228" width="672" height="120" rx="12" fill="#E7F4EE"/>
  <text x="40" y="256" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Money clocks</text>
  <text x="40" y="282" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Promo vs loyalty after 12–24 months · condo bulk fee may remain · winback when cliff hits</text>
  <text x="40" y="308" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">See Telus PureFibre winback guide for Alberta retention pattern. Education only.</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">CRTC wholesale context is not a retail price list. Saving Optimizer.</text>
