<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Calgary and Edmonton home internet checklist</title>
  <desc id="desc">PureFibre versus Rogers/Shaw cable, resellers, promo cliffs, and condo bulk caveats.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
