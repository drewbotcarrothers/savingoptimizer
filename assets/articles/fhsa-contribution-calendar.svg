<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" role="img" aria-labelledby="title desc">
  <title id="title">FHSA annual and lifetime room calendar for a Canadian first-home save</title>
  <desc id="desc">CRA FHSA: $8,000 participation room in the year you open, $40,000 lifetime contributions, unused room carry-forward generally capped so a later year can reach $16,000. FTHBI closed 21 Mar 2024.</desc>
  <rect width="720" height="472" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">FHSA room starts the year you open — not the year you meant to</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">CRA: $8,000 first-year room · $40,000 lifetime contributions (canada.ca, as of 16 Sep 2026). Carry-forward </tspan><tspan x="24" dy="17.6">can make one year $16,000.</tspan></text>
  <rect x="40" y="200" width="70" height="80" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="75" y="190" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$8k</text>
  <text x="75" y="300" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Y1</text>
  <rect x="130" y="200" width="70" height="80" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="165" y="190" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$8k</text>
  <text x="165" y="300" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Y2</text>
  <rect x="220" y="200" width="70" height="80" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="255" y="190" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$8k</text>
  <text x="255" y="300" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Y3</text>
  <rect x="310" y="200" width="70" height="80" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="345" y="190" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$8k</text>
  <text x="345" y="300" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Y4</text>
  <rect x="400" y="200" width="70" height="80" fill="#4B9B74" transform="translate(0,17.6)"/>
  <text x="435" y="190" text-anchor="middle" font-size="12" fill="#4B9B74" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$8k</text>
  <text x="435" y="300" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Y5 = $40k</text>
  <text x="500" y="120" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Late-open trap</text>
  <text x="500" y="148" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Open in 2026: $8,000</text>
  <text x="500" y="172" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">this year — no retro room</text>
  <text x="500" y="196" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">for 2023–2025 eligibility.</text>
  <text x="500" y="228" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Unused Y1 $3,000 →</text>
  <text x="500" y="252" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Y2 can be up to $11,000</text>
  <text x="500" y="276" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">(carry-forward cap applies).</text>
  <text x="24" y="348" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">FTHBI shared-equity applications ended 21 Mar 2024 (CMHC). HBP still lets eligible buyers withdraw up to </tspan><tspan x="24" dy="17.6">$60,000 from an RRSP — a different tool, with repayment rules.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Not tax advice. Confirm room in CRA My Account. Qualifying withdrawals can be tax-free; RRSP-to-FHSA transfers are </tspan><tspan x="24" dy="16.2">not deductible. Account offers are affiliate types only.</tspan></text>
</svg>
