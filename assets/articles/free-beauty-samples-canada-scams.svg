<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">

  <title>Flow chart for a free beauty sample offer</title>
  <desc>Start with a free sample offer. If it asks for a card, leave. If the terms include a recurring charge, leave. Otherwise request the sample from the brand or retailer page.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Free sample: two questions, then request or leave</text>
  <rect x="250" y="44" width="220" height="32" rx="6" fill="#0F7A4B"/>
  <text x="360" y="65" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Free sample offer</text>
  <line x1="360" y1="76" x2="360" y2="96" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="230" y="96" width="260" height="32" rx="6" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="360" y="117" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Asks for a card?</text>
  <line x1="230" y1="112" x2="168" y2="112" stroke="#E5E7EB" stroke-width="2"/>
  <text x="188" y="106" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Yes</text>
  <rect x="24" y="96" width="130" height="32" rx="6" fill="#6B7280"/>
  <text x="89" y="117" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Leave</text>
  <line x1="360" y1="128" x2="360" y2="156" stroke="#E5E7EB" stroke-width="2"/>
  <text x="368" y="148" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">No</text>
  <rect x="190" y="156" width="340" height="32" rx="6" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="360" y="177" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Recurring charge in the terms?</text>
  <line x1="530" y1="172" x2="568" y2="172" stroke="#E5E7EB" stroke-width="2"/>
  <text x="534" y="166" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Yes</text>
  <rect x="568" y="156" width="130" height="32" rx="6" fill="#6B7280"/>
  <text x="633" y="177" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Leave</text>
  <line x1="360" y1="188" x2="360" y2="220" stroke="#E5E7EB" stroke-width="2"/>
  <text x="368" y="210" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">No</text>
  <rect x="160" y="220" width="400" height="32" rx="6" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="360" y="241" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Who runs it? Brand or retailer page</text>
  <line x1="360" y1="252" x2="360" y2="284" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="220" y="284" width="280" height="32" rx="6" fill="#0F7A4B"/>
  <text x="360" y="305" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Then request the sample</text>
  <text x="24" y="352" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">A card for shipping, or a renewal in the terms, means leave.</text>
  <text x="24" y="374" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">That card pattern is the Anti-Fraud Centre subscription trap.</text>
  <text x="24" y="404" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. As of 29 Sep 2026.</text>

</svg>
