<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 489" role="img" aria-labelledby="title desc">
  <title id="title">Canadian mortgage renewal shopping calendar</title>
  <desc id="desc">Start 120 days out, get the current lender offer in writing, shop a straight switch if uninsured, compare rate cashback fees and prepayments. OSFI MQR exemption for qualifying uninsured straight switches since 21 Nov 2024.</desc>
  <rect width="720" height="489" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Shop the renewal 120 days out — not the letter week</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">Shelter-cost framing, 16 Sep 2026. OSFI: uninsured straight switches exempt from prescribed MQR as of 21 </tspan><tspan x="24" dy="17.6">Nov 2024 (verify your facts).</tspan></text>
  <rect x="24" y="84" width="160" height="150" rx="10" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="104" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">120d</text>
  <text x="104" y="148" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Calendar + docs:</text>
  <text x="104" y="172" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">balance, remaining</text>
  <text x="104" y="192" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">amort, insured?</text>
  <text x="104" y="212" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">prepay privileges</text>
  <rect x="196" y="84" width="160" height="150" rx="10" fill="#F3F4F6" transform="translate(0,17.6)"/>
  <text x="276" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">90d</text>
  <text x="276" y="148" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Offer in writing</text>
  <text x="276" y="172" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">from current lender</text>
  <text x="276" y="192" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">before you shop.</text>
  <text x="276" y="212" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Rate is not enough.</text>
  <rect x="368" y="84" width="160" height="150" rx="10" fill="#F3F4F6" transform="translate(0,17.6)"/>
  <text x="448" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">60d</text>
  <text x="448" y="148" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Shop three paths</text>
  <text x="448" y="172" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Bank · broker ·</text>
  <text x="448" y="192" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">credit union.</text>
  <text x="448" y="212" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Same amort / $.</text>
  <rect x="540" y="84" width="156" height="150" rx="10" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="618" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">30d</text>
  <text x="618" y="148" text-anchor="middle" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Scorecard</text>
  <text x="618" y="172" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">rate, cashback,</text>
  <text x="618" y="192" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">fees, prepay,</text>
  <text x="618" y="212" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">portability</text>
  <text x="24" y="272" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Labelled payment sketch (not a quote)</text>
  <text x="24" y="300" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">$420,000 remaining · 22 years left · 5.2% vs 4.4% (illustrative). Payment drop is hundreds per month if the </tspan><tspan x="24" dy="17.6">switch is a true straight switch — no extra cash, no extra amort.</tspan></text>
  <text x="24" y="348" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Insured mortgages and cash-out refinances are a different underwriting story. This is not brokerage or credit </tspan><tspan x="24" dy="17.6">advice.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)"><tspan x="24">OSFI guidance 21 Nov 2024; MQR backgrounder. Lenders still apply B-20 judgment. Confirm with your institution before </tspan><tspan x="24" dy="16.2">you assume a stress-test skip.</tspan></text>
</svg>
