<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">

  <title>Example with made-up inputs: tip on an 80 dollar service, pre-tax versus after-tax</title>
  <desc>Example with made-up inputs. Made-up rates of 15 and 20 percent on a made-up 80 dollar service, before tax and after a made-up 13 percent tax. Tips are 12, 13.56, 16, and 18.08 dollars. Not a Canadian survey.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Example with made-up inputs: what the base changes</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Made-up $80 service. Made-up 13% tax. Made-up rates, not a survey.</text>
  <text x="24" y="100" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">15% pre-tax</text>
  <rect x="150" y="84" width="265" height="24" fill="#6B7280"/>
  <text x="424" y="101" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$12.00</text>
  <text x="24" y="140" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">15% after tax</text>
  <rect x="150" y="124" width="300" height="24" fill="#0F7A4B"/>
  <text x="458" y="141" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$13.56</text>
  <text x="24" y="180" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">20% pre-tax</text>
  <rect x="150" y="164" width="354" height="24" fill="#6B7280"/>
  <text x="512" y="181" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$16.00</text>
  <text x="24" y="220" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">20% after tax</text>
  <rect x="150" y="204" width="400" height="24" fill="#F59E0B"/>
  <text x="558" y="221" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$18.08</text>
  <text x="24" y="270" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">After-tax base is $80 times 1.13 = $90.40, a made-up tax.</text>
  <text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">15% of $90.40 is $13.56. 20% of $90.40 is $18.08.</text>
  <text x="24" y="314" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Ontario's Act does not set these rates. Your receipt's tax replaces 13%.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 29 Sep 2026.</text>

</svg>
