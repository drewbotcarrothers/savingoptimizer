<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: Checkout 51 earnings per year</title>
<desc id="d">Bars compare $26 a year at 50 cents a week, $52 at $1 and $78 at $1.50.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: Checkout 51 earnings per year</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">By weekly claims</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$0.50 a week</text>
<rect x="250" y="104.7" width="116.7" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="374.7" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$26</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$1.00 a week</text>
<rect x="250" y="198.0" width="233.3" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="491.3" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$52</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$1.50 a week</text>
<rect x="250" y="291.3" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$78</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
