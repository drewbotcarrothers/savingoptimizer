<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Per-skater cost of one hour of ice</title>
<desc id="d">Horizontal bars of per-skater cost for an hour at $351.75. 12 skaters $29.31, 16 skaters $21.98, 20 skaters $17.59, 24 skaters $14.66.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Per-skater cost of one hour of ice</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Ottawa 2026 adult prime-time rate of $351.75, before referees or fees</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">12 skaters</text>
<rect x="250" y="93.0" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$29.31</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">16 skaters</text>
<rect x="250" y="163.0" width="262.5" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="520.5" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$21.98</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">20 skaters</text>
<rect x="250" y="233.0" width="210.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="468.0" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$17.59</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">24 skaters</text>
<rect x="250" y="303.0" width="175.1" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="433.1" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$14.66</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. City of Ottawa 2026 rate; arithmetic only. As of 1 Oct 2026.</text>
