<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Annual detergent spend at 5, 8, and 12 loads a week</title>
  <desc>Grouped bars of calculated annual spend for Kirkland Signature liquid, Gain Original, and Tide Original at 5, 8, and 12 loads a week, using Costco East advertised-load prices posted 10 June 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Annual spend from advertised loads</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Cents per advertised load times loads per week times 52. Costco East list posted 10 Jun 2026.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <rect x="24" y="68" width="12" height="12" fill="#0F7A4B"/>
    <text x="42" y="78" fill="#1A1A1A">Kirkland liquid, 13.69 cents</text>
    <rect x="220" y="68" width="12" height="12" fill="#9CA3AF"/>
    <text x="238" y="78" fill="#1A1A1A">Gain Original, 15.06 cents</text>
    <rect x="420" y="68" width="12" height="12" fill="#D1D5DB"/>
    <text x="438" y="78" fill="#1A1A1A">Tide Original, 16.43 cents</text>
  </g>
  <line x1="168" y1="100" x2="168" y2="360" stroke="#E5E7EB"/>
  <line x1="168" y1="360" x2="690" y2="360" stroke="#E5E7EB"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">
    <text x="160" y="358" text-anchor="end">$0</text>
    <text x="340" y="376" text-anchor="middle">$50</text>
    <text x="512" y="376" text-anchor="middle">$100</text>
    <line x1="340" y1="360" x2="340" y2="366" stroke="#E5E7EB"/>
    <line x1="512" y1="360" x2="512" y2="366" stroke="#E5E7EB"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">
    <text x="24" y="128">5 loads/week</text>
    <rect x="168" y="112" width="174" height="16" fill="#0F7A4B"/>
    <text x="348" y="124" fill="#1A1A1A">$35.60</text>
    <rect x="168" y="132" width="191" height="16" fill="#9CA3AF"/>
    <text x="365" y="144" fill="#1A1A1A">$39.16</text>
    <rect x="168" y="152" width="209" height="16" fill="#D1D5DB"/>
    <text x="383" y="164" fill="#1A1A1A">$42.72</text>
    <text x="24" y="208">8 loads/week</text>
    <rect x="168" y="192" width="278" height="16" fill="#0F7A4B"/>
    <text x="452" y="204" fill="#FFFFFF">$56.96</text>
    <rect x="168" y="212" width="306" height="16" fill="#9CA3AF"/>
    <text x="480" y="224" fill="#1A1A1A">$62.66</text>
    <rect x="168" y="232" width="334" height="16" fill="#D1D5DB"/>
    <text x="508" y="244" fill="#1A1A1A">$68.36</text>
    <text x="24" y="288">12 loads/week</text>
    <rect x="168" y="272" width="417" height="16" fill="#0F7A4B"/>
    <text x="470" y="284" fill="#FFFFFF">$85.44</text>
    <rect x="168" y="292" width="459" height="16" fill="#9CA3AF"/>
    <text x="500" y="304" fill="#FFFFFF">$93.98</text>
    <rect x="168" y="312" width="500" height="16" fill="#D1D5DB"/>
    <text x="540" y="324" fill="#1A1A1A">$102.53</text>
  </g>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Scale: $110 = 536 px. Bar widths are proportional. Saving Optimizer, 26 Sep 2026. Not a national price survey.</text>
</svg>
