<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: five activities for one child</title>
  <desc>Example with made-up inputs. Horizontal bars for one child's annual activity costs: art $180, swimming $280, soccer $420, dance $510, and music $640.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: five activities</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">One child, annual amounts. Art $180 to music $640. Not club fees.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">
    <text x="24" y="92">Art</text>
    <rect x="120" y="74" width="129" height="26" fill="#6B7280"/>
    <text x="258" y="92">$180</text>
    <text x="24" y="140">Swimming</text>
    <rect x="120" y="122" width="201" height="26" fill="#0F7A4B"/>
    <text x="330" y="140">$280</text>
    <text x="24" y="188">Soccer</text>
    <rect x="120" y="170" width="302" height="26" fill="#1A1A1A"/>
    <text x="430" y="188" fill="#1A1A1A">$420</text>
    <text x="24" y="236">Dance</text>
    <rect x="120" y="218" width="367" height="26" fill="#F59E0B"/>
    <text x="496" y="236">$510</text>
    <text x="24" y="284">Music</text>
    <rect x="120" y="266" width="460" height="26" fill="#0F7A4B"/>
    <text x="590" y="284" fill="#1A1A1A">$640</text>
    <text x="24" y="330" font-size="12" fill="#6B7280">Five amounts: $180, $280, $420, $510, $640. They are not equal.</text>
    <text x="24" y="350" font-size="12" fill="#6B7280">A two-child year is two sheets like this, not this chart counted twice.</text>
    <text x="24" y="396" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 29 Sep 2026.</text>
  </g>

</svg>
