<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Labelled Caribbean week for two adults, headline price versus all-in totals</title>
  <desc id="desc">A labelled sketch, not a live package. Headline tour-operator total 2700 Canadian dollars. The same package after a premium-drink allowance, one excursion, and a tip sketch is about 3310 dollars. Flight plus resort after transfers is about 3370 dollars in the same sketch, or about 3090 dollars if the room is 280 dollars cheaper.</desc>
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Headline week versus the week you actually pay</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Two adults, 7 nights. Labelled sketch. Not a Cuba, Punta Cana, or Jamaica quote.</text>
  <text x="24" y="108" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Headline package</text>
  <rect x="210" y="90" width="292" height="26" rx="4" fill="#9CA3AF"/>
  <text x="512" y="108" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">$2,700</text>
  <text x="24" y="158" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Package, all-in extras</text>
  <rect x="210" y="140" width="358" height="26" rx="4" fill="#0F7A4B"/>
  <text x="578" y="158" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">$3,310</text>
  <text x="24" y="208" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Flight + resort, all-in</text>
  <rect x="210" y="190" width="365" height="26" rx="4" fill="#0F7A4B"/>
  <text x="585" y="208" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">$3,370</text>
  <text x="24" y="258" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Same DIY, cheaper room</text>
  <rect x="210" y="240" width="334" height="26" rx="4" fill="#0F7A4B"/>
  <text x="554" y="258" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">$3,090</text>
  <text x="24" y="310" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">The $60 gap between the first two all-in bars is noise. The room rate and the transfer decide it.</text>
  <text x="24" y="332" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">A $200 resort credit you would only have used $60 of is not a $200 discount. Medical is separate.</text>
  <text x="24" y="412" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Illustrative Canadian-origin week, built 23 Sep 2026. Re-price before you pay a deposit.</text>
</svg>
