<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Checklist of Canadian credits middle-aged households often miss</title>
  <desc id="desc">2026 figures: Canada employment amount 1,501 dollars, medical threshold the lesser of 3 percent of net income or 2,891 dollars, disability amount 10,341 dollars, caregiver amount for an infirm child 2,740 dollars. Donations and unused tuition need receipts Auto-fill does not invent. Not tax advice.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Credits to verify before you NETFILE</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">2026 indexed amounts used 22 Sep 2026. Checklist, not a filing position.</text>
  <rect x="24" y="74" width="220" height="176" rx="12" fill="#E7F4EE"/>
  <text x="40" y="102" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Work and health</text>
  <text x="40" y="130" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Employment amount $1,501</text>
  <text x="40" y="150" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">T2200 home office only</text>
  <text x="40" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">if the test is met</text>
  <text x="40" y="198" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Medical: 3% or $2,891</text>
  <text x="40" y="226" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">12-month period, either spouse</text>
  <rect x="256" y="74" width="220" height="176" rx="12" fill="#F3F4F6"/>
  <text x="272" y="102" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Family</text>
  <text x="272" y="130" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Caregiver child $2,740</text>
  <text x="272" y="150" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Disability amount $10,341</text>
  <text x="272" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">needs Form T2201</text>
  <text x="272" y="198" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Tuition transfer up to</text>
  <text x="272" y="218" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$5,000 federal</text>
  <text x="272" y="236" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Child must agree in writing</text>
  <rect x="488" y="74" width="208" height="176" rx="12" fill="#F3F4F6"/>
  <text x="504" y="102" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Paper Auto-fill misses</text>
  <text x="504" y="130" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Charity receipts</text>
  <text x="504" y="150" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">First $200 at 14%</text>
  <text x="504" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Above $200 at 29%</text>
  <text x="504" y="198" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Donations carry 5 years</text>
  <text x="504" y="226" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Political credit is separate</text>
  <rect x="24" y="266" width="672" height="100" rx="12" fill="#E7F4EE"/>
  <text x="40" y="294" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Download slips, then decide software or a preparer</text>
  <text x="40" y="318" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CRA My Account and Auto-fill do not invent a missing receipt. The federal transit pass credit is gone.</text>
  <text x="40" y="338" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Flat-rate work-from-home ended after 2022. A rental or a business is the cue for a written quote.</text>
  <text x="24" y="394" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: CRA TD1 2026, payroll thresholds, donation credit notes. Confirm before you file. Education only.</text>
</svg>
