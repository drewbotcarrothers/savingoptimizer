<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Monthly Kanopy and Hoopla caps</title>
  <desc id="desc">Ottawa Kanopy is 8 tickets a month. Halifax Kanopy is 10. Ottawa Hoopla is 4 borrows. Halifax Hoopla is 3. Pages read 25 September 2026. Kanopy Kids is not included in the ticket bars.</desc>
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Monthly caps, two libraries, two apps</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Pages read 25 Sep 2026. Kanopy Kids sits outside these bars.</text>
  <rect x="48" y="136" width="120" height="184" rx="6" fill="#0F7A4B"/>
  <text x="96" y="126" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">8</text>
  <text x="78" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Ottawa</text>
  <text x="74" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Kanopy</text>
  <rect x="210" y="90" width="120" height="230" rx="6" fill="#0F7A4B"/>
  <text x="254" y="80" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">10</text>
  <text x="238" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Halifax</text>
  <text x="242" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Kanopy</text>
  <rect x="372" y="228" width="120" height="92" rx="6" fill="#1A1A1A"/>
  <text x="420" y="218" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">4</text>
  <text x="402" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Ottawa</text>
  <text x="406" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Hoopla</text>
  <rect x="534" y="251" width="120" height="69" rx="6" fill="#1A1A1A"/>
  <text x="582" y="241" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">3</text>
  <text x="562" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Halifax</text>
  <text x="570" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Hoopla</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Same scale: 10 tickets is the tall bar. Ottawa cut Kanopy from 12 to 8 and Hoopla from 6 to 4.</text>
  <text x="24" y="422" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Your library's resource page overrides this chart. Bottoms align at the same baseline.</text>
</svg>
