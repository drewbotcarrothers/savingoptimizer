<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Wireless vs internet ETF after CRTC 2026-43</title>
  <desc id="desc">From 12 June 2026, wireless early cancellation fees are banned when there is no device subsidy. Home internet fixed-term ETFs can still apply if disclosed and decline to zero by 24 months. Activation and modification fees are generally banned for both.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Do not mix the Wireless Code with the Internet Code</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Telecom Regulatory Policy CRTC 2026-43, in force 12 Jun 2026. CCTS fee page used 21 Sep 2026.</text>
  <rect x="24" y="78" width="328" height="196" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Wireless (cellphone)</text>
  <text x="40" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No subsidized device: no ETF.</text>
  <text x="40" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Subsidized device: remaining</text>
  <text x="40" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">subsidy, declining to $0.</text>
  <text x="40" y="216" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Activation / plan-change fees:</text>
  <text x="40" y="236" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">generally prohibited.</text>
  <rect x="368" y="78" width="328" height="196" rx="12" fill="#F3F4F6"/>
  <text x="384" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Home internet (fixed)</text>
  <text x="384" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Month-to-month: no ETF.</text>
  <text x="384" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fixed term: disclosed ETF OK,</text>
  <text x="384" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">must hit $0 by 24 months.</text>
  <text x="384" y="216" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Same activation / change-fee</text>
  <text x="384" y="236" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ban (no tech visit needed).</text>
  <rect x="24" y="292" width="672" height="72" rx="12" fill="#E7F4EE"/>
  <text x="40" y="320" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Still allowed if contracted: on-site install, optional products you chose, equipment non-return, unpaid device financing.</text>
  <text x="40" y="344" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Dispute with the ISP first, then CCTS (1-888-221-1687). Education only, not legal advice.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: CRTC 2026-43; Internet Code G.3; CCTS which-fees-are-allowed (2 Sep 2026 article). Saving Optimizer.</text>
</svg>
