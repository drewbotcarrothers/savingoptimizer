<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Nintendo Switch Online Canada annual prices</title>
  <desc id="desc">nintendo.com/en-ca prices on 25 September 2026: individual 29.99 dollars, family 49.99, Expansion Pack individual 69.99, Expansion Pack family 109.99, per year.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Family wins at two players. Expansion is a separate test.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">nintendo.com/en-ca, CAD per year, up to 8 accounts on Family. Checked 25 Sep 2026.</text>
  <rect x="70" y="241" width="110" height="55" rx="6" fill="#1A1A1A"/>
  <text x="96" y="231" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$29.99</text>
  <text x="82" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Individual</text>
  <rect x="220" y="205" width="110" height="91" rx="6" fill="#0F7A4B"/>
  <text x="246" y="195" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$49.99</text>
  <text x="248" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Family</text>
  <rect x="370" y="169" width="110" height="127" rx="6" fill="#374151"/>
  <text x="396" y="159" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$69.99</text>
  <text x="378" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Expansion</text>
  <text x="400" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">1 account</text>
  <rect x="520" y="96" width="110" height="200" rx="6" fill="#0F7A4B"/>
  <text x="538" y="86" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$109.99</text>
  <text x="528" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Expansion</text>
  <text x="558" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Family</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Two individual years are $59.98. Family is $49.99. Expansion Family is $60 more than base Family.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Pay the extra $60 only if someone plays the classics or the included add-ons. eShop checkout is the bill.</text>
</svg>
