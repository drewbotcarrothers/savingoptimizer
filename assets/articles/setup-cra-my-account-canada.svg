<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">CRA account setup path</title>
  <desc id="desc">Sign in with a Sign-In Partner or a CRA user ID. GCKey does not open a CRA account. Then turn on direct deposit, online mail, and Auto-fill, and share access only through Represent a Client.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">One CRA account, then the settings that save April</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">CRA login pages used 21 Sep 2026. GCKey is for other departments.</text>
  <rect x="24" y="78" width="150" height="88" rx="10" fill="#0F7A4B"/>
  <text x="36" y="110" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">1. Sign-In</text>
  <text x="36" y="130" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Partner bank</text>
  <text x="36" y="148" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">or CRA user ID</text>
  <rect x="198" y="78" width="150" height="88" rx="10" fill="#0F7A4B" opacity="0.85"/>
  <text x="210" y="110" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">2. Deposit</text>
  <text x="210" y="130" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Refunds and</text>
  <text x="210" y="148" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">benefit payments</text>
  <rect x="372" y="78" width="150" height="88" rx="10" fill="#0F7A4B" opacity="0.7"/>
  <text x="384" y="110" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">3. Online mail</text>
  <text x="384" y="130" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Notices where</text>
  <text x="384" y="148" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">you will see them</text>
  <rect x="546" y="78" width="150" height="88" rx="10" fill="#0F7A4B" opacity="0.55"/>
  <text x="558" y="110" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">4. Auto-fill</text>
  <text x="558" y="130" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Then read</text>
  <text x="558" y="148" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">every slip</text>
  <rect x="24" y="190" width="672" height="150" rx="12" fill="#E7F4EE"/>
  <text x="40" y="220" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Room in one place</text>
  <text x="40" y="246" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TFSA room: 2026 dollar limit $7,000. Prior-year slips are the useful check from April 2026.</text>
  <text x="40" y="268" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">RRSP deduction limit: 2026 dollar ceiling $33,810. Your NOA number is the one that binds.</text>
  <text x="40" y="290" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">FHSA participation room starts the year you open the account. $8,000 / $40,000 lifetime.</text>
  <text x="40" y="318" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Spouse or preparer: Represent a Client. Never their hands on your bank sign-in.</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Provincial partner sign-in (BC or Alberta) does not work with Auto-fill. Add a CRA user ID or Sign-In Partner.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not tax advice. Quebec filers also use Revenu Quebec's own account.</text>
</svg>
