<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: boxes for a 2-bedroom move</title>
<desc id="d">Bars compare about $150 for 40 new boxes with about $86 for free boxes plus wardrobe boxes and tape.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: boxes for a 2-bedroom move</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">All new vs mostly free</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">40 new medium boxes</text>
<rect x="250" y="128.0" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$150</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Free boxes + 2 wardrobe + tape</text>
<rect x="250" y="268.0" width="200.7" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="458.7" y="292.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$86</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
