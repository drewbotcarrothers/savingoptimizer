<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Base points value on a 200 dollar household basket</title>
  <desc>On an illustrative 200 dollars of eligible goods before tax, Triangle Rewards at 0.4 percent is 80 cents, Scene+ at Home Hardware is 200 points worth 2 dollars at the 1000-points-for-10-dollars rate, and Shoppers PC Optimum at 15 points per dollar is 3000 points worth 3 dollars at 10000 points for 10 dollars. Card earn is excluded.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Base value on an illustrative $200 basket</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Eligible goods, before tax. Card earn and weekly offers are excluded. 26 Sep 2026.</text>
  <line x1="70" y1="300" x2="680" y2="300" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="70" y1="233" x2="680" y2="233" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="70" y1="166" x2="680" y2="166" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="70" y1="99" x2="680" y2="99" stroke="#E5E7EB" stroke-width="1"/>
  <text x="28" y="304" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">$0</text>
  <text x="28" y="237" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">$1</text>
  <text x="28" y="170" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">$2</text>
  <text x="28" y="103" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">$3</text>
  <rect x="130" y="246" width="110" height="54" rx="4" fill="#0F7A4B"/>
  <text x="158" y="236" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$0.80</text>
  <text x="140" y="324" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">CT Money</text>
  <text x="148" y="342" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">0.4 percent</text>
  <rect x="310" y="166" width="110" height="134" rx="4" fill="#0F7A4B"/>
  <text x="340" y="156" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$2.00</text>
  <text x="332" y="324" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Scene+</text>
  <text x="318" y="342" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">200 pts, not yet $10</text>
  <rect x="490" y="99" width="110" height="201" rx="4" fill="#0F7A4B"/>
  <text x="520" y="90" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$3.00</text>
  <text x="498" y="324" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">PC Optimum</text>
  <text x="500" y="342" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">3,000 pts at Shoppers</text>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Scene+ redeems at 1,000 points for $10. PC Optimum's base unit is 10,000 points for $10.</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Triangle Rewards column, Scene+ Home Hardware article, PC Optimum benefits table.</text>
