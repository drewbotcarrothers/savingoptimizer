<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">First-week internet in three cities</title>
  <desc id="desc">Book install before move-in, address-check fibre versus cable, then avoid double billing in Toronto, Vancouver, and Montréal. Drafted 22 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Toronto · Vancouver · Montréal — week one</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Book before possession. Address-check the unit. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="216" height="210" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Toronto</text>
  <text x="40" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rogers / Bell / resellers</text>
  <text x="40" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Condo riser quirks</text>
  <text x="40" y="188" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Oxio plant varies</text>
  <text x="40" y="220" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Address first</text>
  <rect x="252" y="78" width="216" height="210" rx="12" fill="#E7F4EE"/>
  <text x="268" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Vancouver</text>
  <text x="268" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Telus PureFibre</text>
  <text x="268" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rogers / former Shaw</text>
  <text x="268" y="188" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Strata fee can remain</text>
  <text x="268" y="220" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Quote the unit</text>
  <rect x="480" y="78" width="216" height="210" rx="12" fill="#E7F4EE"/>
  <text x="496" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Montréal</text>
  <text x="496" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Videotron / Fizz / Bell</text>
  <text x="496" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Do not reuse ON cards</text>
  <text x="496" y="188" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">French live TV priced</text>
  <text x="496" y="220" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Unit-level check</text>
  <rect x="24" y="310" width="672" height="64" rx="12" fill="#0F7A4B"/>
  <text x="40" y="348" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Short overlap on purpose. Two full cycles by accident is the expensive quirk.</text>
  <text x="24" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Confirm live availability at the civic address.</text>
</svg>
