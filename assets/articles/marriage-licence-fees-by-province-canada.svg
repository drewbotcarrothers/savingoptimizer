<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Marriage licence fees by province</title>
<desc id="d">Horizontal bars. Toronto $180, Nova Scotia $132.70, British Columbia $100, Manitoba $100, Saskatchewan $60, Alberta $40 plus a registry service fee.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
