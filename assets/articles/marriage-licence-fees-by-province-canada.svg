<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Published fees as of 1 Oct 2026 (Ontario: Toronto; Alberta: government fee only)</text>
<text x="240" y="105.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Toronto</text>
<rect x="250" y="86.9" width="350.0" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="105.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$180</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Nova Scotia</text>
<rect x="250" y="133.5" width="258.0" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="516.0" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$132.70</text>
<text x="240" y="198.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">British Columbia</text>
<rect x="250" y="180.2" width="194.4" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="452.4" y="198.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$100</text>
<text x="240" y="245.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Manitoba</text>
<rect x="250" y="226.9" width="194.4" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="452.4" y="245.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$100</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Saskatchewan</text>
<rect x="250" y="273.5" width="116.7" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="374.7" y="292.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$60</text>
<text x="240" y="338.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Alberta (gov&#x27;t fee)</text>
<rect x="250" y="320.2" width="77.8" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="335.8" y="338.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$40 + service fee</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Provincial and City of Toronto fee pages. As of 1 Oct 2026.</text>
