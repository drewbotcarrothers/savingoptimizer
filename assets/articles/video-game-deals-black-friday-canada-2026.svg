<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Console prices in Canada, 2026</title>
<desc id="d">Horizontal bars of Canadian list prices. PS5 $649.99 before, $819.99 after. PS5 Digital $579.99 before, $749.99 after. Switch 2 $629.99 before, $679.99 after.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Console prices in Canada, 2026</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Before and after the 2026 increases</text>
<text x="240" y="105.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">PS5, before</text>
<rect x="250" y="86.9" width="277.4" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="535.4" y="105.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$649.99</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">PS5, now</text>
<rect x="250" y="133.5" width="350.0" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$819.99</text>
<text x="240" y="198.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">PS5 Digital, before</text>
<rect x="250" y="180.2" width="247.6" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="505.6" y="198.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$579.99</text>
<text x="240" y="245.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">PS5 Digital, now</text>
<rect x="250" y="226.9" width="320.1" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="578.1" y="245.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$749.99</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Switch 2, before</text>
<rect x="250" y="273.5" width="268.9" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="526.9" y="292.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$629.99</text>
<text x="240" y="338.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Switch 2, now</text>
<rect x="250" y="320.2" width="290.2" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="548.2" y="338.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$679.99</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Sony via MobileSyrup (27 Mar 2026); Nintendo of Canada. As of 1 Oct 2026.</text>
</svg>
