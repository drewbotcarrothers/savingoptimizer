<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Internet complaint path in Canada</title>
  <desc id="desc">Three steps: resolve with the provider, then the CCTS, then a CRTC Part 1 only for a general interpretation. Not a shortcut to skip the provider.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Where a bill fight actually goes</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Internet Code administration. Drafted 21 Sep 2026. Not legal advice.</text>
  <rect x="24" y="84" width="200" height="150" rx="12" fill="#0F7A4B"/>
  <text x="124" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">1. Your ISP</text>
  <text x="124" y="158" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Write the fee, the</text>
  <text x="124" y="176" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">contract clause, and</text>
  <text x="124" y="194" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">what you want changed.</text>
  <rect x="250" y="84" width="210" height="150" rx="12" fill="#E7F4EE"/>
  <text x="355" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">2. CCTS</text>
  <text x="355" y="158" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1-888-221-1687</text>
  <text x="355" y="176" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">After a real attempt</text>
  <text x="355" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">with the provider.</text>
  <rect x="486" y="84" width="210" height="150" rx="12" fill="#F3F4F6"/>
  <text x="591" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3. CRTC</text>
  <text x="591" y="152" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Not your appeal desk.</text>
  <text x="591" y="174" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Part 1 applications</text>
  <text x="591" y="192" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">are for interpretation.</text>
  <text x="24" y="270" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CCTS decisions on a specific complaint are not appealed to the CRTC.</text>
  <text x="24" y="298" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Code list: Bell, Cogeco, Eastlink, Northwestel, Rogers, SaskTel, TELUS, Videotron, Xplore.</text>
  <text x="24" y="330" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">90-day mid-term promo notice: CRTC 2026-67, enforce 13 Apr 2027. Contract end-dates are already required.</text>
  <text x="24" y="354" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Activation and no-visit change fees: generally prohibited from 12 Jun 2026 (CRTC 2026-43).</text>
  <text x="24" y="378" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Home internet fixed-term ETFs can still be charged if the contract discloses them.</text>
  <text x="24" y="402" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">TTY 1-844-713-3010. Mail: P.O. Box 56067, Minto Place RO, Ottawa ON K1R 7Z1.</text>
</svg>
