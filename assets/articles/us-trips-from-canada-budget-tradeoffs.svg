<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">A 120 US dollar hotel night in Canadian dollars</title>
  <desc id="desc">At the Bank of Canada daily average on 23 September 2026, 1 US dollar was 1.4096 Canadian dollars. A 120 US dollar room is 169.15 Canadian dollars before local tax. A 2.5 percent card markup illustration makes it 173.38 Canadian dollars. Treating the sticker as 120 Canadian dollars understates the night.</desc>
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">$120 USD is not $120 CAD</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Bank of Canada 23 Sep 2026: 1 USD = 1.4096 CAD. Local US tax still extra.</text>
  <line x1="80" y1="300" x2="660" y2="300" stroke="#E5E7EB"/>
  <rect x="130" y="176" width="100" height="124" fill="#9CA3AF"/>
  <rect x="310" y="125" width="100" height="175" fill="#0F7A4B"/>
  <rect x="490" y="120" width="100" height="180" fill="#0F7A4B"/>
  <text x="152" y="166" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$120</text>
  <text x="322" y="116" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">$169</text>
  <text x="502" y="110" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">$173</text>
  <text x="116" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">If you pretend</text>
  <text x="124" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">it is CAD</text>
  <text x="312" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F7A4B">Mid-market</text>
  <text x="318" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F7A4B">$169.15</text>
  <text x="492" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F7A4B">Plus 2.5%</text>
  <text x="500" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F7A4B">$173.38</text>
  <text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">The gray bar is the mistake. The green bars are the same room before US sales tax.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">2.5 percent is an illustration, not your card. Replace 1.4096 on the day you pay.</text>
  <text x="24" y="424" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Bank of Canada daily average, 23 Sep 2026. Indicative rate only.</text>
</svg>
