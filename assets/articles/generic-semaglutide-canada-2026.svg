  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Dates from Health Canada and the Sandoz release. Checked 26 Sep 2026.</text>
  <line x1="48" y1="210" x2="680" y2="210" stroke="#E5E7EB" stroke-width="2"/>
