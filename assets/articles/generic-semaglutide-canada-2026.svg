  <text x="152" y="138" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Dr. Reddy's</text>
  <text x="152" y="154" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Ozempic generic</text>
  <text x="152" y="170" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">type 2 diabetes</text>
  <text x="200" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1 May</text>
  <text x="200" y="298" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Apo-Semaglutide</text>
  <text x="200" y="314" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">type 2 diabetes</text>
  <text x="363" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">29 Jun</text>
