  <text x="450" y="232" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Aug</text>
  <text x="640" y="232" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Sep</text>
  <circle cx="152" cy="210" r="8" fill="#0F7A4B"/>
  <circle cx="162" cy="210" r="8" fill="#0F7A4B"/>
  <circle cx="363" cy="210" r="8" fill="#0F7A4B"/>
  <circle cx="639" cy="210" r="8" fill="#0F7A4B"/>
