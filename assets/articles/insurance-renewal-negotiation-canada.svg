<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Forty-five day renewal negotiation sequence</title>
  <desc id="desc">A labelled sequence from a written market request 45 days out, through a same-limit retention offer, to a decision to renew, switch, or split the policies.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Negotiate on the same limits, in writing</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Household cadence. Not a statute. Rules read 24 Sep 2026.</text>
  <rect x="24" y="84" width="155" height="118" rx="8" fill="#0F7A4B"/>
  <text x="36" y="116" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Day 45</text>
  <text x="36" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Written request:</text>
  <text x="36" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">broker markets</text>
  <text x="36" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">and one direct</text>
  <rect x="196" y="84" width="155" height="118" rx="8" fill="#0F7A4B"/>
  <text x="208" y="116" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Day 30</text>
  <text x="208" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Quotes back on</text>
  <text x="208" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">your deductible</text>
  <text x="208" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">and endorsement sheet</text>
  <rect x="368" y="84" width="155" height="118" rx="8" fill="#1A1A1A"/>
  <text x="380" y="116" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Retention</text>
  <text x="380" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Incumbent answers</text>
  <text x="380" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">on the same</text>
  <text x="380" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">limits, or declines</text>
  <rect x="540" y="84" width="156" height="118" rx="8" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="552" y="116" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">Decide</text>
  <text x="552" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Renew, switch,</text>
  <text x="552" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">or split auto</text>
  <text x="552" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">from property</text>
  <text x="24" y="240" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">A cheaper quote that deleted a limit is not a competing market</text>
  <rect x="24" y="260" width="672" height="44" rx="6" fill="#F4F7F5"/>
  <text x="36" y="286" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Reject any offer that wins by cutting sewer backup, flood, liability, or collision.</text>
  <text x="24" y="340" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Ontario auto brokers must give the names of their auto markets and the quotes they obtained</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">(Insurance Act s. 230). Property shopping uses the same written habit. FSRA does not</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">require an insurer to match a competitor.</text>
  <text x="24" y="406" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Illustration of a cadence. Your renewal date and panel will differ.</text>
</svg>
