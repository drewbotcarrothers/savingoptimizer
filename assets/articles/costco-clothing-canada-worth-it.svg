<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: cost per wear of singles versus a six-pair package</title>
  <desc>Example with made-up inputs, not Costco prices. A single pair at $6 worn 40 times is 15 cents a wear. Six pairs at $18 are $3 a pair, and at 40 wears that is 7.5 cents a wear.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Example cost per wear</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Example with made-up inputs. Not a warehouse price and not a Kirkland test.</text>
  <text x="24" y="130" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Single, $6, 40 wears</text>
  <rect x="240" y="110" width="400" height="28" fill="#6B7280"/>
  <text x="256" y="129" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">15 cents</text>
  <text x="24" y="190" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Six pairs, $18, 40 wears</text>
  <rect x="240" y="170" width="200" height="28" fill="#0F7A4B"/>
  <text x="256" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">7.5 cents</text>
  <text x="24" y="250" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">$6 divided by 40 is $0.15. $18 divided by 6 is $3. $3 divided by 40 is $0.075.</text>
  <text x="24" y="274" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Membership rules were checked. These dollars are made up.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer, 29 Sep 2026. Conditions dated 1 Aug 2026. </text>
</svg>
