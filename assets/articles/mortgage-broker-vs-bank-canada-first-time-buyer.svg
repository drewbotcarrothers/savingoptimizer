<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Mortgage broker versus bank versus credit union for a Canadian first-time buyer</title>
  <desc id="desc">Three written offers scored on rate, fees, cashback, and prepayment privileges. Brokers typically shop a panel and are paid by the lender on prime files. Banks sell one institution. Credit unions can look different from OSFI rules.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">One channel is not the market</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Score three written offers. Verbal “we’ll match” is not a document. Education, not a channel ranking.</text>
  <rect x="40" y="90" width="200" height="150" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="140" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Broker</text>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Shops a lender panel</text>
  <text x="140" y="172" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Usually lender-paid on prime</text>
  <text x="140" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ask for written pay disclosure</text>
  <text x="140" y="216" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Panel may miss a bank special</text>
  <rect x="260" y="90" width="200" height="150" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Bank / advisor</text>
  <text x="360" y="150" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">One institution’s book</text>
  <text x="360" y="172" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Salary + incentives</text>
  <text x="360" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Package / existing-client rates</text>
  <text x="360" y="216" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Cannot show a rival’s price</text>
  <rect x="480" y="90" width="200" height="150" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="580" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Credit union</text>
  <text x="580" y="150" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Member-owned book</text>
  <text x="580" y="172" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">May sit outside OSFI MQR</text>
  <text x="580" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Get the rule in writing</text>
  <text x="580" y="216" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Membership / holdco rules</text>
  <text x="24" y="278" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fair compare: rate + cashback + fees + prepayments + port / penalty</text>
  <text x="24" y="306" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Bank of Canada research (2023): typical broker origination compensation cited at 0.5%–1.2% of the loan, paid by the lender.</text>
  <text x="24" y="354" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A “too good” verbal rate that expires before your offer is not an offer. Private-lending borrower fees are a different file.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Not brokerage advice. Confirm FSRA / provincial licensing and written compensation disclosure on your file.</text>
</svg>
