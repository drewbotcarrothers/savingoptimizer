<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Labelled Adobe early termination example</title>
  <desc id="desc">If an annual plan billed monthly shows 60 dollars and eight months remain, the remaining balance is 480 dollars. Adobe 50 percent fee on that illustration is 240 dollars.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Half of what is left on an annual plan</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled example. $60 is not a Canadian list price. Terms page updated 17 Apr 2026.</text>
  <rect x="130" y="100" width="160" height="200" rx="6" fill="#1A1A1A"/>
  <text x="166" y="90" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$480</text>
  <text x="150" y="324" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Remaining</text>
  <text x="154" y="342" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">8 x $60</text>
  <rect x="430" y="200" width="160" height="100" rx="6" fill="#0F7A4B"/>
  <text x="474" y="190" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$240</text>
  <text x="468" y="324" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">50 percent</text>
  <text x="478" y="342" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">fee example</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Read the fee on your confirmation screen. Month-to-month has no annual remainder.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Free storage after cancel is 5 GB. Export first. 24 Sep 2026.</text>
</svg>
