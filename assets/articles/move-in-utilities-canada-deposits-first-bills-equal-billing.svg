<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: Ontario deposit on a $120 average bill</title>
<desc id="d">Bars compare a $120 average monthly bill, the $300 maximum deposit, and $50 a month if paid over 6 months.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: Ontario deposit on a $120 average bill</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Dollars</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Average monthly bill</text>
<rect x="250" y="104.7" width="140.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="398.0" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$120</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Maximum deposit (2.5x)</text>
<rect x="250" y="198.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$300</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Deposit over 6 months</text>
<rect x="250" y="291.3" width="58.3" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="316.3" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$50/mo</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
</svg>
