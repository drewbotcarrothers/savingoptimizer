  <text x="254" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">47 × $3.30</text>
  <rect x="328" y="248" width="100" height="52" rx="6" fill="#4B9B74"/>
