<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Fair Pass vs adult PRESTO — same 47-trip month</title>
  <desc id="desc">Fair Pass monthly passes ended 31 Aug 2026. Stay on the $2.10 PRESTO fare and let capping work. A credit-card tap charges adult $3.30 and wastes the discount.</desc>
