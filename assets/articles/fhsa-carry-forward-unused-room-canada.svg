<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">FHSA carry-forward</title>
  <desc id="desc">Eight thousand annual room, forty thousand lifetime, up to eight thousand carry-forward into the next year.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">FHSA room is not a forever pile</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">CRA figures used 22 Sep 2026. Verify live limits.</text>
  <rect x="24" y="78" width="210" height="190" rx="12" fill="#E7F4EE"/>
  <text x="36" y="110" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Annual</text>
  <text x="36" y="140" font-size="28" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$8,000</text>
  <text x="36" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">After the account</text>
  <text x="36" y="190" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">is open.</text>
  <rect x="250" y="78" width="210" height="190" rx="12" fill="#E7F4EE"/>
  <text x="262" y="110" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Carry-forward</text>
  <text x="262" y="140" font-size="28" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+$8,000</text>
  <text x="262" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Into the next year</text>
  <text x="262" y="190" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">— not endless years.</text>
  <rect x="476" y="78" width="220" height="190" rx="12" fill="#F3F4F6"/>
  <text x="488" y="110" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Lifetime</text>
  <text x="488" y="140" font-size="28" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$40,000</text>
  <text x="488" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Hard cap across</text>
  <text x="488" y="190" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">all FHSA activity.</text>
  <text x="24" y="310" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Participation-period timing still runs while room sits unused.</text>
  <text x="24" y="332" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Pair catch-up with payroll PADs. Do not revolving-card the deduction.</text>
  <text x="24" y="354" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not tax advice.</text>
</svg>
