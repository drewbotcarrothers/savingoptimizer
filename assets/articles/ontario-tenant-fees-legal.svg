<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" role="img" aria-labelledby="title desc">
  <title id="title">Ontario tenant fees: last-month rent vs common illegal add-ons</title>
  <desc id="desc">High-level RTA sketch: last-month rent deposit is the usual security deposit. Damage deposits, holding fees, and most application fees are not. Interest on last-month rent tracks the 2026 2.1% guideline.</desc>
  <rect width="720" height="472" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Ontario fee cheat sheet (high-level, not legal advice)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">RTA / LTB framing, 16 Sep 2026. 2026 guideline 2.1% also sets last-month-rent interest (ontario.ca rent </tspan><tspan x="24" dy="17.6">increases).</tspan></text>
  <rect x="24" y="80" width="328" height="230" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="40" y="112" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Usually allowed</text>
  <text x="40" y="144" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" Last-month rent deposit (not damage)</text>
  <text x="40" y="172" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" Rent itself, once lawful</text>
  <text x="40" y="200" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" Key deposit only at replacement cost</text>
  <text x="40" y="228" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">  (prescribed rules — verify amount)</text>
  <text x="40" y="256" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" Interest on LMR at guideline %</text>
  <text x="40" y="284" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" NSF fees only if prescribed</text>
  <rect x="368" y="80" width="328" height="230" rx="12" fill="#F3F4F6" transform="translate(0,17.6)"/>
  <text x="384" y="112" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Treat as a red flag</text>
  <text x="384" y="144" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" Damage / pet / cleaning deposits</text>
  <text x="384" y="172" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" Holding or "to take it off the market"</text>
  <text x="384" y="200" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" Application / credit-check markups</text>
  <text x="384" y="228" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" First-and-last plus extra month</text>
  <text x="384" y="256" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" Key money or furniture buy-in</text>
  <text x="384" y="284" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">" Deposit before you have seen it</text>
  <text x="24" y="348" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">Worked interest: $2,200 last-month deposit × 2.1% = $46.20 for a 2026 interest year. Recovering $1,800 </tspan><tspan x="24" dy="17.6">illegal "damage" beats a $400 move if you can stay.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Educational only. Disputes go to the Landlord and Tenant Board or a licensed advisor. Form T1 is the usual money-back </tspan><tspan x="24" dy="16.2">path — confirm current LTB rules.</tspan></text>
</svg>
