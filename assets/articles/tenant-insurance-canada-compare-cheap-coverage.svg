<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian tenant insurance: typical monthly premium vs going bare</title>
  <desc id="desc">A labelled national average tenant premium of $21.74 per month versus the cash a renter is on the hook for if a leak, fire, or stolen laptop is uninsured. Landlord liability minimums are often $1 million or $2 million.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Tenant insurance is a lease line, not a luxury add-on</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">APOLLO issued-policy average $21.74/month (Jul 2025–Jun 2026, excl. Québec &amp; Yukon). Not your quote.</text>
  <rect x="48" y="210" width="88" height="70" fill="#4B9B74"/>
  <text x="92" y="198" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$21.74</text>
  <text x="92" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Avg/mo</text>
  <rect x="168" y="168" width="88" height="112" fill="#0F7A4B"/>
  <text x="212" y="156" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$261</text>
  <text x="212" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Avg/year</text>
  <rect x="288" y="96" width="88" height="184" fill="#0F7A4B"/>
  <text x="332" y="84" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$2,000+</text>
  <text x="332" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Laptop + bike</text>
  <text x="420" y="120" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Shop the policy, not the banner</text>
  <text x="420" y="148" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Liability $1M or $2M as the lease says</text>
  <text x="420" y="172" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Contents at replacement, not a guess</text>
  <text x="420" y="196" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Deductible you can actually pay</text>
  <text x="420" y="220" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Proof of insurance PDF for the landlord</text>
  <text x="420" y="252" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A leak into the unit below is the</text>
  <text x="420" y="276" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">claim that dwarfs a $261 premium</text>
  <text x="24" y="354" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Going bare saves the premium until a claim. Landlord clauses can still treat no policy as a lease breach. Education only.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Not a quote. Confirm wording with a licensed intermediary. Saving Optimizer does not sell insurance.</text>
</svg>
