<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: yearly game spending</title>
<desc id="d">Horizontal bars for a made-up player: buying five games at release $300; buying in sales $140 (Winter $70, Spring $25, Summer $45).</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: yearly game spending</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Five games at release vs in seasonal sales</text>
<text x="240" y="110.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">At release, total</text>
<rect x="250" y="88.6" width="350.0" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="110.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$300</text>
<text x="240" y="166.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">In sales, total</text>
<rect x="250" y="144.6" width="163.3" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="421.3" y="166.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$140</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Winter Sale</text>
<rect x="250" y="200.6" width="81.7" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="339.7" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$70</text>
<text x="240" y="278.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Summer Sale</text>
<rect x="250" y="256.6" width="52.5" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="310.5" y="278.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$45</text>
<text x="240" y="334.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Spring Sale</text>
<rect x="250" y="312.6" width="29.2" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="287.2" y="334.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$25</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
