<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
 <title id="title">Weekend rental vs car-share by kilometres - labelled Toronto sketches</title>
 <desc id="desc">Grouped bars for an 8-hour 40 km trip, a 36-hour 90 km weekend, and a 48-hour 480 km highway loop comparing Zipcar, Communauto Value Extra, and an all-in traditional rental.</desc>
 <rect width="720" height="420" fill="#FFFFFF"/>
 <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Toronto weekend sketches: hours and kilometres decide</text>
 <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Communauto Value Extra (15 Jun 2026 schedule) vs Zipcar compact (2026 public copy) vs a labelled all-in city rental with desk LDW. Not a quote.</text>
 <line x1="70" y1="80" x2="70" y2="310" stroke="#E5E7EB"/>
 <line x1="70" y1="310" x2="690" y2="310" stroke="#E5E7EB"/>
 <text x="62" y="314" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
 <text x="62" y="249" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$80</text>
 <text x="62" y="184" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$160</text>
 <text x="62" y="119" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$240</text>
 <!-- scale $240 = 230px -->
 <!-- 40km: Zipcar 78=75, CA 45=43, rental 140=134 -->
 <rect x="110" y="235" width="36" height="75" rx="4" fill="#4B9B74"/>
 <rect x="152" y="267" width="36" height="43" rx="4" fill="#0F7A4B"/>
 <rect x="194" y="176" width="36" height="134" rx="4" fill="#9CA3AF"/>
 <text x="170" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">8 h / 40 km</text>
 <!-- 90km: Z 156=150, CA 92=88, R 190=182 -->
 <rect x="300" y="160" width="36" height="150" rx="4" fill="#4B9B74"/>
 <rect x="342" y="222" width="36" height="88" rx="4" fill="#0F7A4B"/>
 <rect x="384" y="128" width="36" height="182" rx="4" fill="#9CA3AF"/>
 <text x="360" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">36 h / 90 km</text>
 <!-- 480km: Z 196=188, CA 224=215, R 170=163 (unlimited, card CDW) -->
 <rect x="490" y="122" width="36" height="188" rx="4" fill="#4B9B74"/>
 <rect x="532" y="95" width="36" height="215" rx="4" fill="#0F7A4B"/>
 <rect x="574" y="147" width="36" height="163" rx="4" fill="#9CA3AF"/>
 <text x="550" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">48 h / 480 km</text>
 <rect x="70" y="358" width="14" height="14" rx="3" fill="#4B9B74"/>
 <text x="90" y="370" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Zipcar compact</text>
 <rect x="230" y="358" width="14" height="14" rx="3" fill="#0F7A4B"/>
 <text x="250" y="370" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Communauto Value Extra</text>
 <rect x="460" y="358" width="14" height="14" rx="3" fill="#9CA3AF"/>
 <text x="480" y="370" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rental all-in (LDW on short trips; card CDW on 480 km)</text>
 <text x="24" y="400" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Scale: $1 H 0.96 px. Confirm live schedules. 20 Sep 2026.</text>
</svg>
