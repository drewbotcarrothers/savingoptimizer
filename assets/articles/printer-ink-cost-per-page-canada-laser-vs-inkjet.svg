<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: black cost per page</title>
<desc id="d">Horizontal bars for made-up cost per page: standard cartridge 15 cents, high-yield 9 cents, laser toner 3 cents, ink tank 2 cents.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: black cost per page</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Price divided by rated page yield, in cents</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Standard cartridge</text>
<rect x="250" y="93.0" width="350.0" height="40.0" rx="3" fill="#6B7280"/>
<text x="608.0" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">15¢</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">High-yield cartridge</text>
<rect x="250" y="163.0" width="210.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="468.0" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">9¢</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Laser toner</text>
<rect x="250" y="233.0" width="70.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="328.0" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">3¢</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Ink tank bottle</text>
<rect x="250" y="303.0" width="46.7" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="304.7" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">2¢</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
