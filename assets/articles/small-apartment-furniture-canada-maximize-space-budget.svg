<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Budget furniture stacks for a Canadian studio and one-bedroom</title>
  <desc id="desc">Labelled 2026 buying stacks. A studio kit of sleeper sofa, table, vertical storage, and lighting at $1,450 used or $2,800 new. A one-bedroom kit at $2,100 used or $4,200 new. Delivery and assembly can erase a $200 Marketplace win.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Furnish the floor plan, not the showroom</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled Canadian 2026 stacks. Elevator and doorway constraints first. Delivery + assembly often $80-$250 per large piece.</text>
  <rect x="70" y="150" width="120" height="130" fill="#0F7A4B"/>
  <text x="130" y="138" text-anchor="middle" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$1,450</text>
  <text x="130" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Studio used</text>
  <rect x="220" y="88" width="120" height="192" fill="#4B9B74"/>
  <text x="280" y="76" text-anchor="middle" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$2,800</text>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Studio new</text>
  <rect x="390" y="128" width="120" height="152" fill="#1A1A1A"/>
  <text x="450" y="116" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$2,100</text>
  <text x="450" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1-bed used</text>
  <rect x="540" y="48" width="120" height="232" fill="#6B7280"/>
  <text x="600" y="36" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$4,200</text>
  <text x="600" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1-bed new</text>
  <text x="24" y="348" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Pay for a sofa-bed, a real table, and vertical storage. Skip matching 7-piece sets on a 12-month lease. Measure the freight elevator.</text>
  <text x="24" y="372" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A $90 delivery that needs a $150 assembly kit and a $40 parking ticket is how a Marketplace dresser loses to a used store with a freight door.</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Furniture outlets and marketplace deals are offer types only. Buy pieces that resell. Not a product ranking.</text>
</svg>
