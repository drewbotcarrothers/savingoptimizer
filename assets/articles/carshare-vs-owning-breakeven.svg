<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Car-share vs owning: labelled Toronto monthly cost by days driven</title>
  <desc id="desc">Line-style bar comparison of Zipcar daily rates plus membership, Communauto Value Extra daily max plus membership, and Ratehub average ownership of $1,373 per month.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Toronto labelled example: days per month vs a financed car</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Zipcar ~$78/day + $9 membership (Apr 2026 public Toronto compact). Communauto Value Extra max $26.50/day + $30 (fee schedule 15 Jun 2026). Ratehub average ownership $1,373 (Apr 2026).</text>
  <line x1="80" y1="88" x2="80" y2="300" stroke="#E5E7EB"/>
  <line x1="80" y1="300" x2="680" y2="300" stroke="#E5E7EB"/>
  <text x="72" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="72" y="247" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$500</text>
  <text x="72" y="190" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1,000</text>
  <text x="72" y="133" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1,500</text>
  <!-- scale $1500=212px -->
  <!-- 2 days Zipcar 165: 23px -->
  <rect x="100" y="277" width="36" height="23" rx="4" fill="#4B9B74"/>
  <rect x="140" y="288" width="36" height="12" rx="4" fill="#0F7A4B"/>
  <rect x="180" y="106" width="36" height="194" rx="4" fill="#9CA3AF"/>
  <text x="158" y="318" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2 days</text>
  <!-- 4 days Zipcar 321: 45; CA 136: 19 -->
  <rect x="250" y="255" width="36" height="45" rx="4" fill="#4B9B74"/>
  <rect x="290" y="281" width="36" height="19" rx="4" fill="#0F7A4B"/>
  <rect x="330" y="106" width="36" height="194" rx="4" fill="#9CA3AF"/>
  <text x="308" y="318" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4 days</text>
  <!-- 8 days Zipcar 633: 89; CA 242: 34 -->
  <rect x="400" y="211" width="36" height="89" rx="4" fill="#4B9B74"/>
  <rect x="440" y="266" width="36" height="34" rx="4" fill="#0F7A4B"/>
  <rect x="480" y="106" width="36" height="194" rx="4" fill="#9CA3AF"/>
  <text x="458" y="318" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">8 days</text>
  <!-- 16 days Zipcar 1257: 178; CA 454: 64 -->
  <rect x="550" y="122" width="36" height="178" rx="4" fill="#4B9B74"/>
  <rect x="590" y="236" width="36" height="64" rx="4" fill="#0F7A4B"/>
  <rect x="630" y="106" width="36" height="194" rx="4" fill="#9CA3AF"/>
  <text x="608" y="318" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">16 days</text>
  <rect x="100" y="348" width="14" height="14" rx="3" fill="#4B9B74"/>
  <text x="120" y="360" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Zipcar compact (labelled)</text>
  <rect x="280" y="348" width="14" height="14" rx="3" fill="#0F7A4B"/>
  <text x="300" y="360" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Communauto Value Extra</text>
  <rect x="490" y="348" width="14" height="14" rx="3" fill="#9CA3AF"/>
  <text x="510" y="360" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ratehub avg ownership</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Taxes extra on Communauto. A paid-off car without a $522 principal is a different worksheet  see the ownership TCO guide. Confirm live rates before you drop a stall.</text>
</svg>
