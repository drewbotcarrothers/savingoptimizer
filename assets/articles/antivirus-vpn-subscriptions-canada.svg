<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Labelled VPN intro price versus renewal</title>
  <desc id="desc">A labelled first year at 40 dollars and a sticker renewal at 120 dollars.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The intro year is not the renewal</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled illustration. Not a VPN company's rate card.</text>
  <rect x="120" y="220" width="150" height="80" rx="6" fill="#0F7A4B"/>
  <text x="195.0" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$40</text>
  <text x="195.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">First year</text>
  <text x="195.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">intro price</text>
  <rect x="420" y="80" width="150" height="220" rx="6" fill="#1A1A1A"/>
  <text x="495.0" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$120</text>
  <text x="495.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Renewal</text>
  <text x="495.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">sticker rate</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Read the renewal sentence 30 days early.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Cancel if you cannot name the last connection. 25 Sep 2026.</text>
</svg>
