<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: cost per wear</title>
<desc id="d">Bars compare 30 cents a wear for durable jeans with $1 for stretch jeans.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: cost per wear</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Two pairs of jeans</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Durable, 300 wears</text>
<rect x="250" y="128.0" width="105.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="363.0" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$0.30</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Stretch, 40 wears</text>
<rect x="250" y="268.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="292.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$1.00</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
</svg>
