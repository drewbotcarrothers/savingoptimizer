<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: cumulative cost of monthly nail trims versus a one-time tool</title>
  <desc>Example with made-up inputs, not real prices; the reader should plug in their own quotes. Line chart. Grey line is an illustrative 20 dollars a visit once a month, reaching 240 dollars at month 12. Green line is an illustrative 30 dollar tool that stays at 30 dollars. Not a price opened on a groomer or clinic page. Frequency note uses VCA Canada’s approximately once a month. 27 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example year: $20 a trim versus a $30 tool</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up prices ($20 a trim, $30 tool), monthly per VCA. Plug in your quotes.</text>
  <line x1="80" y1="80" x2="640" y2="80" stroke="#E5E7EB"/>
  <line x1="80" y1="176" x2="640" y2="176" stroke="#E5E7EB"/>
  <line x1="80" y1="272" x2="640" y2="272" stroke="#E5E7EB"/>
  <line x1="80" y1="320" x2="640" y2="320" stroke="#E5E7EB"/>
  <text x="24" y="84" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$250</text>
  <text x="24" y="180" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$150</text>
  <text x="24" y="276" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$50</text>
  <text x="36" y="324" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$0</text>
  <polyline fill="none" stroke="#6B7280" stroke-width="2.5" points="80.0,320.0 220.0,262.4 360.0,204.8 500.0,147.2 640.0,89.6"/>
  <polyline fill="none" stroke="#0F7A4B" stroke-width="2.5" points="80.0,291.2 220.0,291.2 360.0,291.2 500.0,291.2 640.0,291.2"/>
  <circle cx="80.0" cy="320.0" r="4" fill="#6B7280"/>
  <circle cx="80.0" cy="291.2" r="4" fill="#0F7A4B"/>
  <text x="80.0" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">0</text>
  <circle cx="220.0" cy="262.4" r="4" fill="#6B7280"/>
  <circle cx="220.0" cy="291.2" r="4" fill="#0F7A4B"/>
  <text x="220.0" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">3</text>
  <circle cx="360.0" cy="204.8" r="4" fill="#6B7280"/>
  <circle cx="360.0" cy="291.2" r="4" fill="#0F7A4B"/>
  <text x="360.0" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">6</text>
  <circle cx="500.0" cy="147.2" r="4" fill="#6B7280"/>
  <circle cx="500.0" cy="291.2" r="4" fill="#0F7A4B"/>
  <text x="500.0" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">9</text>
  <circle cx="640.0" cy="89.6" r="4" fill="#6B7280"/>
  <circle cx="640.0" cy="291.2" r="4" fill="#0F7A4B"/>
  <text x="640.0" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">12</text>
  <rect x="24" y="364" width="12" height="12" fill="#6B7280"/>
  <text x="42" y="375" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Paid: $20 times the month number. Month 12 is $240.</text>
  <rect x="400" y="364" width="12" height="12" fill="#0F7A4B"/>
  <text x="418" y="375" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">DIY tool: $30, once.</text>
  <text x="24" y="404" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">In this example the tool costs less than two paid visits ($40). Replace the dollars with a quote. 27 Sep 2026.</text>
</svg>
