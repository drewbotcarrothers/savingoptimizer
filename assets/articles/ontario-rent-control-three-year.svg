<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Three renewals: guideline 2.1% vs two exempt paths</title>
  <desc id="desc">Starting rent $2,400. 2026 guideline 2.1% (ontario.ca, reviewed 16 Sep 2026).</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Three renewals: guideline 2.1% vs two exempt paths</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Starting rent $2,400. 2026 guideline 2.1% (ontario.ca, reviewed 16 Sep 2026).</text>
  <line x1="80" y1="310.0" x2="680" y2="310.0" stroke="#E5E7EB"/><text x="72" y="314.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text><line x1="80" y1="255.0" x2="680" y2="255.0" stroke="#E5E7EB"/><text x="72" y="259.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$800</text><line x1="80" y1="200.0" x2="680" y2="200.0" stroke="#E5E7EB"/><text x="72" y="204.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1.6k</text><line x1="80" y1="145.0" x2="680" y2="145.0" stroke="#E5E7EB"/><text x="72" y="149.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$2.4k</text><line x1="80" y1="90.0" x2="680" y2="90.0" stroke="#E5E7EB"/><text x="72" y="94.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$3.2k</text>
  <rect x="108.0" y="134.3" width="162.7" height="175.7" rx="8" fill="#0F7A4B"/><text x="189.3" y="124.3" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$2,555</text><text x="189.3" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Guideline</text><text x="189.3" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">2.1% × 3 years</text><rect x="298.7" y="119.0" width="162.7" height="191.0" rx="8" fill="#4B9B74"/><text x="380.0" y="109.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">$2,778</text><text x="380.0" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Exempt 5%</text><text x="380.0" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">asked, not a cap</text><rect x="489.3" y="102.2" width="162.7" height="207.8" rx="8" fill="#9CA3AF"/><text x="570.7" y="92.2" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$3,023</text><text x="570.7" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Exempt 8%</text><text x="570.7" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">asked, not a cap</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Exempt buildings have no guideline ceiling. The 8% path is a scenario, not a legal maximum. Compounding is why occupancy date matters.</text>
</svg>
