<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: four parcels</title>
<desc id="d">Horizontal bars for a made-up shipping plan. Four parcels sent 18 December by express cost $118. Sent 5 December by regular service they cost $62.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: four parcels</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Shipped late by express versus early by regular service</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Ship 18 Dec, express</text>
<rect x="250" y="128.0" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$118</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Ship 5 Dec, regular</text>
<rect x="250" y="268.0" width="183.9" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="441.9" y="292.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$62</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
