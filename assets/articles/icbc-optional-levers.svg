<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">B.C. levers inside ICBC — not Ontario shopping</title>
  <desc id="desc">ICBC Basic distance discount: 10% if under 5,000 km/year. Optional distance discount 10–15% under 15,000 km on annual policies (renewals from 1 Jun 2025). Confirm icbc.com.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">B.C. levers inside ICBC — not Ontario shopping</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Basic Autoplan is public. Optional Collision, Comprehensive, and extended liability are the shop. Distance discounts need odometer proof.</text>
  <line x1="64" y1="88" x2="64" y2="300" stroke="#E5E7EB"/>
  <line x1="64" y1="300" x2="696" y2="300" stroke="#E5E7EB"/>
