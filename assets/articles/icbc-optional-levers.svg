  <text x="130" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Basic <5k km</text>
  <text x="130" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">10% Basic</text>
  <rect x="204" y="170" width="100" height="130" rx="6" fill="#4B9B74"/>
  <text x="254" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">10–15%</text>
  <text x="254" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Optional <15k</text>
  <text x="254" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">10–15%</text>
  <rect x="328" y="220" width="100" height="80" rx="6" fill="#9CA3AF"/>
  <text x="378" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">maybe</text>
  <text x="378" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Skip collision</text>
  <text x="378" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">cheap beater</text>
  <rect x="452" y="130" width="100" height="170" rx="6" fill="#9CA3AF"/>
  <text x="502" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">costs</text>
  <text x="502" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Over-insure</text>
  <text x="502" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">unused add-ons</text>
  <text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">ICBC Basic distance discount: 10% if under 5,000 km/year. Optional distance discount 10–15% under 15,000 km on annual policies (renewals from 1 Jun 2025). Confirm icbc.com.</text>
