<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Flow chart for safety boots, from hazard to payroll</title>
  <desc>Start with the job hazard, then the required marking, then whether the employer provides the boots, reimburses them, or pays an allowance. Keep receipts and ask payroll how the CRA page applies. No dollar figures.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Hazard, marking, then who pays</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">No prices. Not tax or legal advice. Check your province.</text>
  <rect x="40" y="64" width="250" height="52" rx="4" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="52" y="86" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">What is the job hazard?</text>
  <text x="52" y="104" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Impact, puncture, electrical, chainsaw.</text>
  <rect x="400" y="64" width="280" height="52" rx="4" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="412" y="86" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Which marking does it need?</text>
  <text x="412" y="104" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Green triangle is not every job.</text>
  <line x1="290" y1="90" x2="400" y2="90" stroke="#0F7A4B" stroke-width="2"/>
  <rect x="40" y="150" width="640" height="64" rx="4" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="52" y="174" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Employer provides, reimburses, or pays an allowance?</text>
  <text x="52" y="194" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">CCOHS does not set a national rule that the employer must pay. Check your province.</text>
  <line x1="360" y1="116" x2="360" y2="150" stroke="#0F7A4B" stroke-width="2"/>
  <rect x="40" y="246" width="640" height="88" rx="4" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="52" y="270" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Keep receipts. Ask payroll how T4130 applies.</text>
  <text x="52" y="290" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Allowance: required by law on site, used to buy the clothing, amount reasonable.</text>
  <text x="52" y="310" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">T4044: an employee does not deduct special clothing they have to wear.</text>
  <line x1="360" y1="214" x2="360" y2="246" stroke="#6B7280" stroke-width="2"/>
  <text x="24" y="370" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">A wrong patch is not a discount. Fit the boot at midday, with work socks on.</text>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. As of 29 Sep 2026. Confirm with the CRA or a tax professional.</text>
</svg>
