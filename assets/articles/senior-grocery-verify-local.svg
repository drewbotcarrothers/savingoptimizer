<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Verify a Canadian senior grocery discount locally</title>
  <desc id="desc">Four-step verification card: ask the store, read the poster, test one receipt, then keep a low-effort system.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">National senior-day lists go stale. The poster wins.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">April 2026: a Lunenburg Foodland dropped its senior discount to match Sobeys regional policy. Blog tables did not get the memo.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="24" y="84" width="155" height="210" rx="12" fill="#E7F4EE" stroke="#0F7A4B"/>
    <text x="101" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B">1. Ask</text>
    <text x="101" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Customer</text>
    <text x="101" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">service, not</text>
    <text x="101" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">a 2024 list</text>
    <text x="101" y="244" text-anchor="middle" font-size="12" fill="#6B7280">Age, day,</text>
    <text x="101" y="260" text-anchor="middle" font-size="12" fill="#6B7280">exclusions</text>
    <rect x="194" y="84" width="155" height="210" rx="12" fill="#F3F4F6"/>
    <text x="271" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B">2. Photo</text>
    <text x="271" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">The till</text>
    <text x="271" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">poster or</text>
    <text x="271" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">app note</text>
    <text x="271" y="244" text-anchor="middle" font-size="12" fill="#6B7280">Date the</text>
    <text x="271" y="260" text-anchor="middle" font-size="12" fill="#6B7280">screenshot</text>
    <rect x="364" y="84" width="155" height="210" rx="12" fill="#F3F4F6"/>
    <text x="441" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B">3. Test</text>
    <text x="441" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">One modest</text>
    <text x="441" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">cart before</text>
    <text x="441" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">you plan a year</text>
    <text x="441" y="244" text-anchor="middle" font-size="12" fill="#6B7280">Keep the</text>
    <text x="441" y="260" text-anchor="middle" font-size="12" fill="#6B7280">receipt</text>
    <rect x="534" y="84" width="162" height="210" rx="12" fill="#F3F4F6"/>
    <text x="615" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B">4. System</text>
    <text x="615" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Pickup list,</text>
    <text x="615" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Flashfood if</text>
    <text x="615" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">on the route</text>
    <text x="615" y="244" text-anchor="middle" font-size="12" fill="#6B7280">Low-effort</text>
    <text x="615" y="260" text-anchor="middle" font-size="12" fill="#6B7280">beats 10% lore</text>
  </g>
  <text x="24" y="332" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">More stable side-quests: Bulk Barn Wednesday senior % and Giant Tiger first-Monday reports - still verify the store.</text>
  <text x="24" y="364" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">10% off a premium banner can lose to Food Basics or No Frills shelf prices. Run both receipts.</text>
  <text x="24" y="388" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer - Canada - 20 Sep 2026. Not a national discount calendar.</text>
</svg>
