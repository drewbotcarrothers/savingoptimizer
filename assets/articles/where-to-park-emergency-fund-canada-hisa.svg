<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Twelve-month HISA yield sketch on 10,000 dollars</title>
  <desc id="desc">Simple-interest sketch: EQ Bank 2.75 percent all year versus a 4.50 percent five-month promo then 0.30 percent. Public figures used 21 Sep 2026. Not a quote.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">$10,000 parked 12 months: teaser vs everyday</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Simple interest, tax extra. Confirm live. Drafted 21 Sep 2026.</text>
  <rect x="70" y="88" width="44" height="232" rx="6" fill="#E7F4EE"/>
  <text x="92" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$275</text>
  <text x="92" y="340" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">EQ 2.75%</text>
  <text x="92" y="356" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">with $2k DD</text>
  <rect x="190" y="147" width="44" height="173" rx="6" fill="#F3F4F6"/>
  <text x="212" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$205</text>
  <text x="212" y="340" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Tangerine</text>
  <text x="212" y="356" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">4.50% then 0.30%</text>
  <rect x="310" y="215" width="44" height="105" rx="6" fill="#F3F4F6"/>
  <text x="332" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$125</text>
  <text x="332" y="340" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">WS Core</text>
  <text x="332" y="356" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">1.25%</text>
  <rect x="430" y="84" width="44" height="236" rx="6" fill="#E7F4EE"/>
  <text x="452" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$280</text>
  <text x="452" y="340" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Oaken</text>
  <text x="452" y="356" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">2.80% everyday</text>
  <rect x="550" y="67" width="44" height="253" rx="6" fill="#E7F4EE"/>
  <text x="572" y="59" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$300</text>
  <text x="572" y="340" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Manulife</text>
  <text x="572" y="356" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">3.00% Advantage</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: EQ Bank rates 16 Sep 2026; Ratehub HISA table 21 Sep 2026; Wealthsimple chequing tiers as of 11 Jun 2026; Tangerine post-promo 0.30% from 2026 roundups (verify live).</text>
  <text x="24" y="410" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Access, CDIC category, and whether you will hop at month 6 decide the winner. Education only.</text>
</svg>
