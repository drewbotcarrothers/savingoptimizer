<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 442" role="img" aria-labelledby="title desc">
  <title id="title">Twelve-month HISA yield sketch on 10,000 dollars</title>
  <desc id="desc">Simple-interest sketch: EQ Bank 3.00 percent all year versus a 4.50 percent five-month promo then 0.30 percent. Public figures used 6 Nov 2026. Not a quote.</desc>
  <rect width="720" height="442" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">$10,000 parked 12 months: teaser vs everyday</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Simple interest, tax extra. Confirm live. As of 6 Nov 2026. Example.</text>
  <rect x="70" y="67" width="44" height="253" rx="6" fill="#E7F4EE"/>
  <text x="92" y="59" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$300</text>
  <text x="92" y="340" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">EQ 3.00%</text>
  <text x="92" y="356" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">with $2k DD</text>
  <rect x="190" y="147" width="44" height="173" rx="6" fill="#F3F4F6"/>
  <text x="212" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$205</text>
  <text x="212" y="340" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Tangerine</text>
  <text x="212" y="356" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">4.50% then 0.30%</text>
  <rect x="310" y="194" width="44" height="126" rx="6" fill="#F3F4F6"/>
  <text x="332" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$150</text>
  <text x="332" y="340" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">EQ base</text>
  <text x="332" y="356" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">1.50% no DD</text>
  <rect x="430" y="316" width="44" height="4" rx="2" fill="#F3F4F6"/>
  <text x="452" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$0</text>
  <text x="452" y="340" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Big-5 float</text>
  <text x="452" y="356" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0%–0.05%</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Gap: about <tspan font-weight="700" fill="#0F7A4B">$95</tspan> more in year one on the everyday 3.00% path vs the 4.50%→0.30% promo path (Example).</text>
  <text x="24" y="422" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Sources: EQ Bank rates page effective 6 Nov 2026; Ratehub.ca table 6 Nov 2026. Not a quote.</text>
</svg>
