<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">E-bike cumulative cost versus Canadian transit passes</title>
  <desc id="desc">Lines comparing a $2,800 e-bike plus gear and winter downtime against TTC capping, Compass 2-zone, and Opus All Modes A monthly products.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Months to beat a Canadian transit product — with winter off</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">E-bike $2,400 + $400 gear + $15/mo running. 2 winter months/year still on transit. Fares reviewed 20 Sep 2026. Not a shop quote.</text>
  <line x1="56" y1="88" x2="56" y2="310" stroke="#E5E7EB"/>
  <line x1="56" y1="310" x2="680" y2="310" stroke="#E5E7EB"/>
  <text x="48" y="314" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="48" y="248" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1.5k</text>
  <text x="48" y="186" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$3k</text>
  <text x="48" y="124" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$4.5k</text>
  <text x="56" y="328" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0</text>
  <text x="200" y="328" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">12 mo</text>
  <text x="344" y="328" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">24 mo</text>
  <text x="488" y="328" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">36 mo</text>
  <text x="632" y="328" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">48 mo</text>
  <polyline fill="none" stroke="#0F7A4B" stroke-width="3" points="56,194 200,186 344,178 488,170 632,162"/>
  <polyline fill="none" stroke="#4B9B74" stroke-width="3" points="56,310 200,248 344,186 488,124 632,88"/>
  <polyline fill="none" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 4" points="56,310 200,242 344,174 488,106 632,88"/>
  <polyline fill="none" stroke="#9CA3AF" stroke-width="3" points="56,310 200,256 344,202 488,148 632,94"/>
  <rect x="80" y="348" width="12" height="12" fill="#0F7A4B"/>
  <text x="96" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">E-bike + running</text>
  <rect x="230" y="348" width="12" height="12" fill="#4B9B74"/>
  <text x="246" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Compass 2-zone $156.70</text>
  <rect x="430" y="348" width="12" height="12" fill="#6B7280"/>
  <text x="446" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TTC cap ~$155</text>
  <rect x="580" y="348" width="12" height="12" fill="#9CA3AF"/>
  <text x="596" y="358" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Opus A $110</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Break-even vs Compass 2-zone ~20–24 months if you still buy two winter months of transit. Vs Opus A, closer to 30 months. Theft or a $600 battery resets the clock.</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">A used acoustic bike at $250 can beat both if the commute is short and flat. EVAP does not cover e-bikes. B.C. PST exemption is tax relief, not a rebate.</text>
</svg>
