<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">TTC adult monthly cost: PAYG cap vs remaining passes</title>
  <desc id="desc">Bar chart comparing adult PRESTO pay-as-you-go monthly cap of $155.10, Adult 12-Month Pass of $143, and post-secondary monthly pass of $128.15 as of September 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Adult TTC: the 47-trip cap vs remaining passes</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">TTC fares page, reviewed 16 Sep 2026. Adult PRESTO $3.30 x 47 = $155.10. Cash and PRESTO Tickets do not cap.</text>
  <line x1="80" y1="90" x2="80" y2="310" stroke="#E5E7EB"/>
  <line x1="80" y1="310" x2="680" y2="310" stroke="#E5E7EB"/>
  <text x="72" y="314" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="72" y="254" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$80</text>
  <text x="72" y="194" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$120</text>
  <text x="72" y="134" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$160</text>
  <!-- scale $160 = 220px; 155.10/160*220=213; y=310-213=97 -->
  <rect x="110" y="97" width="130" height="213" rx="8" fill="#9CA3AF"/>
  <text x="175" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$155.10</text>
  <text x="175" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">PAYG cap</text>
  <text x="175" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">47 x $3.30</text>
  <!-- 143/160*220=197; y=113 -->
  <rect x="295" y="113" width="130" height="197" rx="8" fill="#0F7A4B"/>
  <text x="360" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$143</text>
  <text x="360" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Adult 12-Month</text>
  <text x="360" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">12-month contract</text>
  <!-- 128.15/160*220=176; y=134 -->
  <rect x="480" y="134" width="130" height="176" rx="8" fill="#4B9B74"/>
  <text x="545" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$128.15</text>
  <text x="545" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Post-secondary</text>
  <text x="545" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">monthly pass</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">If you miss 47 trips, PAYG costs less than a contract. TTC still recommends the 12-Month and post-secondary passes for riders who use them every month.</text>
</svg>
