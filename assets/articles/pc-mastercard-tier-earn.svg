<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">PC Financial Mastercard grocery earn by tier</title>
  <desc id="desc">Bar chart of typical PC Optimum points per dollar at Loblaw grocery banners: Mastercard 10, World 20, World Elite 30, Insiders World Elite 40, plus the $120 Insiders fee.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">PC Mastercard grocery earn at Loblaw banners</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Points per $1, public 2026 card tables. 10,000 pts = $10 in-store (~0.1 cent). Confirm pcfinancial.ca before you apply.</text>
  <line x1="90" y1="88" x2="90" y2="300" stroke="#E5E7EB"/>
  <line x1="90" y1="300" x2="690" y2="300" stroke="#E5E7EB"/>
  <text x="82" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0</text>
  <text x="82" y="247" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">20</text>
  <text x="82" y="190" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">30</text>
  <text x="82" y="133" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">40</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="120" y="247" width="100" height="53" rx="8" fill="#9CA3AF"/>
    <text x="170" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">10 pts</text>
    <text x="170" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A">PC MC</text>
    <text x="170" y="340" text-anchor="middle" font-size="11" fill="#6B7280">~1% · $0 fee</text>
    <rect x="260" y="194" width="100" height="106" rx="8" fill="#6B7280"/>
    <text x="310" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">20 pts</text>
    <text x="310" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A">World</text>
    <text x="310" y="340" text-anchor="middle" font-size="11" fill="#6B7280">~2% · $0 fee</text>
    <rect x="400" y="141" width="100" height="159" rx="8" fill="#4B9B74"/>
    <text x="450" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B">30 pts</text>
    <text x="450" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A">World Elite</text>
    <text x="450" y="340" text-anchor="middle" font-size="11" fill="#6B7280">~3% · $0 fee</text>
    <rect x="540" y="88" width="100" height="212" rx="8" fill="#0F7A4B"/>
    <text x="590" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B">40 pts</text>
    <text x="590" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A">Insiders WE</text>
    <text x="590" y="340" text-anchor="middle" font-size="11" fill="#6B7280">~4% · $120 fee</text>
  </g>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Insiders extra 10 pts vs no-fee WE is about 1%. Fee recoup on points alone is roughly $12,000 eligible grocery. The bundled PC Express Pass (listed $99.99/year) is usually the real tipping factor.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Sources: PC Financial / Loblaw newsroom Insiders launch; 2026 card explainers reviewed 16 Sep 2026. Not an application.</text>
</svg>
