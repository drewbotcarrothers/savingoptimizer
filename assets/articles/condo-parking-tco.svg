<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Condo parking monthly equivalent versus car-share</title>
  <desc id="desc">Bars of illustrative monthly parking capital cost in Toronto, Vancouver, Montreal, and Calgary versus a four-day car-share habit.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">A stall is a loan payment hiding in the condo</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Purchase ranges amortised 25 years at 5% (principal+interest only). Plus typical stall condo fee. 20 Sep 2026 labelled bands — confirm listings.</text>
  <line x1="56" y1="84" x2="56" y2="300" stroke="#E5E7EB"/>
  <line x1="56" y1="300" x2="696" y2="300" stroke="#E5E7EB"/>
  <text x="48" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="48" y="248" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$200</text>
  <text x="48" y="192" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$400</text>
  <text x="48" y="136" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$600</text>
  <rect x="80" y="140" width="88" height="160" rx="6" fill="#0F7A4B"/>
  <text x="124" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$500</text>
  <text x="124" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Toronto</text>
  <text x="124" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$75–150k stall</text>
  <rect x="210" y="192" width="88" height="108" rx="6" fill="#4B9B74"/>
  <text x="254" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$310</text>
  <text x="254" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Vancouver</text>
  <text x="254" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$40–80k stall</text>
  <rect x="340" y="220" width="88" height="80" rx="6" fill="#4B9B74"/>
  <text x="384" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$210</text>
  <text x="384" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Montr�al</text>
  <text x="384" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$30–60k stall</text>
  <rect x="470" y="236" width="88" height="64" rx="6" fill="#9CA3AF"/>
  <text x="514" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$160</text>
  <text x="514" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Calgary</text>
  <text x="514" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$30–50k stall</text>
  <rect x="600" y="262" width="72" height="38" rx="6" fill="#0F7A4B"/>
  <text x="636" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$136</text>
  <text x="636" y="322" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4-day share</text>
  <text x="636" y="338" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Communauto VE</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Toronto mid ($100k + $60 fee) is already a second car payment before insurance or fuel. Mid bands shown; downtown Toronto listings can clear $150k.</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">If you could rent the stall for $250, that is the opportunity cost even when "parking is paid for." Scale: $600 = 168 px.</text>
</svg>
