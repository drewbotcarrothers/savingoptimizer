<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Decision flow for a clothing gift</title>
  <desc>Know the size: buy the item and ask for a gift receipt. Unsure: choose an accessory or a gift card. Sender outside Canada: read the CBSA mail gift rule. A business shipment is not a gift. No product prices.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Which clothing gift to give</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Three paths. No product prices on this chart.</text>
  <rect x="28" y="96" width="212" height="200" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="44" y="132" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Know the size</text>
  <text x="44" y="168" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Buy the item.</text>
  <text x="44" y="192" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Ask for a gift receipt.</text>
  <text x="44" y="228" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">It hides what you paid.</text>
  <rect x="254" y="96" width="212" height="200" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="270" y="132" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Unsure of the size</text>
  <text x="270" y="168" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Choose an accessory,</text>
  <text x="270" y="192" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">or a gift card.</text>
  <text x="270" y="228" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Skip a guessed size.</text>
  <rect x="480" y="96" width="212" height="200" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="496" y="132" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Sender is abroad</text>
  <text x="496" y="168" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Read the CBSA gift rule.</text>
  <text x="496" y="192" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Not a business shipment.</text>
  <text x="496" y="228" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">No product price here.</text>
  <text x="24" y="340" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">The abroad path is the mail gift exemption on the CBSA duty page.</text>
  <text x="24" y="362" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Dollar figures for that exemption stay in the article, not on this chart.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Checked 29 Sep 2026.</text>
</svg>
