<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">2026 used-EV incentives: EVAP zero vs Québec and Manitoba</title>
  <desc id="desc">Bar chart of federal EVAP used-EV amount versus Québec Roulez vert $1,000 and Manitoba MPI $2,500.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Used EVs: federal $0. A few provinces still pay.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Reviewed 20 Sep 2026. Roulez vert ends 31 Dec 2026. Manitoba funds are first-come. Confirm official pages.</text>
  <line x1="80" y1="340" x2="680" y2="340" stroke="#E5E7EB"/>
  <text x="160" y="368" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">EVAP used</text>
  <rect x="130" y="332" width="60" height="8" rx="4" fill="#9CA3AF"/>
  <text x="160" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="360" y="368" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Québec used BEV</text>
  <rect x="330" y="260" width="60" height="80" rx="6" fill="#4B9B74"/>
  <text x="360" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$1,000</text>
  <text x="560" y="368" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Manitoba used</text>
  <rect x="530" y="140" width="60" height="200" rx="6" fill="#0F7A4B"/>
  <text x="560" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$2,500</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">A weak battery is a five-figure problem. The rebate is not a PPI. Ontario / Alberta / B.C. used passenger: typically $0 provincial.</text>
</svg>
