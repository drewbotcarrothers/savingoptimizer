<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Cents per advertised laundry load on the Costco East list</title>
  <desc>Dot positions for seven laundry products on the Costco East list posted 10 June 2026, in cents per advertised load. Dollarama, Walmart, and Giant Tiger dots are omitted because those shelf prices were not on a page opened 26 September 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Cents per advertised load, one banner</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Costco East, posted 10 Jun 2026. Other banners are not plotted. The lowest dot is green.</text>
  <line x1="70" y1="250" x2="670" y2="250" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">
    <text x="70" y="272" text-anchor="middle">0 cents</text>
    <text x="370" y="272" text-anchor="middle">15 cents</text>
    <text x="670" y="272" text-anchor="middle">30 cents</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#1A1A1A">
    <circle cx="214" cy="250" r="7" fill="#0F7A4B"/>
    <text x="214" y="228" text-anchor="middle">Springtime</text>
    <text x="214" y="212" text-anchor="middle">7.20</text>
    <circle cx="246" cy="250" r="7" fill="#9CA3AF"/>
    <text x="246" y="188" text-anchor="middle">Purex</text>
    <text x="246" y="172" text-anchor="middle">8.80</text>
    <circle cx="344" cy="250" r="7" fill="#9CA3AF"/>
    <text x="344" y="148" text-anchor="middle">Kirkland liquid</text>
    <text x="344" y="132" text-anchor="middle">13.69</text>
    <circle cx="371" cy="250" r="7" fill="#9CA3AF"/>
    <text x="371" y="108" text-anchor="middle">Gain</text>
    <text x="371" y="92" text-anchor="middle">15.06</text>
    <circle cx="399" cy="250" r="7" fill="#9CA3AF"/>
    <text x="430" y="308" text-anchor="middle">Tide Original 16.43</text>
    <circle cx="425" cy="250" r="7" fill="#9CA3AF"/>
    <text x="470" y="228" text-anchor="middle">Kirkland pacs 17.76</text>
    <circle cx="570" cy="250" r="7" fill="#D1D5DB"/>
    <text x="570" y="188" text-anchor="middle">Tide Pods</text>
    <text x="570" y="172" text-anchor="middle">152 count</text>
    <text x="570" y="156" text-anchor="middle">24.99</text>
  </g>
  <text x="24" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Purex is 8.80 cents for both the After the Rain and Cold Water 250-load jugs at $21.99.</text>
  <text x="24" y="372" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">A $5 Dollarama bottle can still cost more per load. Divide its price by the loads you will actually get.</text>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer, 26 Sep 2026. Positions are cents divided by 30, times 600 px, plus 70.</text>
</svg>
