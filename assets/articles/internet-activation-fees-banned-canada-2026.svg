<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Internet fees after 12 June 2026</title>
  <desc id="desc">From 12 June 2026, activation and no-visit plan-change fees are generally prohibited. A technician visit, optional gear, equipment non-return, and a fixed-term internet ETF can still be charged. Drafted 22 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The ban is real. It is not every fee.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">CRTC 2026-43, in force 12 Jun 2026. CCTS page re-read 22 Sep 2026.</text>
  <rect x="24" y="76" width="328" height="230" rx="12" fill="#0F7A4B"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Generally not allowed</text>
  <text x="40" y="140" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Activation, setup, enrolment</text>
  <text x="40" y="164" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Install with no technician</text>
  <text x="40" y="188" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Speed change with no visit</text>
  <text x="40" y="212" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">A renamed “processing” line</text>
  <text x="40" y="236" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">with no visit and no optional</text>
  <text x="40" y="260" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">product you chose</text>
  <rect x="368" y="76" width="328" height="230" rx="12" fill="#F3F4F6"/>
  <text x="384" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Can still be charged</text>
  <text x="384" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Technician at the premises</text>
  <text x="384" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Optional pod or Wi-Fi visit</text>
  <text x="384" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Gear you do not return</text>
  <text x="384" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fixed-term internet ETF</text>
  <text x="384" y="236" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Late payment, reconnect,</text>
  <text x="384" y="260" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">returned payment (read contract)</text>
  <rect x="24" y="322" width="672" height="52" rx="12" fill="#E7F4EE"/>
  <text x="40" y="354" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ISP first. Pay the undisputed bill. Then CCTS, 1-888-221-1687. Not legal advice.</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Wireless no-ETF without a phone subsidy is a different sentence from a home-internet term.</text>
</svg>
