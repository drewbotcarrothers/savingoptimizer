<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Labelled Subscribe and Save 15 percent</title>
  <desc id="desc">A labelled 20 dollar item is 17 dollars when the 15 percent discount applies.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">15 percent off a price you already pay</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Only when five or more items ship together.</text>
  <rect x="140" y="100" width="150" height="200" rx="6" fill="#1A1A1A"/>
  <text x="215.0" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$20</text>
  <text x="215.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">One-time price</text>
  <text x="215.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">labelled item</text>
  <rect x="420" y="130" width="150" height="170" rx="6" fill="#0F7A4B"/>
  <text x="495.0" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$17</text>
  <text x="495.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">After 15 percent</text>
  <text x="495.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">in a 5-item delivery</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">The reminder email can show a different price.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Prime at $9.99 or $99 is a separate membership. 25 Sep 2026.</text>
</svg>
