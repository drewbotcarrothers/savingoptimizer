<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: from menu price to final cost per guest</title>
<desc id="d">Bars: menu $95.00; with 18% service $112.10; with 13% HST $126.67; with vendor meals $129.87.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: from menu price to final cost per guest</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs, Ontario</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Menu price</text>
<rect x="250" y="93.0" width="256.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="514.0" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$95.00</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Plus service charge</text>
<rect x="250" y="163.0" width="302.1" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="560.1" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$112.10</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Plus HST</text>
<rect x="250" y="233.0" width="341.4" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="599.4" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$126.67</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Plus vendor meals</text>
<rect x="250" y="303.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$129.87</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
