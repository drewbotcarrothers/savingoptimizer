<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Brita pitcher filter cost per litre in Canada</title>
  <desc>Two bars: Brita standard replacement filter OB03 at 6.15 cents per litre from 9.29 dollars and 151 litres, and Brita Elite at 6.34 cents per litre from 28.79 dollars and 454 litres. Prices from brita.ca checked 26 September 2026. Bottled water is omitted because no bottle price was opened.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Cents per litre, filter only</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">brita.ca list price divided by the rated litres on that page. Pitcher hardware and bottles are not in the bars.</text>
  <line x1="220" y1="100" x2="220" y2="300" stroke="#E5E7EB"/>
  <line x1="220" y1="300" x2="680" y2="300" stroke="#E5E7EB"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">
    <text x="212" y="304" text-anchor="end">0</text>
    <text x="450" y="318" text-anchor="middle">5 cents</text>
    <text x="680" y="318" text-anchor="end">10 cents</text>
    <line x1="450" y1="300" x2="450" y2="306" stroke="#E5E7EB"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">
    <text x="24" y="150">Standard OB03</text>
    <text x="24" y="168" font-size="11" fill="#6B7280">151 litres, $9.29</text>
    <rect x="220" y="140" width="283" height="28" fill="#0F7A4B"/>
    <text x="512" y="159">6.15 cents</text>
    <text x="24" y="230">Elite</text>
    <text x="24" y="248" font-size="11" fill="#6B7280">454 litres, $28.79</text>
    <rect x="220" y="214" width="292" height="28" fill="#9CA3AF"/>
    <text x="520" y="233">6.34 cents</text>
  </g>
  <text x="24" y="380" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Scale: 46 px per cent. Fridge, faucet, and under-sink rows were not priced. Checked 26 Sep 2026.</text>
</svg>
