<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 473" role="img" aria-labelledby="title desc">
  <title id="title">EnerGuide home evaluation as a decision tool after grant closure</title>
  <desc id="desc">A registered energy advisor measures airtightness with a blower door, insulation, windows, and mechanicals. You get a GJ-per-year rating, a Homeowner Information Sheet, and a Renovation Upgrade Report. NRCan cites about $600–$1,000 for pre- plus post-retrofit evaluations. Greener Homes Grant and Loan are closed to new applicants.</desc>
  <rect width="720" height="473" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">EnerGuide is a decision tool, not a grant chase</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">After Greener Homes Grant and Loan closure. Lower GJ/year is better. NRCan average $600–$1,000 for both </tspan><tspan x="24" dy="17.6">visits. 20 Sep 2026.</tspan></text>
  <rect x="24" y="78" width="216" height="214" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">What they measure</text>
  <text x="40" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Blower-door airtightness</text>
  <text x="40" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Attic, wall, basement RSI</text>
  <text x="40" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Windows, doors, vents</text>
  <text x="40" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Heat, DHW, cooling</text>
  <text x="40" y="248" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Book only NRCan-listed</text>
  <text x="40" y="266" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">service organizations.</text>
  <rect x="252" y="78" width="216" height="214" rx="12" fill="#F3F4F6" transform="translate(0,17.6)"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">What you receive</text>
  <text x="268" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">EnerGuide rating (GJ/year)</text>
  <text x="268" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Label + information sheet</text>
  <text x="268" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Renovation Upgrade Report</text>
  <text x="268" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Pre- vs post-retrofit pair</text>
  <text x="268" y="248" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Standard operating conditions</text>
  <text x="268" y="266" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">— not your exact lifestyle.</text>
  <rect x="480" y="78" width="216" height="214" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="496" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Closed federal $</text>
  <text x="496" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Grant: closed; docs 31 Dec 2025</text>
  <text x="496" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Loan: closed; funding committed</text>
  <text x="496" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">OHPA intake: closed 31 Jul 2026</text>
  <text x="496" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">OHPA docs: 31 Jan 2027</text>
  <text x="496" y="248" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Pay the advisor unless a live</text>
  <text x="496" y="266" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">provincial path reimburses.</text>
  <text x="24" y="322" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">Rank upgrades by dollars per kWh or GJ saved — attic and air sealing often beat windows. Use the report as </tspan><tspan x="24" dy="17.6">the quote sheet, not shelfware.</tspan></text>
  <text x="24" y="358" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">A DIY walkthrough is enough for weatherstripping and outlet gaskets. Pay for EnerGuide before a heat-pump </tspan><tspan x="24" dy="17.6">or insulation contract you cannot undo.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)">Sources: NRCan EnerGuide evaluation pages and service-organization cost note. Not a rebate approval.</text>
</svg>
