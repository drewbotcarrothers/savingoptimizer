<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Controllable Canadian fuel habits versus a hybrid purchase</title>
  <desc id="desc">Horizontal bars showing labelled monthly dollar impact of trip chaining, tire pressure, highway speed, idle time, and a loyalty stack versus buying a hybrid.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">What you can change this month  not a new powertrain</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled sketches at $1.50/L and 1,200 km. StatsCan gasoline CPI +22.8% YoY in August 2026 (Daily, 14 Sep 2026). Not a dyno test.</text>
  <rect x="220" y="84" width="188" height="34" rx="6" fill="#0F7A4B"/>
  <text x="24" y="106" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Batch 2 extra trips / week</text>
  <text x="418" y="106" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">~$1828/mo</text>
  <rect x="220" y="128" width="94" height="34" rx="6" fill="#4B9B74"/>
  <text x="24" y="150" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Tires to spec (cold PSI)</text>
  <text x="324" y="150" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">~$48/mo</text>
  <rect x="220" y="172" width="122" height="34" rx="6" fill="#4B9B74"/>
  <text x="24" y="194" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Highway 110 vs 120 km/h</text>
  <text x="352" y="194" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">~$815/mo</text>
  <rect x="220" y="216" width="70" height="34" rx="6" fill="#9CA3AF"/>
  <text x="24" y="238" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Cut 10 min idle / day</text>
  <text x="300" y="238" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">~$36/mo</text>
  <rect x="220" y="260" width="80" height="34" rx="6" fill="#4B9B74"/>
  <text x="24" y="282" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">3¢ loyalty stack on 160 L</text>
  <text x="310" y="282" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">~$4.80/mo</text>
  <rect x="220" y="304" width="282" height="34" rx="6" fill="#0F7A4B"/>
  <text x="24" y="326" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Cheaper suburban 6¢ × 160 L</text>
  <text x="514" y="326" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">$9.60 (if on the way)</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">A hybrid can still win on a long highway commute. It is a capital decision. These bars are this months litres. Do not detour 8 km for 6¢/L.</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Scale: $1 H 20 px. Use your last three fill-ups, not a forum MPG screenshot.</text>
</svg>
