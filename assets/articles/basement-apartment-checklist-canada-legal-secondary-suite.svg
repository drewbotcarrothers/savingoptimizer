<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">How to vet a Canadian basement suite before the cheap rent becomes expensive</title>
  <desc id="desc">Renter checklist for secondary suites: egress and alarms, lawful deposits, utility-split red flags, tenant insurance, and when to walk away despite a low asking rent.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Cheap basement ads need extra due diligence</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Renter checklist, 20 Sep 2026. Lease and deposit statutes still apply in informal suites. Not a landlord how-to.</text>
  <rect x="24" y="84" width="330" height="210" rx="12" fill="#E7F4EE"/>
  <text x="40" y="116" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Walk-away signals</text>
  <text x="40" y="150" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No second exit / window you could use</text>
  <text x="40" y="174" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Missing smoke / CO alarms</text>
  <text x="40" y="198" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cash-only, no written lease</text>
  <text x="40" y="222" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Share the house hydro 50/50</text>
  <text x="40" y="246" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Deposit above the provincial cap</text>
  <text x="40" y="270" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Insurer will not quote the address</text>
  <rect x="366" y="84" width="330" height="210" rx="12" fill="#0F7A4B"/>
  <text x="382" y="116" font-size="15" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Ask before you e-transfer</text>
  <text x="382" y="150" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Separate entrance  who else has keys?</text>
  <text x="382" y="174" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Is the suite permitted? High-level only</text>
  <text x="382" y="198" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Whose name is on hydro?</text>
  <text x="382" y="222" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Last winter bill, in writing</text>
  <text x="382" y="246" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Tenant insurance: basement notes</text>
  <text x="382" y="270" font-size="13" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Who talks to the city if inspected?</text>
  <text x="24" y="328" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A $300/month deal that adds $180 hydro and a $2,000 illegal hold is not a deal. Safety and lockouts are leave-now problems, not a spreadsheet.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Educational only. Municipal secondary-suite bylaws differ. Confirm tenancy rules with LTB / RTB / TAL. Not legal, insurance, or building-code advice.</text>
</svg>
