<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: 20-guest party</title>
<desc id="d">Horizontal bars for a made-up party. Full buffet: food $250, drinks $200, total $500. Potluck open house: food $85, drinks $70, total $210.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: 20-guest party</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Full buffet $500 versus potluck open house $210</text>
<text x="240" y="105.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Full buffet, total</text>
<rect x="250" y="86.9" width="350.0" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="105.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$500</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Potluck, total</text>
<rect x="250" y="133.5" width="147.0" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="405.0" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$210</text>
<text x="240" y="198.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Buffet food</text>
