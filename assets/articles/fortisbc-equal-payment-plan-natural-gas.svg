<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">FortisBC Equal Payment Plan for gas and electricity</title>
  <desc id="desc">FortisBC EPP sets 12 equal payments from last year's use at the address. Gas is reviewed every three months. Electricity is reviewed after 12 months. Year-end is a charge or credit, then re-enrolment.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">FortisBC EPP: gas vs electricity clocks</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">12 equal payments from history at the address. Verified 20 Sep 2026.</text>
  <rect x="24" y="78" width="328" height="230" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Natural gas EPP</text>
  <text x="40" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Last year's GJ at the address / 12</text>
  <text x="40" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Reviewed every 3 months</text>
  <text x="40" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Weather, use, and rates can nudge</text>
  <text x="40" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Year-end: charge or credit</text>
  <text x="40" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">then re-enrol at the new amount.</text>
  <text x="40" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rate 1, 2 or 3; account current.</text>
  <rect x="368" y="78" width="328" height="230" rx="12" fill="#F3F4F6"/>
  <text x="384" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Electricity EPP</text>
  <text x="384" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Same 12-payment start</text>
  <text x="384" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Reviewed after 12 months</text>
  <text x="384" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Difference spread into next year</text>
  <text x="384" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">A silent Step 2 winter becomes</text>
  <text x="384" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">next year's "equal" number.</text>
  <text x="384" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Not a BC Hydro rate discount.</text>
  <text x="24" y="344" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">New customers: history at the address or a regional average. Enrol in Account Online.</text>
  <text x="24" y="368" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Pair EPP with conservation. A flat debit is not permission to skip the usage graph.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Source: FortisBC Equal Payment Plan page. Education only. Not enrolment advice.</text>
</svg>
