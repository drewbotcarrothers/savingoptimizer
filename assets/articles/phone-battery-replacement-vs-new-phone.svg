<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: two-year cost of a battery repair versus a new phone</title>
  <desc>Example with made-up inputs. Replacing the battery once and keeping the phone costs 190 dollars over two years. Buying a new phone outright costs 1,100 dollars over the same two years. No plan price is included.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs</text>
  <text x="24" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Two-year device spend. The repair price and the new-phone price are illustrations.</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="120" y1="180" x2="640" y2="180" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="120" y1="280" x2="640" y2="280" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="112" y="84" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">$1,100</text>
  <text x="112" y="184" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">$550</text>
  <text x="112" y="284" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">$0</text>
  <text x="40" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280" transform="rotate(-90 40 196)">Two-year device cost (CAD)</text>
  <rect x="220" y="245.5" width="80" height="34.5" fill="#0F7A4B"/>
  <rect x="420" y="80.0" width="80" height="200.0" fill="#F59E0B"/>
  <text x="260" y="237.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$190</text>
  <text x="460" y="72.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$1,100</text>
  <text x="260" y="304" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Battery once,</text>
  <text x="260" y="322" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">keep the phone</text>
  <text x="460" y="304" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">New phone,</text>
  <text x="460" y="322" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">bought outright</text>
  <text x="24" y="364" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">If the phone is failing for a reason other than the battery, the $190 bar does not apply.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Apple's support page states design targets for capacity, not a repair price. Checked 29 Sep 2026.</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Get a written quote. Quebec's legal warranty may already cover a phone that stops working properly.</text>
</svg>
