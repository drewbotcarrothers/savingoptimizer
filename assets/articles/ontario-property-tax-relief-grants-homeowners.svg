<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 489" role="img" aria-labelledby="title desc">
  <title id="title">Ontario 2026 property tax credits and grants homeowners should check</title>
  <desc id="desc">2026 Ontario Energy and Property Tax Credit maximums are $1,307 for non-seniors and $1,488 for seniors. The Ontario Senior Homeowners Property Tax Grant maximum is $500. A labelled municipal senior rebate example is Brampton $590. None of these are automatic without a filing.</desc>
  <rect width="720" height="489" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Ontario relief is a checklist, not a smaller mill rate</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">CRA 2026 OEPTC and OSHPTG Q&amp;As (used 20 Sep 2026). ontario.ca Senior Homeowners- Property Tax </tspan><tspan x="24" dy="17.6">Grant page updated 2 Jan 2026.</tspan></text>
  <rect x="56" y="140" width="140" height="140" fill="#4B9B74" transform="translate(0,17.6)"/>
  <text x="126" y="128" text-anchor="middle" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$1,307</text>
  <text x="126" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">OEPTC non-sr</text>
  <rect x="216" y="120" width="140" height="160" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="286" y="108" text-anchor="middle" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$1,488</text>
  <text x="286" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">OEPTC senior</text>
  <rect x="376" y="196" width="140" height="84" fill="#1A1A1A" transform="translate(0,17.6)"/>
  <text x="446" y="184" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$500</text>
  <text x="446" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">OSHPTG max</text>
  <rect x="536" y="186" width="140" height="94" fill="#6B7280" transform="translate(0,17.6)"/>
  <text x="606" y="174" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$590</text>
  <text x="606" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Brampton 2026</text>
  <text x="24" y="348" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">OEPTC: $290 energy + $1,017 property (non-senior) or $1,198 property (senior). Paid via Ontario Trillium </tspan><tspan x="24" dy="17.6">Benefit unless an exception applies.</tspan></text>
  <text x="24" y="372" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">OSHPTG is the lesser of $500 and 2025 property tax paid. File ON-BEN. City programs (Toronto deadline 2 </tspan><tspan x="24" dy="17.6">Nov 2026) are a separate form.</tspan></text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)"><tspan x="24">Maximums are not your payment. Income tests apply. Land transfer tax refunds are for buyers, not the annual bill. Not </tspan><tspan x="24" dy="16.2">tax advice.</tspan></text>
</svg>
