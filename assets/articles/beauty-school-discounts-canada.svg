<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>How to book a student clinic</title>
  <desc>Flow from finding a program to tipping etiquette. No prices.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">How to book a student clinic</text>
  <rect x="140" y="62" width="440" height="40" rx="8" fill="#0F7A4B" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="87" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Find a hairstyling or barber program</text>
  <line x1="360" y1="102" x2="360" y2="114" stroke="#6B7280" stroke-width="2"/>
  <polygon points="354,114 366,114 360,120" fill="#6B7280"/>
  <rect x="140" y="120" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Confirm the clinic is open to the public</text>
  <line x1="360" y1="160" x2="360" y2="172" stroke="#6B7280" stroke-width="2"/>
  <polygon points="354,172 366,172 360,178" fill="#6B7280"/>
  <rect x="140" y="178" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Book, and read the time and the limits</text>
  <line x1="360" y1="218" x2="360" y2="230" stroke="#6B7280" stroke-width="2"/>
  <polygon points="354,230 366,230 360,236" fill="#6B7280"/>
  <rect x="140" y="236" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="261" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Expect a longer visit and an instructor check</text>
  <line x1="360" y1="276" x2="360" y2="288" stroke="#6B7280" stroke-width="2"/>
  <polygon points="354,288 366,288 360,294" fill="#6B7280"/>
  <rect x="140" y="294" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="319" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ask about tipping before you sit down</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">No prices on this chart. The number on the clinic page is the one you compare.</text>
</svg>
