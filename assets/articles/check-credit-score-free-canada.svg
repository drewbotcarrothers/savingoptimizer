<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Labelled credit utilization and free report paths</title>
  <desc id="desc">A labelled 7000 dollar balance on 10000 dollars of limits is 70 percent utilization. Paying the same limits down to 2500 dollars is 25 percent. Free reports come from Equifax and TransUnion. Your own request does not affect the score.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Utilization is a balance divided by the limit</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled $10,000 of limits. The 30% figure is a heuristic, not a statute. 21 Sep 2026.</text>
  <text x="24" y="100" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$7,000 owing (70%)</text>
  <rect x="24" y="112" width="460" height="28" rx="6" fill="#0F7A4B"/>
  <text x="500" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">High use</text>
  <text x="24" y="172" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$2,500 owing (25%)</text>
  <rect x="24" y="184" width="164" height="28" rx="6" fill="#0F7A4B" opacity="0.55"/>
  <text x="204" y="204" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Same limits, lower balance</text>
  <rect x="24" y="240" width="320" height="120" rx="12" fill="#E7F4EE"/>
  <text x="40" y="270" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Free report</text>
  <text x="40" y="294" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Equifax and TransUnion online,</text>
  <text x="40" y="312" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">by phone, or by mail. FCAC.</text>
  <text x="40" y="334" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Your own request is not a hard check.</text>
  <rect x="364" y="240" width="332" height="120" rx="12" fill="#F3F4F6"/>
  <text x="380" y="270" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Skip the repair pitch</text>
  <text x="380" y="294" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Bureaus correct errors for free.</text>
  <text x="380" y="312" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Accurate late payments stay until</text>
  <text x="380" y="330" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">the legal period ends.</text>
  <text x="24" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Walk-up centres in Toronto and Burlington closed 1 July 2026. Use online, phone, or mail.</text>
</svg>
