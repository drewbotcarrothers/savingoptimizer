<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: grants and loans</title>
<desc id="d">Horizontal bars for a made-up package. Total grants $10,320 under the old split and $6,000 under the new split; total loans $5,680 and $10,000.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: grants and loans</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">One $16,000 package, old Ontario split versus new</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Grants, old split</text>
<rect x="250" y="93.0" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$10,320</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Grants, new split</text>
<rect x="250" y="163.0" width="203.5" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="461.5" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$6,000</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Loans, old split</text>
<rect x="250" y="233.0" width="192.6" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="450.6" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$5,680</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Loans, new split</text>
<rect x="250" y="303.0" width="339.1" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="597.1" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$10,000</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
