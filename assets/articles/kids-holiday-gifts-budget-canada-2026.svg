<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: three children's holiday gift budgets</title>
  <desc>Example with made-up inputs. Stacked bars for three children: Child A $170, Child B $130, and Child C $215, each split into a main gift, a stocking, an experience, and books. The totals add to $515. Grandparent gifts are not in the bars.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: holiday splits</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Three children. Household cap on these bars: $515. Not store prices.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">
    <text x="24" y="92">Child A</text>
    <rect x="110" y="74" width="311" height="28" fill="#0F7A4B"/>
    <rect x="421" y="74" width="28" height="28" fill="#1A1A1A"/>
    <rect x="449" y="74" width="69" height="28" fill="#F59E0B"/>
    <rect x="518" y="74" width="46" height="28" fill="#6B7280"/>
    <text x="572" y="93">$170</text>
    <text x="24" y="148">Child B</text>
    <rect x="110" y="130" width="130" height="28" fill="#0F7A4B"/>
    <rect x="240" y="130" width="47" height="28" fill="#1A1A1A"/>
    <rect x="287" y="130" width="37" height="28" fill="#F59E0B"/>
    <rect x="324" y="130" width="28" height="28" fill="#6B7280"/>
    <text x="360" y="149">$130</text>
    <text x="24" y="204">Child C</text>
    <rect x="110" y="186" width="205" height="28" fill="#0F7A4B"/>
    <rect x="315" y="186" width="37" height="28" fill="#1A1A1A"/>
    <rect x="352" y="186" width="102" height="28" fill="#F59E0B"/>
    <rect x="454" y="186" width="56" height="28" fill="#6B7280"/>
    <text x="518" y="205">$215</text>
    <rect x="110" y="250" width="16" height="16" fill="#0F7A4B"/>
    <text x="132" y="263">Main gift</text>
    <rect x="230" y="250" width="16" height="16" fill="#1A1A1A"/>
    <text x="252" y="263">Stocking</text>
    <rect x="340" y="250" width="16" height="16" fill="#F59E0B"/>
    <text x="362" y="263">Experience</text>
    <rect x="470" y="250" width="16" height="16" fill="#6B7280"/>
    <text x="492" y="263">Books</text>
    <text x="24" y="310" font-size="12" fill="#6B7280">Child A: main $90, stocking $15, experience $40, books $25.</text>
    <text x="24" y="330" font-size="12" fill="#6B7280">Child B: main $70, stocking $25, experience $20, books $15.</text>
    <text x="24" y="350" font-size="12" fill="#6B7280">Child C: main $110, stocking $20, experience $55, books $30.</text>
    <text x="24" y="390" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. Grandparent gifts are outside these bars.</text>
  </g>

</svg>
