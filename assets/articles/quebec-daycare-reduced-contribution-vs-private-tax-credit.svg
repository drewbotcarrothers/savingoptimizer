<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: net daily daycare cost in Quebec</title>
<desc id="d">Horizontal bars for made-up net daily costs: subsidized $9.65, private at 78 percent credit $12.10, at 70 percent $16.50, at 67 percent $18.15.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: net daily daycare cost in Quebec</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">$55-a-day private space after the credit vs $9.65 reduced contribution</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Subsidized space</text>
<rect x="250" y="93.0" width="186.1" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="444.1" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$9.65</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Private, 78% credit</text>
<rect x="250" y="163.0" width="233.3" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="491.3" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$12.10</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Private, 70% credit</text>
<rect x="250" y="233.0" width="318.2" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="576.2" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$16.50</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Private, 67% credit</text>
<rect x="250" y="303.0" width="350.0" height="40.0" rx="3" fill="#6B7280"/>
<text x="608.0" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$18.15</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
