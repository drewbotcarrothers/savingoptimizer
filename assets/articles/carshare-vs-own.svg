<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Car-share vs rarely driven second car</title>
  <desc id="desc">Illustrative monthly cost of a low-use owned car versus Communauto and Zipcar usage in a Canadian city.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Second-car job vs car-share (illustrative month)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">The parked car still pays insurance and parking even at 400 km. Car-share bills the hours you actually drive.</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <text x="24" y="108" font-weight="600" fill="#1A1A1A">Owned second car (insurance + parking + sinking fund)</text>
    <rect x="420" y="90" width="250" height="24" rx="4" fill="#9CA3AF"/>
    <text x="680" y="108" fill="#6B7280">~$500+</text>
    <text x="24" y="160" font-weight="600" fill="#1A1A1A">Zipcar: 8 hours + 1 weekend day</text>
    <rect x="420" y="142" width="140" height="24" rx="4" fill="#0F7A4B"/>
    <text x="570" y="160" fill="#FFFFFF">usage + $9 fee</text>
    <text x="24" y="212" font-weight="600" fill="#1A1A1A">Communauto Open: similar errand mix</text>
    <rect x="420" y="194" width="155" height="24" rx="4" fill="#0F7A4B"/>
    <text x="585" y="212" fill="#FFFFFF">usage, $0 fee</text>
    <text x="24" y="264" font-weight="600" fill="#1A1A1A">Communauto Value Extra (high hours)</text>
    <rect x="420" y="246" width="180" height="24" rx="4" fill="#0F7A4B"/>
    <text x="610" y="264" fill="#FFFFFF">$30 + lower rates</text>
    <text x="24" y="316" font-weight="600" fill="#1A1A1A">Transit pass + car-share (car-lite)</text>
    <rect x="420" y="298" width="120" height="24" rx="4" fill="#0F7A4B"/>
    <text x="550" y="316" fill="#FFFFFF">often the win</text>
  </g>
  <text x="24" y="364" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Gas, insurance, and maintenance are in Communauto/Zipcar trip rates. Ownership still carries depreciation if the car is financed or new.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer - Canada - 16 Sep 2026 · Toronto fee schedules reviewed 16 Sep 2026</text>
</svg>
