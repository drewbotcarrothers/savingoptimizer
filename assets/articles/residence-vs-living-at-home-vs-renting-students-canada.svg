<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: eight-month housing cost</title>
<desc id="d">Horizontal bars. Residence $16,100. Shared rental with summer rent $15,100. Shared rental with a summer subtenant $11,500. Living at home $2,600.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
