<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Residence, living at home and a shared rental with a 12-month lease</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Residence</text>
