<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Same shelf sticker, different unit prices</title>
  <desc id="desc">Bar chart comparing three peanut butter jars by dollars per 100 grams, showing the cheapest-looking jar is the most expensive per gram.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Shelf price vs $/100 g (peanut butter)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative No Frills / Food Basics tags. Not a price survey.</text>
  <text x="86" y="92" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">$/100 g</text>
  <line x1="86" y1="110" x2="86" y2="310" stroke="#E5E7EB"/>
  <line x1="86" y1="310" x2="680" y2="310" stroke="#E5E7EB"/>
  <line x1="86" y1="260" x2="680" y2="260" stroke="#F3F4F6"/>
  <line x1="86" y1="210" x2="680" y2="210" stroke="#F3F4F6"/>
  <line x1="86" y1="160" x2="680" y2="160" stroke="#F3F4F6"/>
  <line x1="86" y1="110" x2="680" y2="110" stroke="#F3F4F6"/>
  <text x="78" y="314" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0</text>
  <text x="78" y="264" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0.40</text>
  <text x="78" y="214" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0.80</text>
  <text x="78" y="164" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">1.20</text>
  <text x="78" y="114" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">1.60</text>
  <rect x="130" y="135" width="110" height="175" rx="8" fill="#6B7280"/>
  <text x="185" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1.40</text>
  <text x="185" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">500 g name brand</text>
  <text x="185" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$6.99 sticker</text>
  <rect x="305" y="210" width="110" height="100" rx="8" fill="#0F7A4B"/>
  <text x="360" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$0.80</text>
  <text x="360" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1 kg store brand</text>
  <text x="360" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$7.99 sticker</text>
  <rect x="480" y="173" width="110" height="137" rx="8" fill="#6B7280"/>
  <text x="535" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1.10</text>
  <text x="535" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">750 g on sale</text>
  <text x="535" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$8.25 flyer</text>
  <text x="24" y="382" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">The $6.99 jar looks cheapest. Per 100 g it is the most expensive. Convert every tag to the same unit.</text>
</svg>
