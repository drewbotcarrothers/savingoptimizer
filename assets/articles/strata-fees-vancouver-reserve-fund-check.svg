<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Vancouver Form B and depreciation-report checklist before you buy</title>
  <desc id="desc">Read Form B, depreciation report, contingency reserve, parking and storage contributions, rental-restriction bylaws, and earthquake deductible before celebrating a low strata fee. 20 September 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Form B first. List price second.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Metro Vancouver strata package. CMHC condo-buyer framing. Not legal advice. 20 Sep 2026.</text>
  <rect x="36" y="80" width="210" height="200" fill="#E7F4EE"/>
  <text x="141" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Tower A  -  $620 fee</text>
  <text x="141" y="146" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Current dep. report</text>
  <text x="141" y="170" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CRF vs study: funded</text>
  <text x="141" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No levy in minutes</text>
  <text x="141" y="218" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">EQ deductible known</text>
  <text x="141" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Contender</text>
  <rect x="255" y="80" width="210" height="200" fill="#F3F4F6"/>
  <text x="360" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Tower B  -  $410 fee</text>
  <text x="360" y="146" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2018 report</text>
  <text x="360" y="170" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Parkade discussed</text>
  <text x="360" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rental ban / limit</text>
  <text x="360" y="218" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">EQ 1020% unclear</text>
  <text x="360" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Walk or reprice</text>
  <rect x="474" y="80" width="210" height="200" fill="#F3F4F6"/>
  <text x="579" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Circle on Form B</text>
  <text x="579" y="146" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Arrears / lawsuits</text>
  <text x="579" y="170" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Parking / locker $</text>
  <text x="579" y="194" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Contingency $</text>
  <text x="579" y="218" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Bylaw rental rules</text>
  <text x="579" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Lawyer reads it</text>
  <text x="24" y="318" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A $210/month saving vs Tower A is a $15,000 levy if the membrane is year two. Fee + implied catch-up is the stack.</text>
  <text x="24" y="346" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rental-restriction bylaws change resale and your own flexibility if you are posted east.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Not brokerage or legal advice. Mortgage and home-insurance comparison tools are offer types only.</text>
</svg>
