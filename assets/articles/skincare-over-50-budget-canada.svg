<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Monthly skincare cost</title>
  <desc>Example with made-up inputs. Not shelf prices.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Monthly skincare cost</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs. Not shelf prices.</text>
  <text x="24" y="86" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Dollars</text>
  <line x1="70" y1="292.0" x2="690" y2="292.0" stroke="#E5E7EB"/>
  <text x="64" y="296.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">0</text>
  <line x1="70" y1="200.0" x2="690" y2="200.0" stroke="#E5E7EB"/>
  <text x="64" y="204.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">50</text>
  <line x1="70" y1="108.0" x2="690" y2="108.0" stroke="#E5E7EB"/>
  <text x="64" y="112.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">100</text>
  <rect x="190.0" y="244.2" width="100.0" height="47.8" rx="6" fill="#0F7A4B"/>
  <text x="240.0" y="236.2" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$26</text>
  <text x="240.0" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Three steps</text>
  <rect x="470.0" y="148.5" width="100.0" height="143.5" rx="6" fill="#6B7280"/>
  <text x="520.0" y="140.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$78</text>
  <text x="520.0" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Seven steps</text>
  <text x="24" y="352" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Three steps: $6 + $8 + $12 = $26. Seven steps add $14 + $16 + $9 + $13.</text>
  <text x="24" y="370" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">The extra $52 is four products in this example. Saving Optimizer, 29 Sep 2026.</text>
</svg>
