<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Fit4Less Canada true monthly cost before tax</title>
  <desc id="desc">Fit4Less pages used 25 September 2026. 4Less at 7.99 dollars every two weeks is about 17.31 a month in dues, or 21.48 with the 49.99 annual fee. Black Card all-in is about 34.48 a month. Before tax. 26 drafts.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The bi-weekly headline is not the month</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Fit4Less.ca, before tax, 26 bi-weekly drafts. Pages used 25 Sep 2026.</text>
  <rect x="90" y="250" width="130" height="46" rx="6" fill="#374151"/>
  <text x="122" y="240" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$7.99</text>
  <text x="100" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Headline</text>
  <text x="108" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">every 2 weeks</text>
  <rect x="290" y="172" width="130" height="124" rx="6" fill="#0F7A4B"/>
  <text x="322" y="162" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$21.48</text>
  <text x="310" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">4Less true</text>
  <text x="312" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">dues + $49.99</text>
  <rect x="490" y="96" width="130" height="200" rx="6" fill="#0F7A4B"/>
  <text x="522" y="86" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$34.48</text>
  <text x="508" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Black Card</text>
  <text x="516" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">dues + annual</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">4Less is $257.73 a year before tax, not $7.99. A year with 27 drafts costs one more payment.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Lock in Your Rate is another $9.95 plus tax every 3 months, including during the 30-day notice.</text>
</svg>
