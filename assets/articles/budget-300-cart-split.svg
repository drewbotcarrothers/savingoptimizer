<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Sample $300 monthly grocery cart for one person in Canada</title>
  <desc id="desc">Weekly dollars allocated across protein, produce, staples, dairy, and a small flex line totalling $75 a week.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">A $300 month is $75 a week — assign the dollars first</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative single-person discounter cart. Not a nutritious-food-basket or Statistics Canada average.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="90" width="120" height="200" rx="10" fill="#0F7A4B"/>
    <text x="100" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">$22</text>
    <text x="100" y="204" text-anchor="middle" font-size="12" fill="#E7F4EE">Protein</text>
    <text x="100" y="320" text-anchor="middle" font-size="12" fill="#1A1A1A">eggs, beans,</text>
    <text x="100" y="338" text-anchor="middle" font-size="12" fill="#6B7280">sale chicken</text>
    <rect x="176" y="110" width="120" height="180" rx="10" fill="#4B9B74"/>
    <text x="236" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">$16</text>
    <text x="236" y="214" text-anchor="middle" font-size="12" fill="#E7F4EE">Produce</text>
    <text x="236" y="320" text-anchor="middle" font-size="12" fill="#1A1A1A">in-season +</text>
    <text x="236" y="338" text-anchor="middle" font-size="12" fill="#6B7280">frozen veg</text>
    <rect x="312" y="80" width="120" height="210" rx="10" fill="#0C643D"/>
    <text x="372" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">$18</text>
    <text x="372" y="194" text-anchor="middle" font-size="12" fill="#E7F4EE">Staples</text>
    <text x="372" y="320" text-anchor="middle" font-size="12" fill="#1A1A1A">rice, oats,</text>
    <text x="372" y="338" text-anchor="middle" font-size="12" fill="#6B7280">store brand</text>
    <rect x="448" y="140" width="120" height="150" rx="10" fill="#6B7280"/>
    <text x="508" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">$12</text>
    <text x="508" y="234" text-anchor="middle" font-size="12" fill="#F3F4F6">Dairy</text>
    <text x="508" y="320" text-anchor="middle" font-size="12" fill="#1A1A1A">milk / yogurt</text>
    <text x="508" y="338" text-anchor="middle" font-size="12" fill="#6B7280">own brand</text>
    <rect x="584" y="210" width="96" height="80" rx="10" fill="#E7F4EE" stroke="#0F7A4B"/>
    <text x="632" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#0F7A4B">$7</text>
    <text x="632" y="270" text-anchor="middle" font-size="12" fill="#1A1A1A">Flex</text>
    <text x="632" y="320" text-anchor="middle" font-size="12" fill="#1A1A1A">coffee or</text>
    <text x="632" y="338" text-anchor="middle" font-size="12" fill="#6B7280">one treat</text>
  </g>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">CPI context: food from stores +2.8% year over year in August 2026, still +29.0% vs August 2021 (Statistics Canada Daily, 14 Sep 2026).</text>
</svg>
