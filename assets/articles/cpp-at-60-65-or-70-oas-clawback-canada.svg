<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: monthly CPP by start age</title>
<desc id="d">Bars: start at 60 $640; start at 65 $1,000; start at 70 $1,420.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: monthly CPP by start age</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Made-up $1,000 a month at 65, using the government&#x27;s percentages</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Start at 60 (-36%)</text>
<rect x="250" y="104.7" width="157.7" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="415.7" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$640</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Start at 65</text>
<rect x="250" y="198.0" width="246.5" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="504.5" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$1,000</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Start at 70 (+42%)</text>
