<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Face value by card, $185 in total</text>
<text x="240" y="105.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Department store</text>
<rect x="250" y="86.9" width="350.0" height="28.9" rx="3" fill="#0F7A4B"/>
