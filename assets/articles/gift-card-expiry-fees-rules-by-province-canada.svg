<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: six old gift cards</title>
<desc id="d">Horizontal bars for six made-up gift cards: department store $50, restaurant $40, prepaid network $30, mall card $25, bonus card $20 and closing chain $20.</desc>
