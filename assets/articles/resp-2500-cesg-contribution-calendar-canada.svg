<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">RESP 2500 CESG calendar</title>
  <desc id="desc">About 208 dollars a month reaches the 2500 dollar band for 500 dollars of basic CESG.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">$2,500 CESG calendar</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Basic grant $500. Lifetime $7,200. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="160" height="160" rx="12" fill="#E7F4EE"/>
  <text x="36" y="110" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Monthly</text>
  <text x="36" y="140" font-size="26" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$208</text>
  <text x="36" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">x 12 months</text>
  <text x="36" y="198" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">= $2,500 band</text>
  <rect x="200" y="78" width="160" height="160" rx="12" fill="#E7F4EE"/>
  <text x="212" y="110" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Bi-weekly</text>
  <text x="212" y="140" font-size="26" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$96</text>
  <text x="212" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">x 26 pays</text>
  <text x="212" y="198" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">= $2,500 band</text>
  <rect x="376" y="78" width="160" height="160" rx="12" fill="#F3F4F6"/>
  <text x="388" y="110" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Basic CESG</text>
  <text x="388" y="140" font-size="26" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$500</text>
  <text x="388" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">20% on first</text>
  <text x="388" y="190" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$2,500</text>
  <rect x="552" y="78" width="144" height="160" rx="12" fill="#F3F4F6"/>
  <text x="564" y="110" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Catch-up</text>
  <text x="564" y="140" font-size="22" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1,000</text>
  <text x="564" y="170" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">on $5,000</text>
  <text x="564" y="198" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">one year at a time</text>
  <text x="24" y="280" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Additional CESG 2026 on first $500: $100 / $50 / $0 by Canada.ca income bands (used 22 Sep 2026).</text>
  <text x="24" y="302" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Plain RESP receives the grant. Enrolment-fee scholarship plans are optional sales, not a requirement.</text>
  <text x="24" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Lifetime contribution room $50,000 per beneficiary. Education only.</text>
</svg>
