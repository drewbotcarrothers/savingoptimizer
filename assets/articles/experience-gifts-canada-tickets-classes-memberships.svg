<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: membership cost per visit</title>
<desc id="d">Horizontal bars for a made-up membership. 2 visits $75 a visit, 4 visits $37.50, 6 visits $25, 10 visits $15. Single admission $40.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: membership cost per visit</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">A $150 membership against $40 single admissions</text>
<text x="240" y="110.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Single admission</text>
<rect x="250" y="88.6" width="186.7" height="34.7" rx="3" fill="#0F7A4B"/>
