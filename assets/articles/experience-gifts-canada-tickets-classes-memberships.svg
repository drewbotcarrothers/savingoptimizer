<text x="240" y="166.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Membership, 2 visits</text>
<rect x="250" y="144.6" width="350.0" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="166.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$75</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Membership, 4 visits</text>
<rect x="250" y="200.6" width="175.0" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="433.0" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$37.50</text>
<text x="240" y="278.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Membership, 6 visits</text>
<rect x="250" y="256.6" width="116.7" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="374.7" y="278.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$25</text>
<text x="240" y="334.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Membership, 10 visits</text>
