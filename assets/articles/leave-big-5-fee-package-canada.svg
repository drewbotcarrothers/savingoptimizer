<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">90-day exit from a Big-5 monthly fee package</title>
  <desc id="desc">Keep the mortgage and HELOC where they are unless a signed clause ties a discount to the package. Move payroll and PADs to a no-fee chequing account. Overlap two billing cycles. Downgrade or close the package only after a written zero balance. A 16.95 dollar monthly package is about 203 dollars a year.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Leave the package. Leave the mortgage put.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">90-day overlap. Not a rate shop. Figures used 22 Sep 2026.</text>
  <rect x="24" y="74" width="160" height="168" rx="12" fill="#E7F4EE"/>
  <text x="40" y="102" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Days 1-14</text>
  <text x="40" y="130" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Open no-fee</text>
  <text x="40" y="150" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">chequing first</text>
  <text x="40" y="178" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">List every PAD</text>
  <text x="40" y="206" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Do not close yet</text>
  <rect x="196" y="74" width="160" height="168" rx="12" fill="#F3F4F6"/>
  <text x="212" y="102" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Days 15-45</text>
  <text x="212" y="130" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Move payroll</text>
  <text x="212" y="150" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rewrite bill pays</text>
  <text x="212" y="178" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Mortgage PAD</text>
  <text x="212" y="198" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">can move too</text>
  <rect x="368" y="74" width="160" height="168" rx="12" fill="#F3F4F6"/>
  <text x="384" y="102" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Days 46-75</text>
  <text x="384" y="130" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Two clean</text>
  <text x="384" y="150" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">billing cycles</text>
  <text x="384" y="178" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Watch NSF risk</text>
  <text x="384" y="206" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$10 cap from 12 Mar 2026</text>
  <rect x="540" y="74" width="156" height="168" rx="12" fill="#E7F4EE"/>
  <text x="556" y="102" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Days 76-90</text>
  <text x="556" y="130" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Downgrade</text>
  <text x="556" y="150" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">or close</text>
  <text x="556" y="178" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Written $0</text>
  <text x="556" y="206" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Keep branch only if needed</text>
  <rect x="24" y="258" width="672" height="108" rx="12" fill="#E7F4EE"/>
  <text x="40" y="286" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">What stays at the Big-5 bank</text>
  <text x="40" y="310" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">The mortgage and a HELOC stay unless a signed offer ties a discount to the deposit package. Get that clause in writing.</text>
  <text x="40" y="330" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A labelled $16.95 package is $203.40 a year. A tiny foothold is for drafts or a box, not for fear.</text>
  <text x="40" y="350" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">This page does not compare mortgage rates. Offer types: no-fee chequing only.</text>
  <text x="24" y="394" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">FCAC switching sequence plus the 14-day plan on this site. Education only. Not a bank partnership.</text>
</svg>
