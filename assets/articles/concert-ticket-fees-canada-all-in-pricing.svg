<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: one ticket, two displays</title>
<desc id="d">Horizontal bars for a made-up ticket. Option A headline $79.50, total $112.15. Option B headline $89.00, total $100.57.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: one ticket, two displays</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Itemized headline $79.50 versus all-in $89.00, totals after fees and tax</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">A: headline</text>
<rect x="250" y="93.0" width="248.1" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="506.1" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$79.50</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">A: total</text>
<rect x="250" y="163.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$112.15</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">B: headline</text>
<rect x="250" y="233.0" width="277.8" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="535.8" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$89.00</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">B: total</text>
<rect x="250" y="303.0" width="313.9" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="571.9" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$100.57</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
