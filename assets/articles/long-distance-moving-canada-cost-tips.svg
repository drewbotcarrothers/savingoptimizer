<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Long-distance Canada corridor cost levers</title>
  <desc id="desc">TorontoCalgary and VancouverOttawa labelled 2026 education: weight or volume pricing, packing, shoulder-season mid-week loads, and vehicle transport as a separate invoice. Not a bid. 20 September 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Corridors, not U.S. interstate advice</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled long-distance levers. Public 2026 bands, not your inventory. 20 Sep 2026.</text>
  <rect x="36" y="80" width="318" height="200" fill="#E7F4EE"/>
  <text x="195" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Toronto ' Calgary</text>
  <text x="195" y="142" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~2,7003,400 km road</text>
  <text x="195" y="168" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2-bed full-service sketch</text>
  <text x="195" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$4,500$8,500</text>
  <text x="195" y="220" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">+ car ship $1,200$2,400</text>
  <text x="195" y="248" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Hotels if you drive the truck</text>
  <rect x="366" y="80" width="318" height="200" fill="#F3F4F6"/>
  <text x="525" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Vancouver ' Ottawa</text>
  <text x="525" y="142" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~4,3004,500 km road</text>
  <text x="525" y="168" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2-bed full-service sketch</text>
  <text x="525" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$6,000$11,000</text>
  <text x="525" y="220" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">+ car ship $1,800$3,200</text>
  <text x="525" y="248" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Shared load vs dedicated</text>
  <text x="24" y="318" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Levers that move the number: weight/volume after declutter, pack yourself, OctoberApril mid-week, shared truck vs exclusive use.</text>
  <text x="24" y="346" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Temporary housing and overlapping rent are often larger than a $400 packing add-on. Price the gap weeks.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Not a bid. HST extra where it applies. Quote platforms and truck rental are offer types only.</text>
</svg>
