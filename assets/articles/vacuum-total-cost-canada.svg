<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Dyson V8 Canada parts prices if you buy one of each</title>
  <desc>Stacked bars of Dyson Canada parts prices checked 26 September 2026. Star-filter V8 example: battery 139.99 dollars, pre-filter 32.99, post-filter 32.99. Pinch-filter example: battery 142.99 and pre-filter 20.99. These are list prices for one of each part, not a prediction that a vacuum needs them within five years. The machine purchase price is not included.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">One of each priced part, not a five-year forecast</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Dyson Canada parts pages. Purchase price of the vacuum is not in the stack. Shipping of 5.99 dollars is extra.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <rect x="24" y="70" width="12" height="12" fill="#0F7A4B"/>
    <text x="42" y="80" fill="#1A1A1A">Battery</text>
    <rect x="130" y="70" width="12" height="12" fill="#6B7280"/>
    <text x="148" y="80" fill="#1A1A1A">Pre-filter</text>
    <rect x="250" y="70" width="12" height="12" fill="#D1D5DB"/>
    <text x="268" y="80" fill="#1A1A1A">Post-filter</text>
  </g>
  <line x1="180" y1="100" x2="180" y2="340" stroke="#E5E7EB"/>
  <line x1="180" y1="340" x2="680" y2="340" stroke="#E5E7EB"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">
    <text x="172" y="344" text-anchor="end">$0</text>
    <text x="430" y="358" text-anchor="middle">$100</text>
    <text x="680" y="358" text-anchor="end">$200</text>
    <line x1="430" y1="340" x2="430" y2="346" stroke="#E5E7EB"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">
    <text x="24" y="160">V8 star-filter</text>
    <text x="24" y="176" font-size="11" fill="#6B7280">parts 972237-01, 965661-05, 967478-05</text>
    <rect x="180" y="145" width="280" height="22" fill="#0F7A4B"/>
    <rect x="460" y="145" width="66" height="22" fill="#6B7280"/>
    <rect x="526" y="145" width="66" height="22" fill="#D1D5DB"/>
    <text x="600" y="161">$206</text>
    <text x="24" y="250">V8 pinch-filter</text>
    <text x="24" y="266" font-size="11" fill="#6B7280">parts 967834-08 and 965661-01</text>
    <rect x="180" y="230" width="286" height="22" fill="#0F7A4B"/>
    <rect x="466" y="230" width="42" height="22" fill="#6B7280"/>
    <text x="516" y="246">$164</text>
  </g>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Scale: 2 px per dollar. Totals round to the nearest dollar. Corded and robot purchase prices did not load. 26 Sep 2026.</text>
</svg>
