<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Same staples, different banners</title>
  <desc id="desc">Illustrative relative cost of a 12-item staple basket at discount banners versus a full-service banner.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Staples basket: discount vs full-service (illustrative)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Relative index. Discount average = 100. Not a city-wide price survey.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="24" y="108" font-size="13" font-weight="600" fill="#1A1A1A">No Frills / FreshCo / Food Basics</text>
    <rect x="280" y="90" width="280" height="26" rx="6" fill="#0F7A4B"/>
    <text x="572" y="108" font-size="13" font-weight="700" fill="#0F7A4B">100</text>
    <text x="24" y="156" font-size="13" font-weight="600" fill="#1A1A1A">Walmart Supercentre</text>
    <rect x="280" y="138" width="286" height="26" rx="6" fill="#0F7A4B" opacity="0.75"/>
    <text x="578" y="156" font-size="13" font-weight="700" fill="#1A1A1A">102</text>
    <text x="24" y="204" font-size="13" font-weight="600" fill="#1A1A1A">Real Canadian Superstore</text>
    <rect x="280" y="186" width="308" height="26" rx="6" fill="#6B7280"/>
    <text x="600" y="204" font-size="13" font-weight="700" fill="#1A1A1A">110</text>
    <text x="24" y="252" font-size="13" font-weight="600" fill="#1A1A1A">Full-service (Loblaws / Sobeys / Metro)</text>
    <rect x="280" y="234" width="336" height="26" rx="6" fill="#1A1A1A"/>
    <text x="628" y="252" font-size="13" font-weight="700" fill="#1A1A1A">120</text>
  </g>
  <text x="24" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A 20% premium on a $160 staple week is $32  more than most loyalty offers pay.</text>
  <text x="24" y="332" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Community price-book pattern (PFC / RFD), not official Statistics Canada banner indexes. Produce and meat quality still vary by store.</text>
  <text x="24" y="368" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Cherry-picking sale proteins can flip a week. The rotation is for boring staples you buy every time.</text>
</svg>
