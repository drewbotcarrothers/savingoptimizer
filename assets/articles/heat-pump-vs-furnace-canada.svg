<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Cold-climate heat pump versus gas furnace roles in Canada</title>
  <desc id="desc">Three roles: a conventional air-source heat pump that leans on backup below about âˆ’10°C, a cold-climate model marketed to âˆ’25°C with a falling COP, and a hybrid dual-fuel setup common in Ontario and the Prairies. "Works to âˆ’25°C" is not a COP of 3 at âˆ’25°C.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">"Works to âˆ’25°C" is not a COP of 3 at âˆ’25°C</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Canadian cold-climate roles â€” not Sun Belt brochure math. COP is heat moved per kWh. Backup heat is the bill you forgot. 20 Sep 2026.</text>
  <rect x="24" y="78" width="216" height="230" rx="12" fill="#F3F4F6"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Conventional ASHP</text>
  <text x="40" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fine in shoulder seasons</text>
  <text x="40" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Capacity falls as it gets cold</text>
  <text x="40" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Backup strips or furnace take over</text>
  <text x="40" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">If backup is electric resistance,</text>
  <text x="40" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">January can look like baseboards.</text>
  <text x="40" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ask for capacity at âˆ’8 / âˆ’15°C.</text>
  <rect x="252" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Cold-climate ASHP</text>
  <text x="268" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Sized to keep heating at âˆ’25°C</text>
  <text x="268" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">COP still drops in the deep freeze</text>
  <text x="268" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Needs panel, siting, and defrost</text>
  <text x="268" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Marketing floor ` seasonal COP.</text>
  <text x="268" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Read the spec sheet at âˆ’15°C.</text>
  <text x="268" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ask: lockout temp and backup.</text>
  <rect x="480" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="496" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Hybrid / dual-fuel</text>
  <text x="496" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Heat pump + gas furnace</text>
  <text x="496" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Common in ON and the Prairies</text>
  <text x="496" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Switchover set by $ or °C</text>
  <text x="496" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Keeps existing ducts; adds an</text>
  <text x="496" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">outdoor unit and controls.</text>
  <text x="496" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ask: who sets the changeover.</text>
  <text x="24" y="340" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Federal Greener Homes Grant closed (documents by 31 Dec 2025). Loan applications closed; funding committed. OHPA intake closed 31 Jul 2026.</text>
  <text x="24" y="364" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Live money is provincial / utility stacks. A furnace-only replacement can still win if the panel, ducts, or cash cannot stretch this winter.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Educational comparison. Not a contractor quote or rebate approval. Re-check NRCan and your utility the week you sign.</text>
</svg>
