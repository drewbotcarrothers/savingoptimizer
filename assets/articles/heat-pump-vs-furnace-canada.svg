<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 473" role="img" aria-labelledby="title desc">
  <title id="title">Cold-climate heat pump versus gas furnace roles in Canada</title>
  <desc id="desc">Three roles: a conventional air-source heat pump that leans on backup below about −10°C, a cold-climate model marketed to −25°C with a falling COP, and a hybrid dual-fuel setup common in Ontario and the Prairies. "Works to −25°C" is not a COP of 3 at −25°C.</desc>
  <rect width="720" height="473" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">"Works to −25°C" is not a COP of 3 at −25°C</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">Canadian cold-climate roles — not Sun Belt brochure math. COP is heat moved per kWh. Backup heat is the </tspan><tspan x="24" dy="17.6">bill you forgot. 20 Sep 2026.</tspan></text>
  <rect x="24" y="78" width="216" height="230" rx="12" fill="#F3F4F6" transform="translate(0,17.6)"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Conventional ASHP</text>
  <text x="40" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Fine in shoulder seasons</text>
  <text x="40" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Capacity falls as it gets cold</text>
  <text x="40" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Backup strips or furnace take over</text>
  <text x="40" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">If backup is electric resistance,</text>
  <text x="40" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">January can look like baseboards.</text>
  <text x="40" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Ask for capacity at −8 / −15°C.</text>
  <rect x="252" y="78" width="216" height="230" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Cold-climate ASHP</text>
  <text x="268" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Sized to keep heating at −25°C</text>
  <text x="268" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">COP still drops in the deep freeze</text>
  <text x="268" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Needs panel, siting, and defrost</text>
  <text x="268" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Marketing floor ` seasonal COP.</text>
  <text x="268" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Read the spec sheet at −15°C.</text>
  <text x="268" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Ask: lockout temp and backup.</text>
  <rect x="480" y="78" width="216" height="230" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="496" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Hybrid / dual-fuel</text>
  <text x="496" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Heat pump + gas furnace</text>
  <text x="496" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Common in ON and the Prairies</text>
  <text x="496" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Switchover set by $ or °C</text>
  <text x="496" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Keeps existing ducts; adds an</text>
  <text x="496" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">outdoor unit and controls.</text>
  <text x="496" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Ask: who sets the changeover.</text>
  <text x="24" y="340" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">Federal Greener Homes Grant closed (documents by 31 Dec 2025). Loan applications closed; funding </tspan><tspan x="24" dy="17.6">committed. OHPA intake closed 31 Jul 2026.</tspan></text>
  <text x="24" y="364" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Live money is provincial / utility stacks. A furnace-only replacement can still win if the panel, ducts, or cash </tspan><tspan x="24" dy="17.6">cannot stretch this winter.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)">Educational comparison. Not a contractor quote or rebate approval. Re-check NRCan and your utility the week you sign.</text>
</svg>
