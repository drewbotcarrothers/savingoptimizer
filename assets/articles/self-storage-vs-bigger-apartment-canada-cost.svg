<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 489" role="img" aria-labelledby="title desc">
  <title id="title">Self-storage versus an extra bedroom in Toronto and Calgary</title>
  <desc id="desc">Toronto extra-bedroom gap using TRREB Q2 2026 one-bed $2,273 versus StatCan QRS two-bed asking $2,650 is $377. A labelled climate-controlled 5x10 is $220. Calgary two-bed asking $1,890 versus a labelled $1,550 one-bed is $340 versus $160 storage.</desc>
  <rect width="720" height="489" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Storage vs a bigger lease: the month you never exit</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">Toronto: TRREB 1-bed $2,273 vs StatCan QRS Q2 2026 2-bed ask $2,650. Calgary 2-bed ask $1,890 (Daily, 9 </tspan><tspan x="24" dy="17.6">Sep 2026).</tspan></text>
  <rect x="70" y="150" width="120" height="130" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="130" y="138" text-anchor="middle" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$220</text>
  <text x="130" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">TO 5x10*</text>
  <rect x="220" y="118" width="120" height="162" fill="#1A1A1A" transform="translate(0,17.6)"/>
  <text x="280" y="106" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$377</text>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">TO extra bed</text>
  <rect x="390" y="186" width="120" height="94" fill="#4B9B74" transform="translate(0,17.6)"/>
  <text x="450" y="174" text-anchor="middle" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$160</text>
  <text x="450" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">YYC 5x10*</text>
  <rect x="540" y="126" width="120" height="154" fill="#6B7280" transform="translate(0,17.6)"/>
  <text x="600" y="114" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$340</text>
  <text x="600" y="302" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">YYC extra bed</text>
  <text x="24" y="348" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">*Storage bars are labelled 2026 operator bands (climate-controlled 5x10), not a quote. Add lock, admin, and </tspan><tspan x="24" dy="17.6">tenant-insurance riders.</tspan></text>
  <text x="24" y="372" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">24 months of $220 storage is $5,280 — often more than selling the sofa and paying one local move </tspan><tspan x="24" dy="17.6">($450-$900 studio/1-bed band).</tspan></text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)"><tspan x="24">Calgary 1-bed is a labelled $1,550 listing sketch so the $340 gap is honest about mix. Declutter first. Not a storage </tspan><tspan x="24" dy="16.2">brokerage.</tspan></text>
</svg>
