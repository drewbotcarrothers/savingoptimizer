<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
<title id="t">Pet-proofing: where the top-10 toxins usually live at home</title>
<desc id="d">A room-by-room checklist of the ten items on the Pet Poison Helpline top-10 list as of 27 Sep 2026. Kitchen and pantry: chocolate, grapes and raisins, garlic and onions, xylitol in sugar-free products. Medicine cabinet and bags: ibuprofen, acetaminophen, vitamin D3 supplements. Garage, basement, and sheds: bromethalin and anticoagulant rodenticides. Stored anywhere: marijuana. If a pet eats one, call a veterinarian or a poison helpline.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Where the top-10 toxins usually live at home</text>
<text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Grouping by room is ours. The ten items are Pet Poison Helpline’s top-10 list, as of 27 Sep 2026.</text>
<rect x="24" y="70" width="330" height="140" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="36" y="92" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">Kitchen and pantry</text>
<text x="36" y="112" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Chocolate</text>
<text x="36" y="128" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Grapes and raisins (trail mix too)</text>
<text x="36" y="144" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Garlic and onions</text>
<text x="36" y="160" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Xylitol: read sugar-free labels</text>
<text x="36" y="198" font-family="Inter, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#0F7A4B">Closed cupboards; covered bins</text>
<rect x="366" y="70" width="330" height="140" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="378" y="92" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">Medicine cabinet and bags</text>
<text x="378" y="112" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Ibuprofen</text>
<text x="378" y="128" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Acetaminophen</text>
<text x="378" y="144" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Vitamin D3 supplements</text>
<text x="378" y="198" font-family="Inter, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#0F7A4B">Closed bottles, up high; bags zipped</text>
<rect x="24" y="220" width="330" height="140" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="36" y="242" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">Garage, basement, shed</text>
<text x="36" y="262" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Bromethalin rodenticides</text>
<text x="36" y="278" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Anticoagulant rodenticides</text>
<text x="36" y="348" font-family="Inter, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#0F7A4B">Bait where a pet cannot reach; keep the package</text>
<rect x="366" y="220" width="330" height="140" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="378" y="242" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">Anywhere it is stored</text>
<text x="378" y="262" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">• Marijuana</text>
<text x="378" y="348" font-family="Inter, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#0F7A4B">Store like the human medications</text>
<text x="24" y="388" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">If a pet eats any of these, call your veterinarian or a pet poison helpline now (numbers in the article).</text>
<text x="24" y="403" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Road salt, antifreeze, and plants were not on that list; that does not make them safe. Not veterinary advice.</text>
</svg>
