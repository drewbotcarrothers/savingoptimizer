<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canada Greener Homes Grant and Loan status in 2026</title>
  <desc id="desc">Grant closed to new applicants with a 31 Dec 2025 document deadline. Loan applications closed 1 Oct 2025 and funding is fully committed. Approved files continue. Live money is provincial or utility.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Greener Homes in 2026: closed doors, open files</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">NRCan status used 20 Sep 2026. Do not apply from a 2023 blog. Approved files still move.</text>
  <rect x="24" y="78" width="216" height="230" rx="12" fill="#F3F4F6"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Grant (CGHG)</text>
  <text x="40" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">New apps closed Feb 2024</text>
  <text x="40" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Last document day:</text>
  <text x="40" y="184" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">31 Dec 2025</text>
  <text x="40" y="220" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">On-time uploads still</text>
  <text x="40" y="238" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">get processed. No new file.</text>
  <text x="40" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Portal: existing applicants only.</text>
  <rect x="252" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Loan (CGHL)</text>
  <text x="268" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Last apply day: 1 Oct 2025</text>
  <text x="268" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Funding fully committed</text>
  <text x="268" y="184" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">NRCan page 17 Apr 2026</text>
  <text x="268" y="220" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Approved loans stay open.</text>
  <text x="268" y="238" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Finish work. Post-EnerGuide.</text>
  <text x="268" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Portal: cghli.ca (approved only).</text>
  <rect x="480" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="496" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">What to do instead</text>
  <text x="496" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Provincial / utility lists</text>
  <text x="496" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">OHPA intake closed</text>
  <text x="496" y="184" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">31 Jul 2026</text>
  <text x="496" y="220" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">EnerGuide is still a</text>
  <text x="496" y="238" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">decision tool, not a cheque.</text>
  <text x="496" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Re-verify the week you sign.</text>
  <text x="24" y="344" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">NRCan never door-knocks or asks for a loan deposit. Ignore 2023 grant tables in search results.</text>
  <text x="24" y="368" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Loan was $5,000-$40,000 interest-free over 10 years - history for approved files, not a new offer.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not a grant approval, loan offer, or contractor endorsement. Re-check natural-resources.canada.ca.</text>
</svg>
