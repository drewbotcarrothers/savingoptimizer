<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Insurance sequence from home purchase to the first renewal</title>
  <desc id="desc">Bind the dwelling policy before closing, set the limit from rebuild cost, choose water endorsements before move-in, update the auto address the week you move, review life insurance if people rely on your income, then review again after renovations. Not a quote.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Binder to first renewal</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">The lender's instruction letter sets the proof. 24 Sep 2026. Not a quote.</text>
  <rect x="24" y="80" width="100" height="48" rx="4" fill="#0F7A4B"/>
  <text x="36" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Bind</text>
  <rect x="136" y="80" width="100" height="48" rx="4" fill="#0F7A4B"/>
  <text x="148" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Rebuild</text>
  <rect x="248" y="80" width="100" height="48" rx="4" fill="#0F7A4B"/>
  <text x="260" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Water</text>
  <rect x="360" y="80" width="100" height="48" rx="4" fill="#0F7A4B"/>
  <text x="376" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Auto km</text>
  <rect x="472" y="80" width="100" height="48" rx="4" fill="#0F7A4B"/>
  <text x="496" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Life</text>
  <rect x="584" y="80" width="112" height="48" rx="4" fill="#0F7A4B"/>
  <text x="600" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF">Year one</text>
  <text x="24" y="168" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Purchase price, including land</text>
  <rect x="280" y="150" width="400" height="26" rx="4" fill="#D1D5DB"/>
  <text x="24" y="214" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Dwelling limit: rebuild the house</text>
  <rect x="280" y="196" width="260" height="26" rx="4" fill="#0F7A4B"/>
  <text x="24" y="268" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">The grey bar is the listing. The green bar is what a fire rebuilds.</text>
  <text x="24" y="310" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Lengths are a sketch. A Toronto lot can dwarf the building. A rural rebuild can exceed the price.</text>
  <text x="24" y="342" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sewer backup and overland flood are separate endorsements. Decide them before the truck unloads.</text>
  <text x="24" y="374" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Change the garaging postal code and commute kilometres the week you move, not at renewal.</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Life insurance is a needs question if people rely on your income. It is not the mortgage penalty.</text>
</svg>
