<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: pay shipping, keep a filler, or return it</title>
  <desc>Example with made-up inputs. Paying $8 shipping on a $46 item is $54. Adding a $14 filler you keep, with shipping then at $0, is $60. Returning the filler and paying a made-up $4 fee is $50. The bars are different heights.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">Example with made-up inputs: three ways to finish the order</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Out of pocket. The filler you keep is the highest bar. Not a retailer's quote.</text>
  <line x1="70" y1="300" x2="660" y2="300" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="110" y="138.0" width="90" height="162.0" fill="#0F7A4B"/>
  <text x="155" y="130.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">$54</text>
  <text x="155" y="322" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">Pay shipping</text>
  <text x="155" y="340" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Item $46 plus $8</text>
  <rect x="310" y="120.0" width="90" height="180.0" fill="#0F7A4B"/>
  <text x="355" y="112.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">$60</text>
  <text x="355" y="322" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">Keep the filler</text>
  <text x="355" y="340" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Filler $14, ship $0</text>
  <rect x="510" y="150.0" width="90" height="150.0" fill="#0F7A4B"/>
  <text x="555" y="142.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">$50</text>
  <text x="555" y="322" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">Return the filler</text>
  <text x="555" y="340" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Item $46 plus $4 fee</text>
  <text x="24" y="372" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Made-up inputs: $46 + $8 shipping = $54. Keep a $14 filler and pay $60.</text>
  <text x="24" y="390" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Return that filler and pay a made-up $4 fee: $46 + $4 = $50.</text>
  <text x="24" y="410" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 29 Sep 2026.</text>
</svg>
