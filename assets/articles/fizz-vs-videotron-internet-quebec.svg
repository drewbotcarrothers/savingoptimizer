<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Fizz vs Videotron 100 Mbps 24-month sketch</title>
  <desc id="desc">Illustrative Quebec 100 Mbps cable on the same Videotron plant: Fizz about $45 per month versus Videotron Internet 100 about $68 per month. Verify live. Drafted 21 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Same coaxial. Different bill and support.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Quebec 100 Mbps-class cable sketch, taxes extra. Verify at your address. 21 Sep 2026.</text>
  <rect x="48" y="88" width="300" height="236" rx="12" fill="#E7F4EE"/>
  <text x="198" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Fizz Internet 100</text>
  <text x="198" y="148" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">About $45 / month (public 2026 cards)</text>
  <text x="198" y="184" text-anchor="middle" font-size="28" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$1,080</text>
  <text x="198" y="210" text-anchor="middle" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">24 months before tax</text>
  <text x="198" y="242" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">App / chat support. Modem included.</text>
  <text x="198" y="262" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Loyalty $1 to $6 / mo (My Rewards).</text>
  <text x="198" y="282" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">60-day email notice if rates rise.</text>
  <rect x="372" y="88" width="300" height="236" rx="12" fill="#F3F4F6"/>
  <text x="522" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Videotron Internet 100</text>
  <text x="522" y="148" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">About $68 / month (public 2026 cards)</text>
  <text x="522" y="184" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1,632</text>
  <text x="522" y="210" text-anchor="middle" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">24 months before tax</text>
  <text x="522" y="242" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Phone, stores, Helix Fi gateway.</text>
  <text x="522" y="262" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TV / phone bundles if you want them.</text>
  <text x="522" y="282" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Higher tiers and fibre pockets.</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Gap about $552 over 24 months if both rates hold. Fizz legal notes (used 21 Sep 2026): modem rental included; pause $10, twice a year.</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Stay on Helix if you need a person on the phone, TV in the same stack, or a speed Fizz does not sell at your civic address.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Fizz.ca and Videotron.com prices change; run an address check before you cancel.</text>
</svg>
