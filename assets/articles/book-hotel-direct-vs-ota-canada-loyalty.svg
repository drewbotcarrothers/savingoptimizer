<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Portal gap versus one free night</title>
  <desc id="desc">Labelled four-night stay: portal 760 dollars, direct 800 dollars, a 40 dollar gap. One free night valued at 180 dollars is larger than the gap, so the rule books direct.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">A $40 gap is not a $180 night</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled four nights, same cancellation. Your free-night value replaces $180.</text>
  <text x="24" y="112" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Portal, four nights</text>
  <rect x="230" y="94" width="304" height="26" rx="4" fill="#9CA3AF"/>
  <text x="242" y="112" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$760</text>
  <text x="24" y="166" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Direct, four nights</text>
  <rect x="230" y="148" width="320" height="26" rx="4" fill="#0F7A4B"/>
  <text x="242" y="166" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$800</text>
  <text x="24" y="220" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Gap</text>
  <rect x="230" y="202" width="48" height="26" rx="4" fill="#0F7A4B"/>
  <text x="242" y="220" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$40</text>
  <text x="24" y="274" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">One free night</text>
  <rect x="230" y="256" width="180" height="26" rx="4" fill="#0F7A4B"/>
  <text x="242" y="274" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$180 value</text>
  <text x="24" y="330" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Gap smaller than the free night: book direct. If the free night is $0, take the $40.</text>
  <text x="24" y="354" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Count elite credit only if this stay reaches a tier you will use.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sketch for the 60-second rule. Not a live hotel rate.</text>
</svg>
