<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Monthly cost of asked increases on $2,400 rent</title>
  <desc id="desc">Ontario 2026 guideline is 2.1% (ontario.ca). Other bars are asks, not legal caps.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Monthly cost of asked increases on $2,400 rent</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Ontario 2026 guideline is 2.1% (ontario.ca). Other bars are asks, not legal caps.</text>
  <line x1="80" y1="310.0" x2="680" y2="310.0" stroke="#E5E7EB"/><text x="72" y="314.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text><line x1="80" y1="255.0" x2="680" y2="255.0" stroke="#E5E7EB"/><text x="72" y="259.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$65</text><line x1="80" y1="200.0" x2="680" y2="200.0" stroke="#E5E7EB"/><text x="72" y="204.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$130</text><line x1="80" y1="145.0" x2="680" y2="145.0" stroke="#E5E7EB"/><text x="72" y="149.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$195</text><line x1="80" y1="90.0" x2="680" y2="90.0" stroke="#E5E7EB"/><text x="72" y="94.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$260</text>
  <rect x="108.0" y="267.7" width="162.7" height="42.3" rx="8" fill="#0F7A4B"/><text x="189.3" y="257.7" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">+$50</text><text x="189.3" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2.1%</text><text x="189.3" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">ON guideline 2026</text><rect x="298.7" y="208.5" width="162.7" height="101.5" rx="8" fill="#4B9B74"/><text x="380.0" y="198.5" text-anchor="middle" font-size="13" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">+$120</text><text x="380.0" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">5%</text><text x="380.0" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">common exempt ask</text><rect x="489.3" y="106.9" width="162.7" height="203.1" rx="8" fill="#9CA3AF"/><text x="570.7" y="96.9" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+$240</text><text x="570.7" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">10%</text><text x="570.7" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">walk-away territory</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">BC’s 2026 limit is 2.3% for most residential tenancies. Québec has TAL rules, not this Ontario guideline. Comps decide whether you push back or pack.</text>
</svg>
