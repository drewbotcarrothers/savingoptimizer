<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Flow from Form T2201 Part A and Part B to a CRA decision</title>
  <desc>Part A is completed by the person with the impairment or a legal representative. Part B is completed only by a medical practitioner and is submitted to the CRA. If approved, prior-year adjustments may be requested and other programs that require the disability tax credit can be considered. If refused, the person can ask for a review or file an objection.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">T2201 path: Part A, Part B, then the CRA decision</text>
  <text x="24" y="52" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Digital form. Applicants do not complete Part B. As of 27 Sep 2026.</text>
  <rect x="24" y="78" width="150" height="64" rx="8" fill="#0F7A4B"/>
  <text x="99" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Part A</text>
  <text x="99" y="124" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF">You or a representative</text>
  <rect x="210" y="78" width="170" height="64" rx="8" fill="#0F7A4B"/>
  <text x="295" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Part B</text>
  <text x="295" y="124" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF">Medical practitioner only</text>
  <rect x="416" y="78" width="150" height="64" rx="8" fill="#1A1A1A"/>
  <text x="491" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">CRA decision</text>
  <path d="M174 110 H210" stroke="#0F7A4B" stroke-width="2" fill="none"/>
  <path d="M380 110 H416" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <rect x="40" y="190" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="56" y="216" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">Approved</text>
  <text x="56" y="242" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Claim the disability amount for the</text>
  <text x="56" y="258" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">years on the notice of determination.</text>
  <text x="56" y="282" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Ask for adjustments up to 10 years</text>
  <text x="56" y="298" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">if the box was not already checked.</text>
  <text x="56" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Then read what else requires the DTC.</text>
  <rect x="380" y="190" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="396" y="216" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Refused</text>
  <text x="396" y="242" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Write the tax centre and ask for</text>
  <text x="396" y="258" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">a review. Send medical information</text>
  <text x="396" y="274" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">that was not already provided.</text>
  <text x="396" y="298" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Or object no later than 90 days</text>
  <text x="396" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">after the notice is mailed.</text>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">The decision uses Part B. A targeted processing time is published on the how-to-apply page; this chart does not print a week count.</text>
  <text x="24" y="410" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">CRA how-to-apply page and Guide RC4064, Disability-Related Information 2025. As of 27 Sep 2026.</text>
</svg>
