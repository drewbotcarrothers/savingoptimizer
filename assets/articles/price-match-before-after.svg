<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Sample one-week grocery receipt before and after price matching</title>
  <desc id="desc">Bar chart comparing a $186 regular discounter basket with a $154 price-matched basket.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Sample week: list vs price-matched till</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative GTA household, identical 18-item staple list. Not a promise of savings.</text>
  <text x="86" y="92" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Paid at till ($)</text>
  <!-- grid -->
  <line x1="86" y1="110" x2="86" y2="310" stroke="#E5E7EB"/>
  <line x1="86" y1="310" x2="680" y2="310" stroke="#E5E7EB"/>
  <line x1="86" y1="260" x2="680" y2="260" stroke="#F3F4F6"/>
  <line x1="86" y1="210" x2="680" y2="210" stroke="#F3F4F6"/>
  <line x1="86" y1="160" x2="680" y2="160" stroke="#F3F4F6"/>
  <line x1="86" y1="110" x2="680" y2="110" stroke="#F3F4F6"/>
  <text x="78" y="314" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0</text>
  <text x="78" y="264" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">50</text>
  <text x="78" y="214" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">100</text>
  <text x="78" y="164" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">150</text>
  <text x="78" y="114" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">200</text>
  <!-- 186 / 200 * 200px = 186 -->
  <rect x="170" y="124" width="120" height="186" rx="8" fill="#6B7280"/>
  <text x="230" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$186</text>
  <text x="230" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Shelf prices</text>
  <text x="230" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">one discounter</text>
  <!-- 154 / 200 * 200 = 154; y = 310-154 = 156 -->
  <rect x="400" y="156" width="120" height="154" rx="8" fill="#0F7A4B"/>
  <text x="460" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$154</text>
  <text x="460" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">After matching</text>
  <text x="460" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">4 items, 4-unit cap</text>
  <text x="24" y="382" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Worked example: $32 saved (~17%). Time cost ~12 minutes of Flipp clipping. Skip if the extra drive exceeds the win.</text>
</svg>
