<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: tree cost by year 10</title>
<desc id="d">Horizontal bars for made-up running totals. Artificial tree $330 in every year. Real tree $65 in year 1, $195 in year 3, $325 in year 5, $520 in year 8 and $650 in year 10.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: tree cost by year 10</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Running total, artificial vs real</text>
<text x="240" y="105.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Artificial, any year</text>
<rect x="250" y="86.9" width="177.7" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="435.7" y="105.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$330</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Real, year 1</text>
<rect x="250" y="133.5" width="35.0" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="293.0" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$65</text>
<text x="240" y="198.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Real, year 3</text>
<rect x="250" y="180.2" width="105.0" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="363.0" y="198.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$195</text>
<text x="240" y="245.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Real, year 5</text>
<rect x="250" y="226.9" width="175.0" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="433.0" y="245.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$325</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Real, year 8</text>
<rect x="250" y="273.5" width="280.0" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="538.0" y="292.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$520</text>
<text x="240" y="338.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Real, year 10</text>
<rect x="250" y="320.2" width="350.0" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="338.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$650</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
