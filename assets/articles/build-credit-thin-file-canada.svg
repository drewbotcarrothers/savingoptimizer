<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Build a thin Canadian credit file without paid gimmicks</title>
  <desc id="desc">Order free Equifax and TransUnion reports, open one revolving account, pay on time for 6 to 12 months, and skip paid credit repair.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Thin file: grow it with boring habits</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Free reports first. One revolving trade line. No repair retainer. 22 Sep 2026.</text>
  <rect x="24" y="78" width="210" height="120" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Free disclosures</text>
  <text x="40" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Equifax + TransUnion</text>
  <text x="40" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Own request is soft</text>
  <text x="40" y="172" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Dispute errors yourself</text>
  <rect x="250" y="78" width="210" height="120" rx="12" fill="#F3F4F6"/>
  <text x="266" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. One revolving line</text>
  <text x="266" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Secured or starter card</text>
  <text x="266" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Pay in full on time</text>
  <text x="266" y="172" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Skip three applications</text>
  <rect x="476" y="78" width="220" height="120" rx="12" fill="#E7F4EE"/>
  <text x="492" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. 6–12 months</text>
  <text x="492" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">On-time every cycle</text>
  <text x="492" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Re-check before a loan</text>
  <text x="492" y="172" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Keep the oldest card</text>
  <rect x="24" y="220" width="672" height="140" rx="12" fill="#F3F4F6"/>
  <text x="40" y="252" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Skip</text>
  <text x="40" y="280" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Paid credit repair for accurate blanks or late marks. Score apps that promise a jump for a subscription.</text>
  <text x="40" y="304" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rent-reporting add-ons you have not verified against both bureaus. Trade-line rental marketplaces.</text>
  <text x="40" y="328" font-size="13" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Authorized user only when the primary card is clean and the issuer reports it.</text>
  <text x="24" y="394" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">FCAC free-report path. Education only. Not credit advice. Accent #0F7A4B.</text>
</svg>
