<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>EPRA environmental handling fee on a 30 to 45 inch display, 1 September 2026 schedule</title>
  <desc>Green bars show the EPRA fee for display devices 30 to 45 inches, including all-in-one computers, from the 1 September 2026 steward schedule. British Columbia 6.80 dollars, Saskatchewan 3.10, Manitoba 3.10, Quebec 8.50, New Brunswick 7.05, Nova Scotia 5.50, Prince Edward Island 5.50, Newfoundland and Labrador 9.05. Ontario and Alberta are dashes on that schedule and are omitted. Yukon is 24 dollars and the Northwest Territories 24.50, stated in the caption because they use a much higher scale.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">EHF on a 30-45 in. display, EPRA 1 Sep 2026</text>
  <text x="24" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Ontario and Alberta are dashes on this schedule. YT $24.00 and NT $24.50 are off this scale.</text>
