<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Zero-based month for a Canadian household</title>
  <desc id="desc">A labelled 6,200 dollar net month assigned to housing, utilities, food, kids, transport, insurance, savings, and an irregular envelope so unassigned cash is zero.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Assign the month until nothing is left</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled $6,200 net. Illustration only. Drafted 22 Sep 2026.</text>
  <rect x="24" y="76" width="672" height="36" rx="8" fill="#E7F4EE"/>
  <text x="40" y="99" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Net pay $6,200</text>
  <text x="180" y="99" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Unassigned after the jobs below: $0</text>
  <rect x="24" y="126" width="150" height="78" rx="8" fill="#E7F4EE"/>
  <text x="36" y="154" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Housing</text>
  <text x="36" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$2,430</text>
  <rect x="184" y="126" width="150" height="78" rx="8" fill="#E7F4EE"/>
  <text x="196" y="154" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Kids</text>
  <text x="196" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1,060</text>
  <rect x="344" y="126" width="150" height="78" rx="8" fill="#F3F4F6"/>
  <text x="356" y="154" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Groceries</text>
  <text x="356" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$750</text>
  <rect x="504" y="126" width="192" height="78" rx="8" fill="#F3F4F6"/>
  <text x="516" y="154" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Transport + car</text>
  <text x="516" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$490</text>
  <rect x="24" y="216" width="160" height="78" rx="8" fill="#F3F4F6"/>
  <text x="36" y="244" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Utilities + fuel</text>
  <text x="36" y="266" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$280</text>
  <rect x="196" y="216" width="150" height="78" rx="8" fill="#E7F4EE"/>
  <text x="208" y="244" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Savings</text>
  <text x="208" y="266" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$250</text>
  <rect x="358" y="216" width="150" height="78" rx="8" fill="#F3F4F6"/>
  <text x="370" y="244" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Insurance + phone</text>
  <text x="370" y="266" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$230</text>
  <rect x="520" y="216" width="176" height="78" rx="8" fill="#F3F4F6"/>
  <text x="532" y="244" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Household + irregular</text>
  <text x="532" y="266" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$310 + $400</text>
  <text x="24" y="328" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Housing includes a $280 property-tax sinking fund. Utilities include a $60 winter-fuel fund.</text>
  <text x="24" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sum: 2430 + 1060 + 750 + 490 + 280 + 250 + 230 + 310 + 400 = 6200.</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">FCAC budget worksheet is free. No subscription required. Education only.</text>
</svg>
