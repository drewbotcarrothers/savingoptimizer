<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Declutter cubic-foot savings on a Canadian local move</title>
  <desc id="desc">Labelled 2026 sketch: dropping a 2-bed from a 20-foot truck to a 16-foot truck or fewer crew hours by selling, donating, or trashing volume before movers price the job. 20 September 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Volume, not vibes  pay for fewer cubic feet</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Local 2-bed sketch. Public 2026 crew bands ~$120$180/hour. Not a quote. 20 Sep 2026.</text>
  <rect x="40" y="84" width="300" height="210" fill="#F3F4F6"/>
  <text x="190" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Keep everything</text>
  <text x="190" y="150" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">20-ft truck or 8 crew hours</text>
  <text x="190" y="178" text-anchor="middle" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Sofa you will replace</text>
  <text x="190" y="202" text-anchor="middle" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Books, dead IKEA, paint</text>
  <text x="190" y="226" text-anchor="middle" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Storage for later</text>
  <text x="190" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$1,200$1,600</text>
  <rect x="380" y="84" width="300" height="210" fill="#E7F4EE"/>
  <text x="530" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Two-week declutter</text>
  <text x="530" y="150" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">16-ft or 56 hours</text>
  <text x="530" y="178" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Sell bulky first</text>
  <text x="530" y="202" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Donate, curb, landfill</text>
  <text x="530" y="226" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Replace cheap at destination</text>
  <text x="530" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$750$1,100</text>
  <text x="24" y="330" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A $40 IKEA dresser that eats 8 cubic feet can cost more in truck time than a used replacement at the new city.</text>
  <text x="24" y="356" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Storage-unit temptation: $120$250/month in many Canadian metros plus a second move. Price the months you will actually store.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sketch only. Get three written quotes on the same post-declutter inventory. Quote platforms are an offer type.</text>
</svg>
