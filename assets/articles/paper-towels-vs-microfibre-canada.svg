<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Months until a microfibre pack matches Kirkland paper towel spend</title>
  <desc>Cumulative Kirkland paper towel cost at an illustrative 10 sheets a day, using 1.30 cents a sheet from the Costco East list posted 10 June 2026, beside the 22.69 dollar purchase price of a 36-cloth Kirkland pack on a Costco same-day listing checked 26 September 2026. Washing and cloth lifespan are not in the bars.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Paper spend versus one cloth pack</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Illustrative 10 sheets a day. Kirkland paper at 1.30 cents a sheet. Cloth line is the 22.69 dollar purchase only.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <rect x="24" y="68" width="12" height="12" fill="#0F7A4B"/>
    <text x="42" y="78" fill="#1A1A1A">Kirkland paper, cumulative</text>
    <rect x="250" y="68" width="12" height="12" fill="#9CA3AF"/>
    <text x="268" y="78" fill="#1A1A1A">36-cloth pack, 22.69 dollars, not yet washed</text>
  </g>
  <line x1="120" y1="100" x2="120" y2="340" stroke="#E5E7EB"/>
  <line x1="120" y1="340" x2="690" y2="340" stroke="#E5E7EB"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">
    <text x="112" y="344" text-anchor="end">$0</text>
    <text x="112" y="248" text-anchor="end">$20</text>
    <text x="112" y="152" text-anchor="end">$40</text>
    <line x1="120" y1="244" x2="690" y2="244" stroke="#E5E7EB"/>
    <line x1="120" y1="148" x2="690" y2="148" stroke="#E5E7EB"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">
    <text x="148" y="362" text-anchor="middle">Month 3</text>
    <rect x="132" y="284" width="28" height="56" fill="#0F7A4B"/>
    <rect x="164" y="231" width="28" height="109" fill="#9CA3AF"/>
    <text x="146" y="276" text-anchor="middle" font-size="11">$12</text>
    <text x="268" y="362" text-anchor="middle">Month 6</text>
    <rect x="252" y="227" width="28" height="113" fill="#0F7A4B"/>
    <rect x="284" y="231" width="28" height="109" fill="#9CA3AF"/>
    <text x="266" y="218" text-anchor="middle" font-size="11">$23</text>
    <text x="388" y="362" text-anchor="middle">Month 9</text>
    <rect x="372" y="171" width="28" height="169" fill="#0F7A4B"/>
    <rect x="404" y="231" width="28" height="109" fill="#9CA3AF"/>
    <text x="386" y="162" text-anchor="middle" font-size="11">$35</text>
    <text x="508" y="362" text-anchor="middle">Month 12</text>
    <rect x="492" y="115" width="28" height="225" fill="#0F7A4B"/>
    <rect x="524" y="231" width="28" height="109" fill="#9CA3AF"/>
    <text x="506" y="106" text-anchor="middle" font-size="11">$47</text>
  </g>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Scale: 48 dollars = 230 px. Bars round to the nearest dollar. Saving Optimizer, 26 Sep 2026. Not a national survey.</text>
</svg>
