<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Annual haircut cost, family of four</title>
  <desc>Example with made-up inputs. Annual cost for four people: booked often $1,664, stretched $1,040, mixed $715. Not average Canadian prices.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Annual haircut cost, family of four</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Example with made-up inputs. Not a price survey.</text>
  <text x="24" y="86" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Dollars a year</text>
  <line x1="70" y1="108" x2="70" y2="300" stroke="#E5E7EB"/>
  <line x1="70" y1="300" x2="690" y2="300" stroke="#E5E7EB"/>
  <line x1="70" y1="300.0" x2="690" y2="300.0" stroke="#E5E7EB"/>
  <text x="64" y="304.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0</text>
  <line x1="70" y1="252.0" x2="690" y2="252.0" stroke="#E5E7EB"/>
  <text x="64" y="256.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">500</text>
  <line x1="70" y1="204.0" x2="690" y2="204.0" stroke="#E5E7EB"/>
  <text x="64" y="208.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">1000</text>
  <line x1="70" y1="156.0" x2="690" y2="156.0" stroke="#E5E7EB"/>
  <text x="64" y="160.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">1500</text>
  <line x1="70" y1="108.0" x2="690" y2="108.0" stroke="#E5E7EB"/>
  <text x="64" y="112.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">2000</text>
  <rect x="212.0" y="140.3" width="100.0" height="159.7" rx="8" fill="#6B7280"/>
  <text x="262.0" y="132.3" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1,664</text>
  <text x="262.0" y="322.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Booked often</text>
  <rect x="340.0" y="200.2" width="100.0" height="99.8" rx="8" fill="#6B7280"/>
  <text x="390.0" y="192.2" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$1,040</text>
  <text x="390.0" y="322.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Stretched</text>
  <rect x="468.0" y="231.4" width="100.0" height="68.6" rx="8" fill="#0F7A4B"/>
  <text x="518.0" y="223.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$715</text>
  <text x="518.0" y="322.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Mixed</text>
  <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Booked often is 8 visits. Stretched is 5. Mixed adds a $45 clipper. All invented.</text>
</svg>
