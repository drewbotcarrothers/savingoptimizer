<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Illustrative pet emergency fund growth at three monthly amounts</title>
  <desc>Line chart of an illustrative 1200 dollar target. Two hundred dollars a month reaches it in 6 months, one hundred dollars in 12 months, and fifty dollars in 24 months. No interest. The target is not a veterinary fee. Checked 27 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Illustrative fund: $50, $100, and $200 a month</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Arithmetic on a $1,200 placeholder. No interest. Replace the target with your clinic's estimate.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">
    <line x1="24" y1="76" x2="48" y2="76" stroke="#0F7A4B" stroke-width="3"/>
    <text x="54" y="80">$200 / month</text>
    <line x1="180" y1="76" x2="204" y2="76" stroke="#1A1A1A" stroke-width="3"/>
    <text x="210" y="80">$100 / month</text>
    <line x1="340" y1="76" x2="364" y2="76" stroke="#6B7280" stroke-width="3"/>
    <text x="370" y="80">$50 / month</text>
  </g>
  <line x1="72" y1="100" x2="72" y2="320" stroke="#E5E7EB"/>
  <line x1="72" y1="320" x2="680" y2="320" stroke="#E5E7EB"/>
  <line x1="72" y1="100" x2="680" y2="100" stroke="#E5E7EB"/>
  <line x1="72" y1="210" x2="680" y2="210" stroke="#E5E7EB"/>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">
    <text x="66" y="324" text-anchor="end">$0</text>
    <text x="66" y="214" text-anchor="end">$600</text>
    <text x="66" y="104" text-anchor="end">$1,200</text>
    <text x="72" y="340" text-anchor="middle">0</text>
    <text x="224" y="340" text-anchor="middle">6</text>
    <text x="376" y="340" text-anchor="middle">12</text>
    <text x="528" y="340" text-anchor="middle">18</text>
    <text x="680" y="340" text-anchor="middle">24</text>
    <text x="376" y="362" text-anchor="middle">Months</text>
  </g>
  <polyline fill="none" stroke="#6B7280" stroke-width="3" points="72,320 224,265 376,210 528,155 680,100"/>
  <polyline fill="none" stroke="#1A1A1A" stroke-width="3" points="72,320 224,210 376,100 528,100 680,100"/>
  <polyline fill="none" stroke="#0F7A4B" stroke-width="3" points="72,320 224,100 376,100 528,100 680,100"/>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">$1,200 divided by 6, 12, and 24 is $200, $100, and $50. Not a published vet fee. Checked 27 Sep 2026.</text>
</svg>
