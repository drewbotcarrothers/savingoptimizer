<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Free trial cancel timeline</title>
  <desc id="desc">Day 0 is the screenshot. Seven days before the end is the reminder. Apple trials are cancelled at least 24 hours before they end.</desc>
  <rect width="720" height="360" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">One trial, three dates</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Apple Support (CA), published 14 Sep 2026: cancel at least 24 hours early.</text>
  <line x1="60" y1="160" x2="660" y2="160" stroke="#0F7A4B" stroke-width="4"/>
  <circle cx="80" cy="160" r="12" fill="#0F7A4B"/>
  <circle cx="360" cy="160" r="12" fill="#0F7A4B"/>
  <circle cx="640" cy="160" r="12" fill="#1A1A1A"/>
  <text x="48" y="128" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">Day 0</text>
  <text x="36" y="200" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Price, end</text>
  <text x="40" y="218" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">date, biller</text>
  <text x="300" y="128" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">7 days out</text>
  <text x="312" y="200" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Reminder</text>
  <text x="300" y="218" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Cancel now</text>
  <text x="560" y="128" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Trial ends</text>
  <text x="575" y="200" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Too late</text>
  <text x="568" y="218" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">for Apple</text>
  <text x="24" y="280" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Uninstalling does not cancel Apple or Google Play. Direct trials cancel on the vendor site.</text>
  <text x="24" y="318" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Start the next trial only after this one has a saved confirmation. 24 Sep 2026.</text>
</svg>
