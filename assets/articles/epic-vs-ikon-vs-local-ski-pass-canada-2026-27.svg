<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: cost per ski day</title>
<desc id="d">Horizontal bars showing a made-up $1,500 pass divided by days skied. 5 days $300 a day, 8 days $188, 10 days $150, 15 days $100, 20 days $75.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: cost per ski day</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Same $1,500 pass at different day counts</text>
<text x="240" y="110.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">5 days</text>
<rect x="250" y="88.6" width="350.0" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="110.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$300 a day</text>
<text x="240" y="166.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">8 days</text>
<rect x="250" y="144.6" width="219.3" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="477.3" y="166.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$188 a day</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">10 days</text>
<rect x="250" y="200.6" width="175.0" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="433.0" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$150 a day</text>
<text x="240" y="278.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">15 days</text>
<rect x="250" y="256.6" width="116.7" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="374.7" y="278.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$100 a day</text>
<text x="240" y="334.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">20 days</text>
<rect x="250" y="312.6" width="87.5" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="345.5" y="334.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$75 a day</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
