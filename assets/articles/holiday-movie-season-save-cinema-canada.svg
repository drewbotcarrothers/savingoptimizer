<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: family movie outing</title>
<desc id="d">Horizontal bars for a made-up family outing. Opening Saturday premium total $118 (tickets $88, snacks $30). Second Tuesday regular total $56 (tickets $36, snacks $20).</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: family movie outing</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Opening Saturday premium vs second Tuesday regular</text>
<text x="240" y="105.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Saturday premium, total</text>
<rect x="250" y="86.9" width="350.0" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="105.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$118</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Tuesday regular, total</text>
<rect x="250" y="133.5" width="166.1" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="424.1" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$56</text>
<text x="240" y="198.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Saturday tickets</text>
<rect x="250" y="180.2" width="261.0" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="519.0" y="198.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$88</text>
<text x="240" y="245.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Tuesday tickets</text>
<rect x="250" y="226.9" width="106.8" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="364.8" y="245.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$36</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Saturday snacks</text>
<rect x="250" y="273.5" width="89.0" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="347.0" y="292.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$30</text>
<text x="240" y="338.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Tuesday snacks</text>
<rect x="250" y="320.2" width="59.3" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="317.3" y="338.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$20</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
