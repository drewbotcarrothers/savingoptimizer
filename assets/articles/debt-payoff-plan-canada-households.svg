<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Household debt payoff order with a mortgage and kids</title>
  <desc id="desc">Keep one month of bills liquid and pay the mortgage as contracted. Send extra cash to high-rate cards first, then down the rate ladder. Keep a small registered skim.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Extra cash has a queue</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Mortgage PAD stays. Illustration only. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="128" height="210" rx="12" fill="#E7F4EE"/>
  <text x="36" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Buffer</text>
  <text x="36" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">One month</text>
  <text x="36" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">of must-pays</text>
  <text x="36" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">in a HISA</text>
  <text x="36" y="208" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Before extra</text>
  <text x="36" y="226" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">card payments.</text>
  <rect x="164" y="78" width="128" height="210" rx="12" fill="#E7F4EE"/>
  <text x="176" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">19%+ </text>
  <text x="176" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cards and</text>
  <text x="176" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">fee balances</text>
  <text x="176" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">first.</text>
  <text x="176" y="208" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">20.99% is a</text>
  <text x="176" y="226" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">benchmark only.</text>
  <rect x="304" y="78" width="128" height="210" rx="12" fill="#F3F4F6"/>
  <text x="316" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Then rates</text>
  <text x="316" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Car, then</text>
  <text x="316" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">HELOC principal.</text>
  <text x="316" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Interest-only</text>
  <text x="316" y="204" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">never finishes.</text>
  <rect x="444" y="78" width="128" height="210" rx="12" fill="#F3F4F6"/>
  <text x="456" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Keep going</text>
  <text x="456" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Mortgage PAD</text>
  <text x="456" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">as contracted.</text>
  <text x="456" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Match, plus a</text>
  <text x="456" y="204" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">small TFSA.</text>
  <rect x="584" y="78" width="112" height="210" rx="12" fill="#F3F4F6"/>
  <text x="596" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Pause</text>
  <text x="596" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Job loss,</text>
  <text x="596" y="156" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">medical,</text>
  <text x="596" y="176" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">furnace.</text>
  <text x="596" y="208" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Minimums</text>
  <text x="596" y="226" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">still get paid.</text>
  <text x="24" y="320" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Family loan at 0% needs a written date. It is last on interest math, not invisible.</text>
  <text x="24" y="342" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Quebec card minimum: at least 5% of the balance from 1 Aug 2025. Pacing, not a strategy.</text>
  <text x="24" y="364" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">No debt-settlement, payday, or credit-repair pitch. Education only.</text>
</svg>
