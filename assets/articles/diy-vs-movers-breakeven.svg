<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 489" role="img" aria-labelledby="title desc">
  <title id="title">DIY vs professional movers in Canada including hidden costs</title>
  <desc id="desc">Labelled local two-bedroom sketch: DIY truck plus time versus a two-person crew, with condo elevator and COI friction. 2026 industry ranges, not a quote.</desc>
  <rect width="720" height="489" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">DIY vs movers — count elevator time, not vibes</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">Labelled local 2-bed sketch, 16 Sep 2026. Industry bands often ~$120–$180/hr for two movers + truck; not </tspan><tspan x="24" dy="17.6">your quote.</tspan></text>
  <text x="160" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">DIY (example)</text>
  <rect x="80" y="108" width="160" height="36" fill="#6B7280" transform="translate(0,17.6)"/>
  <text x="160" y="132" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Truck + km $220</text>
  <rect x="80" y="144" width="160" height="24" fill="#9CA3AF" transform="translate(0,17.6)"/>
  <text x="160" y="161" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Waiver / ins. $90</text>
  <rect x="80" y="168" width="160" height="20" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="160" y="183" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Gear + food $70</text>
  <rect x="80" y="188" width="160" height="50" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="160" y="218" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Your time 16h × $25</text>
  <text x="160" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Cash $380 · + time $400</text>
  <text x="420" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Pros (example)</text>
  <rect x="340" y="108" width="160" height="90" fill="#1A1A1A" transform="translate(0,17.6)"/>
  <text x="420" y="158" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Crew 5h × $160 = $800</text>
  <rect x="340" y="198" width="160" height="24" fill="#4B9B74" transform="translate(0,17.6)"/>
  <text x="420" y="215" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Travel time $80</text>
  <rect x="340" y="222" width="160" height="16" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="420" y="234" text-anchor="middle" font-size="11" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">COI usually $0</text>
  <text x="420" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">H $880 + elevator risk</text>
  <text x="530" y="130" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Condo miss = second</text>
  <text x="530" y="152" font-size="13" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">trip at full hourly.</text>
  <text x="530" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Hybrid: you pack,</text>
  <text x="530" y="206" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">they lift the sofa.</text>
  <text x="24" y="300" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">Mid-size city studio: DIY often wins on cash. Downtown Toronto or Vancouver 2-bed with a booked freight </tspan><tspan x="24" dy="17.6">elevator: pros often win once you price backs and a missed slot.</tspan></text>
  <text x="24" y="348" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Long-distance is a different worksheet (fuel, hotels, one-way truck balance). Do not use this local bar for </tspan><tspan x="24" dy="17.6">Toronto–Vancouver.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)"><tspan x="24">Ranges from public 2026 mover explainers. Get three written quotes. Moving marketplaces and truck rentals are offer </tspan><tspan x="24" dy="16.2">types only — no claimed partnerships.</tspan></text>
</svg>
