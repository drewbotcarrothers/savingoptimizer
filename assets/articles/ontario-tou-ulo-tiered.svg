<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" role="img" aria-labelledby="title desc">
  <title id="title">Ontario RPP commodity prices: TOU vs ULO vs Tiered</title>
  <desc id="desc">OEB Regulated Price Plan commodity prices effective 1 November 2025: TOU 9.8 / 15.7 / 20.3 ¢/kWh, ULO overnight 3.9 ¢ and weekday 4–9 p.m. 39.1 ¢, Tiered 12.0 then 14.2 ¢/kWh. Delivery and the Ontario Electricity Rebate are separate.</desc>
  <rect width="720" height="472" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Ontario RPP commodity only (OEB, 1 Nov 2025)</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">Not your all-in bill. Delivery, regulatory charges, and the 23.5% Ontario Electricity Rebate sit on other lines. As </tspan><tspan x="24" dy="17.6">of 20 Sep 2026.</tspan></text>
  <rect x="24" y="78" width="216" height="248" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="40" y="106" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Time-of-Use</text>
  <text x="40" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Off-peak 9.8¢</text>
  <text x="40" y="160" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Mid-peak 15.7¢</text>
  <text x="40" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">On-peak 20.3¢</text>
  <text x="40" y="220" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Hours flip 1 May / 1 Nov.</text>
  <text x="40" y="244" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Weekends and holidays</text>
  <text x="40" y="262" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">are off-peak all day.</text>
  <text x="40" y="298" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Fits: shift laundry, dishwasher.</text>
  <rect x="252" y="78" width="216" height="248" rx="12" fill="#F3F4F6" transform="translate(0,17.6)"/>
  <text x="268" y="106" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Ultra-Low Overnight</text>
  <text x="268" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Overnight 3.9¢</text>
  <text x="268" y="160" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Weekend off-peak 9.8¢</text>
  <text x="268" y="184" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Mid-peak 15.7¢</text>
  <text x="268" y="208" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Weekday 4–9 p.m. 39.1¢</text>
  <text x="268" y="244" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Hours stay put year-round.</text>
  <text x="268" y="268" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Overnight win vs dinner-hour pain.</text>
  <text x="268" y="304" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Fits: EV / night shift loads.</text>
  <rect x="480" y="78" width="216" height="248" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="496" y="106" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Tiered</text>
  <text x="496" y="136" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">First block 12.0¢</text>
  <text x="496" y="160" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Above threshold 14.2¢</text>
  <text x="496" y="196" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Summer: first 600 kWh</text>
  <text x="496" y="214" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Winter: first 1,000 kWh</text>
  <text x="496" y="250" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Clock does not matter.</text>
  <text x="496" y="274" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Volume does.</text>
  <text x="496" y="304" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Fits: steady daytime use.</text>
  <text x="24" y="356" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">Run the OEB bill calculator with your LDC and 12 months of interval data before you file an election. A switch </tspan><tspan x="24" dy="17.6">lands at the start of a billing period.</tspan></text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Source: Ontario Energy Board electricity rates page, prices set 1 Nov 2025. Retailer contracts are a different product </tspan><tspan x="24" dy="16.2">and add Global Adjustment.</tspan></text>
</svg>
