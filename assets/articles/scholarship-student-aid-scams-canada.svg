<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: money lost to student aid fee scams</title>
<desc id="d">Bars show a $49 database fee, a $199 application service fee, a $350 loan forgiveness fee and a $598 total.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: money lost to student aid fee scams</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Three example fees for services that are free</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Scholarship database fee</text>
<rect x="250" y="93.0" width="28.7" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="286.7" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$49</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Aid application service</text>
<rect x="250" y="163.0" width="116.5" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="374.5" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$199</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Loan forgiveness fee</text>
<rect x="250" y="233.0" width="204.8" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="462.8" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$350</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Total lost</text>
<rect x="250" y="303.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$598</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
</svg>
