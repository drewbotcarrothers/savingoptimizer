<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Planning timeline for travelling with medication: six weeks, two weeks, departure, and abroad</title>
  <desc>A planning sequence, not a statutory deadline. About six weeks before departure, ask the plan and the pharmacist about a vacation supply and write the Ontario letter if the public plan's trip length applies. About two weeks before, put labelled medicine in carry-on and check the destination's import rules. At departure, declare medication to the screening officer. Abroad, a Canadian prescription may not be fillable and an Ontario Drug Benefit fill outside Ontario is not covered.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Medication timeline: plan, pack, fly, then abroad</text>
  <text x="24" y="52" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">A planning sequence. The only dated public-plan rule below is Ontario's. As of 27 Sep 2026.</text>
  <line x1="80" y1="130" x2="640" y2="130" stroke="#E5E7EB" stroke-width="4"/>
  <circle cx="100" cy="130" r="12" fill="#0F7A4B"/>
  <circle cx="270" cy="130" r="12" fill="#0F7A4B"/>
  <circle cx="450" cy="130" r="12" fill="#0F7A4B"/>
  <circle cx="620" cy="130" r="12" fill="#1A1A1A"/>
  <text x="100" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">6 weeks</text>
  <text x="270" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">2 weeks</text>
  <text x="450" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Departure</text>
  <text x="620" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Abroad</text>
  <text x="100" y="168" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Ask the plan</text>
  <text x="100" y="186" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">and pharmacist.</text>
  <text x="100" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Ontario public plan:</text>
  <text x="100" y="226" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">letter or insurance</text>
  <text x="100" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">copy for a long trip.</text>
  <text x="270" y="168" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Original labels.</text>
  <text x="270" y="186" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Carry-on, not</text>
  <text x="270" y="204" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">the checked bag.</text>
  <text x="270" y="228" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Ask the destination</text>
  <text x="270" y="244" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">about import rules.</text>
  <text x="450" y="168" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Declare medicine</text>
  <text x="450" y="186" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">at screening.</text>
  <text x="450" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Liquids you need</text>
  <text x="450" y="226" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">are outside the</text>
  <text x="450" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">100 ml rule.</text>
  <text x="620" y="168" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">A Canadian</text>
  <text x="620" y="186" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">prescription may</text>
  <text x="620" y="204" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">not be filled.</text>
  <text x="620" y="228" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">ODB does not pay</text>
  <text x="620" y="244" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">a fill outside Ontario.</text>
  <text x="24" y="300" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Six weeks and two weeks are planning marks on this chart, not deadlines printed by CATSA or Ontario.</text>
  <text x="24" y="328" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Travel medical insurance is a separate decision. Read the certificate, then the insurance guides.</text>
  <text x="24" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Carry a copy of the prescription with generic and trade names, and a note from the prescriber.</text>
  <text x="24" y="410" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Ontario.ca drug coverage page, updated 18 Aug 2026. CATSA. Travel.gc.ca. As of 27 Sep 2026.</text>
</svg>
