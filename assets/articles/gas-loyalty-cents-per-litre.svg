<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Effective cents per litre from Canadian gas loyalty stacks</title>
  <desc id="desc">Bar chart of illustrative cents-per-litre value: PC Optimum base, PC Mastercard, Petro-Points base, Petro-Points with RBC, Shell Scene+ base, and Shell with Scotiabank instant savings.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Same 40 L fill, six stacks - cents per litre, not brand loyalty</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Public Esso, Petro-Canada, and Shell pages reviewed 16 Sep 2026. Instant pump discounts beat points you might never burn.</text>
  <line x1="56" y1="88" x2="56" y2="300" stroke="#E5E7EB"/>
  <line x1="56" y1="300" x2="696" y2="300" stroke="#E5E7EB"/>
  <text x="48" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0 c/L</text>
  <text x="48" y="244" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">3 c/L</text>
  <text x="48" y="184" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">6 c/L</text>
  <text x="48" y="124" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">9 c/L</text>
  <!-- scale 9c = 212px -->
  <!-- 1c = 23.6; y=276 -->
  <rect x="70" y="276" width="88" height="24" rx="6" fill="#9CA3AF"/>
  <text x="114" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~1 c/L</text>
  <text x="114" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">PC base</text>
  <text x="114" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">10 pts/L</text>
  <!-- 3c = 71; y=229 -->
  <rect x="172" y="229" width="88" height="71" rx="6" fill="#4B9B74"/>
  <text x="216" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~3 c/L</text>
  <text x="216" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">PC + MC</text>
  <text x="216" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">30 pts/L</text>
  <!-- 1c Petro -->
  <rect x="274" y="276" width="88" height="24" rx="6" fill="#9CA3AF"/>
  <text x="318" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~1 c/L</text>
  <text x="318" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Petro base</text>
  <text x="318" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">10 pts/L</text>
  <!-- 7c = 165; y=135 -->
  <rect x="376" y="135" width="88" height="165" rx="6" fill="#0F7A4B"/>
  <text x="420" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">up to 7 c/L</text>
  <text x="420" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Petro + RBC</text>
  <text x="420" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">instant c/L</text>
  <!-- 1c Shell -->
  <rect x="478" y="276" width="88" height="24" rx="6" fill="#9CA3AF"/>
  <text x="522" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~1 c/L</text>
  <text x="522" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Shell Scene+</text>
  <text x="522" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">1 pt/L</text>
  <!-- 3c Shell Scotia -->
  <rect x="580" y="229" width="88" height="71" rx="6" fill="#4B9B74"/>
  <text x="624" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3 c/L+</text>
  <text x="624" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Shell + Scotia</text>
  <text x="624" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">linked Go+</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Points valued at published redemptions (PC 10,000 = $10; Petro-Points 1,000 = $1; Scene+ 1,000 = $10 at Shell). Insiders WE and V-Power can raise PC and Shell further - confirm live terms.</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Do not drive extra kilometres for a 1 c/L stack. The cheapest posted litre still wins if it is 5c cheaper down the street.</text>
</svg>
