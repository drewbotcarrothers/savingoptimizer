<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Alberta gas: monthly DRT vs a winter contract</title>
  <desc id="desc">Jan 2026 DRT prints were above $3/GJ commodity. Delivery is extra. 20 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Alberta gas: monthly DRT vs a winter contract</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Jan 2026 DRT prints were above $3/GJ commodity. Delivery is extra. 20 Sep 2026.</text>
  <rect x="24" y="78" width="216" height="140" rx="12" fill="#E7F4EE"/>
  <text x="40" y="106" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. What DRT is</text>
  <text x="40" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Default gas commodity.</text>
  <text x="40" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">AUC, changes monthly.</text>
  <text x="40" y="182" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Not RoLR electricity.</text>
  <rect x="252" y="78" width="216" height="140" rx="12" fill="#F3F4F6"/>
  <text x="268" y="106" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Fixed contracts</text>
  <text x="268" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Stability vs premium.</text>
  <text x="268" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Add admin + exit.</text>
  <text x="268" y="182" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">A $40 year is not a project.</text>
  <rect x="480" y="78" width="216" height="140" rx="12" fill="#E7F4EE"/>
  <text x="496" y="106" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Bundles</text>
  <text x="496" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Two UCA tabs first.</text>
  <text x="496" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cheap power, rich gas</text>
  <text x="496" y="182" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">is a common miss.</text>
  <rect x="24" y="234" width="216" height="140" rx="12" fill="#F3F4F6"/>
  <text x="40" y="262" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Forecast GJ</text>
  <text x="40" y="288" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Nov-Mar, this address.</text>
  <text x="40" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Do not annualize July.</text>
  <text x="40" y="338" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Stats beat one bill.</text>
  <rect x="252" y="234" width="216" height="140" rx="12" fill="#E7F4EE"/>
  <text x="268" y="262" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">5. Gas-only tool</text>
  <text x="268" y="288" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">¢, fee, term, exit.</text>
  <text x="268" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Postal code matters.</text>
  <text x="268" y="338" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Confirm the live row.</text>
  <rect x="480" y="234" width="216" height="140" rx="12" fill="#F3F4F6"/>
  <text x="496" y="262" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">6. Red flags</text>
  <text x="496" y="288" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cutoff scripts.</text>
  <text x="496" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Unclear exit dollars.</text>
  <text x="496" y="338" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">10-day cooling-off.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: UCA default-rates table and Cost Comparison Tool. Education only.</text>
</svg>
