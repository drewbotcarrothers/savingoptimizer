<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS fee over five years</title>
  <desc id="desc">NEXUS costs 120 US dollars, non-refundable, for five years, or 24 US dollars a year. Hours saved are the household's own number, not a published average.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The fee is fixed. The hours are yours.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">One paying adult. CBSA fee read 23 Sep 2026. Children under 18 can be $0.</text>
  <text x="24" y="118" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Five-year fee</text>
  <rect x="220" y="100" width="300" height="28" rx="4" fill="#0F7A4B"/>
  <text x="232" y="119" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$120 USD</text>
  <text x="24" y="178" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Per year</text>
  <rect x="220" y="160" width="60" height="28" rx="4" fill="#0F7A4B"/>
  <text x="232" y="179" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$24</text>
  <text x="24" y="238" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Hours saved</text>
  <rect x="220" y="220" width="360" height="28" rx="4" fill="#E5E7EB"/>
  <text x="232" y="239" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">your crossings x hours you actually get back</text>
  <text x="24" y="300" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Two adults are $240 USD. A land crossing counts once per car.</text>
  <text x="24" y="324" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">An airport line counts once per person. Do not triple-count one arrival.</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">One U.S. trip in five years rarely clears a non-refundable fee plus an interview.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Source: CBSA NEXUS fee pages. CAD depends on your card's U.S. dollar conversion.</text>
</svg>
