<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Labelled gym buyout comparison</title>
  <desc id="desc">An illustration, not a GoodLife fee: four months at 60 dollars is 240 dollars still owing. A written buyout of 150 dollars is lower. Use the number on your agreement.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Compare the buyout with the dues left</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustration. Not a published GoodLife price. 24 Sep 2026.</text>
  <rect x="140" y="100" width="150" height="200" rx="6" fill="#1A1A1A"/>
  <text x="176" y="90" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$240</text>
  <text x="156" y="324" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Dues left</text>
  <text x="160" y="342" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">4 x $60</text>
  <rect x="420" y="175" width="150" height="125" rx="6" fill="#0F7A4B"/>
  <text x="456" y="165" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$150</text>
  <text x="428" y="324" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Written buyout</text>
  <text x="448" y="342" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">if offered</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Pay a buyout only when it is smaller than the term and the end date is on the receipt.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Stopping the bank draft does not end the membership.</text>
</svg>
