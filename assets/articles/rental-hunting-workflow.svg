<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian rental hunting daily workflow</title>
  <desc id="desc">Six-step loop: alerts, filters, scam screen, verify ownership, viewing, tracking sheet. Kijiji, Facebook Marketplace, and PadMapper.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">A daily hunt beats a weekend binge</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Canada platforms, 16 Sep 2026. Good units in Toronto, Vancouver, and Montréal often disappear in hours.</text>
  <rect x="24" y="84" width="210" height="88" rx="10" fill="#E7F4EE"/>
  <text x="129" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Alerts on</text>
  <text x="129" y="142" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Kijiji + PadMapper +</text>
  <text x="129" y="160" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Marketplace saved search</text>
  <rect x="255" y="84" width="210" height="88" rx="10" fill="#F3F4F6"/>
  <text x="360" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Filter hard</text>
  <text x="360" y="142" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Price, beds, hydro, pets,</text>
  <text x="360" y="160" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">date available, map radius</text>
  <rect x="486" y="84" width="210" height="88" rx="10" fill="#F3F4F6"/>
  <text x="591" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3. Scam screen</text>
  <text x="591" y="142" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">No deposit before viewing.</text>
  <text x="591" y="160" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Too-cheap + overseas = skip</text>
  <rect x="24" y="196" width="210" height="88" rx="10" fill="#F3F4F6"/>
  <text x="129" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Verify</text>
  <text x="129" y="254" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Same-day in-person view.</text>
  <text x="129" y="272" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Keys, lobby, hydro meter</text>
  <rect x="255" y="196" width="210" height="88" rx="10" fill="#F3F4F6"/>
  <text x="360" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">5. Message script</text>
  <text x="360" y="254" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Name, dates, income proof</text>
  <text x="360" y="272" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">ready, ask for a slot today</text>
  <rect x="486" y="196" width="210" height="88" rx="10" fill="#0F7A4B"/>
  <text x="591" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">6. Track sheet</text>
  <text x="591" y="254" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Address, ask, follow-up,</text>
  <text x="591" y="272" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">ghost vs real, next step</text>
  <text x="24" y="328" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Expand the map radius only after three quiet days at your first-choice neighbourhoods  not after one bad evening.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Not legal advice. Platform names are how Canadians actually hunt in 2026; we do not claim Kijiji, Meta, or PadMapper partnerships.</text>
</svg>
