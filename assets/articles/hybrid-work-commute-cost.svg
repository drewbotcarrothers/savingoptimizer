<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
 <title id="title">Hybrid office days versus a five-day pass and stall</title>
 <desc id="desc">Grouped bars of TTC PRESTO fares plus a $200 parking placeholder at two, three, and five office days per week versus the $143 Adult 12-Month.</desc>
 <rect width="720" height="420" fill="#FFFFFF"/>
 <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">TTC + stall: hybrid is a different product</text>
 <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Adult PRESTO $3.30 / ~4.3 weeks. Ratehub $200 parking placeholder (29 Apr 2026). 12-Month $143 is fare only.</text>
 <line x1="80" y1="78" x2="80" y2="300" stroke="#E5E7EB"/>
 <line x1="80" y1="300" x2="680" y2="300" stroke="#E5E7EB"/>
 <text x="72" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
 <text x="72" y="249" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$150</text>
 <text x="72" y="194" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$300</text>
 <text x="72" y="139" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$450</text>
 <!-- scale $450=222px -->
 <!-- 2 day fare 57=28, park 200=99, total 257 -->
 <rect x="130" y="272" width="40" height="28" rx="4" fill="#0F7A4B"/>
 <rect x="178" y="201" width="40" height="99" rx="4" fill="#9CA3AF"/>
 <text x="174" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2 days</text>
 <text x="174" y="338" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">~$57 + stall</text>
 <!-- 3 day 86=42, 200=99 -->
 <rect x="300" y="258" width="40" height="42" rx="4" fill="#0F7A4B"/>
 <rect x="348" y="201" width="40" height="99" rx="4" fill="#9CA3AF"/>
 <text x="344" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3 days</text>
 <text x="344" y="338" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">~$86 + stall</text>
 <!-- 5 day cap 155=76, 200=99 -->
 <rect x="470" y="224" width="40" height="76" rx="4" fill="#0F7A4B"/>
 <rect x="518" y="201" width="40" height="99" rx="4" fill="#9CA3AF"/>
 <text x="514" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">5 days / cap</text>
 <text x="514" y="338" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$155 + stall</text>
 <rect x="80" y="362" width="14" height="14" rx="3" fill="#0F7A4B"/>
 <text x="100" y="374" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">PRESTO fares (PAYG / cap)</text>
 <rect x="280" y="362" width="14" height="14" rx="3" fill="#9CA3AF"/>
 <text x="300" y="374" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Parking $200 placeholder</text>
 <text x="24" y="404" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$143 12-Month is fare-only and still loses to 2-3 day PAYG. Drop the stall on hybrid weeks when the building allows. 20 Sep 2026.</text>
</svg>
