<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: points from one trip</title>
<desc id="d">Horizontal bars for made-up points: detergent 2,000, chicken 1,000, yogurt 500, bread 500.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: points from one trip</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Loaded offers used on list items</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Laundry detergent</text>
<rect x="250" y="93.0" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">2,000</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Chicken</text>
<rect x="250" y="163.0" width="175.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="433.0" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">1,000</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Yogurt</text>
<rect x="250" y="233.0" width="87.5" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="345.5" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">500</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Bread</text>
<rect x="250" y="303.0" width="87.5" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="345.5" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">500</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">10,000 points = $10.</text>
</svg>
