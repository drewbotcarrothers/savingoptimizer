<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Tank versus tankless water heaters in Canadian winter inlet water</title>
  <desc id="desc">Tankless units cut standby losses but lose flow when Canadian inlet water is about 5 C. Electric whole-house tankless is rarely practical. A high-efficiency tank can still win. Verified 20 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Tankless flow shrinks when Canadian inlet water is 5 C</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">NRCan Water Heater Guide: 15 L/min at 18 C inlet can fall to about 11 L/min at 5 C. 20 Sep 2026.</text>
  <rect x="70" y="110" width="80" height="170" fill="#E5E7EB"/>
  <text x="82" y="300" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">18 C inlet</text>
  <text x="88" y="158" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">15</text>
  <text x="82" y="176" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">L/min</text>
  <rect x="180" y="154" width="80" height="126" fill="#0F7A4B"/>
  <text x="198" y="300" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">5 C inlet</text>
  <text x="198" y="200" font-size="14" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">11</text>
  <text x="192" y="218" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">L/min</text>
  <rect x="300" y="88" width="196" height="210" rx="12" fill="#E7F4EE"/>
  <text x="316" y="116" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">What the upsell skips</text>
  <text x="316" y="144" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Gas vent and condensate</text>
  <text x="316" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Electric service upgrade</text>
  <text x="316" y="184" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Hard-water descaling</text>
  <text x="316" y="204" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Simultaneous showers</text>
  <text x="316" y="236" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Third path: heat-pump</text>
  <text x="316" y="256" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">water heater (space + drain)</text>
  <text x="316" y="280" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Keep a high-EF tank if install is steep.</text>
  <rect x="520" y="88" width="176" height="210" rx="12" fill="#F3F4F6"/>
  <text x="536" y="116" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">NRCan EF snapshot</text>
  <text x="536" y="148" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Gas tankless avg 0.85</text>
  <text x="536" y="168" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Gas tank avg 0.62</text>
  <text x="536" y="196" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Older listing averages.</text>
  <text x="536" y="216" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Read the live EnerGuide</text>
  <text x="536" y="236" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">or UEF on the quote.</text>
  <text x="536" y="268" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Install cost is not EF.</text>
  <text x="24" y="356" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A high-efficiency tank plus low-flow heads can beat a tankless that needed a panel upgrade and still showers slowly in January.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: NRCan Water Heater Guide (5 C inlet example); Energy Efficiency Regulations UEF for gas instantaneous. Education only.</text>
</svg>
