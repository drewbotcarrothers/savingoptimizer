<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Long-term disability claim timeline</title>
  <desc id="desc">File long-term disability forms during the elimination period. Sick leave and EI sickness may pay earlier months. EI sickness is up to 26 weeks in 2026. Appeal deadlines are on the denial letter.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The unpaid weeks are when you build the file</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Replace the day counts with your booklet. EI figures read 24 Sep 2026.</text>
  <rect x="24" y="78" width="160" height="64" rx="6" fill="#E7F4EE"/>
  <text x="36" y="106" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F7A4B">Week you stop</text>
  <text x="36" y="126" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F7A4B">Ask for the kit</text>
  <rect x="200" y="78" width="160" height="64" rx="6" fill="#128A56"/>
  <text x="212" y="106" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Sick leave / STD</text>
  <text x="212" y="126" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Check this first</text>
  <rect x="376" y="78" width="160" height="64" rx="6" fill="#0F7A4B"/>
  <text x="388" y="106" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">EI sickness</text>
  <text x="388" y="126" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Up to 26 weeks</text>
  <rect x="552" y="78" width="144" height="64" rx="6" fill="#1A1A1A"/>
  <text x="564" y="106" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">LTD starts</text>
  <text x="564" y="126" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFFFFF">If approved</text>
  <text x="24" y="180" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">2026 EI maximum on Canada.ca: 55 percent, up to $729 a week. Taxable. Often offset.</text>
  <text x="24" y="210" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Employer-paid LTD premium: the benefit is generally taxable. Ask for withholding.</text>
  <text x="24" y="240" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Denial: use the letter's deadline, then the company ombuds, then OLHI.</text>
  <text x="24" y="270" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">A partial return needs a written answer on residual pay and recurrence.</text>
  <text x="24" y="320" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not a claim service. Do the next form.</text>
</svg>
