<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">

  <title>Example with made-up inputs: price per 100 millilitres for ointment, cream, and lotion</title>
  <desc>Example with made-up inputs. Ointment 18 dollars per 100 millilitres, cream 8 dollars, lotion 3.50 dollars. Not shelf prices and not a ranking.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Example with made-up inputs: price per 100 mL</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Not a shelf price. A format you will not use is the costly one.</text>
  <text x="24" y="110" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Ointment</text>
  <rect x="140" y="92" width="400" height="26" fill="#6B7280"/>
  <text x="550" y="110" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">$18.00</text>
  <text x="24" y="160" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Cream</text>
  <rect x="140" y="142" width="178" height="26" fill="#0F7A4B"/>
  <text x="328" y="160" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">$8.00</text>
  <text x="24" y="210" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Lotion</text>
  <rect x="140" y="192" width="78" height="26" fill="#F59E0B"/>
  <text x="228" y="210" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">$3.50</text>
  <text x="24" y="270" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Sizes behind the rates: 100 mL at $18, 200 mL at $16, 400 mL at $14.</text>
  <text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">If the package is in grams, divide by grams. Do not mix the units.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 29 Sep 2026.</text>

</svg>
