<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Stack versus rotation, ad-supported year</title>
  <desc id="desc">Three ad-supported streamers all year are about 348 dollars before tax. Netflix all year plus four months of Disney Plus and three months of Crave is about 168 dollars.</desc>
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">A year of three logos, or one plus a slot</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Ad-supported prices checked 24 Sep 2026. Before tax. Rounded on the bars.</text>
  <rect x="140" y="90" width="140" height="230" rx="6" fill="#1A1A1A"/>
  <text x="168" y="82" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$348</text>
  <text x="156" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">All three</text>
  <text x="164" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">all year</text>
  <rect x="420" y="198" width="140" height="122" rx="6" fill="#0F7A4B"/>
  <text x="452" y="190" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$168</text>
  <text x="444" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Netflix year</text>
  <text x="430" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">plus a short slot</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Exact arithmetic: $347.64 stacked vs $167.81 rotated. Confirm live tiers before you join.</text>
  <text x="24" y="422" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Netflix $7.99, Disney+ $8.99, Crave $11.99. Sources are on the article.</text>
</svg>
