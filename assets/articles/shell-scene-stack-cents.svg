<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Shell Go+ Scene+ and card stack in cents per litre</title>
  <desc id="desc">Horizontal bars of illustrative Shell Canada stacks after the May 2026 nationwide Scene+ launch: base points, Go+ bonus, Scotiabank instant cents, V-Power extras, and CAA 3 cents.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Which Shell pieces you actually qualify for â€” ¢/L, 20 Sep 2026</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Nationwide Scene+ at participating Shell from 26 May 2026. Instant ¢/L is cash. Points valued at 1,000 = $10 at Shell. Confirm live Go+ and club terms.</text>
  <rect x="200" y="88" width="47" height="36" rx="6" fill="#9CA3AF"/>
  <text x="24" y="112" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Scene+ base (1 pt/L)</text>
  <text x="256" y="112" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">~1.0¢</text>
