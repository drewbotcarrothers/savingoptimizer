  <text x="24" y="356" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Do not add every bar. CAA terms (valid to 28 Feb 2027 in club copy reviewed Sep 2026) say combination is at Shell's discretion â€” test one fill.</text>
  <text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">V-Power only "wins" if you already buy premium. A 6¢ cheaper Petro-Canada or independent still beats a 3¢ Shell stack.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Scale: 1¢ H 47 px. Illustrative, not a quote. Air Miles at Shell is over.</text>
