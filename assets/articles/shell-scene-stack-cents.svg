  <text x="262" y="160" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">~1.1¢</text>
  <rect x="200" y="184" width="141" height="36" rx="6" fill="#0F7A4B"/>
  <text x="24" y="208" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">+ Scotia/Tangerine instant</text>
  <text x="352" y="208" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">+3.0¢ cash</text>
  <rect x="200" y="232" width="188" height="36" rx="6" fill="#0F7A4B"/>
  <text x="24" y="256" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">V-Power extra instant</text>
