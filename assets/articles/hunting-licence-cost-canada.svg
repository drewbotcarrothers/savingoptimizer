<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: first-year Ontario licences</title>
<desc id="d">Bars show the Outdoors Card at $8.57, small game at $22.76, deer at $43.86 and a total of $84.96 with HST.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: first-year Ontario licences</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Small game and deer, 2026 resident fees</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Outdoors Card</text>
<rect x="250" y="93.0" width="35.3" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="293.3" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$8.57</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Small game, 1 year</text>
<rect x="250" y="163.0" width="93.8" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="351.8" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$22.76</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Deer licence</text>
<rect x="250" y="233.0" width="180.7" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="438.7" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$43.86</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Total with 13% HST</text>
<rect x="250" y="303.0" width="350.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$84.96</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
</svg>
