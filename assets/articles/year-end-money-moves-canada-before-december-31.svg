<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Basic CESG by annual RESP contribution, per child</title>
<desc id="d">Bars: $1,000 contribution gets $200; $2,500 gets $500; $5,000 with unused grant room gets $1,000.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Basic CESG by annual RESP contribution, per child</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">20% grant, up to $500 a year, or $1,000 with unused room</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$1,000 contributed</text>
<rect x="250" y="104.7" width="70.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="328.0" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$200 CESG</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$2,500 contributed</text>
<rect x="250" y="198.0" width="175.0" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="433.0" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$500 CESG</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">$5,000, with unused room</text>
<rect x="250" y="291.3" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$1,000 CESG</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. ESDC CESG rules, basic grant only. As of 7 Oct 2026.</text>
</svg>
