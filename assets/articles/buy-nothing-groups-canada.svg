<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Buy Nothing flow: post, coordinate, porch pickup</title>
  <desc>Three green steps. Post an ask or a give, coordinate inside the group, then meet at a porch in daylight. No money changes hands under the gift rules.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">From the post to the porch</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Gift only. The Buy Nothing commitment opened 26 Sep 2026 bars selling, buying, trading, and bartering.</text>
  <rect x="36" y="110" width="190" height="150" rx="8" fill="#0F7A4B"/>
  <text x="131" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1. Post</text>
  <text x="131" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF">Ask or give</text>
  <text x="131" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF">in the group</text>
  <rect x="266" y="110" width="190" height="150" rx="8" fill="#0F7A4B"/>
  <text x="361" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2. Coordinate</text>
  <text x="361" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF">Time and place</text>
  <text x="361" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF">in the thread</text>
  <rect x="496" y="110" width="190" height="150" rx="8" fill="#0F7A4B"/>
  <text x="591" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3. Porch</text>
  <text x="591" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF">Daylight pickup</text>
  <text x="591" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF">No cash</text>
  <text x="24" y="310" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Winter method, not a temperature: daylight, a cleared path, stay outside, and do not enter the home.</text>
  <text x="24" y="348" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Cribs, car seats, and recalled goods are a Health Canada question. Search recalls-rappels.canada.ca before you take them.</text>
</svg>
