<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Order for using a Canadian workplace drug plan</title>
  <desc id="desc">Look the drug up on the formulary, start prior authorization if it is restricted, fill the maintenance supply the plan allows, and appeal a denial with clinical notes.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The counter is the last step</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Your formulary labels may differ. 25 Nov 2026.</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <rect x="24" y="84" width="150" height="88" rx="6" fill="#0F7A4B"/>
    <text x="36" y="116" fill="#FFFFFF">Look up</text>
    <text x="36" y="136" fill="#FFFFFF">the DIN</text>
    <rect x="198" y="84" width="150" height="88" rx="6" fill="#0F7A4B"/>
    <text x="210" y="116" fill="#FFFFFF">Authorize if</text>
    <text x="210" y="136" fill="#FFFFFF">restricted</text>
    <rect x="372" y="84" width="150" height="88" rx="6" fill="#0F7A4B"/>
    <text x="384" y="116" fill="#FFFFFF">Fill what the</text>
    <text x="384" y="136" fill="#FFFFFF">plan allows</text>
    <rect x="546" y="84" width="150" height="88" rx="6" fill="#0F7A4B"/>
    <text x="558" y="116" fill="#FFFFFF">Appeal with</text>
    <text x="558" y="136" fill="#FFFFFF">the notes</text>
  </g>
  <text x="24" y="220" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Preferred: covered at the normal percentage. Restricted: criteria first. Excluded: cash, unless an exception exists.</text>
  <text x="24" y="252" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">A brand spread and a dispensing fee over the cap are not coinsurance. They do not come back later.</text>
  <text x="24" y="300" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">Do not switch medicines to dodge a form. Ask the prescriber. File the form.</text>
  <text x="24" y="348" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Spouse plans and provincial programs can pay a remainder. They do not skip the formulary.</text>
</svg>
