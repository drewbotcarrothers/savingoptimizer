<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Window film and interior storm windows in Canada</title>
  <desc id="desc">Full window replacement is often a comfort and resale buy, not a fast bill ROI. Shrink film, interior storms, and cellular shades are the heating-season triage. Condensation risk matters. Heritage and rental rules limit what you can attach.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Window triage before a $20,000 package</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Canadian heating-season order. Film, then inserts, then replace. 20 Sep 2026.</text>
  <rect x="24" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">This winter</text>
  <text x="40" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Lock the sash; weatherstrip</text>
  <text x="40" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Shrink film on the worst panes</text>
  <text x="40" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Heavy curtains at night</text>
  <text x="40" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Watch condensation between</text>
  <text x="40" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">film and glass - vent if it ices.</text>
  <text x="40" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Undoes in April. Renter-friendly.</text>
  <rect x="252" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Middle path</text>
  <text x="268" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Interior acrylic / glass storms</text>
  <text x="268" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Magnetic or track inserts</text>
  <text x="268" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cellular / honeycomb shades</text>
  <text x="268" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Better air seal than film</text>
  <text x="268" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Still not a new window.</text>
  <text x="268" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Heritage-friendly if reversible.</text>
  <rect x="480" y="78" width="216" height="230" rx="12" fill="#F3F4F6"/>
  <text x="496" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Replace when</text>
  <text x="496" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Failed sealed unit (fog)</text>
  <text x="496" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rotting sash / unsafe</text>
  <text x="496" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Wall is open anyway</text>
  <text x="496" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Comfort / street appeal /</text>
  <text x="496" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">resale - not fast $/kWh.</text>
  <text x="496" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Attic first if it is empty.</text>
  <text x="24" y="344" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">South glass: winter sun is free heat; summer film or shades cut gain. Know the season you are buying.</text>
  <text x="24" y="368" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Renters and heritage: reversible only. Do not caulk a listed sash shut.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">NRCan home energy-efficiency; BC Hydro conservation context. Education only. Not a renovation bid.</text>
</svg>
