<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Labelled loyalty discount versus the premium you pay</title>
  <desc id="desc">In a labelled illustration the loyalty percentage rises from 10 percent to 12 percent while the amount paid still increases, and a same-cover quote is lower in the third year.</desc>
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Loyalty percentage up, cheque still up</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled illustration. Not your renewal. 23 Sep 2026.</text>
  <text x="80" y="96" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Amount paid if you stay</text>
  <rect x="100" y="210" width="80" height="130" rx="6" fill="#0F7A4B"/>
  <text x="108" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Year 0</text>
  <text x="104" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">$1,620</text>
  <rect x="240" y="184" width="80" height="156" rx="6" fill="#0F7A4B"/>
  <text x="248" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Year 1</text>
  <text x="244" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">$1,800</text>
  <rect x="380" y="164" width="80" height="176" rx="6" fill="#1A1A1A"/>
  <text x="388" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Year 2</text>
  <text x="384" y="156" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">$1,936</text>
  <rect x="520" y="200" width="80" height="140" rx="6" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="524" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Quote</text>
  <text x="524" y="192" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F7A4B">$1,760</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Sticker moves 10% to 12%. Year-2 stay ($1,936) still loses to a same-cover quote ($1,760).</text>
  <text x="24" y="424" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">The clean claims record can be re-underwritten. The old loyalty percentage does not transfer.</text>
</svg>
