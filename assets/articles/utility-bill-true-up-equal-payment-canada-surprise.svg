<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">How Canadian utility equal-payment true-ups sneak up</title>
  <desc id="desc">True-ups happen when installments lag actual use and rates. Read the cumulative plan balance before the anniversary. Request a mid-year reset after a renovation or EV. A sinking fund is the DIY version of equal billing.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">True-up shock is a lag, not a scam</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Enbridge EMPP, FortisBC EPP, Ontario LDC budget plans. 20 Sep 2026.</text>
  <rect x="80" y="200" width="36" height="80" fill="#E5E7EB"/>
  <rect x="128" y="160" width="36" height="120" fill="#E5E7EB"/>
  <rect x="176" y="100" width="36" height="180" fill="#0F7A4B"/>
  <rect x="224" y="88" width="36" height="192" fill="#0F7A4B"/>
  <rect x="272" y="130" width="36" height="150" fill="#E5E7EB"/>
  <rect x="320" y="190" width="36" height="90" fill="#E5E7EB"/>
  <line x1="70" y1="168" x2="370" y2="168" stroke="#0F7A4B" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="80" y="310" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Jul</text>
  <text x="176" y="310" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Nov</text>
  <text x="224" y="310" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Jan</text>
  <text x="80" y="328" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Bars = actual. Dash = installment.</text>
  <rect x="400" y="78" width="296" height="230" rx="12" fill="#E7F4EE"/>
  <text x="416" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Before anniversary</text>
  <text x="416" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1. Read plan balance</text>
  <text x="416" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Compare Jan kWh or m3</text>
  <text x="416" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3. Ask for a mid-year reset</text>
  <text x="416" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Enbridge: large miss can roll</text>
  <text x="416" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">into next year's EMPP.</text>
  <text x="416" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cancel = true-up now.</text>
  <text x="24" y="360" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cold winter + a rate increase = compounding underpayment. A sinking fund is the DIY equal plan.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: Enbridge EMPP, FortisBC EPP. Education only. Not enrolment advice.</text>
</svg>
