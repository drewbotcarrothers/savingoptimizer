<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Evo and Modo days versus Ratehub ownership</title>
  <desc id="desc">Grouped bars at 2, 4, 8, and 12 days comparing Evo day rates, Modo Day Tripper, and Ratehub $1,373 average ownership.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Vancouver: days you drive, not the logo you like.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Evo $104.99/day + $1.85 fee (evo.ca/rates, 20 Sep 2026). Modo Day Tripper $100. Ratehub $1,373 (29 Apr 2026). Tax extra.</text>
  <line x1="60" y1="330" x2="700" y2="330" stroke="#E5E7EB"/>
  <text x="24" y="120" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1,373</text>
  <line x1="80" y1="88" x2="700" y2="88" stroke="#E5E7EB" stroke-dasharray="4 4"/>
  <text x="130" y="350" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2 days</text>
  <rect x="100" y="292" width="18" height="38" fill="#0F7A4B"/>
  <rect x="122" y="294" width="18" height="36" fill="#4B9B74"/>
  <text x="290" y="350" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4 days</text>
  <rect x="260" y="254" width="18" height="76" fill="#0F7A4B"/>
  <rect x="282" y="258" width="18" height="72" fill="#4B9B74"/>
  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">8 days</text>
  <rect x="420" y="180" width="18" height="150" fill="#0F7A4B"/>
  <rect x="442" y="186" width="18" height="144" fill="#4B9B74"/>
  <text x="610" y="350" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">12 days</text>
  <rect x="580" y="104" width="18" height="226" fill="#0F7A4B"/>
  <rect x="602" y="114" width="18" height="216" fill="#4B9B74"/>
  <rect x="80" y="88" width="620" height="6" fill="#9CA3AF"/>
  <rect x="24" y="380" width="14" height="14" fill="#0F7A4B"/>
  <text x="44" y="392" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Evo day + fee</text>
  <rect x="160" y="380" width="14" height="14" fill="#4B9B74"/>
  <text x="180" y="392" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Modo Day Tripper</text>
  <rect x="320" y="380" width="14" height="14" fill="#9CA3AF"/>
  <text x="340" y="392" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ratehub financed average</text>
  <text x="520" y="392" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Replace ICBC and the stall.</text>
</svg>
