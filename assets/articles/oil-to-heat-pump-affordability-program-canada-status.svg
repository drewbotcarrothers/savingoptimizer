<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Oil to Heat Pump Affordability program status 2026</title>
  <desc id="desc">Federal OHPA intake closed 31 Jul 2026. Existing applicants upload documents by 31 Jan 2027. Program files through 31 Mar 2027. Off-grid and Nunavut homes were ineligible. Some provincial income-qualified paths remain.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">OHPA wind-down: closed intake, open files</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">NRCan page used 20 Sep 2026. Transitioning to Environment and Climate Change Canada.</text>
  <rect x="24" y="78" width="216" height="230" rx="12" fill="#F3F4F6"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Who it was for</text>
  <text x="40" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Oil-heated primary home</text>
  <text x="40" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">At or below median income</text>
  <text x="40" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">On an integrated grid</text>
  <text x="40" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Federal cheque up to $10,000</text>
  <text x="40" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">in direct-delivery provinces.</text>
  <text x="40" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">EnerGuide was not always required.</text>
  <rect x="252" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Federal clocks</text>
  <text x="268" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Last apply day:</text>
  <text x="268" y="160" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">31 Jul 2026</text>
  <text x="268" y="190" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Documents + paid work:</text>
  <text x="268" y="212" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">31 Jan 2027</text>
  <text x="268" y="246" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Program close: 31 Mar 2027</text>
  <text x="268" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Portal: existing applicants.</text>
  <rect x="480" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="496" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Still look here</text>
  <text x="496" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ON: Save on Energy EAP</text>
  <text x="496" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">income-qualified oil path</text>
  <text x="496" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Atlantic co-delivery clocks</text>
  <text x="496" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Nunavut / off-grid / some</text>
  <text x="496" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">remote QC: not eligible.</text>
  <text x="496" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Verify the live provincial page.</text>
  <text x="24" y="344" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">NRCan does not approve door-to-door heat-pump sellers. Homeowners apply themselves.</text>
  <text x="24" y="368" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Enquiries: enviroinfo@ec.gc.ca. Do not send a deposit to a stranger claiming to be NRCan.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not an approval, income test, or contractor quote. Re-check the NRCan OHPA page.</text>
</svg>
