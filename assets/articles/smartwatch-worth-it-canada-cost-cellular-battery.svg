<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: yearly cost over a four-year life</title>
<desc id="d">Bars: fitness band about $55 a year; $329 smartwatch about $82; cellular smartwatch with a made-up $10 monthly fee about $202.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: yearly cost over a four-year life</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up lifespan and carrier fee, before tax</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Fitness band (CA$219.95)</text>
<rect x="250" y="104.7" width="95.3" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="353.3" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">About $55/yr</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Smartwatch ($329)</text>
<rect x="250" y="198.0" width="142.1" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="400.1" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">About $82/yr</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Same watch + $10/mo cellular</text>
<rect x="250" y="291.3" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">About $202/yr</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 7 Oct 2026.</text>
</svg>
