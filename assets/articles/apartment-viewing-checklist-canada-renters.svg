<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian apartment viewing checklist that protects money</title>
  <desc id="desc">Four viewing buckets: building systems, lease inclusions, condition photos for the deposit, and questions that reveal fee or utility surprises before you sign.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">View like the lease is already spending your money</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Same-day notes beat a memory. 20 Sep 2026. Deposit rules still follow the province, not the listing slang.</text>
  <rect x="24" y="80" width="160" height="210" rx="12" fill="#E7F4EE"/>
  <text x="104" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Systems</text>
  <text x="36" y="142" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Water pressure</text>
  <text x="36" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Heat / AC run test</text>
  <text x="36" y="186" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Mould / moisture</text>
  <text x="36" y="208" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Noise at the window</text>
  <text x="36" y="230" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Outlets that work</text>
  <text x="36" y="252" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Laundry cycle time</text>
  <rect x="196" y="80" width="160" height="210" rx="12" fill="#0F7A4B"/>
  <text x="276" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Inclusions</text>
  <text x="208" y="142" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Heat / hydro / water</text>
  <text x="208" y="164" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Parking / locker</text>
  <text x="208" y="186" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Laundry in-suite?</text>
  <text x="208" y="208" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Who pays internet</text>
  <text x="208" y="230" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Submeter vs split</text>
  <text x="208" y="252" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Get it on the lease</text>
  <rect x="368" y="80" width="160" height="210" rx="12" fill="#F3F4F6"/>
  <text x="448" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Deposit proof</text>
  <text x="380" y="142" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Photos of every room</text>
  <text x="380" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Oven, caulk, floors</text>
  <text x="380" y="186" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">BC: ask for RTB-27</text>
  <text x="380" y="208" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">QC: no exacted deposit</text>
  <text x="380" y="230" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">ON: LMR ` damage</text>
  <text x="380" y="252" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Timestamp the album</text>
  <rect x="540" y="80" width="156" height="210" rx="12" fill="#1A1A1A"/>
  <text x="618" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Ask today</text>
  <text x="552" y="142" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Last winter hydro?</text>
  <text x="552" y="164" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Upcoming specials?</text>
  <text x="552" y="186" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Guest / pet rules?</text>
  <text x="552" y="208" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Move-in elevator?</text>
  <text x="552" y="230" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Who holds keys?</text>
  <text x="552" y="252" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Refuse junk fees</text>
  <text x="24" y="328" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A $80/month hydro surprise is $960/year  more than most first month free slogans. Measure for furniture so you do not buy a sofa that will not turn the stair.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Educational checklist. Confirm deposits on Tribunals Ontario, B.C. RTB, and TAL / C.c.Q. 1904. Not legal advice.</text>
</svg>
