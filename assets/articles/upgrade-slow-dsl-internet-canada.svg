<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">DSL upgrade shortlist</title>
  <desc id="desc">Confirm DSL-only, then compare fixed wireless, LTE or 5G home, satellite, and cable or fibre overbuilds. Drafted 22 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Another year of 5 Mbps is a choice</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Confirm copper-only, then shortlist exits. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="160" height="200" rx="12" fill="#F3F4F6"/>
  <text x="36" y="110" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1. Confirm</text>
  <text x="36" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Checkers + map</text>
  <text x="36" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ILEC technologies</text>
  <rect x="196" y="78" width="160" height="200" rx="12" fill="#E7F4EE"/>
  <text x="208" y="110" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">2. Wireless</text>
  <text x="208" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">WISP survey</text>
  <text x="208" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">LTE / 5G home</text>
  <rect x="368" y="78" width="160" height="200" rx="12" fill="#E7F4EE"/>
  <text x="380" y="110" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Satellite</text>
  <text x="380" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">LEO live CAD</text>
  <text x="380" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Hardware return?</text>
  <rect x="540" y="78" width="156" height="200" rx="12" fill="#E7F4EE"/>
  <text x="552" y="110" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">4. Wire</text>
  <text x="552" y="140" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cable overbuild</text>
  <text x="552" y="164" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">UBF fibre date</text>
  <rect x="24" y="300" width="672" height="72" rx="12" fill="#0F7A4B"/>
  <text x="40" y="334" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Price light vs heavy household needs. Renewing DSL on autopilot is optional.</text>
  <text x="40" y="358" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Education only. Confirm live availability.</text>
  <text x="24" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">50/10 Mbps is a policy yardstick, not your guaranteed install.</text>
</svg>
