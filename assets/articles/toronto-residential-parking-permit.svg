<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Toronto residential parking permit fees versus private spots</title>
  <desc id="desc">Monthly cost of City of Toronto 2026 residential permit tiers versus a rented condo stall and a couple of parking tickets.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Toronto street permit vs a paid stall</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">City of Toronto 2026 fees + HST. Condo rent is a labelled band. Reviewed 20 Sep 2026.</text>
  <line x1="56" y1="80" x2="56" y2="290" stroke="#E5E7EB"/>
  <line x1="56" y1="290" x2="680" y2="290" stroke="#E5E7EB"/>
  <text x="48" y="294" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="48" y="224" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$100</text>
  <text x="48" y="154" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$200</text>
  <text x="48" y="94" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$300</text>
  <rect x="78" y="258" width="72" height="32" fill="#0F7A4B"/>
  <rect x="188" y="218" width="72" height="72" fill="#4B9B74"/>
  <rect x="298" y="196" width="72" height="94" fill="#6B7280"/>
  <rect x="408" y="118" width="72" height="172" fill="#9CA3AF"/>
  <rect x="518" y="206" width="72" height="84" fill="#C4C4C4"/>
  <text x="114" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1st vehicle</text>
  <text x="114" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$27.38</text>
  <text x="224" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2nd vehicle</text>
  <text x="224" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$79.50</text>
  <text x="334" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">On-site access</text>
  <text x="334" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$110.71</text>
  <text x="444" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Condo rent</text>
  <text x="444" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$150$300+</text>
  <text x="554" y="310" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2 tickets</text>
  <text x="554" y="326" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">~$60$120</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">First-vehicle permit $24.23 + 13% HST = $27.38/month when you have no on-site parking. Convenience rate $97.97 + HST if a driveway or stall exists.</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Two $30$60 tags erase the cheap permit. A wait-listed street is not $27  it is Green P or a rented stall. Confirm the live city fee table.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Source: City of Toronto residential on-street parking 2026 fees page. Condo rent band from companion parking guide.</text>
</svg>
