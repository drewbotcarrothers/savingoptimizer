<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 437" role="img">
  <title>Which dental program to ask about before a denture quote</title>
  <desc>A flow from program check to quote, preauthorization, fit, and follow-up. Start with the Canadian Dental Care Plan if enrolled, the Ontario Seniors Dental Care Program if enrolled in Ontario, a workplace plan if you have one, or cash. Implant-supported dentures are excluded from the CDCP.</desc>
  <rect width="720" height="437" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Ask which program pays before you book the impressions</text>
  <text x="24" y="52" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Order of questions, not a promise that two programs pay the same tooth.</text>
  <rect x="24" y="74" width="160" height="78" rx="4" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="104" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Which plan</text>
  <text x="104" y="116" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CDCP, OSDCP,</text>
  <text x="104" y="132" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">workplace, or cash</text>
  <rect x="208" y="74" width="160" height="78" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="288" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Written quote</text>
  <text x="288" y="116" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Type, arch, lab,</text>
  <text x="288" y="132" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">and follow-up visits</text>
  <rect x="392" y="74" width="160" height="78" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="472" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3. Preauthorization</text>
  <text x="472" y="116" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Partial dentures: yes</text>
  <text x="472" y="132" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">before the first one</text>
  <rect x="536" y="174" width="160" height="78" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="616" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Fit</text>
  <text x="616" y="216" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CDCP fee includes</text>
  <text x="616" y="232" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3 months of care</text>
  <rect x="352" y="274" width="160" height="78" rx="4" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="432" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">5. Follow-up</text>
  <text x="432" y="316" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Reline: 1 per arch</text>
  <text x="432" y="332" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">in any 24 months</text>
  <path d="M184 113 H208" stroke="#6B7280" fill="none" stroke-width="1.5"/>
  <path d="M368 113 H392" stroke="#6B7280" fill="none" stroke-width="1.5"/>
  <path d="M552 113 H616 V174" stroke="#6B7280" fill="none" stroke-width="1.5"/>
  <path d="M616 252 V313 H512" stroke="#6B7280" fill="none" stroke-width="1.5"/>
  <text x="24" y="390" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif"><tspan x="24">Implant-supported dentures are a CDCP exclusion. OSDCP dentures are partial. Confirm both before you choose a </tspan><tspan x="24" dy="16.2">provider.</tspan></text>
</svg>
