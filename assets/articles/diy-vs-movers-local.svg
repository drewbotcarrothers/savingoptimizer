<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Local move: labelled DIY vs pro ranges (not quotes)</title>
  <desc id="desc">Industry public ranges compiled 16 Sep 2026. Confirm three written quotes.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Local move: labelled DIY vs pro ranges (not quotes)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Industry public ranges compiled 16 Sep 2026. Confirm three written quotes.</text>
  <line x1="80" y1="310.0" x2="680" y2="310.0" stroke="#E5E7EB"/><text x="72" y="314.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text><line x1="80" y1="255.0" x2="680" y2="255.0" stroke="#E5E7EB"/><text x="72" y="259.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$450</text><line x1="80" y1="200.0" x2="680" y2="200.0" stroke="#E5E7EB"/><text x="72" y="204.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$900</text><line x1="80" y1="145.0" x2="680" y2="145.0" stroke="#E5E7EB"/><text x="72" y="149.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1.4k</text><line x1="80" y1="90.0" x2="680" y2="90.0" stroke="#E5E7EB"/><text x="72" y="94.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$1.8k</text>
  <rect x="108.0" y="255.0" width="115.0" height="55.0" rx="8" fill="#9CA3AF"/><text x="165.5" y="245.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$450</text><text x="165.5" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Studio DIY</text><text x="165.5" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">truck + time</text><rect x="251.0" y="224.4" width="115.0" height="85.6" rx="8" fill="#4B9B74"/><text x="308.5" y="214.4" text-anchor="middle" font-size="13" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">~$700</text><text x="308.5" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Studio pro</text><text x="308.5" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">2 movers local</text><rect x="394.0" y="200.0" width="115.0" height="110.0" rx="8" fill="#4B9B74"/><text x="451.5" y="190.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">~$900</text><text x="451.5" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2-bed DIY</text><text x="451.5" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">hidden extras</text><rect x="537.0" y="114.4" width="115.0" height="195.6" rx="8" fill="#0F7A4B"/><text x="594.5" y="104.4" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$1,600</text><text x="594.5" y="332.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2-bed pro</text><text x="594.5" y="350.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">condo elevator</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Condo elevator bookings, COI, and mileage are why DIY ‘wins’ shrink after a 2-bedroom. Ranges are teaching bands, not a company’s bid.</text>
</svg>
