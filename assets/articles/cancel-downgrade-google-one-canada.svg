<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Storage in use compared with the free 15 GB Google quota</title>
  <desc id="desc">A labelled account using 80 GB cannot fall back to the free 15 GB without deleting or exporting first. Gmail, Drive, and Photos share that 15 GB.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Get under 15 GB before the paid plan ends</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled use. Your storage page is the number that matters.</text>
  <rect x="140" y="100" width="160" height="180" rx="6" fill="#1A1A1A"/>
  <text x="180" y="90" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">80 GB</text>
  <text x="168" y="304" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">In use now</text>
  <rect x="430" y="232" width="160" height="48" rx="6" fill="#0F7A4B"/>
  <text x="474" y="222" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">15 GB</text>
  <text x="462" y="304" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Free quota</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Over the free quota, Gmail, Drive, and Photos stop accepting new items.</text>
  <text x="24" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Google One help: benefits last until the end of the billing cycle, then each person keeps up to 15 GB.</text>
</svg>
