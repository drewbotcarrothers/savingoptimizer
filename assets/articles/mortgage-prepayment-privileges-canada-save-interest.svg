<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian mortgage prepayment privileges cut interest without a penalty</title>
  <desc id="desc">Use the annual lump-sum and payment-increase room in the commitment letter. Going over the privilege typically triggers IRD on a fixed or three months interest on a variable.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Use the privilege room. Do not invent extra room.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Common Canadian structures: 1020% lump sum per year plus a 1020% payment increase. Read your letter.</text>
  <rect x="40" y="84" width="200" height="120" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="140" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Lump-sum</text>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">e.g. 15% of original</text>
  <text x="140" y="168" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">principal each year</text>
  <rect x="260" y="84" width="200" height="120" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="360" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Payment increase</text>
  <text x="360" y="146" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">e.g. +15% of the</text>
  <text x="360" y="168" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">contract payment</text>
  <rect x="480" y="84" width="200" height="120" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="2"/>
  <text x="580" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Over the line</text>
  <text x="580" y="146" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Fixed: IRD risk</text>
  <text x="580" y="168" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Variable: ~3 months</text>
  <text x="24" y="240" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Labelled $400,000 / 25-year / 4.50% sketch</text>
  <text x="24" y="268" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Contract payment H $2,214/month. One $10,000 privilege lump in year 1 trims roughly $8,000$9,000 of lifetime interest if the term and rate hold  not a quote.</text>
  <text x="24" y="296" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Accelerated weekly or a 15% payment bump compounds more quietly than one bonus cheque you forget.</text>
  <text x="24" y="328" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Privilege % often resets at renewal. Ask whether it is of original or current balance before you send a wire.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Illustrative Canadian semi-annual compounding. Confirm the commitment. Used 20 Sep 2026. Not brokerage advice.</text>
</svg>
