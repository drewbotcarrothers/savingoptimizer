<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">TekSavvy Ontario Cable 100 credit cliff</title>
  <desc id="desc">Illustrative 24-month total for Ontario Cable 100 at 38.95 dollars for 12 months then 74.95 dollars, equalling 1366.80 dollars before tax.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The worth-it test is month 13</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Ontario Cable 100 sketch. Topicks.ca updated 11 Sep 2026. Taxes extra.</text>
  <rect x="48" y="88" width="200" height="200" rx="12" fill="#E7F4EE"/>
  <text x="148" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Months 1-12</text>
  <text x="148" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$38.95</text>
  <text x="148" y="184" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">with bill credit</text>
  <text x="148" y="220" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">12 x $38.95</text>
  <text x="148" y="244" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">= $467.40</text>
  <rect x="280" y="88" width="200" height="200" rx="12" fill="#F3F4F6"/>
  <text x="380" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Months 13-24</text>
  <text x="380" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$74.95</text>
  <text x="380" y="184" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">credit gone</text>
  <text x="380" y="220" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">12 x $74.95</text>
  <text x="380" y="244" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">= $899.40</text>
  <rect x="508" y="88" width="184" height="200" rx="12" fill="#0F7A4B"/>
  <text x="600" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">24 months</text>
  <text x="600" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$1,366.80</text>
  <text x="600" y="196" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">if you never re-shop</text>
  <text x="600" y="230" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Re-shop at month 11</text>
  <text x="600" y="248" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">and year two is optional</text>
  <text x="24" y="324" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Some plans are already flat. Some Chatham-Kent fibre tiers are a 24-month term with a $15-per-remaining-month ETF.</text>
  <text x="24" y="348" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Fibre 1.5 footnote on teksavvy.com (21 Sep 2026): $20/month credit for 12 months, then-current price currently $119.95.</text>
  <text x="24" y="372" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Comparison sites the same month also show $89.95 then $119.95. The address cart is the price. Do not average the two.</text>
  <text x="24" y="396" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Education only. Not a TekSavvy offer. Confirm live.</text>
</svg>
