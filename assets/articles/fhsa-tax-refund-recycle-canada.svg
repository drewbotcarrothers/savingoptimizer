<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">FHSA refund recycle loop</title>
  <desc id="desc">Contribution, deduction, refund, then redirect cash into the down-payment plan after buffer and debt checks.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">FHSA refund recycle loop</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">The refund is withheld tax returning. Drafted 22 Sep 2026.</text>
  <rect x="24" y="90" width="140" height="100" rx="12" fill="#E7F4EE"/>
  <text x="40" y="130" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Contribute</text>
  <text x="40" y="155" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Use FHSA room</text>
  <text x="172" y="140" font-size="20" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">→</text>
  <rect x="200" y="90" width="140" height="100" rx="12" fill="#E7F4EE"/>
  <text x="216" y="130" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">2. Deduct</text>
  <text x="216" y="155" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">On the return</text>
  <text x="348" y="140" font-size="20" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">→</text>
  <rect x="376" y="90" width="140" height="100" rx="12" fill="#F3F4F6"/>
  <text x="392" y="130" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">3. Refund</text>
  <text x="392" y="155" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Direct deposit</text>
  <text x="524" y="140" font-size="20" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">→</text>
  <rect x="552" y="90" width="144" height="100" rx="12" fill="#F3F4F6"/>
  <text x="564" y="130" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Redirect</text>
  <text x="564" y="155" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Same week</text>
  <text x="24" y="240" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Before step 4: fund a one-month buffer and attack 19%+ revolving debt if either is broken.</text>
  <text x="24" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Do not double-count: a deduction is not a second $8,000 of room.</text>
  <text x="24" y="292" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Labelled sketch: $8,000 at ~30% marginal relief ≈ $2,400 — not $8,000 cash back.</text>
  <text x="24" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not tax advice.</text>
  <text x="24" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Pair with FHSA carry-forward and refund triage guides.</text>
</svg>
