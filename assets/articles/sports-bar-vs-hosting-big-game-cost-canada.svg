<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: six friends</title>
<desc id="d">Bars for a made-up group of six: bar $85 per person (food $30, drinks $30, tax and tip $20, transport $5); home $28 per person from a $170 total.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: six friends</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Cost per person at a bar compared with hosting at home</text>
<text x="240" y="110.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Bar, per person</text>
<rect x="250" y="88.6" width="350.0" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="110.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$85</text>
<text x="240" y="166.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Home, per person</text>
<rect x="250" y="144.6" width="115.3" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="373.3" y="166.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$28</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Bar food</text>
<rect x="250" y="200.6" width="123.5" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="381.5" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$30</text>
<text x="240" y="278.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Bar drinks</text>
<rect x="250" y="256.6" width="123.5" height="34.7" rx="3" fill="#1A1A1A"/>
<text x="381.5" y="278.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$30</text>
<text x="240" y="334.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Bar tax and tip</text>
<rect x="250" y="312.6" width="82.4" height="34.7" rx="3" fill="#0F7A4B"/>
<text x="340.4" y="334.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$20</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
