<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canada EVAP incentive amounts 2026 to 2031</title>
  <desc id="desc">Declining federal EVAP point-of-sale incentives for battery-electric and plug-in hybrid vehicles through 2031.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">EVAP amounts fall each year (Transport Canada)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Incentive is based on the date the dealer submits the eligibility assessment, not delivery day.</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="12">
    <text x="80" y="250" text-anchor="middle" fill="#6B7280">2026</text>
    <rect x="50" y="90" width="60" height="140" rx="4" fill="#0F7A4B"/>
    <text x="80" y="82" text-anchor="middle" font-weight="700" fill="#1A1A1A">$5k</text>
    <rect x="50" y="195" width="60" height="35" rx="4" fill="#86C9A5"/>
    <text x="80" y="274" text-anchor="middle" fill="#0F7A4B">PHEV $2.5k</text>
    <text x="180" y="250" text-anchor="middle" fill="#6B7280">2027</text>
    <rect x="150" y="118" width="60" height="112" rx="4" fill="#0F7A4B"/>
    <text x="180" y="110" text-anchor="middle" font-weight="700" fill="#1A1A1A">$4k</text>
    <rect x="150" y="202" width="60" height="28" rx="4" fill="#86C9A5"/>
    <text x="280" y="250" text-anchor="middle" fill="#6B7280">2028-29</text>
    <rect x="250" y="146" width="60" height="84" rx="4" fill="#0F7A4B"/>
    <text x="280" y="138" text-anchor="middle" font-weight="700" fill="#1A1A1A">$3k</text>
    <rect x="250" y="209" width="60" height="21" rx="4" fill="#86C9A5"/>
    <text x="380" y="250" text-anchor="middle" fill="#6B7280">2030-31</text>
    <rect x="350" y="174" width="60" height="56" rx="4" fill="#0F7A4B"/>
    <text x="380" y="166" text-anchor="middle" font-weight="700" fill="#1A1A1A">$2k</text>
    <rect x="350" y="216" width="60" height="14" rx="4" fill="#86C9A5"/>
  </g>
  <rect x="470" y="90" width="226" height="160" rx="6" fill="#F3F4F6"/>
  <text x="486" y="116" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">2026 rules to remember</text>
  <text x="486" y="142" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">BEV/FCEV up to $5,000</text>
  <text x="486" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">PHEV up to $2,500</text>
  <text x="486" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">$50,000 final value cap</text>
  <text x="486" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">No cap if made in Canada</text>
  <text x="486" y="222" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Live 16 Feb 2026; funds first-come</text>
  <text x="24" y="320" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Dark green = BEV/FCEV. Light green = PHEV. PHEV 2027 $2,000; 2028-29 $1,500; 2030-31 $1,000.</text>
  <text x="24" y="342" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Funding: $2.275B over 5 years; $2.131B remaining as of 1 Jun 2026 (Transport Canada EVAP page).</text>
  <text x="24" y="364" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Replaced iZEV. One incentive per individual over the 5-year program.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer - Canada - 16 Sep 2026</text>
</svg>
