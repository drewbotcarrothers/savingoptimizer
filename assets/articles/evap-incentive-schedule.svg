<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Canada EVAP incentive amounts by year for BEV/FCEV and PHEV</title>
  <desc id="desc">Column chart of Transport Canada EVAP maximum incentives declining from 2026 through 2031.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">EVAP maximum incentive by calendar year</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Transport Canada program overview, reviewed 16 Sep 2026. Amount follows the eligibility-assessment date.</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">
    <line x1="80" y1="320" x2="680" y2="320" stroke="#E5E7EB"/>
    <line x1="80" y1="80" x2="80" y2="320" stroke="#E5E7EB"/>
    <text x="28" y="324">$0</text>
    <text x="16" y="244">$2k</text>
    <text x="16" y="164">$4k</text>
    <text x="16" y="84">$5k</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="12">
    <rect x="100" y="80" width="36" height="240" rx="3" fill="#0F7A4B"/>
    <rect x="140" y="200" width="36" height="120" rx="3" fill="#9CA3AF"/>
    <text x="108" y="340" fill="#1A1A1A">2026</text>
    <rect x="196" y="128" width="36" height="192" rx="3" fill="#0F7A4B"/>
    <rect x="236" y="224" width="36" height="96" rx="3" fill="#9CA3AF"/>
    <text x="204" y="340" fill="#1A1A1A">2027</text>
    <rect x="292" y="176" width="36" height="144" rx="3" fill="#0F7A4B"/>
    <rect x="332" y="248" width="36" height="72" rx="3" fill="#9CA3AF"/>
    <text x="300" y="340" fill="#1A1A1A">2028</text>
    <rect x="388" y="176" width="36" height="144" rx="3" fill="#0F7A4B"/>
    <rect x="428" y="248" width="36" height="72" rx="3" fill="#9CA3AF"/>
    <text x="396" y="340" fill="#1A1A1A">2029</text>
    <rect x="484" y="224" width="36" height="96" rx="3" fill="#0F7A4B"/>
    <rect x="524" y="272" width="36" height="48" rx="3" fill="#9CA3AF"/>
    <text x="492" y="340" fill="#1A1A1A">2030</text>
    <rect x="580" y="224" width="36" height="96" rx="3" fill="#0F7A4B"/>
    <rect x="620" y="272" width="36" height="48" rx="3" fill="#9CA3AF"/>
    <text x="588" y="340" fill="#1A1A1A">2031</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="12">
    <rect x="80" y="368" width="14" height="14" rx="2" fill="#0F7A4B"/>
    <text x="100" y="380" fill="#1A1A1A">BEV / FCEV ($5,000 ’ $2,000)</text>
    <rect x="360" y="368" width="14" height="14" rx="2" fill="#9CA3AF"/>
    <text x="380" y="380" fill="#1A1A1A">PHEV ($2,500 ’ $1,000)</text>
  </g>
</svg>
