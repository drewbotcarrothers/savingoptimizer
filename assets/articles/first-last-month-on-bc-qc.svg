<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Move-in cash for the same $2,200 rent in Ontario, B.C., and Québec</title>
  <desc id="desc">Labelled $2,200 rent sketch. Ontario: first month plus last-month rent deposit, about $4,400. B.C.: first month plus a security deposit capped at half a month ($1,100), about $3,300; a pet damage deposit can add another half month. Québec: typically first month only, about $2,200; classic damage deposits are generally not allowed.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Same $2,200 rent - three different move-in cheques</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">High-level, 20 Sep 2026. Not legal advice. Ontario last-month · B.C. half-month cap · Québec no classic deposit (C.c.Q. 1904 / TAL).</text>
  <rect x="36" y="100" width="208" height="220" rx="12" fill="#E7F4EE"/>
  <text x="140" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Ontario</text>
  <text x="140" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$4,400</text>
  <text x="140" y="196" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">First + last-month deposit</text>
  <text x="52" y="232" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">LMR is not a damage deposit</text>
  <text x="52" y="254" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2026 LMR interest 2.1%</text>
  <text x="52" y="276" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Key/holding extras: pause</text>
  <rect x="256" y="100" width="208" height="220" rx="12" fill="#0F7A4B"/>
  <text x="360" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">B.C.</text>
  <text x="360" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$3,300</text>
  <text x="360" y="196" text-anchor="middle" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">First + $1,100 security</text>
  <text x="272" y="232" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Cap: half a month</text>
  <text x="272" y="254" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Pet: another half max</text>
  <text x="272" y="276" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif">Not first and last</text>
  <rect x="476" y="100" width="208" height="220" rx="12" fill="#F3F4F6"/>
  <text x="580" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Québec</text>
  <text x="580" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$2,200</text>
  <text x="580" y="196" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">First month only (typical)</text>
  <text x="492" y="232" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No exacted deposit</text>
  <text x="492" y="254" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No last-month demand</text>
  <text x="492" y="276" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">No postdated cheques</text>
  <text x="24" y="354" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">National budget first and last overfunds a Vancouver suite and under-warns an Ontario renter. Key money and application fees are a refuse in all three.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Educational only. Confirm on Tribunals Ontario, gov.bc.ca RTB, and TAL / Civil Code of Québec. Disputes need the board or a licensed advisor.</text>
</svg>
