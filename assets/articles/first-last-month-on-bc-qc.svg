<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" role="img" aria-labelledby="title desc">
  <title id="title">Move-in cash for the same $2,200 rent in Ontario, B.C., and Québec</title>
  <desc id="desc">Labelled $2,200 rent sketch. Ontario: first month plus last-month rent deposit, about $4,400. B.C.: first month plus a security deposit capped at half a month ($1,100), about $3,300; a pet damage deposit can add another half month. Québec: typically first month only, about $2,200; classic damage deposits are generally not allowed.</desc>
  <rect width="720" height="472" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Same $2,200 rent - three different move-in cheques</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">High-level, 20 Sep 2026. Not legal advice. Ontario last-month · B.C. half-month cap · Québec no classic </tspan><tspan x="24" dy="17.6">deposit (C.c.Q. 1904 / TAL).</tspan></text>
  <rect x="36" y="100" width="208" height="220" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="140" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Ontario</text>
  <text x="140" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$4,400</text>
  <text x="140" y="196" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">First + last-month deposit</text>
  <text x="52" y="232" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">LMR is not a damage deposit</text>
  <text x="52" y="254" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">2026 LMR interest 2.1%</text>
  <text x="52" y="276" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Key/holding extras: pause</text>
  <rect x="256" y="100" width="208" height="220" rx="12" fill="#0F7A4B" transform="translate(0,17.6)"/>
  <text x="360" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">B.C.</text>
  <text x="360" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$3,300</text>
  <text x="360" y="196" text-anchor="middle" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">First + $1,100 security</text>
  <text x="272" y="232" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Cap: half a month</text>
  <text x="272" y="254" font-size="12" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Pet: another half max</text>
  <text x="272" y="276" font-size="12" fill="#E7F4EE" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Not "first and last"</text>
  <rect x="476" y="100" width="208" height="220" rx="12" fill="#F3F4F6" transform="translate(0,17.6)"/>
  <text x="580" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Québec</text>
  <text x="580" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$2,200</text>
  <text x="580" y="196" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">First month only (typical)</text>
  <text x="492" y="232" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">No exacted deposit</text>
  <text x="492" y="254" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">No last-month demand</text>
  <text x="492" y="276" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">No postdated cheques</text>
  <text x="24" y="354" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">National "budget first and last" overfunds a Vancouver suite and under-warns an Ontario renter. Key money </tspan><tspan x="24" dy="17.6">and application fees are a refuse in all three.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">Educational only. Confirm on Tribunals Ontario, gov.bc.ca RTB, and TAL / Civil Code of Québec. Disputes need the </tspan><tspan x="24" dy="16.2">board or a licensed advisor.</tspan></text>
</svg>
