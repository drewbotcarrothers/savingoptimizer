<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Line-voltage smart thermostats for Canadian baseboards</title>
  <desc id="desc">A 24 V furnace thermostat is the wrong product on 120/240 V baseboards. Match voltage, double-pole, and amp rating. Hydro-Quebec: electronic vs dial can cut about 10%. 20 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">The aisle that says smart is not a voltage</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Canadian baseboards are line voltage. Hydro-Quebec ~10% is electronic vs dial. 20 Sep 2026.</text>
  <rect x="24" y="78" width="216" height="230" rx="12" fill="#F3F4F6"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Wrong box</text>
  <text x="40" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">24 V Nest-style furnace</text>
  <text x="40" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">C-wire talk, no 240 V</text>
  <text x="40" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Peak Perks AC lists</text>
  <text x="40" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Will not switch a</text>
  <text x="40" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">baseboard heater.</text>
  <text x="40" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Paperweight or hazard.</text>
  <rect x="252" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Match the circuit</text>
  <text x="268" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">120 V or 240 V plate</text>
  <text x="268" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Double-pole on 240 V</text>
  <text x="268" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Amps: W divided by V</text>
  <text x="268" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">2000 W at 240 V is</text>
  <text x="268" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">about 8.3 A. Leave room.</text>
  <text x="268" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">CSA / cUL line-voltage.</text>
  <rect x="480" y="78" width="216" height="230" rx="12" fill="#E7F4EE"/>
  <text x="496" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Then schedule</text>
  <text x="496" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Zone unused rooms</text>
  <text x="496" y="162" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Rate D second tier</text>
  <text x="496" y="186" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ULO 39.1 cents dinner</text>
  <text x="496" y="222" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Deep setbacks in a leaky</text>
  <text x="496" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">plex can cost recovery kWh.</text>
  <text x="496" y="276" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Hire out mystery panels.</text>
  <text x="24" y="344" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Quebec and Atlantic electric-heat homes are the use case. Ontario ULO is usually a bad roommate for resistance heat.</text>
  <text x="24" y="368" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Renters: landlord in writing. Do not own the circuit. Photo the old double-pole before you disconnect.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not an electrical-code ruling or an install quote. Confirm live Rate D and OEB cents.</text>
</svg>
