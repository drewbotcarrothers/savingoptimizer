<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: monthly sinking fund for a family of four</title>
  <desc>Example with made-up inputs. Coats are $15 a month, boots are $10 a month, and kids gear is $15 a month. The total is $40. Not a Statistics Canada figure.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Example monthly sinking fund</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Example with made-up inputs. Two adults and two children. Not the $2,739 average.</text>
  <text x="24" y="120" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Coats, $360 over 24 months</text>
  <rect x="280" y="100" width="300" height="28" fill="#0F7A4B"/>
  <text x="296" y="119" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$15</text>
  <text x="24" y="176" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Boots, $240 over 24 months</text>
  <rect x="280" y="156" width="200" height="28" fill="#0F7A4B"/>
  <text x="296" y="175" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$10</text>
  <text x="24" y="232" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">Kids gear, $180 over 12 months</text>
  <rect x="280" y="212" width="300" height="28" fill="#0F7A4B"/>
  <text x="296" y="231" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$15</text>
  <text x="24" y="286" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">$15 plus $10 plus $15 is $40 a month. Bar length: $15 is 300 px.</text>
  <text x="24" y="310" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">The 2023 clothing average of $2,739 is a separate, real StatCan figure. It is not these bars.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer, 29 Sep 2026. The Daily released 21 May 2025. Fund dollars invented.</text>
</svg>
