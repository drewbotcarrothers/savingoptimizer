<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Calm Canadian collections call path</title>
  <desc id="desc">Verify the debt in writing, use a short script, arrange payment only when verified, check credit reports, consider non-profit counselling.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Collector calls: verify, write, then decide</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">No debt-settlement sales pitch. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="155" height="175" rx="12" fill="#E7F4EE"/>
  <text x="36" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Verify</text>
  <text x="36" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Agency and debt</text>
  <text x="36" y="158" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">in writing first.</text>
  <rect x="195" y="78" width="155" height="175" rx="12" fill="#E7F4EE"/>
  <text x="207" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">2. Script</text>
  <text x="207" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No payment on</text>
  <text x="207" y="158" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">the first call.</text>
  <rect x="366" y="78" width="155" height="175" rx="12" fill="#E7F4EE"/>
  <text x="378" y="108" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Arrange</text>
  <text x="378" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Written plan on</text>
  <text x="378" y="158" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">verified debt only.</text>
  <rect x="537" y="78" width="159" height="175" rx="12" fill="#F3F4F6"/>
  <text x="549" y="108" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Credit</text>
  <text x="549" y="138" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Free Equifax and</text>
  <text x="549" y="158" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TransUnion check.</text>
  <text x="549" y="190" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Non-profit help OK.</text>
  <text x="24" y="294" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">FCAC and provincial rules limit unfair collection practices — confirm your province.</text>
  <text x="24" y="316" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Accurate negatives are not deleted by repair firms. Education only. Not legal advice.</text>

</svg>
