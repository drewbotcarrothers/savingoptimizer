<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Illustrative weekly cost of one Toronto walk a day</title>
  <desc>Two bars. Three walks at the Rover Toronto median of 20 dollars is 60 dollars. Five walks at the same median is 100 dollars. The median is one 30-minute walk, includes the 11 percent booking fee already, and is not a daycare day rate. No Toronto daycare median was opened.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="start">One walk a day, not a daycare day</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">Rover Toronto median, 20 dollars a walk. Arithmetic only. Daycare is not drawn.</text>
<line x1="80" y1="80" x2="680" y2="80" stroke="#E5E7EB"/>
<line x1="80" y1="170" x2="680" y2="170" stroke="#E5E7EB"/>
<line x1="80" y1="260" x2="680" y2="260" stroke="#E5E7EB"/>
  <text x="28" y="84" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start">$100</text>
  <text x="36" y="174" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start">$50</text>
  <text x="44" y="264" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start">$0</text>
<rect x="180" y="152" width="140" height="108" fill="#6B7280"/>
<rect x="420" y="80" width="140" height="180" fill="#0F7A4B"/>
  <text x="250" y="148" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">$60</text>
  <text x="490" y="76" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B" text-anchor="middle">$100</text>
  <text x="250" y="286" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">3 walk days</text>
  <text x="490" y="286" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">5 walk days</text>
  <text x="24" y="330" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">Green is 5 times 20 dollars. Grey is 3 times 20 dollars. Two walk days would be 40 dollars and are in the table.</text>
  <text x="24" y="352" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">The page says the median includes a booking fee of 11 percent. Do not add 11 percent again.</text>
  <text x="24" y="374" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="start">A Toronto daycare day rate did not open on 27 Sep 2026, so it is not a third bar.</text>
  <text x="24" y="404" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start">Saving Optimizer. Rover Toronto dog-walking page, as of 27 Sep 2026.</text></svg>
