<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: a $780 con-ed course after tax credits</title>
<desc id="d">Bars show the $780 fee, $250 Canada training credit, about $80 tuition credit and about $450 net cost.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: a $780 con-ed course after tax credits</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Federal credits only, example learner with $250 training credit room</text>
<text x="240" y="117.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Course fee</text>
<rect x="250" y="93.0" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="117.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$780</text>
<text x="240" y="187.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Canada training credit</text>
<rect x="250" y="163.0" width="112.2" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="370.2" y="187.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">−$250</text>
<text x="240" y="257.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Tuition credit (15%)</text>
<rect x="250" y="233.0" width="35.9" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="293.9" y="257.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">−$80</text>
<text x="240" y="327.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Net cost</text>
<rect x="250" y="303.0" width="201.9" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="459.9" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">≈$450</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
</svg>
