<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Atlantic bills: energy ¢, oil history, verify pilots</title>
  <desc id="desc">NB 15.84 ¢, NS 18.324 ¢, NL Hydro 15.587 ¢ plus customer charges. 20 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Atlantic bills: energy ¢, oil history, verify pilots</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">NB 15.84 ¢, NS 18.324 ¢, NL Hydro 15.587 ¢ plus customer charges. 20 Sep 2026.</text>
  <rect x="24" y="78" width="216" height="140" rx="12" fill="#E7F4EE"/>
  <text x="40" y="106" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Why it differs</text>
  <text x="40" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Smaller systems.</text>
  <text x="40" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Oil tanks still common.</text>
  <text x="40" y="182" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Not Manitoba ¢.</text>
  <rect x="252" y="78" width="216" height="140" rx="12" fill="#F3F4F6"/>
  <text x="268" y="106" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Read the PDF</text>
  <text x="268" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Energy + customer</text>
  <text x="268" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">+ riders (FAM, variance).</text>
  <text x="268" y="182" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Right utility logo.</text>
  <rect x="480" y="78" width="216" height="140" rx="12" fill="#E7F4EE"/>
  <text x="496" y="106" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. TOU pilots</text>
  <text x="496" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">NS optional TVP.</text>
  <text x="496" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Eligibility is limited.</text>
  <text x="496" y="182" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Do not paste Ontario ULO.</text>
  <rect x="24" y="234" width="216" height="140" rx="12" fill="#F3F4F6"/>
  <text x="40" y="262" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Heat pumps</text>
  <text x="40" y="288" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Provincial stacks.</text>
  <text x="40" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Quote hygiene first.</text>
  <text x="40" y="338" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Panel and backup heat.</text>
  <rect x="252" y="234" width="216" height="140" rx="12" fill="#E7F4EE"/>
  <text x="268" y="262" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">5. Cashflow</text>
  <text x="268" y="288" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Budget billing helps.</text>
  <text x="268" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Arrears: call early.</text>
  <text x="268" y="338" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Oil truck is separate.</text>
  <rect x="480" y="234" width="216" height="140" rx="12" fill="#F3F4F6"/>
  <text x="496" y="262" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">6. OHPA closed</text>
  <text x="496" y="288" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Intake 31 Jul 2026.</text>
  <text x="496" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Docs 31 Jan 2027.</text>
  <text x="496" y="338" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">No door-knock NRCan.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: NB Power, NS Power tariff book, NL Hydro Rate 1.1, NRCan OHPA. Education only.</text>
</svg>
