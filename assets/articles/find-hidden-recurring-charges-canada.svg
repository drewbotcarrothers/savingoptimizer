<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Where recurring charges hide</title>
  <desc id="desc">A teaching example of hits found on the bank export, Apple, Google, Amazon or PayPal, and the telecom bill. Not your statement.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Five places, one sitting</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Counts are a teaching example so the order is visible.</text>
  <rect x="40" y="150" width="100" height="150" rx="6" fill="#0F7A4B"/>
  <text x="70" y="140" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">6</text>
  <text x="62" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Bank and</text>
  <text x="78" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">card</text>
  <rect x="170" y="190" width="100" height="110" rx="6" fill="#0F7A4B"/>
  <text x="206" y="180" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">3</text>
  <text x="196" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Apple</text>
  <rect x="300" y="210" width="100" height="90" rx="6" fill="#1A1A1A"/>
  <text x="336" y="200" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">2</text>
  <text x="322" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Google</text>
  <rect x="430" y="170" width="100" height="130" rx="6" fill="#0F7A4B"/>
  <text x="466" y="160" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">4</text>
  <text x="448" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Amazon</text>
  <text x="452" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">PayPal</text>
  <rect x="560" y="230" width="100" height="70" rx="6" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="596" y="220" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F7A4B">1</text>
  <text x="578" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Telecom</text>
  <text x="24" y="380" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Tag each hit keep, cancel, or investigate before you call.</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Repeat every quarter. 24 Sep 2026.</text>
</svg>
