<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">When a surplus pickup is worth the drive</title>
  <desc id="desc">Break-even chart of net savings after a $0.70 per kilometre round-trip cost against pickup value.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Skip the pickup if the drive eats the deal</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Worked example: $0.70/km all-in (fuel + wear). Not StatsCan. Parking fees raise the true cost.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="90" width="200" height="150" rx="12" fill="#E7F4EE"/>
    <text x="140" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B">Net after 4 km</text>
    <text x="140" y="168" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A">+$9.20</text>
    <text x="140" y="196" text-anchor="middle" font-size="12" fill="#6B7280">$12 deal - $2.80 drive</text>
    <rect x="260" y="90" width="200" height="150" rx="12" fill="#F3F4F6"/>
    <text x="360" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">Net after 12 km</text>
    <text x="360" y="168" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A">+$3.60</text>
    <text x="360" y="196" text-anchor="middle" font-size="12" fill="#6B7280">$12 deal - $8.40 drive</text>
    <rect x="480" y="90" width="200" height="150" rx="12" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="580" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">Net after 20 km</text>
    <text x="580" y="168" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A">-$2.00</text>
    <text x="580" y="196" text-anchor="middle" font-size="12" fill="#6B7280">$12 deal - $14.00 drive</text>
  </g>
  <text x="24" y="278" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Rule of thumb</text>
  <text x="24" y="304" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Keep pickups on a trip you are already making. A $6 bakery bag is a treat, not a grocery system.</text>
  <text x="24" y="328" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Chooser apps (Flashfood, FoodHero) beat surprise bags when you can freeze meat the same night.</text>
  <text x="24" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Deal value is the discount versus the store regular price, after app fees. Round trip = 2 x one-way km.</text>
</svg>
