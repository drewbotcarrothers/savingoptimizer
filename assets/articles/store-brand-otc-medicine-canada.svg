<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Illustrative price per dose, name brand versus a second product</title>
  <desc>Worked example only. Twenty doses at $12.00 is $0.60 a dose. Forty doses at $10.00 is $0.25 a dose. Not a shelf price.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Illustrative price per dose</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Stand-in arithmetic. A larger count is cheaper per dose only if you use the doses.</text>
  <text x="24" y="130" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">20 doses at $12.00</text>
  <rect x="220" y="110" width="400" height="28" fill="#6B7280"/>
  <text x="236" y="129" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$0.60</text>
  <text x="24" y="190" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1A">40 doses at $10.00</text>
  <rect x="220" y="170" width="167" height="28" fill="#0F7A4B"/>
  <text x="236" y="189" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$0.25</text>
  <text x="24" y="250" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">$12.00 / 20 = $0.60. $10.00 / 40 = $0.25. Bar length: $0.60 = 400 px.</text>
  <text x="24" y="278" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">These dollars are not Advil and not a store brand. Match the DIN, the strength, and the form first.</text>
  <text x="24" y="306" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">If you will discard doses after the expiry date, divide by the doses you will use.</text>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer, 27 Sep 2026. No shelf price was opened.</text>

</svg>
