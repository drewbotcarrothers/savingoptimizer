<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Decision flow: which CRA guide to open before claiming work clothes</title>
  <desc>Reading order with no dollar figures. Employee claims start in guide T4044, which says most clothing and special clothing you have to wear are not deductible. Self-employed claims start in guide T4002. Employer allowances start on the CRA uniforms page, which was not fully loaded.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Which page to open before a clothing claim</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">No dollar figures. Not a determination. Confirm with the CRA or a tax professional.</text>
  <rect x="40" y="78" width="250" height="52" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="52" y="100" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Employee or self-employed?</text>
  <text x="52" y="118" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">The guides are different.</text>
  <rect x="40" y="168" width="250" height="64" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="52" y="190" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Employee: open T4044</text>
  <text x="52" y="208" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Most clothing is personal.</text>
  <text x="52" y="224" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Special clothing is not deductible.</text>
  <rect x="380" y="168" width="300" height="64" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="392" y="190" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Self-employed: open T4002</text>
  <text x="392" y="208" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Personal expenses stay off the form.</text>
  <text x="392" y="224" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Oilskin is fishing gear, not a costume rule.</text>
  <rect x="40" y="280" width="640" height="72" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="52" y="304" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Employer allowance or reimbursement?</text>
  <text x="52" y="324" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Open the CRA uniforms and protective-clothing page. </text>
  <text x="52" y="342" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Do not decide taxable versus non-taxable from this chart. CCOHS boot markings are not a deduction.</text>
  <line x1="165" y1="130" x2="165" y2="168" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="290" y1="200" x2="380" y2="200" stroke="#E5E7EB" stroke-width="2"/>
  <text x="24" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer, 29 Sep 2026. T4044 and T4002 chapter 3 checked. Not tax advice.</text>
</svg>
