<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">One month of Paramount Plus Basic versus annual</title>
  <desc id="desc">Basic is 7.99 dollars a month or 70.99 dollars a year in Canada.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">One show is a month of Basic</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Paramount+ Support, Canada, used 25 Sep 2026.</text>
  <rect x="140" y="270" width="150" height="30" rx="6" fill="#0F7A4B"/>
  <text x="215.0" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$7.99</text>
  <text x="215.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">One month</text>
  <text x="215.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Basic with ads</text>
  <rect x="420" y="80" width="150" height="220" rx="6" fill="#1A1A1A"/>
  <text x="495.0" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$70.99</text>
  <text x="495.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Annual Basic</text>
  <text x="495.0" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">only if you stay</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Three months at $7.99 is $23.97, still under $70.99.</text>
  <text x="24" y="408" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Apple TV is $14.99 a month after 7 days. 25 Sep 2026.</text>
</svg>
