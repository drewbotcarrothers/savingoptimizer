<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Compass Card adult monthly pass versus stored-value cost at 26 and 44 taps</title>
  <desc id="desc">Grouped bars comparing TransLink adult 1-zone and 2-zone monthly passes against stored-value cost for a 3-day hybrid week and a 5-day commute after the 1 July 2026 fare increase.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Adult Compass: hybrid week vs five-day commute</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">TransLink fares as of 1 Jul 2026. 26 taps = 13 weekday round trips. 44 taps = 22 weekday round trips.</text>
  <line x1="80" y1="88" x2="80" y2="300" stroke="#E5E7EB"/>
  <line x1="80" y1="300" x2="680" y2="300" stroke="#E5E7EB"/>
  <text x="72" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="72" y="248" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$80</text>
  <text x="72" y="192" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$160</text>
  <text x="72" y="136" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$240</text>
  <!-- scale $240 = 212px -->
  <!-- 1Z 26 taps $74.10 = 65; y=235 -->
  <rect x="110" y="235" width="36" height="65" rx="4" fill="#4B9B74"/>
  <!-- 1Z monthly $117.20 = 104; y=196 -->
  <rect x="152" y="196" width="36" height="104" rx="4" fill="#0F7A4B"/>
  <text x="149" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$117</text>
  <text x="149" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1-zone</text>
  <text x="149" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">hybrid 26 taps</text>
  <!-- 1Z 44 taps $125.40 = 111; y=189 -->
  <rect x="230" y="189" width="36" height="111" rx="4" fill="#9CA3AF"/>
  <rect x="272" y="196" width="36" height="104" rx="4" fill="#0F7A4B"/>
  <text x="269" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$125</text>
  <text x="269" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">1-zone</text>
  <text x="269" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">5-day 44 taps</text>
  <!-- 2Z 26 $109.20 = 96; y=204 -->
  <rect x="360" y="204" width="36" height="96" rx="4" fill="#4B9B74"/>
  <!-- 2Z monthly $156.70 = 138; y=162 -->
  <rect x="402" y="162" width="36" height="138" rx="4" fill="#0F7A4B"/>
  <text x="399" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$157</text>
  <text x="399" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2-zone</text>
  <text x="399" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">hybrid 26 taps</text>
  <!-- 2Z 44 $184.80 = 163; y=137 -->
  <rect x="480" y="137" width="36" height="163" rx="4" fill="#9CA3AF"/>
  <rect x="522" y="162" width="36" height="138" rx="4" fill="#0F7A4B"/>
  <text x="519" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$185</text>
  <text x="519" y="318" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2-zone</text>
  <text x="519" y="334" text-anchor="middle" font-size="10" fill="#6B7280" font-family="Inter, system-ui, sans-serif">5-day 44 taps</text>
  <rect x="90" y="354" width="12" height="12" rx="2" fill="#4B9B74"/>
  <text x="108" y="365" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Stored value (hybrid)</text>
  <rect x="280" y="354" width="12" height="12" rx="2" fill="#9CA3AF"/>
  <text x="298" y="365" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Stored value (5-day)</text>
  <rect x="490" y="354" width="12" height="12" rx="2" fill="#0F7A4B"/>
  <text x="508" y="365" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Monthly pass</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Weekend and after-6:30 p.m. travel is 1-zone. A 2-zone pass still wins a true five-day Surrey–downtown commute. Hybrid WFH usually should not buy the pass.</text>
</svg>
