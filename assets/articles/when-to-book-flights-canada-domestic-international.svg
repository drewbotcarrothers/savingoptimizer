<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canada-origin booking windows versus booking six months out</title>
  <desc id="desc">Expedia Canada 2026 Air Hacks averages: domestic economy booked 31 to 45 days out saved about 185 dollars versus 180-plus days. International economy booked 15 to 30 days out saved about 190 dollars. International booked 31 to 45 days out still saved about 185 dollars.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">One magic day is the wrong rule</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Average savings versus booking 180+ days out. Expedia.ca Air Hacks, February 2026. Not your fare.</text>
  <line x1="250" y1="86" x2="250" y2="300" stroke="#E5E7EB"/>
  <text x="24" y="118" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Domestic economy, 31-45 days</text>
  <rect x="250" y="100" width="370" height="26" rx="4" fill="#0F7A4B"/>
  <text x="262" y="118" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">about $185 CAD less</text>
  <text x="24" y="178" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">International, 15-30 days</text>
  <rect x="250" y="160" width="380" height="26" rx="4" fill="#0F7A4B"/>
  <text x="262" y="178" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">about $190 CAD less</text>
  <text x="24" y="238" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">International, 31-45 days</text>
  <rect x="250" y="220" width="370" height="26" rx="4" fill="#0F7A4B"/>
  <text x="262" y="238" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">about $185 CAD less</text>
  <text x="24" y="292" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Booked 180+ days out</text>
  <rect x="250" y="274" width="18" height="26" rx="4" fill="#9CA3AF"/>
  <text x="276" y="292" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">the expensive baseline in this dataset</text>
  <text x="24" y="340" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Start alerts 3-5 months out. Buy a dip inside the window, not the first price you see.</text>
  <text x="24" y="364" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Christmas, March break, and sold-out long weekends can leave this average behind.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Source: Expedia 2026 Air Hacks for Canadians, published February 2026. Averages, not a quote.</text>
</svg>
