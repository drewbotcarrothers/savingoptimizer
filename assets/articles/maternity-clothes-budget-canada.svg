<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: two maternity plans</title>
  <desc>Buy everything, versus borrow and buy used. Example with made-up inputs. Buy-everything $520. Borrow-and-used $140.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: two maternity plans</text>
  <text x="24" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Buy everything, versus borrow and buy used.</text>
  <text x="24" y="114" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Buy everything</text>
  <rect x="250" y="96" width="400" height="28" fill="#6B7280"/>
  <text x="262" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$520</text>
  <text x="24" y="176" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Borrow and used</text>
  <rect x="250" y="158" width="108" height="28" fill="#0F7A4B"/>
  <text x="366" y="177" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">$140</text>
  <text x="24" y="318" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs. Buy-everything $520. Borrow-and-used $140.</text>
  <text x="24" y="338" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Not a retailer total. Rebuild both plans from your closet.</text>
  <text x="24" y="404" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 29 Sep 2026.</text>
</svg>
