<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian condo and strata elevator booking cost traps</title>
  <desc id="desc">Toronto and Vancouver pattern: book freight elevators 2 to 4 weeks ahead, weekday windows, certificate of insurance often $2 million naming the corporation, refundable damage deposits, and overtime if you miss the slot. 20 September 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Elevator first. Quote second.</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Condo / strata access is a first-class moving cost. Pattern notes, not your boards form. 20 Sep 2026.</text>
  <rect x="36" y="80" width="210" height="188" fill="#E7F4EE"/>
  <text x="141" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Book</text>
  <text x="141" y="142" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">24 weeks ahead</text>
  <text x="141" y="166" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Weekday 24 hr slots</text>
  <text x="141" y="190" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Weekends often closed</text>
  <text x="141" y="214" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Both buildings same day</text>
  <text x="141" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Missed slot = 2nd trip</text>
  <rect x="255" y="80" width="210" height="188" fill="#F3F4F6"/>
  <text x="360" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Paper</text>
  <text x="360" y="142" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">COI often $2M</text>
  <text x="360" y="166" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Name the corporation</text>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Pros issue in a day</text>
  <text x="360" y="214" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">DIY van may fail</text>
  <text x="360" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No COI, no elevator</text>
  <rect x="474" y="80" width="210" height="188" fill="#F3F4F6"/>
  <text x="579" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Cash</text>
  <text x="579" y="142" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Deposit $250$1,000</text>
  <text x="579" y="166" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Get the refund path</text>
  <text x="579" y="190" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Dock overtime fees</text>
  <text x="579" y="214" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Pad / concierge hours</text>
  <text x="579" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Photo the pads</text>
  <text x="24" y="304" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Toronto condos and Vancouver strata pages commonly describe weekday freight windows and named COIs. Your declaration / bylaws win.</text>
  <text x="24" y="332" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">A $1,200 cheap Saturday crew that cannot enter the loading dock is not cheaper than a Tuesday booked window.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Not a mover brokerage. Moving-quote tools are an offer type. Confirm both buildings before you pay a deposit.</text>
</svg>
