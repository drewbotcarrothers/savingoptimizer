<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative 90-day household supplies tracker</title>
  <desc id="desc">Illustrative stacked bars, not a national average and not Statistics Canada. Month 1: paper 28, cleaning 22, laundry 30 dollars. Month 2: paper 18, cleaning 15, laundry 20. Month 3: paper 24, cleaning 12, laundry 26. A dashed line marks an illustrative 70 dollar target.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">90-day tracker, illustrative dollars</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Replace every bar with your receipts. The $70 line is a sample target, not StatCan.</text>
  <line x1="80" y1="80" x2="80" y2="320" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="80" y1="320" x2="680" y2="320" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="80" y1="150" x2="680" y2="150" stroke="#0F7A4B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="142" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F7A4B">Target $70</text>
  <text x="24" y="324" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">$0</text>
  <text x="16" y="154" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">$70</text>
  <!-- scale: $1 = 2.4 px, baseline y=320. Month1 total 80 -> 192px. paper 28*2.4=67.2, cleaning 52.8, laundry 72 -->
  <rect x="140" y="252.8" width="90" height="67.2" fill="#0F7A4B"/>
  <rect x="140" y="200" width="90" height="52.8" fill="#1A1A1A"/>
  <rect x="140" y="128" width="90" height="72" fill="#6B7280"/>
  <text x="185" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Month 1</text>
  <text x="185" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">$80</text>
  <!-- month2 total 53 -> 127.2. paper 43.2, cleaning 36, laundry 48 -->
  <rect x="320" y="276.8" width="90" height="43.2" fill="#0F7A4B"/>
  <rect x="320" y="240.8" width="90" height="36" fill="#1A1A1A"/>
  <rect x="320" y="192.8" width="90" height="48" fill="#6B7280"/>
  <text x="365" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Month 2</text>
  <text x="365" y="182" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">$53</text>
  <!-- month3 total 62 -> 148.8. paper 57.6, cleaning 28.8, laundry 62.4 -->
  <rect x="500" y="262.4" width="90" height="57.6" fill="#0F7A4B"/>
  <rect x="500" y="233.6" width="90" height="28.8" fill="#1A1A1A"/>
  <rect x="500" y="171.2" width="90" height="62.4" fill="#6B7280"/>
  <text x="545" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Month 3</text>
  <text x="545" y="160" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">$62</text>
  <rect x="140" y="378" width="14" height="14" fill="#0F7A4B"/>
  <text x="160" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Paper</text>
  <rect x="230" y="378" width="14" height="14" fill="#1A1A1A"/>
  <text x="250" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Cleaning</text>
  <rect x="340" y="378" width="14" height="14" fill="#6B7280"/>
  <text x="360" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Laundry</text>
</svg>
