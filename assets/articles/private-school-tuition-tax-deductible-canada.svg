<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 438" width="720" height="438" role="img" aria-labelledby="t d">
<title id="t">Example: what counts from $18,000 of fees</title>
<desc id="d">Bars: total fees $18,000; tuition not deductible $15,400; after-school care claimable $2,600.</desc>
<rect width="720" height="438" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: what counts from $18,000 of fees</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Total fees</text>
<rect x="250" y="104.7" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$18,000</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Tuition (not deductible)</text>
<rect x="250" y="198.0" width="299.4" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="557.4" y="222.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$15,400</text>
<text x="240" y="315.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A"><tspan x="240">After-school care (child care </tspan><tspan x="240" dy="17.6">deduction)</tspan></text>
<rect x="250" y="291.3" width="50.6" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="308.6" y="315.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$2,600</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280" transform="translate(0,17.6)">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
</svg>
