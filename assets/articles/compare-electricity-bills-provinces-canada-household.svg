<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Compare provincial bills as structures, not medals</title>
  <desc id="desc">Heating fuel and fixed charges break viral cheapest-province charts. 20 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Compare provincial bills as structures, not medals</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Heating fuel and fixed charges break viral cheapest-province charts. 20 Sep 2026.</text>
  <rect x="24" y="78" width="216" height="140" rx="12" fill="#E7F4EE"/>
  <text x="40" y="106" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Mix and market</text>
  <text x="40" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Hydro-heavy vs mixed.</text>
  <text x="40" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">RPP vs Crown vs shop.</text>
  <text x="40" y="182" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Alberta is the outlier.</text>
  <rect x="252" y="78" width="216" height="140" rx="12" fill="#F3F4F6"/>
  <text x="268" y="106" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. Four designs</text>
  <text x="268" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ON clocks + OER.</text>
  <text x="268" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">BC tiers / QC Rate D.</text>
  <text x="268" y="182" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">AB RoLR ~12 ¢ energy.</text>
  <rect x="480" y="78" width="216" height="140" rx="12" fill="#E7F4EE"/>
  <text x="496" y="106" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">3. Hidden heat</text>
  <text x="496" y="132" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Gas vs baseboard</text>
  <text x="496" y="152" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">vs oil vs heat pump.</text>
  <text x="496" y="182" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Convert useful heat.</text>
  <rect x="24" y="234" width="216" height="140" rx="12" fill="#F3F4F6"/>
  <text x="40" y="262" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">4. Fixed charges</text>
  <text x="40" y="288" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Customer / access /</text>
  <text x="40" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">basic lines distort ¢.</text>
  <text x="40" y="338" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Split energy vs delivery.</text>
  <rect x="252" y="234" width="216" height="140" rx="12" fill="#E7F4EE"/>
  <text x="268" y="262" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">5. Benchmark</text>
  <text x="268" y="288" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">12 months, same</text>
  <text x="268" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">structure, not a meme.</text>
  <text x="268" y="338" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Equal billing hides kWh.</text>
  <rect x="480" y="234" width="216" height="140" rx="12" fill="#F3F4F6"/>
  <text x="496" y="262" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">6. Movers</text>
  <text x="496" y="288" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Utility logo, lease</text>
  <text x="496" y="308" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">inclusions, rate class.</text>
  <text x="496" y="338" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Ask for 12 months.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Sources: OEB, BC Hydro, Hydro-Quebec, UCA, Manitoba Hydro, NB Power, NS Power, NL Hydro. Education only.</text>
</svg>
