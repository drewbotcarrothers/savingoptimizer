<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Vetting a rural WISP</title>
  <desc id="desc">Line of sight, peak-hour tests, contract length, and red flags before you sign a rural fixed-wireless plan. Drafted 22 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Vet the tower path before the monthly</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Site survey beats a brochure. Drafted 22 Sep 2026.</text>
  <rect x="24" y="78" width="672" height="64" rx="12" fill="#E7F4EE"/>
  <text x="40" y="118" font-size="14" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" font-weight="700">Line of sight · trees · winter mount access</text>
  <rect x="24" y="156" width="672" height="64" rx="12" fill="#E7F4EE"/>
  <text x="40" y="196" font-size="14" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" font-weight="700">Evening speed test · data cap · fair use in writing</text>
  <rect x="24" y="234" width="672" height="64" rx="12" fill="#F3F4F6"/>
  <text x="40" y="274" font-size="14" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" font-weight="700">Term length · who owns the antenna · exit fees</text>
  <rect x="24" y="318" width="672" height="56" rx="12" fill="#0F7A4B"/>
  <text x="40" y="352" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Red flag: “unlimited” with no evening example and pressure to pay today.</text>
  <text x="24" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Education only. Not a directory of WISPs.</text>
</svg>
