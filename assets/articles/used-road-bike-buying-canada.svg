<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: what a used bike really costs</title>
<desc id="d">Bars: bike $650; tires $120; tune-up $100; lock $80; lights $40; bell and tape $25.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: what a used bike really costs</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Example with made-up inputs</text>
<text x="240" y="105.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Bike</text>
<rect x="250" y="86.9" width="350.0" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="105.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$650</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Tires and tubes</text>
<rect x="250" y="133.5" width="64.6" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="322.6" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$120</text>
<text x="240" y="198.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Tune-up</text>
<rect x="250" y="180.2" width="53.8" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="311.8" y="198.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$100</text>
<text x="240" y="245.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">U-lock</text>
<rect x="250" y="226.9" width="43.1" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="301.1" y="245.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$80</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Lights</text>
