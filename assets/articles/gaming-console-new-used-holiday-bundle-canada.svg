<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Console, game, extras and subscription combined</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">New</text>
