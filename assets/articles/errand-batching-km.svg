<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="title desc">
 <title id="title">Weekly kilometres before and after errand batching</title>
 <desc id="desc">Before-and-after bars for a labelled household that combined four solo mid-week errands into two loops, plus a Saturday warehouse run that stayed.</desc>
 <rect width="720" height="456" fill="#FFFFFF"/>
 <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Same errands, fewer cold starts</text>
 <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">Labelled week: pharmacy, hardware, grocery, school pickup. StatsCan gasoline +22.8% YoY (Aug 2026 Daily, </tspan><tspan x="24" dy="17.6">14 Sep 2026).</tspan></text>
 <line x1="160" y1="80" x2="160" y2="300" stroke="#E5E7EB" transform="translate(0,17.6)"/>
 <line x1="160" y1="300" x2="680" y2="300" stroke="#E5E7EB" transform="translate(0,17.6)"/>
 <text x="152" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">0 km</text>
 <text x="152" y="249" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">40</text>
 <text x="152" y="194" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">80</text>
 <text x="152" y="139" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">120</text>
 <!-- scale 120km = 220px -->
 <rect x="220" y="120" width="70" height="180" rx="6" fill="#9CA3AF" transform="translate(0,17.6)"/>
 <text x="255" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">98 km</text>
 <text x="255" y="322" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Before</text>
 <text x="255" y="340" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">4 solo loops</text>
 <rect x="400" y="185" width="70" height="115" rx="6" fill="#0F7A4B" transform="translate(0,17.6)"/>
 <text x="435" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">63 km</text>
 <text x="435" y="322" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">After</text>
 <text x="435" y="340" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">2 loops</text>
 <rect x="560" y="245" width="70" height="55" rx="6" fill="#4B9B74" transform="translate(0,17.6)"/>
 <text x="595" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">-35 km</text>
 <text x="595" y="322" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Deleted</text>
 <text x="595" y="340" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">~-$4 fuel @ $1.50</text>
 <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280" transform="translate(0,17.6)"><tspan x="24">Fuel-only dollars are small; four deleted loops a week plus a skipped Saturday hop is a tank. Report honest km </tspan><tspan x="24" dy="17.6">at insurance renewal.</tspan></text>
 <text x="24" y="404" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6)">CRA 2026 73c/km is the all-in ceiling if you test delivery vs a 22 km suburban loop. 20 Sep 2026.</text>
</svg>
