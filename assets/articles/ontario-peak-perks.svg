<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 489" role="img" aria-labelledby="title desc">
  <title id="title">Ontario Peak Perks credits versus a demand-response event</title>
  <desc id="desc">Save on Energy Peak Perks pays $75 on enrolment and $20 each year you stay enrolled. Events run on non-holiday weekdays, at most three hours, with a thermostat shift of up to 2°C. You cannot also enrol in Hydro One myEnergy Rewards. Cornwall is not eligible.</desc>
  <rect width="720" height="489" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Peak Perks: $75 in, $20 to stay, events you can override</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280"><tspan x="24">IESO / Save on Energy demand response. Amounts from the program page, as of 20 Sep 2026. Not a utility bill </tspan><tspan x="24" dy="17.6">credit.</tspan></text>
  <rect x="24" y="78" width="216" height="214" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">The credits</text>
  <text x="40" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$75 virtual Mastercard</text>
  <text x="40" y="158" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">within 60 days of acceptance</text>
  <text x="40" y="190" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">$20 each year you stay</text>
  <text x="40" y="208" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">after the Jun–Sep season</text>
  <text x="40" y="240" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">New thermostat ` second $75.</text>
  <text x="40" y="264" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Unenrol: info@peakperks.ca</text>
  <rect x="252" y="78" width="216" height="214" rx="12" fill="#F3F4F6" transform="translate(0,17.6)"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">A DR event</text>
  <text x="268" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Possible 1°C pre-cool</text>
  <text x="268" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Then up to +2°C for ≤3 hours</text>
  <text x="268" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Weekdays, roughly noon–9 p.m.</text>
  <text x="268" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Window: 1 Jun – 30 Sep</text>
  <text x="268" y="248" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Override on the stat or the app.</text>
  <text x="268" y="266" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Chronic overrides miss the point.</text>
  <rect x="480" y="78" width="216" height="214" rx="12" fill="#E7F4EE" transform="translate(0,17.6)"/>
  <text x="496" y="108" font-size="15" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Eligibility</text>
  <text x="496" y="140" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Ontario residential (not Cornwall)</text>
  <text x="496" y="164" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Central AC or heat pump</text>
  <text x="496" y="188" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Eligible Wi-Fi thermostat</text>
  <text x="496" y="212" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Not in another DR program</text>
  <text x="496" y="248" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">Hydro One: Peak Perks or</text>
  <text x="496" y="266" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)">myEnergy Rewards — not both.</text>
  <text x="24" y="322" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6)"><tspan x="24">Comfort without defeating the program: pre-cool yourself on a warned afternoon, close south blinds, delay the </tspan><tspan x="24" dy="17.6">oven, and override only if someone is heat-vulnerable.</tspan></text>
  <text x="24" y="358" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" transform="translate(0,17.6) translate(0,17.6)"><tspan x="24">A $75 card does not pay for a $250 thermostat by itself. Pair it with TOU / ULO plan choice if the device also </tspan><tspan x="24" dy="17.6">shifts loads.</tspan></text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280" transform="translate(0,17.6) translate(0,17.6) translate(0,17.6)"><tspan x="24">Source: saveonenergy.ca Peak Perks and Hydro One myEnergy Rewards FAQ. Credits and model lists change — </tspan><tspan x="24" dy="16.2">re-check before you buy a thermostat.</tspan></text>
</svg>
