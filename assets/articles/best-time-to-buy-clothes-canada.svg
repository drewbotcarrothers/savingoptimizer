  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Seasonal pattern, not a price guarantee</text>
  <text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Shaded months are when that category is typically at the end of its season. Not a percent off.</text>
