  <text x="24" y="310" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">January is shaded for outerwear and for holiday clothes. July and August for swim and summer. September for back-to-school leftovers.</text>
  <text x="24" y="334" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">November is not shaded. That is when you may need the coat, which is selection, not clearance.</text>
