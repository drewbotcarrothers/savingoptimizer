  <title>Seasonal pattern for clothing clearances in Canada, not a price guarantee</title>
  <desc>A 12-month strip. Outerwear end-of-season is shaded in January and February. Swim and summer are shaded in July and August. Back-to-school is shaded in September. Holiday clothes are shaded in January. The label says seasonal pattern, not a price guarantee. No discount levels.</desc>
