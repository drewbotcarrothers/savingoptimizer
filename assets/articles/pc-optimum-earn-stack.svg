<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">PC Optimum grocery earn: offers vs co-branded cards</title>
  <desc id="desc">Bar chart of typical effective grocery returns: free member offers, no-fee World Elite Mastercard, and Insiders World Elite including Express Pass value.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Grocery earn is offers-only unless a PC card is in the wallet</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative effective return at 10,000 pts = $10. Card rates from public PC Financial materials, reviewed Sep 2026.</text>
  <line x1="80" y1="90" x2="80" y2="310" stroke="#E5E7EB"/>
  <line x1="80" y1="310" x2="680" y2="310" stroke="#E5E7EB"/>
  <text x="72" y="314" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">0%</text>
  <text x="72" y="254" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">2%</text>
  <text x="72" y="194" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">4%</text>
  <text x="72" y="134" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">6%</text>
  <!-- 1% offers = 30px of 220 at 6% scale: 1/6*220=36.7; y=310-37=273 -->
  <rect x="120" y="273" width="120" height="37" rx="8" fill="#9CA3AF"/>
  <text x="180" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~1%</text>
  <text x="180" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Free member</text>
  <text x="180" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">loaded offers</text>
  <!-- 3% WE = 3/6*220=110; y=200 -->
  <rect x="300" y="200" width="120" height="110" rx="8" fill="#4B9B74"/>
  <text x="360" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~3%</text>
  <text x="360" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No-fee WE MC</text>
  <text x="360" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">30 pts / $1</text>
  <!-- 4% Insiders = 4/6*220=147; y=163 -->
  <rect x="480" y="163" width="120" height="147" rx="8" fill="#0F7A4B"/>
  <text x="540" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~4%</text>
  <text x="540" y="332" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Insiders WE</text>
  <text x="540" y="350" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">40 pts / $1 · $120 fee</text>
  <text x="24" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Insiders also bundles a PC Express Pass (publicly valued at $99.99/year). Pay the fee only if grocery earn + pass replace costs you already pay. Confirm current card pages.</text>
</svg>
