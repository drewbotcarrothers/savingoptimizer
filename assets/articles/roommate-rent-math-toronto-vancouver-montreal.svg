<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Two-way split of Q2 2026 asking two-bedroom rents in Vancouver, Toronto, and Montreal</title>
  <desc id="desc">Statistics Canada Quarterly Rent Statistics Q2 2026 asking two-bedroom rents: Vancouver $3,030, Toronto $2,650, Montreal $1,820. A two-way equal split is $1,515, $1,325, and $910 before utilities.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Roommate math: split the 2-bed, then add utilities</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">StatCan QRS Q2 2026 asking 2-bed (Daily, 9 Sep 2026): Vancouver $3,030 · Toronto $2,650 · Montréal $1,820.</text>
  <rect x="56" y="88" width="90" height="192" fill="#0F7A4B"/>
  <text x="101" y="76" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$3,030</text>
  <text x="101" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Van ask</text>
  <rect x="166" y="176" width="90" height="104" fill="#4B9B74"/>
  <text x="211" y="164" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$1,515</text>
  <text x="211" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Van / 2</text>
  <rect x="276" y="112" width="90" height="168" fill="#0F7A4B"/>
  <text x="321" y="100" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$2,650</text>
  <text x="321" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TO ask</text>
  <rect x="386" y="188" width="90" height="92" fill="#4B9B74"/>
  <text x="431" y="176" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$1,325</text>
  <text x="431" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TO / 2</text>
  <rect x="496" y="164" width="90" height="116" fill="#0F7A4B"/>
  <text x="541" y="152" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$1,820</text>
  <text x="541" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Mtl ask</text>
  <rect x="606" y="220" width="80" height="60" fill="#4B9B74"/>
  <text x="646" y="208" text-anchor="middle" font-size="12" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$910</text>
  <text x="646" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Mtl / 2</text>
  <text x="24" y="354" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Paid 2-bed is lower: Van $2,470 · TO $2,160 · Mtl $1,360. New-lease asking is what a roommate hunt usually faces.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Labelled CMA averages, not a listing. Utilities, internet, and tenant insurance sit on top. Not legal advice.</text>
