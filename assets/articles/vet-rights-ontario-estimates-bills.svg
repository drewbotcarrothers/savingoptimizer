<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Ontario path from a clinic concern to a College complaint</title>
  <desc>Four steps for Ontario: raise the concern, talk to the clinic manager, make a written request, then the College of Veterinarians of Ontario complaint process if needed. As of 27 Sep 2026.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Ontario: clinic first, then the College</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">A conversation, then paper, then the regulator if you still need one.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">
    <rect x="28" y="120" width="150" height="80" rx="8" fill="#0F7A4B"/>
    <text x="103" y="154" text-anchor="middle" fill="#FFFFFF" font-weight="700">Concern</text>
    <text x="103" y="174" text-anchor="middle" fill="#FFFFFF" font-size="11">Name the charge</text>
    <polygon points="186,160 210,160 210,152 226,160 210,168 210,160" fill="#6B7280"/>
    <rect x="234" y="120" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="309" y="154" text-anchor="middle" font-weight="700">Clinic manager</text>
    <text x="309" y="174" text-anchor="middle" font-size="11" fill="#6B7280">Ask in person</text>
    <polygon points="392,160 416,160 416,152 432,160 416,168 416,160" fill="#6B7280"/>
    <rect x="440" y="120" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="515" y="154" text-anchor="middle" font-weight="700">Written request</text>
    <text x="515" y="174" text-anchor="middle" font-size="11" fill="#6B7280">Keep a copy</text>
    <polygon points="515,208 515,236 507,236 515,252 523,236 515,236" fill="#6B7280"/>
    <rect x="390" y="260" width="250" height="80" rx="8" fill="#0F7A4B"/>
    <text x="515" y="292" text-anchor="middle" fill="#FFFFFF" font-weight="700">CVO complaint</text>
    <text x="515" y="312" text-anchor="middle" fill="#FFFFFF" font-size="11">If the clinic does not resolve it</text>
  </g>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Ontario only. Regulation 1093 and College pages opened 27 Sep 2026. Not legal advice.</text>
</svg>
