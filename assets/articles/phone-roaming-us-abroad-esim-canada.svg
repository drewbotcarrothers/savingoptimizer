<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: roaming cost for 10 days and 90 days</title>
  <desc>Example with made-up inputs. A carrier daily add-on at 15 dollars a day costs 150 dollars over 10 days and 1,350 dollars over 90 days. A travel eSIM at 6 dollars a day costs 60 dollars and 540 dollars. Wi-Fi only is 0 dollars on the phone bill for both stays.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs</text>
  <text x="24" y="46" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Phone-bill cost only. Not a carrier price and not an eSIM brand.</text>
  <text x="18" y="168" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280" transform="rotate(-90 18 168)">Made-up cost (CAD)</text>
  <line x1="70" y1="78" x2="680" y2="78" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="70" y1="183" x2="680" y2="183" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="70" y1="288" x2="680" y2="288" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="64" y="82" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">$1,440</text>
  <text x="64" y="187" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">$720</text>
  <text x="64" y="292" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">$0</text>
  <rect x="150" y="266.1" width="36" height="21.9" fill="#0F7A4B"/>
  <rect x="194" y="279.2" width="36" height="8.8" fill="#F59E0B"/>
  <rect x="238" y="284" width="36" height="4" fill="#6B7280"/>
  <text x="168" y="260.1" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">$150</text>
  <text x="212" y="273.2" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">$60</text>
  <text x="256" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">$0</text>
  <rect x="430" y="91.1" width="36" height="196.9" fill="#0F7A4B"/>
  <rect x="474" y="209.2" width="36" height="78.8" fill="#F59E0B"/>
  <rect x="518" y="284" width="36" height="4" fill="#6B7280"/>
  <text x="448" y="85.1" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">$1,350</text>
  <text x="492" y="203.2" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">$540</text>
  <text x="536" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">$0</text>
  <text x="212" y="312" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">10-day trip</text>
  <text x="492" y="312" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">90-day stay</text>
  <rect x="150" y="340" width="14" height="14" fill="#0F7A4B"/>
  <text x="170" y="352" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Daily add-on at $15</text>
  <rect x="310" y="340" width="14" height="14" fill="#F59E0B"/>
  <text x="330" y="352" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Travel eSIM at $6 a day</text>
  <rect x="500" y="340" width="14" height="14" fill="#6B7280"/>
  <text x="520" y="352" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Wi-Fi only</text>
  <text x="24" y="384" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">The $100 roaming cap on the CRTC roaming page is a separate rule. These bars ignore it on purpose</text>
  <text x="24" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">so a daily add-on is visible. Cap as of 29 Sep 2026. These dollars were not.</text>
</svg>
