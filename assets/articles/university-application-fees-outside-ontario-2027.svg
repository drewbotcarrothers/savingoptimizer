<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: application costs for one student</title>
<desc id="d">Bars show UBC $78.50, Alberta $150, McGill $140.16, two Atlantic schools $140, extras $137.25 and OUAC $159.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example: application costs for one student</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Three Ontario choices plus five schools outside Ontario</text>
<text x="240" y="105.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">UBC</text>
<rect x="250" y="86.9" width="172.8" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="430.8" y="105.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$78.50</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">U of Alberta</text>
<rect x="250" y="133.5" width="330.2" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="588.2" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$150</text>
<text x="240" y="198.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">McGill</text>
<rect x="250" y="180.2" width="308.5" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="566.5" y="198.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$140.16</text>
<text x="240" y="245.3" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Two Atlantic schools</text>
<rect x="250" y="226.9" width="308.2" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="566.2" y="245.3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$140 (example)</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Supplemental + transcripts</text>
<rect x="250" y="273.5" width="302.1" height="28.9" rx="3" fill="#0F7A4B"/>
<text x="560.1" y="292.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$137.25</text>
<text x="240" y="338.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">OUAC, 3 choices</text>
<rect x="250" y="320.2" width="350.0" height="28.9" rx="3" fill="#1A1A1A"/>
<text x="608.0" y="338.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$159</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with illustrative inputs. As of 24 Nov 2026.</text>
