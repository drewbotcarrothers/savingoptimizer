<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">A labelled subscription stack above a household cap</title>
  <desc id="desc">A labelled stack of about 108 dollars sits above an 80 dollar cap. Cut the lowest joy-per-dollar rows until the stack is under the cap.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Cut from the bottom until you are under the cap</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Labelled household, not a national average. Dollars are after the tax notes in the guide.</text>
  <rect x="150" y="90" width="150" height="190" rx="6" fill="#1A1A1A"/>
  <text x="186" y="80" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$108</text>
  <text x="178" y="304" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Current stack</text>
  <rect x="420" y="158" width="150" height="122" rx="6" fill="#0F7A4B"/>
  <text x="460" y="148" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">$80</text>
  <text x="456" y="304" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Chosen cap</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">The gap is about $28. That is one or two rows, not a new personality.</text>
  <text x="24" y="390" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Pick a fixed dollar or a percent of take-home. Review it at a raise, a move, or a new child.</text>
</svg>
