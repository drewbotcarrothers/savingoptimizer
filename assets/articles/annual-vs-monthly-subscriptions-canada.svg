<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Months of monthly payments that equal one annual prepay</title>
  <desc id="desc">Annual price divided by monthly price is about 9.9 months for Prime, 10 months for Disney Plus Standard, and 10 months for Microsoft 365 Personal and Family. Prepay only if you will still use the service after that month.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Months until annual costs the same as monthly</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Annual price divided by monthly price. List prices, before tax. 25 Sep 2026.</text>
  <rect x="70" y="168" width="110" height="132" rx="6" fill="#0F7A4B"/>
  <text x="92" y="158" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">9.9 mo</text>
  <text x="96" y="322" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Prime</text>
  <text x="78" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">$99 / $9.99</text>
  <rect x="220" y="160" width="110" height="140" rx="6" fill="#0F7A4B"/>
  <text x="242" y="150" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">10.0 mo</text>
  <text x="238" y="322" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Disney+</text>
  <text x="228" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Standard</text>
  <rect x="370" y="160" width="110" height="140" rx="6" fill="#0F7A4B"/>
  <text x="392" y="150" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">10.0 mo</text>
  <text x="388" y="322" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">M365</text>
  <text x="378" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Personal</text>
  <rect x="520" y="160" width="110" height="140" rx="6" fill="#0F7A4B"/>
  <text x="542" y="150" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4B">10.0 mo</text>
  <text x="546" y="322" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">M365</text>
  <text x="536" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Family</text>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">If you will cancel before that month, monthly is the cheaper product.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Prime fee page via the Prime guide, 24 Sep 2026. Disney+ help, new-subscription prices as of 20 May 2026. Microsoft Canada store, 25 Sep 2026.</text>
</svg>
