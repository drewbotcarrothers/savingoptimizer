<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Cost per shower</title>
  <desc>Example with made-up inputs. Not a shelf price.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Cost per shower</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Example with made-up inputs. Not a shelf price.</text>
  <text x="24" y="86" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Dollars per shower</text>
  <line x1="70" y1="292.0" x2="696" y2="292.0" stroke="#E5E7EB"/>
  <line x1="70" y1="200.0" x2="696" y2="200.0" stroke="#E5E7EB"/>
  <line x1="70" y1="108.0" x2="696" y2="108.0" stroke="#E5E7EB"/>
  <line x1="70" y1="108" x2="70" y2="292" stroke="#E5E7EB"/>
  <text x="64" y="296.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">0</text>
  <text x="64" y="204.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">0.5</text>
  <text x="64" y="112.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">1</text>
  <rect x="121.7" y="281.0" width="110.0" height="11.0" rx="6" fill="#0F7A4B"/>
  <text x="176.7" y="271.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$0.06</text>
  <text x="176.7" y="314.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Bar soap</text>
  <text x="176.7" y="330.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">40 showers</text>
  <rect x="335.0" y="255.2" width="110.0" height="36.8" rx="6" fill="#F59E0B"/>
  <text x="390.0" y="245.2" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$0.20</text>
  <text x="390.0" y="314.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Body wash</text>
  <text x="390.0" y="330.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">10 mL dose</text>
  <rect x="548.3" y="126.4" width="110.0" height="165.6" rx="6" fill="#6B7280"/>
  <text x="603.3" y="116.4" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">$0.90</text>
  <text x="603.3" y="314.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Shower oil</text>
  <text x="603.3" y="330.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">5 mL dose</text>
  <text x="24" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Bar $2.40 ÷ 40 showers = $0.06. Wash $6 ÷ (300 mL ÷ 10 mL) = $0.20.</text>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Oil $18 ÷ (100 mL ÷ 5 mL) = $0.90. Doses and prices are made up.</text>
</svg>
