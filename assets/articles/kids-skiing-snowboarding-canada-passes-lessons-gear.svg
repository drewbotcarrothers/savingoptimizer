<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example with made-up inputs: six ski days for a child</title>
<desc id="d">Horizontal bars for made-up season costs: day tickets and daily rentals $590, Kidz Pass and seasonal lease about $260.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: six ski days for a child</text>
<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Day tickets and rentals versus Kidz Pass and a seasonal lease</text>
<text x="240" y="152.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Day tickets + rentals</text>
<rect x="250" y="128.0" width="350.0" height="40.0" rx="3" fill="#6B7280"/>
<text x="608.0" y="152.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$590</text>
<text x="240" y="292.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Kidz Pass + lease</text>
<rect x="250" y="268.0" width="154.2" height="40.0" rx="3" fill="#1A1A1A"/>
<text x="412.2" y="292.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">About $260</text>
<text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer. Example with made-up inputs. As of 1 Oct 2026.</text>
