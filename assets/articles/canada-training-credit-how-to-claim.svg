<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Example: how much of a course comes back</title>
<desc id="d">Bars: course fees $2,400; 50% of fees $1,200; limit $1,500; credit claimed $1,200; net cost $1,200.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
