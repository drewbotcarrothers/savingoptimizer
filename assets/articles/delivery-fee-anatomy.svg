<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">PC Express vs Voilà vs Instacart fee anatomy</title>
  <desc id="desc">Stacked comparison of typical extra cost on a $100 grocery order: delivery or pickup fee, service fee or pass, markup, and tip.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Extra cost on a $100 basket (illustrative, before tax)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Fees change by city and slot. Confirm in-app. Pass prices: PC Express $99.99/yr; Voilà Anytime $99.99/yr; Instacart+ often $99/yr.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- PC Express pickup no pass: $1 -->
    <rect x="70" y="250" width="100" height="50" rx="6" fill="#4B9B74"/>
    <text x="120" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B">~$1</text>
    <text x="120" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A">PC Express</text>
    <text x="120" y="340" text-anchor="middle" font-size="11" fill="#6B7280">future pickup</text>
    <!-- PC Express same-day delivery no pass: ~$10 -->
    <rect x="190" y="160" width="100" height="140" rx="6" fill="#0F7A4B"/>
    <text x="240" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B">~$10</text>
    <text x="240" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A">PC Express</text>
    <text x="240" y="340" text-anchor="middle" font-size="11" fill="#6B7280">same-day deliv.</text>
    <!-- Voila payg ~$8-12, no tip -->
    <rect x="330" y="140" width="100" height="160" rx="6" fill="#0C643D"/>
    <text x="380" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#0C643D">~$816</text>
    <text x="380" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A">Voilà</text>
    <text x="380" y="340" text-anchor="middle" font-size="11" fill="#6B7280">slot fee, no tip</text>
    <!-- Instacart stacked: fee+service+markup+tip ~$25 -->
    <rect x="470" y="80" width="100" height="40" rx="6" fill="#9CA3AF"/>
    <rect x="470" y="120" width="100" height="50" rx="0" fill="#6B7280"/>
    <rect x="470" y="170" width="100" height="70" rx="0" fill="#4B9B74"/>
    <rect x="470" y="240" width="100" height="60" rx="6" fill="#0F7A4B"/>
    <text x="520" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">~$2230</text>
    <text x="520" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A">Instacart</text>
    <text x="520" y="340" text-anchor="middle" font-size="11" fill="#6B7280">fee+markup+tip</text>
    <rect x="600" y="88" width="12" height="12" fill="#9CA3AF"/>
    <text x="618" y="98" font-size="11" fill="#6B7280">Tip</text>
    <rect x="600" y="110" width="12" height="12" fill="#6B7280"/>
    <text x="618" y="120" font-size="11" fill="#6B7280">Markup</text>
    <rect x="600" y="132" width="12" height="12" fill="#4B9B74"/>
    <text x="618" y="142" font-size="11" fill="#6B7280">Service</text>
    <rect x="600" y="154" width="12" height="12" fill="#0F7A4B"/>
    <text x="618" y="164" font-size="11" fill="#6B7280">Delivery</text>
  </g>
  <text x="24" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">With a pass, PC Express and Voilà drop toward $0 delivery on eligible orders. Instacart+ waives some delivery but usually not markup or tip. Reviewed 16 Sep 2026.</text>
</svg>
