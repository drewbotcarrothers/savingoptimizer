<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">15-item Canadian store-brand swap savings</title>
  <desc id="desc">Illustrative annual savings from switching pantry staples in stages versus an all-at-once fail.</desc>
  <rect width="720" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Staged pantry swaps vs the all-at-once crash</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Teaching estimate for a two-person Canadian discounter household. Recheck unit prices.</text>
  <line x1="90" y1="80" x2="90" y2="300" stroke="#E5E7EB"/>
  <line x1="90" y1="300" x2="680" y2="300" stroke="#E5E7EB"/>
  <text x="82" y="304" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text>
  <text x="82" y="234" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$150</text>
  <text x="82" y="164" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$300</text>
  <text x="82" y="94" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$450</text>
  <rect x="140" y="248" width="120" height="52" rx="8" fill="#9CA3AF"/>
  <text x="200" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$80</text>
  <text x="200" y="324" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">5 easy swaps</text>
  <text x="200" y="342" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">month 1</text>
  <rect x="310" y="178" width="120" height="122" rx="8" fill="#4B9B74"/>
  <text x="370" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$220</text>
  <text x="370" y="324" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">10 items</text>
  <text x="370" y="342" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">month 2</text>
  <rect x="480" y="128" width="120" height="172" rx="8" fill="#0F7A4B"/>
  <text x="540" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$340</text>
  <text x="540" y="324" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">15 items</text>
  <text x="540" y="342" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">kept after 90 days</text>
  <text x="24" y="378" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">If you revert 8 items in week two, you saved nothing and taught the household that "cheap food" tastes bad. Stage it.</text>
</svg>
