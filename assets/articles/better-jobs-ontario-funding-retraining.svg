<text x="24" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Maximums from ontario.ca; request is an example with made-up inputs</text>
<text x="240" y="128.7" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Maximum, programs up to 2 years</text>
<rect x="250" y="104.7" width="350.0" height="40.0" rx="3" fill="#0F7A4B"/>
<text x="608.0" y="128.7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">$35,000</text>
<text x="240" y="222.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Maximum, 1 year or less</text>
