<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Better Jobs Ontario maximums and the example</title>
<desc id="d">Bars: maximum for programs up to 2 years $35,000; maximum for 1 year or less $28,000; example request $24,600.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
