<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Verify provincial first-time buyer programs before you count the cash</title>
  <desc id="desc">Ontario LTT refund, Toronto MLTT rebate, B.C. PTT first-time reduction, and Albertas no-LTT baseline. Expired pilots still rank in search. Verify the week you offer.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">A national grant listicle is not a closing statement</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Date-stamp every program on the provincial site the week you write the offer. Stack FHSA/HBP separately.</text>
  <rect x="28" y="80" width="160" height="150" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="108" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Ontario</text>
  <text x="108" y="138" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">LTT refund max</text>
  <text x="108" y="158" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$4,000 (10 Feb 2026)</text>
  <text x="108" y="186" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Toronto +$4,475 MLTT</text>
  <rect x="196" y="80" width="160" height="150" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="276" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">B.C.</text>
  <text x="276" y="138" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">PTT first-time</text>
  <text x="276" y="158" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$8,000 in $500k$835k</text>
  <text x="276" y="186" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">gov.bc.ca  verify band</text>
  <rect x="364" y="80" width="160" height="150" fill="#E8F5EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="444" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Québec</text>
  <text x="444" y="138" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Welcome / mutation tax</text>
  <text x="444" y="158" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">City programs vary</text>
  <text x="444" y="186" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Check the municipality</text>
  <rect x="532" y="80" width="160" height="150" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="2"/>
  <text x="612" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Alberta</text>
  <text x="612" y="138" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">No provincial LTT</text>
  <text x="612" y="158" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Do not invent one</text>
  <text x="612" y="186" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Local grants still expire</text>
  <text x="24" y="264" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Verification checklist</text>
  <text x="24" y="292" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Official .ca URL · income and price caps · occupancy timing · stacking with FHSA/HBP · pilot ended date · lawyer confirms the statement</text>
  <text x="24" y="324" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Red flag: a 2022 blog still ranking a closed down-payment pilot as if it funds 2026 closings.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">ontario.ca (10 Feb 2026), gov.bc.ca PTT, CRA FHSA  used 20 Sep 2026. Not legal advice.</text>
</svg>
