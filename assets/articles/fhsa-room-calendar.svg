<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">FHSA room: on-time vs late vs catch-up (labelled)</title>
  <desc id="desc">CRA participation-room basics, reviewed 16 Sep 2026. Not your T1028.</desc>
  <rect width="720" height="430" fill="#FFFFFF"/>
  <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">FHSA room: on-time vs late vs catch-up (labelled)</text>
  <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">CRA participation-room basics, reviewed 16 Sep 2026. Not your T1028.</text>
  <line x1="80" y1="320.0" x2="680" y2="320.0" stroke="#E5E7EB"/><text x="72" y="324.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$0</text><line x1="80" y1="262.5" x2="680" y2="262.5" stroke="#E5E7EB"/><text x="72" y="266.5" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$11.2k</text><line x1="80" y1="205.0" x2="680" y2="205.0" stroke="#E5E7EB"/><text x="72" y="209.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$22.5k</text><line x1="80" y1="147.5" x2="680" y2="147.5" stroke="#E5E7EB"/><text x="72" y="151.5" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$33.8k</text><line x1="80" y1="90.0" x2="680" y2="90.0" stroke="#E5E7EB"/><text x="72" y="94.0" text-anchor="end" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$45k</text>
  <rect x="108.0" y="115.6" width="162.7" height="204.4" rx="8" fill="#0F7A4B"/><text x="189.3" y="105.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">$40k</text><text x="189.3" y="342.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">On-time</text><text x="189.3" y="360.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">5 × $8,000</text><rect x="298.7" y="156.4" width="162.7" height="163.6" rx="8" fill="#4B9B74"/><text x="380.0" y="146.4" text-anchor="middle" font-size="13" font-weight="700" fill="#4B9B74" font-family="Inter, system-ui, sans-serif">$32k</text><text x="380.0" y="342.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Late 1 yr</text><text x="380.0" y="360.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">miss year 1</text><rect x="489.3" y="115.6" width="162.7" height="204.4" rx="8" fill="#9CA3AF"/><text x="570.7" y="105.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">$40k</text><text x="570.7" y="342.0" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Catch-up</text><text x="570.7" y="360.0" text-anchor="middle" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">then $16k year</text>
  <text x="24" y="412" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Lifetime room is $40,000. Carry-forward is limited (often up to $8,000 extra in a later year). Missing a year without unused room to catch up can strand lifetime room — confirm CRA.</text>
</svg>
