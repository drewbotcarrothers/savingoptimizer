<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Rogers winback vs list vs independent</title>
  <desc id="desc">Illustrative 24-month CAD stacks: Rogers public promo, a typical winback, and an independent reseller. Community reports and Rogers public cards as of 21 Sep 2026. Not a quote.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Winback beats list. A written independent can beat both.</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative 24-month CAD before tax. Verify live. Drafted 21 Sep 2026.</text>
  <rect x="48" y="90" width="80" height="220" rx="8" fill="#F3F4F6"/>
  <text x="88" y="330" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">List</text>
  <text x="88" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$2,640</text>
  <rect x="176" y="150" width="80" height="160" rx="8" fill="#C5E3D4"/>
  <text x="216" y="330" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Public promo</text>
  <text x="216" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$2,160</text>
  <rect x="304" y="190" width="80" height="120" rx="8" fill="#0F7A4B"/>
  <text x="344" y="330" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Winback*</text>
  <text x="344" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">~$1,080</text>
  <rect x="432" y="210" width="80" height="100" rx="8" fill="#E7F4EE"/>
  <text x="472" y="330" text-anchor="middle" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Independent</text>
  <text x="472" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">~$936</text>
  <rect x="528" y="90" width="168" height="220" rx="12" fill="#E7F4EE"/>
  <text x="544" y="118" font-size="13" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Ask for, in writing</text>
  <text x="544" y="146" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Monthly rate</text>
  <text x="544" y="166" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Credit amount + date</text>
  <text x="544" y="186" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Gateway fee waived?</text>
  <text x="544" y="206" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Term length</text>
  <text x="544" y="226" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">ETF schedule</text>
  <text x="544" y="246" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Promo end date</text>
  <text x="544" y="278" font-size="11" fill="#6B7280" font-family="Inter, system-ui, sans-serif">No email = no deal.</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">*Winback bar uses community-reported ~$45/mo 1.5 Gbps-class plus $200 credit sketches, not a Rogers guarantee.</text>
  <text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Public cards 21 Sep 2026: Starter 150 $75 / Popular 500 $90 on 24-mo term (Rogers.com). Education only.</text>
</svg>
