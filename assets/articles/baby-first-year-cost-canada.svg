<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Example with made-up inputs: first-year spending by quarter</title>
  <desc>Example with made-up inputs. Stacked bars for four quarters. Segments are gear, diapers and feeding, clothing, and childcare. Quarter totals are $1,380, $560, $1,060, and $1,490. The mix changes. These are not average Canadian prices.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="26" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Example with made-up inputs: spending by quarter</text>
  <text x="24" y="46" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Not an average first-year cost. Fill the worksheet with your own prices.</text>
  <text x="90" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">$1,380</text>
  <rect x="55" y="115" width="70" height="121" fill="#0F7A4B"/>
  <rect x="55" y="236" width="70" height="48" fill="#1A1A1A"/>
  <rect x="55" y="284" width="70" height="16" fill="#6B7280"/>
  <text x="90" y="328" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Q1</text>
  <text x="230" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">$560</text>
  <rect x="195" y="277" width="70" height="11" fill="#0F7A4B"/>
  <rect x="195" y="225" width="70" height="52" fill="#1A1A1A"/>
  <rect x="195" y="288" width="70" height="12" fill="#6B7280"/>
  <text x="230" y="328" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Q2</text>
  <text x="370" y="142" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">$1,060</text>
  <rect x="335" y="294" width="70" height="6" fill="#0F7A4B"/>
  <rect x="335" y="238" width="70" height="56" fill="#1A1A1A"/>
  <rect x="335" y="218" width="70" height="20" fill="#6B7280"/>
  <rect x="335" y="158" width="70" height="60" fill="#F59E0B"/>
  <text x="370" y="328" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Q3</text>
  <text x="510" y="84" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">$1,490</text>
  <rect x="475" y="296" width="70" height="4" fill="#0F7A4B"/>
  <rect x="475" y="236" width="70" height="60" fill="#1A1A1A"/>
  <rect x="475" y="221" width="70" height="15" fill="#6B7280"/>
  <rect x="475" y="100" width="70" height="121" fill="#F59E0B"/>
  <text x="510" y="328" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Q4</text>
  <rect x="24" y="352" width="14" height="14" fill="#0F7A4B"/>
  <text x="44" y="364" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Gear</text>
  <rect x="100" y="352" width="14" height="14" fill="#1A1A1A"/>
  <text x="120" y="364" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Diapers and feeding</text>
  <rect x="270" y="352" width="14" height="14" fill="#6B7280"/>
  <text x="290" y="364" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Clothing</text>
  <rect x="370" y="352" width="14" height="14" fill="#F59E0B"/>
  <text x="390" y="364" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Childcare</text>
  <text x="24" y="392" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Q1 and Q2 have no childcare in this sketch. Q3 and Q4 add a made-up care bill. Clothing is a thin band.</text>
  <text x="24" y="410" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer. Example with made-up inputs. Checked 29 Sep 2026.</text>
</svg>
