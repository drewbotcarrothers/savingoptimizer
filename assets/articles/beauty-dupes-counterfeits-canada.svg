<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Flow from a dupe claim to ingredient lists, seller, recalls, and buy or skip</title>
  <desc>A decision flow with no prices. Find a product sold as a dupe, compare the ingredient lists on two real packages, check the seller and the packaging, search Government of Canada recalls, then buy under the product's own name or skip.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Before you buy a lookalike</text>
  <text x="24" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">A process, not a price. Skip any listing that uses someone else's brand.</text>
  <rect x="24" y="80" width="120" height="64" fill="#FFFFFF" stroke="#1A1A1A"/>
  <text x="36" y="108" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Find a dupe</text>
  <text x="36" y="126" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">own name only</text>
  <line x1="144" y1="112" x2="168" y2="112" stroke="#1A1A1A"/>
  <rect x="168" y="80" width="120" height="64" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="178" y="108" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Compare lists</text>
  <text x="178" y="126" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">two real boxes</text>
  <line x1="288" y1="112" x2="312" y2="112" stroke="#1A1A1A"/>
  <rect x="312" y="80" width="120" height="64" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="322" y="108" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Seller and box</text>
  <text x="322" y="126" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">name you can find</text>
  <line x1="432" y1="112" x2="456" y2="112" stroke="#1A1A1A"/>
  <rect x="456" y="80" width="120" height="64" fill="#FFFFFF" stroke="#0F7A4B"/>
  <text x="466" y="108" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">Search recalls</text>
  <text x="466" y="126" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">Canada.ca alerts</text>
  <line x1="576" y1="112" x2="600" y2="112" stroke="#1A1A1A"/>
  <rect x="600" y="80" width="96" height="64" fill="#0F7A4B"/>
  <text x="612" y="116" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Buy or skip</text>
  <text x="24" y="190" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">Stop and skip if the title uses another brand and the seller is not that brand.</text>
  <text x="24" y="214" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">A copied ingredient list is not the contents. </text>
  <text x="24" y="238" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280">Recalls search checked 29 Sep 2026. A clear search is not a lab test.</text>
  <text x="24" y="400" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Saving Optimizer, 29 Sep 2026.</text>
</svg>
