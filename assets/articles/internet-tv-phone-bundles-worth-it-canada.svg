<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Bundle promo clocks versus internet only</title>
  <desc id="desc">A worksheet sketch showing internet, TV, and home phone on different promo lengths, versus an internet-only line that stays flat.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Three promo clocks, not one save</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Illustrative shape. Plug in your quotes. Drafted 21 Sep 2026.</text>
  <rect x="40" y="90" width="300" height="36" rx="8" fill="#0F7A4B"/>
  <text x="52" y="113" font-size="13" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">Internet offer: often 24 months</text>
  <rect x="40" y="140" width="160" height="36" rx="8" fill="#E7F4EE"/>
  <text x="52" y="163" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TV intro: 12 months</text>
  <rect x="210" y="140" width="250" height="36" rx="8" fill="#F3F4F6"/>
  <text x="222" y="163" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">TV regular after that</text>
  <rect x="40" y="190" width="100" height="36" rx="8" fill="#E7F4EE"/>
  <text x="52" y="213" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Phone: 6 mo</text>
  <rect x="150" y="190" width="310" height="36" rx="8" fill="#F3F4F6"/>
  <text x="162" y="213" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Phone regular, if you still have it</text>
  <rect x="430" y="90" width="250" height="136" rx="12" fill="#E7F4EE"/>
  <text x="555" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Internet-only</text>
  <text x="555" y="158" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">One clock.</text>
  <text x="555" y="180" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Plus streaming you</text>
  <text x="555" y="200" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">already pay, in CAD.</text>
  <text x="24" y="268" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Year-two bundle = internet after its offer + TV after its intro + phone after its intro.</text>
  <text x="24" y="296" font-size="13" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">If that sum beats internet-only plus the streaming you will keep, the sticker save was a year-one costume.</text>
  <text x="24" y="330" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Bell Ontario mobility credit, 21 Sep 2026: $10/month inside the Internet and Mobility cards. Real, and not a TV package.</text>
  <text x="24" y="354" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Rogers internet page the same day said you save on TV in a bundle, without a dollar in the text we fetched.</text>
  <text x="24" y="378" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Do not invent a channel lineup. This page does not rank streaming catalogues.</text>
  <text x="24" y="402" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Education only. Not an ISP or streaming partnership.</text>
</svg>
