<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Low-cost internet checklist for seniors on GIS</title>
  <desc id="desc">Connecting Families letter and portal, ISP hardship asks, library bridge, and prepaid hotspot traps to avoid.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A">Seniors on GIS: low-cost internet helper path</text>
  <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Invitation letter required for CFI. Facts stamped 22 Sep 2026.</text>
  <rect x="24" y="78" width="328" height="120" rx="12" fill="#E7F4EE"/>
  <text x="40" y="106" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">1. Connecting Families</text>
  <text x="40" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">GIS ≥80% of maximum + letter</text>
  <text x="40" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">with 8-digit code → portal.</text>
  <text x="40" y="176" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">$10 / $20 volunteer ISP plans.</text>
  <rect x="368" y="78" width="328" height="120" rx="12" fill="#F3F4F6"/>
  <text x="384" y="106" font-size="14" font-weight="700" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">2. If no letter yet</text>
  <text x="384" y="132" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Ask ISP hardship / low-cost</text>
  <text x="384" y="150" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">SKUs in writing. Keep CFI code.</text>
  <text x="384" y="176" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Library Wi-Fi as a bridge.</text>
  <rect x="24" y="220" width="672" height="130" rx="12" fill="#E7F4EE"/>
  <text x="40" y="248" font-size="14" font-weight="700" fill="#0F7A4B" font-family="Inter, system-ui, sans-serif">Avoid</text>
  <text x="40" y="274" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Prepaid hotspot “deals” that look cheap until overages and throttles hit.</text>
  <text x="40" y="296" font-size="12" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif">Anyone selling a CFI code or asking for a SIN by DM.</text>
  <text x="40" y="318" font-size="12" fill="#6B7280" font-family="Inter, system-ui, sans-serif">Official ISED lines: 1-800-328-6189 · TTY 1-866-694-8389. Education only.</text>
  <text x="24" y="386" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">ISED Connecting Families · canada.ca GIS materials · Saving Optimizer.</text>
</svg>
