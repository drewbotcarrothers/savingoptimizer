<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Canadian weekly grocery operating system</title>
  <desc id="desc">Six steps from Sunday planning through receipt review: Flipp, loyalty, surplus, shop, review.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <text x="24" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">A 20-minute Sunday loop that actually sticks</text>
  <text x="24" y="58" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">Plan once. Clip, load, check surplus, shop the list, update the price book.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="24" y="88" width="210" height="92" rx="12" fill="#E7F4EE" stroke="#0F7A4B"/>
    <text x="40" y="118" font-size="12" font-weight="700" fill="#0F7A4B">1 · Plan</text>
    <text x="40" y="142" font-size="14" font-weight="600" fill="#1A1A1A">Sunday 20 min</text>
    <text x="40" y="162" font-size="12" fill="#6B7280">Fridge check + 5 dinners</text>
    <rect x="255" y="88" width="210" height="92" rx="12" fill="#F3F4F6"/>
    <text x="271" y="118" font-size="12" font-weight="700" fill="#0F7A4B">2 · Clip</text>
    <text x="271" y="142" font-size="14" font-weight="600" fill="#1A1A1A">Flipp meal sketch</text>
    <text x="271" y="162" font-size="12" fill="#6B7280">Protein + produce on sale</text>
    <rect x="486" y="88" width="210" height="92" rx="12" fill="#F3F4F6"/>
    <text x="502" y="118" font-size="12" font-weight="700" fill="#0F7A4B">3 · Load</text>
    <text x="502" y="142" font-size="14" font-weight="600" fill="#1A1A1A">Loyalty offers</text>
    <text x="502" y="162" font-size="12" fill="#6B7280">PC · Scene+ · Moi</text>
    <rect x="24" y="220" width="210" height="92" rx="12" fill="#F3F4F6"/>
    <text x="40" y="250" font-size="12" font-weight="700" fill="#0F7A4B">4 · Surplus</text>
    <text x="40" y="274" font-size="14" font-weight="600" fill="#1A1A1A">Flashfood / FoodHero</text>
    <text x="40" y="294" font-size="12" fill="#6B7280">Only if on the route</text>
    <rect x="255" y="220" width="210" height="92" rx="12" fill="#F3F4F6"/>
    <text x="271" y="250" font-size="12" font-weight="700" fill="#0F7A4B">5 · Shop</text>
    <text x="271" y="274" font-size="14" font-weight="600" fill="#1A1A1A">List-first sequence</text>
    <text x="271" y="294" font-size="12" fill="#6B7280">Perimeter, then one treat</text>
    <rect x="486" y="220" width="210" height="92" rx="12" fill="#0F7A4B"/>
    <text x="502" y="250" font-size="12" font-weight="700" fill="#FFFFFF">6 · Review</text>
    <text x="502" y="274" font-size="14" font-weight="600" fill="#FFFFFF">Receipt + price book</text>
    <text x="502" y="294" font-size="12" fill="#E7F4EE">5 minutes, same night</text>
  </g>
  <path d="M234 134h21" stroke="#0F7A4B" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M465 134h21" stroke="#0F7A4B" stroke-width="2"/>
  <path d="M591 180v22" stroke="#0F7A4B" stroke-width="2"/>
  <path d="M234 266h21" stroke="#0F7A4B" stroke-width="2"/>
  <path d="M465 266h21" stroke="#0F7A4B" stroke-width="2"/>
  <text x="24" y="350" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Illustrative household: $240/week grocery spend. A 1012% trim is about $25$29/week.</text>
  <text x="24" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">Estimate for a busy two-adult household. Your baseline is the four-week average of actual receipts, including quick stops.</text>
  <text x="24" y="400" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Saving Optimizer · Canada · 16 Sep 2026</text>
</svg>
